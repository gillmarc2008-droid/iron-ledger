/**
 * Forms holds ONE unsaved editor draft at a time (routine or exercise).
 * Nothing in a draft is persisted until the user taps Save.
 */
const Forms = {
  state: null,
  open(key, kind, draft, backTo) {
    this.state = { key, kind, draft, original: JSON.stringify(draft), errors: null, backTo };
    return this.state;
  },
  get(key) { return this.state && this.state.key === key ? this.state : null; },
  currentKey() { return this.state ? this.state.key : null; },
  // A captured-but-unsaved photo always counts as unsaved work.
  isDirty() { return !!this.state && (this.state.key === 'photo:new' || JSON.stringify(this.state.draft) !== this.state.original); },
  clear() { this.state = null; },
  /** Which form (if any) a route belongs to. */
  keyFor(hash) {
    let m;
    if (hash === '#/routine/new') return 'routine:new';
    if ((m = hash.match(/^#\/routine\/([\w-]+)\/edit$/))) return `routine:${m[1]}`;
    if (hash === '#/exercise/new') return 'exercise:new';
    if ((m = hash.match(/^#\/exercise\/([\w-]+)\/edit$/))) return `exercise:${m[1]}`;
    if (hash === '#/more/goals/strength/new') return 'goal:new';
    if (hash === '#/progress/body/new') return 'body:new';
    if ((m = hash.match(/^#\/progress\/body\/([\w-]+)$/))) return `body:${m[1]}`;
    if (hash === '#/progress/photos/new') return 'photo:new';
    if ((m = hash.match(/^#\/progress\/photos\/([\w-]+)\/edit$/))) return `photo:${m[1]}`;
    if ((m = hash.match(/^#\/more\/goals\/strength\/([\w-]+)$/))) return `goal:${m[1]}`;
    return null;
  },
  /** Generic text/select binding: <input data-bind="field">. */
  bind(el) {
    if (!this.state) return;
    const field = el.dataset.bind;
    const value = el.dataset.type === 'int' ? parseInt(el.value, 10) : el.value;
    this.state.draft[field] = value;
    if (this.state.kind === 'exercise' && field === 'primaryMuscle') {
      // A muscle cannot be both primary and secondary.
      this.state.draft.secondaryMuscles = this.state.draft.secondaryMuscles.filter((m) => m !== value);
      const box = $('#ex-secondary');
      if (box) box.innerHTML = Views.secondaryChips(this.state.draft);
    }
  }
};

const Editor = {
  draft() { return Forms.state && Forms.state.kind === 'routine' ? Forms.state.draft : null; },

  /** Re-renders the item list only, keeping scroll position and restoring focus. */
  renderItems(focusId) {
    const d = this.draft();
    if (!d) return;
    $('#editor-items').innerHTML = Views.editorItems(d, Forms.state.errors || {});
    this.updateSummary();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && !el.disabled) el.focus();
    }
  },

  updateSummary() {
    const d = this.draft();
    $('#sum-ex').textContent = Calc.routineExerciseCount(d);
    $('#sum-sets').textContent = Calc.routineWorkingSets(d);
  },

  onItemInput(el) {
    const d = this.draft();
    if (!d) return;
    const it = RoutineDraft.item(d, el.dataset.item);
    if (!it) return;
    const field = el.dataset.field;
    if (field === 'notes') it.notes = el.value;
    else if (field === 'restSec') it.restSec = parseInt(el.value, 10);
    else if (field === 'rirSingle') { const v = Util.parseIntOrNull(el.value); it.rirMin = v; it.rirMax = v; }
    else it[field] = Util.parseIntOrNull(el.value); // blank/invalid stays null -> caught on save
  }
};

/**
 * Exercise picker shared by the routine editor and the active workout.
 * ctx = { title, existingIds(): string[], existingLabel, onAdd(ids) }
 */
const Picker = {
  ctx: null,
  el() { return $('#picker'); },

  open(ctx) {
    this.ctx = ctx;
    UIState.picker = { q: '', muscle: 'all', equipment: 'all', favourites: false, selected: [] };
    const p = this.el();
    p.innerHTML = `
      <header class="picker__head">
        <button type="button" class="btn btn-ghost" style="justify-self:start" data-action="picker-close">Cancel</button>
        <h2 id="picker-title">${esc(ctx.title)}</h2>
        <span class="picker__count num" id="pick-count" aria-live="polite">0 selected</span>
      </header>
      <div class="picker__filters">${Partials.filters('pick', UIState.picker)}</div>
      <div class="picker__list"><ul class="xlist" id="pick-results"></ul></div>
      <footer class="picker__foot">
        <button type="button" class="btn btn-primary btn-block" data-action="picker-add" id="pick-add" disabled>Select exercises to add</button>
      </footer>`;
    this.renderList();
    showDialog(p);
    const search = $('#pick-q');
    if (search && window.matchMedia && window.matchMedia('(hover: hover)').matches) search.focus(); // avoid popping the phone keyboard
  },

  close() { hideDialog(this.el()); },

  renderList() {
    const s = UIState.picker;
    const list = ExerciseService.query({ ...s, sort: 'preference' });
    const existing = new Set(this.ctx ? this.ctx.existingIds() : []);
    $('#pick-results').innerHTML = Partials.pickerRows(list, s.selected, existing, this.ctx ? this.ctx.existingLabel : '');
    this.updateFooter();
  },

  updateFooter() {
    const n = UIState.picker.selected.length;
    $('#pick-count').textContent = `${n} selected`;
    const btn = $('#pick-add');
    btn.disabled = n === 0;
    if (this.ctx && this.ctx.single) btn.textContent = n === 0 ? 'Select an exercise' : 'Use this exercise';
    else btn.textContent = n === 0 ? 'Select exercises to add' : `Add ${Fmt.plural(n, 'exercise')}`;
  },

  toggle(id) {
    const sel = UIState.picker.selected;
    const i = sel.indexOf(id);
    if (i >= 0) sel.splice(i, 1);
    else if (this.ctx && this.ctx.single) sel.splice(0, sel.length, id);
    else sel.push(id);
    // Update in place so the list does not jump while scrolling.
    $$('#pick-results [data-action="pick-toggle"]').forEach((b) => {
      const pos = sel.indexOf(b.dataset.id);
      b.setAttribute('aria-pressed', String(pos >= 0));
      $('.pick-badge', b).textContent = pos >= 0 ? pos + 1 : '';
    });
    this.updateFooter();
  },

  add() {
    const sel = UIState.picker.selected.slice();
    if (!sel.length || !this.ctx) return;
    this.close();
    this.ctx.onAdd(sel); // added in the order they were selected
    if (!this.ctx.single) Toast.show(`Added ${Fmt.plural(sel.length, 'exercise')}`);
  }
};

const Filters = {
  state(scope) { return scope === 'lib' ? UIState.library : UIState.picker; },

  render(scope) {
    if (scope === 'pick') { Picker.renderList(); return; }
    const list = ExerciseService.query({ ...UIState.library, sort: 'name' });
    const box = $('#lib-results');
    if (box) box.innerHTML = Partials.libraryRows(list);
    const count = $('#lib-count');
    if (count) count.textContent = Fmt.plural(list.length, 'exercise');
  },

  onSearch(el) {
    this.state(el.dataset.filter).q = el.value;
    this.render(el.dataset.filter);
  },

  onChip(el) {
    const { scope, key, value } = el.dataset;
    const s = this.state(scope);
    if (key === 'favourites') s.favourites = !s.favourites;
    else s[key] = value;
    // Update pressed state in place (keeps the chip row's scroll position).
    const root = scope === 'pick' ? Picker.el() : $('#view');
    $$(`[data-action="filter"][data-scope="${scope}"]`, root).forEach((c) => {
      const pressed = c.dataset.key === 'favourites' ? s.favourites : s[c.dataset.key] === c.dataset.value;
      c.setAttribute('aria-pressed', String(pressed));
    });
    this.render(scope);
  }
};


/* =======================================================================
   16. ROUTER
   Hash-based so the browser back button works and no server is required.
   Guard: leaving an editor with unsaved changes asks for confirmation.
   ======================================================================= */
const Router = (() => {
  const routes = [
    { re: /^#\/home$/, tab: 'home', view: () => Views.home() },
    { re: /^#\/workout\/(routines|schedule|history|exercises)$/, tab: 'workout', view: (m) => Views.workout(m[1]) },
    { re: /^#\/history\/([\w-]+)$/, tab: 'workout', view: (m) => Views.historyDetail(m[1]) },
    { re: /^#\/routine\/new$/, tab: 'workout', editing: true, view: () => Views.routineEditor(null) },
    { re: /^#\/routine\/([\w-]+)\/edit$/, tab: 'workout', editing: true, view: (m) => Views.routineEditor(m[1]) },
    { re: /^#\/routine\/([\w-]+)$/, tab: 'workout', view: (m) => Views.routineDetail(m[1]) },
    { re: /^#\/exercise\/new$/, tab: 'workout', editing: true, view: () => Views.exerciseForm(null) },
    { re: /^#\/exercise\/([\w-]+)\/edit$/, tab: 'workout', editing: true, view: (m) => Views.exerciseForm(m[1]) },
    { re: /^#\/exercise\/([\w-]+)\/(history|progress)$/, tab: 'workout', view: (m) => Views.exerciseDetail(m[1], m[2]) },
    { re: /^#\/exercise\/([\w-]+)$/, tab: 'workout', view: (m) => Views.exerciseDetail(m[1], 'overview') },
    { re: /^#\/progress\/(overview|strength|body|photos)$/, tab: 'progress', view: (m) => Views.progress(m[1]) },
    { re: /^#\/progress\/body\/new$/, tab: 'progress', editing: true, view: () => Views.bodyForm(null) },
    { re: /^#\/progress\/body\/([\w-]+)$/, tab: 'progress', editing: true, view: (m) => Views.bodyForm(m[1]) },
    { re: /^#\/progress\/photos\/new$/, tab: 'progress', editing: true, view: () => Views.photoForm(null) },
    { re: /^#\/progress\/photos\/camera$/, tab: 'progress', editing: true, camera: true, view: () => Views.camera() },
    { re: /^#\/progress\/photos\/([\w-]+)\/edit$/, tab: 'progress', editing: true, view: (m) => Views.photoForm(m[1]) },
    { re: /^#\/progress\/photos\/([\w-]+)$/, tab: 'progress', view: (m) => Views.photoView(m[1]) },
    { re: /^#\/progress\/compare$/, tab: 'progress', view: () => Views.compare() },
    { re: /^#\/progress\/transformation$/, tab: 'progress', view: () => Views.transformation() },
    { re: /^#\/more$/, tab: 'more', view: () => Views.more() },
    { re: /^#\/more\/goals$/, tab: 'more', view: () => Views.goals() },
    { re: /^#\/more\/goals\/strength\/new$/, tab: 'more', editing: true, view: () => Views.strengthGoalForm(null) },
    { re: /^#\/more\/goals\/strength\/([\w-]+)$/, tab: 'more', editing: true, view: (m) => Views.strengthGoalForm(m[1]) },
    // Workout engine (full screen, no bottom nav)
    { re: /^#\/workout\/active$/, tab: 'workout', editing: true, view: () => Views.activeWorkout() },
    { re: /^#\/workout\/replace\/([\w-]+)$/, tab: 'workout', editing: true, view: (m) => Views.replaceExercise(m[1]) },
    { re: /^#\/workout\/review\/([\w-]+)$/, tab: 'workout', editing: true, view: (m) => Views.routineReview(m[1]) },
    { re: /^#\/workout\/summary\/([\w-]+)$/, tab: 'workout', editing: true, view: (m) => Views.workoutSummary(m[1]) }
  ];
  const aliases = { '': '#/home', '#': '#/home', '#/': '#/home', '#/workout': '#/workout/routines', '#/progress': '#/progress/overview' };
  let current = null;
  let bypassGuard = false;

  function normalize(hash) { return aliases[hash] || hash; }


  /*
   * Hash links are resolved by the app itself, against THIS document's URL.
   * Some hosts (e.g. sandboxed previews using srcdoc) give the page a base URL
   * from another origin; resolving '#/x' against it breaks history calls.
   * Building the URL from location.href avoids that, and a failure to update
   * the address bar must never stop the app from rendering.
   */
  function urlFor(hash) { return location.href.split('#')[0] + hash; }
  function setUrl(hash) {
    try { history.replaceState(null, '', urlFor(hash)); } catch (_) { /* address bar not updatable here */ }
  }

  function render(hash, { keepScroll = false } = {}) {
    hash = normalize(hash);
    const match = routes.map((r) => ({ r, m: hash.match(r.re) })).find((x) => x.m);
    if (!match) return redirect('#/home');
    // Drop a draft that belongs to a route we are no longer on.
    if (Forms.currentKey() && Forms.keyFor(hash) !== Forms.currentKey()) Forms.clear();
    const routeChanged = hash !== current;
    if (!match.r.camera) Camera.stop();   // never leave the camera running off-screen
    PhotoUrls.releaseFull();
    current = hash;
    const html = match.r.view(match.m);
    if (html == null) return null; // the view redirected
    const view = $('#view');
    const y = window.scrollY;
    view.innerHTML = html;
    document.body.classList.toggle('is-editing', !!match.r.editing);
    // Compact "workout in progress" strip everywhere except Home (which has its own card) and full-screen views.
    const showStrip = !!WorkoutService.active() && !match.r.editing && match.r.tab !== 'home';
    $('#activebar').innerHTML = showStrip ? Views.activeStrip() : '';
    document.body.classList.toggle('has-activebar', showStrip);
    $$('.tab').forEach((t) => {
      if (t.dataset.tab === match.r.tab) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    document.body.classList.toggle('is-camera', !!match.r.camera);
    Hydrate.run(view);
    if (keepScroll) window.scrollTo(0, y);
    else if (routeChanged) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
    return null;
  }

  /** Replaces the current history entry (no extra back-button step). */
  function redirect(hash) {
    setUrl(hash);
    render(hash);
    return null;
  }

  async function onHashChange() {
    const target = normalize(location.hash);
    if (!bypassGuard && Forms.isDirty() && Forms.keyFor(target) !== Forms.currentKey()) {
      setUrl(current); // stay put while we ask
      const ok = await Dialog.confirm({
        title: 'Discard changes?', message: 'You have unsaved changes. Leaving now will lose them.',
        confirmLabel: 'Discard', cancelLabel: 'Keep editing', danger: true
      });
      if (!ok) return;
      Forms.clear();
      go(target);
      return;
    }
    bypassGuard = false;
    render(target);
  }

  /** Programmatic navigation. `force` skips the guard (used after save/discard). */
  function go(hash, { force = false } = {}) {
    if (normalize(location.hash) === hash) { render(hash); return; }
    bypassGuard = force;
    try {
      location.hash = hash; // fires hashchange -> render
    } catch (_) {
      bypassGuard = false;
      current = null;
      render(hash);       // host blocks URL changes: navigate in-app only
    }
  }

  function start() {
    window.addEventListener('hashchange', onHashChange);
    const initial = normalize(location.hash);
    if (initial !== location.hash) setUrl(initial);
    render(initial);
  }

  return { start, go, redirect, refresh: () => render(current, { keepScroll: true }), current: () => current };
})();


/* =======================================================================
   17. EVENTS + BOOT
   One delegated listener per event type. Elements declare intent with
   data-action; handlers live in Actions.
   ======================================================================= */
const Actions = {
  async 'start-routine'(el) { await startWorkout({ routineId: el.dataset.id }); },

  /* ----- active workout ----- */
  'aw-toggle'(el) {
    const { se, set } = el.dataset;
    const now = Date.now();
    const last = Actions._lastToggle;
    if (last && last.set === set && now - last.t < CONFIG.DOUBLE_TAP_MS) return; // ignore accidental double tap
    Actions._lastToggle = { set, t: now };
    RestAlert.unlock(); // a user tap: browsers only allow sound after one
    try {
      WorkoutService.toggleSet(se, set);
    } catch (err) {
      const d = err instanceof AppError && err.details && err.details[0];
      if (d && d.setId) {
        const input = document.getElementById(`${d.field === 'weight' ? 'w' : 'r'}-${d.setId}`);
        if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
      }
      throw err;
    }
    Router.refresh();
  },

  async 'aw-set-menu'(el) {
    const a = WorkoutService.active();
    const { x, st } = WorkoutService.find(a, el.dataset.se, el.dataset.set);
    const label = Calc.setLabels(x.sets)[x.sets.indexOf(st)];
    const icons = { warmup: 'spark', working: 'list', drop: 'down', failure: 'alert' };
    const choice = await Dialog.sheet({
      title: `Set ${label}, ${x.nameSnapshot}`,
      actions: [
        ...CONFIG.SET_TYPES.map((t) => ({ id: `type:${t}`, label: SET_TYPE_LABELS[t], icon: icons[t], current: st.type === t })),
        { id: 'remove', label: 'Remove set', icon: 'trash', danger: true }
      ]
    });
    if (!choice) return;
    if (choice.startsWith('type:')) {
      WorkoutService.setType(x.id, st.id, choice.slice(5));
      Router.refresh();
      return;
    }
    if (WorkoutService.setHasData(st)) {
      const ok = await Dialog.confirm({
        title: `Remove set ${label}?`,
        message: `This set has ${st.completed ? 'been completed' : 'values entered'}. It will be removed from today's workout only.`,
        confirmLabel: 'Remove set', danger: true
      });
      if (!ok) return;
    }
    WorkoutService.removeSet(x.id, st.id);
    Router.refresh();
  },

  'aw-copy-prev'(el) {

  async 'aw-ex-menu'(el) {
    const a = WorkoutService.active();
    const { x } = WorkoutService.find(a, el.dataset.se);
    const choice = await Dialog.sheet({
      title: x.nameSnapshot,
      actions: [
        { id: 'set', label: 'Add set', icon: 'plus' },
        { id: 'warmup', label: 'Add warm-up set', icon: 'spark' },
        { id: 'note', label: x.sessionNote ? "Edit today's note" : "Add today's note", icon: 'edit' },
        { id: 'history', label: 'View history', icon: 'list' },
        ...(ExerciseService.get(x.performedExerciseId) ? [
          { id: 'machine', label: ExerciseService.get(x.performedExerciseId).machineSettings ? 'Edit machine settings' : 'Add machine settings', icon: 'sliders' },
          { id: 'pnote', label: ExerciseService.get(x.performedExerciseId).notes ? 'Edit personal note' : 'Add personal note', icon: 'edit' }] : []),
        ...(el.dataset.first === 'true' ? [] : [{ id: 'up', label: 'Move up', icon: 'up' }]),
        ...(el.dataset.last === 'true' ? [] : [{ id: 'down', label: 'Move down', icon: 'down' }]),
        { id: 'replace', label: 'Replace exercise', icon: 'swap' },
        { id: 'remove', label: 'Remove from workout', icon: 'trash', danger: true }
      ]
    });
    if (!choice) return;
    if (choice === 'set' || choice === 'warmup') { WorkoutService.addSet(x.id, choice === 'set' ? 'working' : 'warmup'); Router.refresh(); }
    if (choice === 'replace') Router.go(`#/workout/replace/${x.id}`);
    if (choice === 'machine' || choice === 'pnote') {
      const ex = ExerciseService.get(x.performedExerciseId);
      const field = choice === 'machine' ? 'machineSettings' : 'notes';
      const text = await Dialog.prompt({
        title: choice === 'machine' ? 'Machine settings' : 'Personal note',
        label: `${ex.name} (kept for every workout)`, value: ex[field], maxLength: 200, confirmLabel: 'Save',
        placeholder: choice === 'machine' ? 'e.g. Seat 4, back 3, handle 2' : ''
      });
      if (text == null) return;
      ExerciseService.setField(ex.id, field, text);
      Router.refresh();
    }
    if (choice === 'history') {
      if (ExerciseService.get(x.performedExerciseId)) Router.go(`#/exercise/${x.performedExerciseId}/history`);
      else Toast.show('This exercise is no longer in your library.');
    }
    if (choice === 'up' || choice === 'down') {
      WorkoutService.moveExercise(x.id, choice === 'up' ? -1 : 1);
      Router.refresh();
      const card = document.getElementById(`se-${x.id}`);
      if (card) card.scrollIntoView({ block: 'center' });
    }
    if (choice === 'note') {
      const text = await Dialog.prompt({
        title: "Today's note", label: `${x.nameSnapshot} (this workout only)`, value: x.sessionNote,
        message: x.notesSnapshot ? `Routine note: ${x.notesSnapshot}` : '', confirmLabel: 'Save note', maxLength: 200
      });
      if (text == null) return;
      WorkoutService.setExerciseNote(x.id, text);
      Router.refresh();
    }
    if (choice === 'remove') {
      const logged = x.sets.filter((st) => WorkoutService.setHasData(st)).length;
      const ok = await Dialog.confirm({
        title: `Remove ${x.nameSnapshot}?`,
        message: logged
          ? `${Fmt.plural(logged, 'set')} with logged data will be deleted from today's workout. The routine is not changed.`
          : "It will be removed from today's workout only. The routine is not changed.",
        confirmLabel: logged ? 'Delete logged sets' : 'Remove', danger: true
      });
      if (!ok) return;
      WorkoutService.removeExercise(x.id);
      Router.refresh();
    }

    let go;
    if (st.workingSets + st.warmupSets === 0) {
      go = (await Dialog.choose({
        title: 'Finish workout?', message: 'No sets are completed yet. Finishing saves a workout with no completed sets.',
        actions: [{ id: 'back', label: 'Return to workout', kind: 'primary' }, { id: 'finish', label: 'Finish anyway', kind: 'secondary' }]
      })) === 'finish';

  async 'entry-menu'(el) {
    const en = ScheduleService.get(el.dataset.entry);
    if (!en) return;
    const name = ScheduleService.routineName(en);
    if (en.status === 'completed') { if (en.sessionId) Router.go(`#/history/${en.sessionId}`); return; }
    const exists = !!RoutineService.get(en.routineId);
    const missed = ScheduleService.isMissed(en);
    const actions = [
      ...(exists ? [{ id: 'start', label: 'Start now', icon: 'play' }] : []),
      ...(exists ? [{ id: 'move', label: missed || en.status === 'skipped' ? 'Reschedule' : 'Move', icon: 'calendar' }] : []),
      { id: 'replace', label: 'Replace with another routine', icon: 'swap' },
      ...(en.status === 'planned' ? [{ id: 'skip', label: 'Skip', icon: 'open' }] : []),
      { id: 'remove', label: 'Remove from schedule', icon: 'trash', danger: true }
    ];
    const choice = await Dialog.sheet({ title: `${name}, ${Fmt.relDay(en.date)}`, actions });
    if (choice === 'start') await startWorkout({ routineId: en.routineId, entryId: en.id });
    if (choice === 'move') await moveEntryFlow(en.id);
    if (choice === 'skip') { ScheduleService.skip(en.id); Toast.show(`${name} skipped`); Router.refresh(); }
    if (choice === 'remove') {
      const ok = await Dialog.confirm({ title: `Remove ${name}?`, message: `It will be taken off ${Fmt.relDay(en.date)}. Your weekly plan is not changed.`, confirmLabel: 'Remove', danger: true });
      if (!ok) return;
      ScheduleService.remove(en.id); Toast.show('Removed from schedule'); Router.refresh();
    }
    if (choice === 'replace') {
      const rid = await chooseRoutine(`Replace ${name} with`, en.routineId);
      if (!rid) return;
      ScheduleService.replace(en.id, rid); Toast.show('Schedule updated'); Router.refresh();
    }
  },

    const conflicts = ScheduleService.conflicts(el.dataset.date, null);
    if (conflicts.length) {

  async 'plan-day'(el) {
    const day = el.dataset.day;
    const ids = ScheduleService.sc().plan[day].slice();
    const dayName = Tax.label('weekdays', day);
    const actions = [];
    ids.forEach((id, i) => {
      const r = RoutineService.get(id);
      if (!r) return;
      actions.push({ id: `change:${i}`, label: `Change ${r.name}`, icon: 'swap' });
      actions.push({ id: `remove:${i}`, label: `Remove ${r.name}`, icon: 'trash', danger: true });
    });
    actions.push({ id: 'add', label: ids.length ? 'Add another workout' : 'Assign a routine', icon: 'plus' });
    if (ids.length) actions.push({ id: 'rest', label: 'Make it a rest day', icon: 'clock' });
    const choice = await Dialog.sheet({ title: `${dayName}s`, actions });
    if (!choice) return;
    if (choice === 'rest') ids.length = 0;
    else if (choice.startsWith('remove:')) ids.splice(Number(choice.slice(7)), 1);
    else {
      const idx = choice.startsWith('change:') ? Number(choice.slice(7)) : ids.length;
      const rid = await chooseRoutine(`${dayName}s`, ids[idx]);
      if (!rid) return;
      ids[idx] = rid;
    }
    ScheduleService.setDay(day, ids);
    Toast.show('Weekly plan updated');
    Router.refresh();

  'goal-save'() {
    const f = Forms.state;
    if (!f || f.kind !== 'goal') return;
    const d = f.draft;
    const errors = {};
    const w = Units.parse(d.weight);
    if (w.empty || w.invalid || !(w.value > 0)) errors.weight = 'Enter a target weight greater than 0.';
    const reps = String(d.reps).trim() ? Util.parseIntOrNull(d.reps) : null;
    if (String(d.reps).trim() && !Util.isIntIn(reps, [1, 100])) errors.reps = 'Reps must be a whole number from 1 to 100.';
    if (Object.keys(errors).length) { f.errors = errors; Router.refresh(); Toast.show(Object.values(errors)[0], 'error'); return; }
    GoalService.saveStrength({ id: d.id, exerciseId: d.exerciseId, targetWeightKg: Units.fromDisplay(w.value), targetReps: reps, targetDate: d.targetDate || null, createdAt: d.createdAt });
    Forms.clear();
    Toast.show('Goal saved');
    Router.go('#/more/goals', { force: true });
  },

  /* ----- editor ----- */
  'item-step'(el) {
    const d = Editor.draft();
    const it = d && RoutineDraft.item(d, el.dataset.item);
    if (!it) return;
    const [min, max] = CONFIG.LIMITS.sets;
    const base = Number.isInteger(it.sets) ? it.sets : 3;
    it.sets = Math.min(max, Math.max(min, base + Number(el.dataset.delta)));
    document.getElementById(`sets-${it.id}`).textContent = it.sets;
    Editor.updateSummary();
  },

  'item-move'(el) {
    const d = Editor.draft();
    const dir = Number(el.dataset.dir);
    if (!d || !RoutineDraft.move(d, el.dataset.item, dir)) return;
    const id = el.dataset.item;
    const idx = d.exercises.findIndex((it) => it.id === id);
    // Keep focus on the moved item's button; switch direction at the ends.
    let focusId = `mv-${dir < 0 ? 'up' : 'down'}-${id}`;
    if (dir < 0 && idx === 0) focusId = `mv-down-${id}`;
    if (dir > 0 && idx === d.exercises.length - 1) focusId = `mv-up-${id}`;
    Editor.renderItems(focusId);
  },

  'item-remove'(el) {
    const d = Editor.draft();
    if (!d) return;
    const idx = d.exercises.findIndex((it) => it.id === el.dataset.item);
    const ex = idx >= 0 && ExerciseService.get(d.exercises[idx].exerciseId);
    RoutineDraft.remove(d, el.dataset.item);
    if (Forms.state.errors && Forms.state.errors.items) delete Forms.state.errors.items[el.dataset.item];
    const next = d.exercises[idx] || d.exercises[idx - 1];
    Editor.renderItems(next ? `rm-${next.id}` : null);
    if (!next) $('[data-action="open-picker"]').focus();
    Toast.show(`Removed ${ex ? ex.name : 'exercise'}`);
  },

      existingLabel: 'already in routine',
      existingIds: () => (Editor.draft() ? Editor.draft().exercises.map((it) => it.exerciseId) : []),
      onAdd: (ids) => {
        const d = Editor.draft();
        if (!d) return;
        const before = d.exercises.length;
        RoutineDraft.addExercises(d, ids);
        Editor.renderItems();
        const first = d.exercises[before];
        const node = first && document.getElementById(`item-${first.id}`);
        if (node) node.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    });

      return;
    }
    const isNew = !d.id;
    const id = RoutineService.save(d);
    Forms.clear();
    Toast.show(isNew ? 'Routine created' : 'Routine saved');
    Router.go(`#/routine/${id}`, { force: true });

    const f = Forms.state;
    if (!f || f.kind !== 'exercise') return;
    const id = f.key === 'exercise:new' ? null : f.key.slice('exercise:'.length);
    f.draft.name = f.draft.name.trim();

async function handleImportFile(file) {
  if (!file) return;
  if (file.size > CONFIG.MAX_IMPORT_BYTES) {
    await Dialog.alert({ title: 'Import failed', message: 'That file is too large to be an Iron Ledger backup.' });
    return;
  }
  const text = await file.text();
  const res = BackupService.parse(text);
  if (!res.ok) {
    await Dialog.alert({
      title: 'Import failed',
      message: 'Nothing was changed. The file was rejected for these reasons:',
      errors: res.errors.slice(0, 4).concat(res.errors.length > 4 ? [`…and ${res.errors.length - 4} more.`] : [])
    });
    return;
  }
  const when = res.summary.exportedAt ? new Date(res.summary.exportedAt) : null;
  const ok = await Dialog.confirm({
    title: 'Replace all data?',
    message: `This backup${when && !isNaN(when) ? ` from ${when.toLocaleString()}` : ''} contains ${Fmt.plural(res.summary.routines, 'routine')}, ${Fmt.plural(res.summary.exercises, 'exercise')} and ${Fmt.plural(res.summary.sessions, 'completed workout')}${res.summary.hasActive ? ', plus a workout in progress' : ''}. All current data, including any workout in progress, will be replaced.`,
    confirmLabel: 'Replace data', danger: true
  });
  if (!ok) return;
  BackupService.apply(res.data, res.active);
  ScheduleService.ensure();
  await refreshMissingPhotos();
  if (UIState.missingPhotos.size) Toast.show(`${Fmt.plural(UIState.missingPhotos.size, 'photo')} need your photo backup to show images.`);
  Forms.clear();
  Theme.apply(SettingsService.get().theme);
  Toast.show('Backup imported');
  Router.go('#/home', { force: true });
}

/**
 * The ONE way a workout starts (routine, scheduled entry or empty).
 * Handles an existing active workout, double taps, and the "missed workout
 * started on a day with its own plan" question. Never blocked by the schedule.
 */
async function startWorkout({ routineId = null, entryId = null, empty = false }) {
  const a = WorkoutService.active();
  if (a) {
    if (!empty && a.sourceRoutineId === routineId && Clock.now() - Date.parse(a.startedAt) < 5000) { Router.go('#/workout/active'); return; }
    const choice = await Dialog.choose({
      title: 'Workout already in progress',
      message: `${a.sourceRoutineName}, started ${Fmt.ago(a.startedAt)}.`,
      actions: [
        { id: 'resume', label: `Resume ${a.sourceRoutineName}`, kind: 'primary' },
        { id: 'discard', label: 'Discard & start new', kind: 'secondary' },
        { id: 'cancel', label: 'Cancel', kind: 'ghost' }
      ]
    });
    if (choice === 'resume') { Router.go('#/workout/active'); return; }
    if (choice !== 'discard') return;
    const sure = await Dialog.confirm({
      title: `Discard ${a.sourceRoutineName}?`,
      message: 'Every set logged in this workout will be deleted. This cannot be undone.',
      confirmLabel: 'Discard workout', danger: true
    });
    if (!sure) return;
    WorkoutService.discard();
  }
  if (startWorkout.busy) return;
  startWorkout.busy = true;
  try {
    if (empty) WorkoutService.startEmpty();
    else WorkoutService.start(routineId, { scheduleEntryId: entryId });
  } finally {
    setTimeout(() => { startWorkout.busy = false; }, CONFIG.DOUBLE_TAP_MS);
  }
  // A missed workout started today: ask what happens to today's own plan. Never decided silently.
  const en = entryId ? ScheduleService.get(entryId) : null;
  if (en && en.date < DateKey.today()) {
    const todays = ScheduleService.todayPlanned().filter((t) => t.id !== en.id);
    for (const t of todays) {
      const name = ScheduleService.routineName(t);
      const c = await Dialog.choose({
        title: `What should happen to today's ${name} workout?`,
        actions: [
          { id: 'keep', label: 'Keep scheduled', kind: 'primary' },
          { id: 'tomorrow', label: 'Move to tomorrow', kind: 'secondary' },
          { id: 'date', label: 'Choose date', kind: 'secondary' },
          { id: 'skip', label: 'Skip', kind: 'ghost' }
        ]
      });
      if (c === 'tomorrow') await moveEntryTo(t.id, DateKey.add(DateKey.today(), 1));
      if (c === 'date') await moveEntryFlow(t.id, { askWhen: false });
      if (c === 'skip') ScheduleService.skip(t.id);
    }
  }
  Router.go('#/workout/active', { force: true });
}

/** Today / Tomorrow / Choose date, then conflict handling. */
async function moveEntryFlow(entryId, { askWhen = true } = {}) {
  const en = ScheduleService.get(entryId);
  if (!en) return;
  const today = DateKey.today();
  let target = null;
  if (askWhen) {
    const c = await Dialog.choose({
      title: `Move ${ScheduleService.routineName(en)}`,
      actions: [
        ...(en.date !== today || en.status !== 'planned' ? [{ id: 'today', label: 'Today', kind: 'secondary' }] : []),
        { id: 'tomorrow', label: 'Tomorrow', kind: 'secondary' },
        { id: 'date', label: 'Choose date', kind: 'secondary' },
        { id: 'cancel', label: 'Cancel', kind: 'ghost' }
      ]
    });
    if (c === 'today') target = today;
    else if (c === 'tomorrow') target = DateKey.add(today, 1);
    else if (c !== 'date') return;
  }
  if (!target) {
    target = await pickDate(`Move ${ScheduleService.routineName(en)} to`);
    if (!target) return;
  }
  await moveEntryTo(entryId, target);
}

async function moveEntryTo(entryId, target) {
  for (;;) {
    const conflicts = ScheduleService.conflicts(target, entryId);
    let mode = 'keep';
    if (conflicts.length) {
      const c = await Dialog.choose({
        title: 'A workout is already scheduled for this date.',
        message: `${conflicts.map((x) => ScheduleService.routineName(x)).join(' and ')}, ${Fmt.relDay(target)}.`,
        actions: [
          { id: 'keep', label: 'Keep both', kind: 'primary' },
          { id: 'replace', label: 'Replace existing', kind: 'secondary' },
          { id: 'other', label: 'Choose another date', kind: 'secondary' },
          { id: 'cancel', label: 'Cancel', kind: 'ghost' }
        ]
      });
      if (c === 'other') { target = await pickDate('Choose another date'); if (!target) return; continue; }
      if (c !== 'keep' && c !== 'replace') return;
      mode = c;
    }
    ScheduleService.move(entryId, target, mode);
    Toast.show(`Moved to ${Fmt.relDay(target)}`);
    Router.refresh();
    return;
  }
}

async function pickDate(title) {
  const today = DateKey.today();
  const v = await Dialog.prompt({
    title, label: 'Date', inputType: 'date', min: today, value: DateKey.add(today, 1), confirmLabel: 'Choose',
    validate: (x) => (!DateKey.isKey(x) ? 'Choose a date.' : x < today ? 'Choose today or a later date.' : null)
  });
  return v || null;
}

async function chooseRoutine(title, currentId = null) {
  const routines = RoutineService.list();
  if (!routines.length) { Toast.show('Create a routine first.'); return null; }
  const c = await Dialog.choose({
    title,
    actions: [...routines.map((r) => ({ id: r.id, label: r.id === currentId ? `${r.name} (current)` : r.name, kind: 'secondary' })), { id: '__cancel', label: 'Cancel', kind: 'ghost' }]
  });
  return c && c !== '__cancel' ? c : null;
}

/** Live camera for progress photos. The framing guide is an overlay only. */
const Camera = {
  stream: null,
  supported() {
    return !!(typeof navigator !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
  },
  async start() {
    const video = $('#cam-video');
    const msg = $('#cam-msg');
    if (!video) return;
    Camera.stop();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: UIState.cameraFacing, width: { ideal: 1920 }, height: { ideal: 1920 } }, audio: false });
      if (!document.contains(video)) { stream.getTracks().forEach((t) => t.stop()); return; } // user already left
      Camera.stream = stream;
      video.srcObject = stream;
      await video.play().catch(() => {});
      if (msg) msg.hidden = true;
    } catch (err) {
      if (msg) msg.textContent = err && err.name === 'NotAllowedError'
        ? 'Camera access is blocked. Allow it in your browser settings, or choose a photo instead.'
        : 'The camera could not start. You can choose a photo instead.';
    }
  },
  stop() { if (Camera.stream) { Camera.stream.getTracks().forEach((t) => t.stop()); Camera.stream = null; } },
  capture() {
    const v = $('#cam-video');
    if (!v || !v.videoWidth) return Promise.reject(new AppError('The camera is not ready yet.'));
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0); // the guide is not part of the video, so it is never saved
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new AppError('The photo could not be captured.'))), 'image/jpeg', 0.92));
  }
};

/** After each render: load photo images, start the camera, wire photo panning. */
const Hydrate = {
  run(root) {
    $$('img[data-thumb]', root).forEach((img) => {
      PhotoUrls.thumb(img.dataset.thumb).then((u) => { if (u) img.src = u; else Hydrate.missing(img); }).catch(() => Hydrate.missing(img));
    });
    $$('img[data-full]', root).forEach((img) => {
      PhotoUrls.image(img.dataset.full).then((u) => { if (u) img.src = u; else Hydrate.missing(img); }).catch(() => Hydrate.missing(img));
    });
    if ($('#cam-video', root)) Camera.start();
    $$('[data-pan]', root).forEach((frame) => Hydrate.pan(frame));
  },
  missing(img) { img.removeAttribute('src'); img.alt = 'Image not on this device'; img.classList.add('is-missing'); },
  /** Drag to reposition a photo for comparison (view-only; the photo is unchanged). */
  pan(frame) {
    const side = frame.dataset.pan;
    const img = $('img', frame);
    let start = null;
    frame.addEventListener('pointerdown', (e) => {
      start = { x: e.clientX, y: e.clientY, o: { ...UIState.compare.offset[side] }, w: frame.clientWidth, h: frame.clientHeight };
      frame.setPointerCapture(e.pointerId);
    });
    frame.addEventListener('pointermove', (e) => {
      if (!start) return;
      const o = UIState.compare.offset[side];
      o.x = Math.max(-40, Math.min(40, start.o.x + ((e.clientX - start.x) / start.w) * 100));
      o.y = Math.max(-40, Math.min(40, start.o.y + ((e.clientY - start.y) / start.h) * 100));
      img.style.transform = `translate(${o.x}%,${o.y}%) scale(${UIState.compare.zoom[side]})`;
    });
    const end = () => { start = null; };
    frame.addEventListener('pointerup', end);
    frame.addEventListener('pointercancel', end);
  }
};

/** File downloads: the artifact host's downloads capability, else a normal browser download. */
const Download = {
  async save(filename, text, mime, doneMessage) {
    if (window.claude && typeof window.claude.use === 'function') {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try { await downloads.save({ filename, data: text }); Toast.show(doneMessage); }  // string or Blob
        catch (err) {
          if (err && err.code === 'declined') Toast.show('Export cancelled');
          else if (err && err.code === 'rate_limited') Toast.show('An export prompt is already open.', 'error');
          else Toast.show('Export is not available in this view.', 'error');
        }
        return;
      }
    }
    const blob = text instanceof Blob ? text : new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    Toast.show(doneMessage);
  }
};

/**
 * Rest-end alert while Iron Ledger is on screen: vibration (where supported)
 * and a short beep. No notification permission is requested: web pages
 * cannot alert reliably while the phone is locked, so we do not pretend to.
 * Every call is guarded so alerts can never disturb the timer.
 */
const RestAlert = {
  ctx: null,
  supported() {
    return typeof navigator !== 'undefined' && (typeof navigator.vibrate === 'function' || !!(window.AudioContext || window.webkitAudioContext));
  },
  unlock() {
    try {
      if (!SettingsService.get().restAlerts) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!RestAlert.ctx) RestAlert.ctx = new AC();
      if (RestAlert.ctx.state === 'suspended') RestAlert.ctx.resume();
    } catch (_) { /* sound unavailable */ }
  },
  fire() {
    if (!SettingsService.get().restAlerts || document.hidden) return;
    try { if (typeof navigator.vibrate === 'function') navigator.vibrate([180, 90, 180]); } catch (_) { /* ignore */ }
    try {
      const ctx = RestAlert.ctx;
      if (!ctx || ctx.state !== 'running') return;
      [0, 0.22].forEach((t) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.16);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.18);
      });
    } catch (_) { /* ignore */ }
  }
};

function bindEvents() {
  document.addEventListener('click', async (e) => {
    // In-app links are routed here so they never resolve against a foreign base URL.
    const link = e.target.closest('a[href^="#/"]');
    if (link && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      e.preventDefault();
      Router.go(link.getAttribute('href'));
      return;
    }
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = Actions[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    try { await fn(el, e); } catch (err) { handleError(err); }
  });

  const onEdit = (e) => {
    const el = e.target;
    try {
      if (el.dataset.replaceNote !== undefined) { if (UIState.replace) UIState.replace.note = el.value; }
      else if (el.dataset.aw) {
        // Saved on every keystroke: nothing is lost if the page closes mid-entry.
        const r = WorkoutService.updateSetField(el.dataset.se, el.dataset.set, el.dataset.aw, el.value);
        el.setAttribute('aria-invalid', String(r.invalid));
      } else if (el.dataset.histSearch !== undefined) {
        UIState.ui.historyQuery = el.value;
        const box = $('#hist-results');
        if (box) box.innerHTML = Views.historyList();
      } else if (el.dataset.ui) { UIState.ui[el.dataset.ui] = el.value; Router.refresh(); }
      else if (el.dataset.filter) Filters.onSearch(el);
      else if (el.dataset.bind) Forms.bind(el);
      else if (el.dataset.item && el.dataset.field) Editor.onItemInput(el);
    } catch (err) { handleError(err); }
  };
  document.addEventListener('input', (e) => { if (!e.target.dataset.ui) onEdit(e); });
  document.addEventListener('change', async (e) => {
    const el = e.target;
    try {
      if (el.dataset.goal) { saveGoalField(el); return; }
      if (el.dataset.uiDate) {
        if (DateKey.isKey(el.value)) UIState.ui[el.dataset.uiDate] = el.value;
        Router.refresh();
        return;
      }
      if (el.dataset.setting === 'defaultRestSec') {
        let v = el.value;
        if (v === 'custom') {
          const typed = await Dialog.prompt({
            title: 'Default rest', label: 'Seconds (15–600)', inputMode: 'numeric', value: String(SettingsService.get().defaultRestSec), confirmLabel: 'Save',
            validate: (x) => (Util.isIntIn(Util.parseIntOrNull(x), [15, 600]) ? null : 'Enter a whole number from 15 to 600.')
          });
          if (typed == null) { Router.refresh(); return; }
          v = typed;
        }
        SettingsService.set('defaultRestSec', Util.parseIntOrNull(v));
        Toast.show(`Default rest ${Fmt.rest(SettingsService.get().defaultRestSec)}`);
        Router.refresh();
        return;
      }
      if (el.tagName === 'SELECT') onEdit(e);
    } catch (err) { handleError(err); }
  });

  // Enter moves weight -> reps -> RIR within a set row, then closes the keyboard.
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (e.key !== 'Enter' || !el.dataset || !el.dataset.aw) return;
    e.preventDefault();
    const next = { weight: 'r', reps: 'q' }[el.dataset.aw];
    const target = next && document.getElementById(`${next}-${el.dataset.set}`);
    if (target) target.focus(); else el.blur();
  });

  ['#photo-file', '#photo-camera'].forEach((sel) => $(sel).addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // so picking the same file again still fires 'change'
    handleNewPhotoFile(file);
  }));
  $('#photo-import-file').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      Toast.show('Importing photos…');
      let obj;
      try { obj = JSON.parse(await file.text()); } catch (_) { throw new AppError('That file is not a photo backup.'); }
      const r = await PhotoService.importBackup(obj);
      await refreshMissingPhotos();
      Toast.show(`${Fmt.plural(r.added, 'photo')} imported${r.skipped ? `, ${r.skipped} already here` : ''}`);
      Router.refresh();
    } catch (err) { handleError(err); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.compare) return;
    const c = UIState.compare;
    const v = Number(el.value);
    if (el.dataset.compare === 'cut') { c.cut = v; const box = $('.cmp-slider'); if (box) box.style.setProperty('--cut', `${v}%`); return; }
    const side = el.dataset.compare === 'zoom-a' ? 'a' : 'b';
    c.zoom[side] = v;
    const img = $(`[data-pan="${side}"] img`);
    if (img) img.style.transform = `translate(${c.offset[side].x}%,${c.offset[side].y}%) scale(${v})`;
  });

  $('#import-file').addEventListener('change', (e) => {
    handleImportFile(e.target.files && e.target.files[0]).catch(handleError);
  });

  const picker = Picker.el();
  picker.addEventListener('cancel', (e) => { e.preventDefault(); Picker.close(); });

  Dialog.bind();

  window.addEventListener('beforeunload', (e) => {
    if (Forms.isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => { if (SettingsService.get().theme === 'system') Theme.apply('system'); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
  }
}

/**
 * Updates elapsed time and rest countdown once a second. Every value is
 * recomputed from stored timestamps, so screen lock, backgrounding or a
 * throttled interval cannot make the clocks drift.
 */
const Ticker = {
  restDoneKey: null,
  start() {
    const a = WorkoutService.active();
    if (a && a.restTimer && Calc.restRemainingSec(a.restTimer) <= 0) Ticker.restDoneKey = a.restTimer.endsAt;
    setInterval(() => Ticker.tick(), 1000);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      Ticker.tick();
      // Back after midnight: generate new schedule days and refresh what depends on "today".
      try { if (ScheduleService.ensure() && !document.body.classList.contains('is-editing')) Router.refresh(); } catch (err) { handleError(err); }
    });
    window.addEventListener('pageshow', () => Ticker.tick());
  },
  tick() {
    const a = WorkoutService.active();
    if (!a) return;
    const elapsed = Fmt.clock(Calc.sessionDurationSec(a));
    $$('[data-tick="elapsed"]').forEach((n) => { if (n.textContent !== elapsed) n.textContent = elapsed; });
    const t = a.restTimer;
    if (!t) return;
    const rem = Calc.restRemainingSec(t);
    const txt = Fmt.clock(rem);
    $$('[data-tick="rest"]').forEach((n) => { if (n.textContent !== txt) n.textContent = txt; });
    if (rem > 0) return;
    const bar = $('.restbar');
    if (bar && !bar.classList.contains('is-done')) {
      bar.classList.add('is-done');
      const label = $('[data-rest-label]', bar); if (label) label.textContent = 'Rest complete';
      const skip = $('[data-rest-skip]', bar); if (skip) skip.textContent = 'Dismiss';
    }
    if (Ticker.restDoneKey !== t.endsAt) { Ticker.restDoneKey = t.endsAt; Toast.show('Rest complete'); RestAlert.fire(); }
  }
};

/** Goals screen fields save when you leave them (blank clears the goal). */
function saveGoalField(el) {
  const field = el.dataset.goal;
  const err = el.id ? document.getElementById(`${el.id}-err`) : null;
  const fail = (msg) => { el.setAttribute('aria-invalid', 'true'); if (err) { err.textContent = msg; err.hidden = false; } Toast.show(msg, 'error'); };
  if (err) err.hidden = true;
  el.setAttribute('aria-invalid', 'false');
  const raw = String(el.value).trim();
  let value = null;
  if (field === 'workoutsPerWeek') value = raw ? Util.parseIntOrNull(raw) : null;
  else if (raw) {
    const p = Units.parse(raw);
    if (p.invalid || p.empty) { fail('Enter a number, or clear the field.'); return; }
    if (field === 'bodyweightKg') {
      value = Units.fromDisplay(p.value);
      if (!(value > 0 && value <= 500)) { fail('Enter a realistic bodyweight.'); return; }
    } else {
      value = Math.round(p.value * 10) / 10;
      if (!(value > 0 && value <= 75)) { fail('Body fat must be between 0 and 75%.'); return; }
    }
  }
  GoalService.set(field, value);
  Toast.show(value == null ? 'Goal cleared' : 'Goal saved');
}

function showBanner(messages) {
  if (!messages.length) return;
  $('#banner').innerHTML = `<div class="banner__box" role="alert">${icon('alert')}<p>${messages.map(esc).join(' ')}</p>
    <button type="button" class="icon-btn" data-action="dismiss-banner" aria-label="Dismiss message">${icon('close')}</button></div>`;
}

function boot() {
  try {
    Store.init();
  } catch (err) {
    console.error(err);
    $('#view').innerHTML = `<div class="fatal"><h1>Iron Ledger could not start</h1>
      <p>Your stored data was not modified. Error: ${esc(err.message)}</p></div>`;
    return;
  }
  Theme.apply(SettingsService.get().theme);
  try { ScheduleService.ensure(); } catch (err) { console.error(err); }
  bindEvents();
  showBanner(Store.takeNotices());
  Router.start();
  Ticker.start();
  // Photos: find metadata without image files, and remove image files without metadata.
  if (PhotoStore.available()) {
    refreshMissingPhotos().then(() => PhotoService.prune()).then(() => { if (UIState.missingPhotos.size && /photo|compare|transformation/.test(location.hash)) Router.refresh(); }).catch((err) => console.error(err));
  }
  registerServiceWorker();
}

/**
 * Installable app + offline shell. The worker fetches the app NETWORK-FIRST,
 * so a new upload always wins when online; the cached copy is only used
 * offline. Skipped where it cannot work (file://, embedded previews).
 */
function registerServiceWorker() {
  try {
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost') || window.top !== window) return;
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker not registered', err));
  } catch (_) { /* not available */ }
}

boot();
</script>
