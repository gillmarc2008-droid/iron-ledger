    if (!CONFIG.SET_TYPES.includes(type)) throw new AppError('Unknown set type.');
    Store.activeTransact((d) => { WorkoutService.find(d, seId, setId).st.type = type; });
  },

  addExercises(exerciseIds) {
    Store.activeTransact((d) => {
      const ids = WorkoutService.idsIn(d);
      exerciseIds.forEach((exId) => {
        const ex = ExerciseService.get(exId);
        if (!ex) return;
        const iso = ex.mechanic === 'isolation';
        d.exercises.push(WorkoutService.buildExercise(ex, {
          exerciseId: ex.id, routineItemId: null, sets: 3, repMin: iso ? 10 : 8, repMax: iso ? 15 : 12,
          rirMin: 1, rirMax: 2, restSec: ex.defaultRestSec, notes: '', added: true
        }, ids));
      });
    });
  },

  removeExercise(seId) {
    Store.activeTransact((d) => {
      const { x } = WorkoutService.find(d, seId);
      if (!x.addedDuringSession) {
        d.removedExercises.push({ sessionExerciseId: x.id, originalExerciseId: x.originalExerciseId, routineItemId: x.routineItemId, nameSnapshot: x.nameSnapshot, removedAt: Util.now() });
      }
      d.exercises = d.exercises.filter((e) => e.id !== seId);
      if (d.restTimer && d.restTimer.sessionExerciseId === seId) d.restTimer = null;
    });
  },

  moveExercise(seId, dir) {
    return Store.activeTransact((d) => {
      const i = d.exercises.findIndex((e) => e.id === seId);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= d.exercises.length) return false;
      [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]];
      return true;
    });
  },

  setExerciseNote(seId, text) {
    Store.activeTransact((d) => { WorkoutService.find(d, seId).x.sessionNote = String(text || '').trim(); });
  },

  setWorkoutNotes(text) {
    Store.activeTransact((d) => { d.notes = String(text || '').trim(); });
  },

  adjustRest(deltaSec) {
    Store.activeTransact((d) => {
      if (!d.restTimer) return;
      const now = Clock.now();
      const ends = Math.max(now, Date.parse(d.restTimer.endsAt) + deltaSec * 1000);
      d.restTimer.endsAt = new Date(ends).toISOString();
    });
  },

  skipRest() { Store.activeTransact((d) => { d.restTimer = null; d.lastRestExerciseId = null; }); },

  armRest(d, x) {
    const now = Clock.now();
    d.restTimer = { sessionExerciseId: x.id, durationSec: x.restSeconds, startedAt: new Date(now).toISOString(), endsAt: new Date(now + x.restSeconds * 1000).toISOString() };
  },

  /** Manual rest mode: start the timer for the last completed exercise. */
  startRest() {
    Store.activeTransact((d) => {
      const x = d.exercises.find((e) => e.id === d.lastRestExerciseId);
      if (!x) throw new AppError('Complete a set first.');
      WorkoutService.armRest(d, x);
    });
  },

  /**
   * Replaces an exercise in TODAY'S session only. The routine is never touched;
   * scope 'routine' only flags the change for review after the workout.
   * History follows performedExerciseId, so the new exercise gets the performance.
   */
  replaceExercise(seId, newExerciseId, { reason, painArea = null, note = '', scope = 'today' }) {
    if (!Tax.has('substitutionReasons', reason)) throw new AppError('Choose why you are replacing the exercise.');
    const ex = ExerciseService.get(newExerciseId);
    if (!ex) throw new AppError('That exercise no longer exists.');
    Store.activeTransact((d) => {
      const { x } = WorkoutService.find(d, seId);
      if (x.sets.some((st) => st.completed)) throw new AppError('Sets are already completed for this exercise. Undo them, or use Add exercise for the new movement.');
      if (!x.substitution) x.originalNameSnapshot = x.nameSnapshot;
      x.performedExerciseId = ex.id;
      x.nameSnapshot = ex.name;
      x.primaryMuscleSnapshot = ex.primaryMuscle;
      x.equipmentSnapshot = ex.equipment;
      if (ex.id === x.originalExerciseId) {
        // Replaced back to the original: no substitution remains.
        x.substitution = false; x.substitutionReason = null; x.substitutionDetail = null; x.proposeRoutineUpdate = false;
      } else {
        x.substitution = true;
        x.substitutionReason = reason;
        x.substitutionDetail = { painArea: reason === 'pain' ? painArea : null, note: String(note || '').trim(), at: Util.now() };
        x.proposeRoutineUpdate = scope === 'routine' && !!x.routineItemId;
      }
      // Values typed for the old exercise do not belong to the new one.
      x.sets.forEach((st) => { st.weightKg = null; st.reps = null; st.rir = null; });
      if (d.restTimer && d.restTimer.sessionExerciseId === x.id) d.restTimer = null;
    });
  },

  incompleteCount() {
    const a = Store.getActive();
    return a ? a.exercises.reduce((n, x) => n + x.sets.filter((st) => !st.completed).length, 0) : 0;
  },

  /** Completes the workout. Incomplete sets are kept as not-completed; nothing is invented. */
  finish() {
    const a = Store.getActive();
    if (!a) throw new AppError('No workout is in progress.');
    const done = Util.clone(a);
    done.status = 'completed';
    done.completedAt = Util.now();
    done.durationSec = Calc.sessionDurationSec(done);
    done.restTimer = null;
    const errors = Validate.session(done, 'completed');
    if (errors.length) throw new AppError('The workout could not be saved.', errors);
    // Saved to history AND linked to its schedule entry in one transaction.
    Store.commitActive(done, (d) => ScheduleService.markCompletedIn(d, done.scheduleEntryId, done.id));
    return done.id;
  },

  discard() { Store.discardActive(); }
};

/* =======================================================================
   SCHEDULE
   The weekly plan generates DATED ENTRIES (stored records). Each entry has
   its own status, so changing the plan never rewrites the past:
     planned   -> scheduled, not yet done (MISSED once its date has passed)
     completed -> linked to the session that fulfilled it (sessionId)
     skipped   -> the user explicitly chose not to do it
     moved     -> replaced by a new entry on another date (movedTo)
     removed   -> taken off the schedule
   The schedule is a plan only. It never blocks starting any workout.
   ======================================================================= */
const ScheduleService = {
  sc() { return Store.get().schedule; },
  hasPlan() { const p = ScheduleService.sc().plan; return Tax.ids('weekdays').some((k) => p[k].length > 0); },

  routineName(en) {
    const r = RoutineService.get(en.routineId);
    return r ? r.name : en.routineName;
  },

  newEntry(d, date, routineId, source, extra = {}) {
    const r = d.routines.find((x) => x.id === routineId);
    const t = Util.now();
    const en = {
      id: Id.unique('sc', new Set(d.schedule.entries.map((e) => e.id))),
      date, routineId, routineName: r ? r.name : (extra.routineName || 'Workout'), source,
      status: 'planned', sessionId: null, movedTo: null, movedFrom: null, createdAt: t, updatedAt: t, ...extra
    };
    d.schedule.entries.push(en);
    return en;
  },

  /** Creates plan entries for dates not yet generated (never backfills more than the window). */
  materializeIn(d) {
    const today = DateKey.today();
    const last = DateKey.add(today, CONFIG.SCHEDULE_WINDOW_DAYS - 1);
    let from = d.schedule.materializedThrough ? DateKey.add(d.schedule.materializedThrough, 1) : today;
    const floor = DateKey.add(today, -CONFIG.SCHEDULE_WINDOW_DAYS);
    if (from < floor) from = floor;
    let changed = false;
    for (let key = from; key <= last; key = DateKey.add(key, 1)) {
      // A date already touched by the plan (e.g. completed or skipped) is not regenerated.
      const touched = d.schedule.entries.some((en) => en.date === key && en.source === 'plan');
      if (!touched) {
        d.schedule.plan[DateKey.weekday(key)].forEach((rid) => {
          if (d.routines.some((r) => r.id === rid)) { ScheduleService.newEntry(d, key, rid, 'plan'); changed = true; }
        });
      }
    }
    if (d.schedule.materializedThrough !== last) { d.schedule.materializedThrough = last; changed = true; }
    return changed;
  },

  /** Called on start-up and when the day changes. Writes only if something new is generated. */
  ensure() {
    const sc = ScheduleService.sc();
    const last = DateKey.add(DateKey.today(), CONFIG.SCHEDULE_WINDOW_DAYS - 1);
    if (sc.materializedThrough === last) return false;
    Store.transact((d) => { ScheduleService.materializeIn(d); });
    return true;
  },

  /** Sets one weekday of the plan; untouched future plan dates are regenerated. Past stays as it was. */
  setDay(weekday, routineIds) {
    if (!Tax.has('weekdays', weekday)) throw new AppError('Unknown day.');
    Store.transact((d) => {
      d.schedule.plan[weekday] = routineIds.filter((id) => d.routines.some((r) => r.id === id));
      d.schedule.planUpdatedAt = Util.now();
      const today = DateKey.today();
      d.schedule.entries = d.schedule.entries.filter((en) => !(en.source === 'plan' && en.status === 'planned' && en.date >= today));
      d.schedule.materializedThrough = DateKey.add(today, -1);
      ScheduleService.materializeIn(d);
    });
  },

  visible() { return ScheduleService.sc().entries.filter((en) => en.status !== 'removed'); },
  on(key) { return ScheduleService.visible().filter((en) => en.date === key).sort((a, b) => a.createdAt.localeCompare(b.createdAt)); },
  get(id) { return ScheduleService.sc().entries.find((en) => en.id === id) || null; },
  isMissed(en) { return en.status === 'planned' && en.date < DateKey.today(); },

  /** Planned entries whose date has passed, newest first, within the look-back window. */
  missed(lookbackDays = CONFIG.MISSED_LOOKBACK_DAYS) {
    const today = DateKey.today();
    const floor = DateKey.add(today, -lookbackDays);
    return ScheduleService.visible().filter((en) => en.status === 'planned' && en.date < today && en.date >= floor)
      .sort((a, b) => b.date.localeCompare(a.date));
  },
  todayPlanned() { return ScheduleService.on(DateKey.today()).filter((en) => en.status === 'planned'); },
  next() {
    const today = DateKey.today();
    return ScheduleService.visible().filter((en) => en.status === 'planned' && en.date > today)
      .sort((a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt))[0] || null;
  },
  conflicts(dateKey, excludeId) { return ScheduleService.on(dateKey).filter((en) => en.status === 'planned' && en.id !== excludeId); },

  update(id, mutate) {
    return Store.transact((d) => {
      const en = d.schedule.entries.find((e) => e.id === id);
      if (!en) throw new AppError('That scheduled workout no longer exists.');
      const r = mutate(en, d);
      en.updatedAt = Util.now();
      return r;
    });
  },

  skip(id) { ScheduleService.update(id, (en) => { en.status = 'skipped'; en.skippedAt = Util.now(); }); },
  remove(id) { ScheduleService.update(id, (en) => { en.status = 'removed'; }); },
  replace(id, routineId) {
    const r = RoutineService.get(routineId);
    if (!r) throw new AppError('That routine no longer exists.');
    ScheduleService.update(id, (en) => { en.replacedRoutineId = en.routineId; en.routineId = r.id; en.routineName = r.name; });
  },

  /**
   * Moves an entry: the original is kept as 'moved' (history of the decision)
   * and a new planned entry is created on the target date.
   * mode 'replace' removes the target date's planned entries; 'keep' keeps both.
   */
  move(id, toKey, mode = 'keep') {
    if (!DateKey.isKey(toKey)) throw new AppError('Choose a valid date.');
    if (toKey < DateKey.today()) throw new AppError('Choose today or a later date.');
    return ScheduleService.update(id, (en, d) => {
      if (en.date === toKey && en.status === 'planned') return en.id;
      if (mode === 'replace') {
        d.schedule.entries.forEach((o) => {
          if (o.date === toKey && o.status === 'planned' && o.id !== en.id) { o.status = 'removed'; o.replacedBy = en.id; o.updatedAt = Util.now(); }
        });
      }
      const created = ScheduleService.newEntry(d, toKey, en.routineId, 'moved', { movedFrom: en.id, routineName: en.routineName });
      en.status = 'moved';
      en.movedTo = toKey;
      return created.id;
    });
  },

  add(dateKey, routineId) {
    if (!DateKey.isKey(dateKey)) throw new AppError('Choose a valid date.');
    if (!RoutineService.get(routineId)) throw new AppError('That routine no longer exists.');
    return Store.transact((d) => ScheduleService.newEntry(d, dateKey, routineId, 'manual').id);
  },

  /** Runs inside the finish transaction. Ignores entries that were removed meanwhile. */
  markCompletedIn(d, entryId, sessionId) {
    if (!entryId) return;
    const en = d.schedule.entries.find((e) => e.id === entryId);
    if (!en || en.status === 'removed') return;
    en.status = 'completed';
    en.sessionId = sessionId;
    en.completedAt = Util.now();
    en.updatedAt = Util.now();
  }
};


/* =======================================================================
   CSV EXPORT — one row per COMPLETED set, from session snapshots only.
   ======================================================================= */
const CsvService = {
  cell(v) {
    if (v == null) return '';
    let s = String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`; // spreadsheet formula-injection guard
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  },
  build(sessions = Store.get().sessions) {
    const unit = Units.current();
    const header = ['Date', 'Start time', 'Workout', 'Workout duration (min)', 'Exercise', 'Substituted for', 'Substitution reason',
      'Set', 'Set type', 'Weight', 'Unit', 'Weight (kg)', 'Reps', 'RIR', 'Completed at', 'Workout ID'];
    const rows = [header];
    sessions.slice().sort((a, b) => Date.parse(a.startedAt) - Date.parse(b.startedAt)).forEach((ws) => {
      const start = new Date(ws.startedAt);
      const time = `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`;
      const mins = Math.round(Calc.sessionDurationSec(ws) / 60);
      ws.exercises.forEach((x) => {
        const labels = Calc.setLabels(x.sets);
        x.sets.forEach((st, i) => {
          if (!st.completed) return;
          rows.push([
            DateKey.of(start), time, ws.sourceRoutineName, mins, x.nameSnapshot,
            x.substitution ? x.originalNameSnapshot : '',
            x.substitution ? Tax.label('substitutionReasons', x.substitutionReason) : '',
            labels[i], SET_TYPE_NAMES[st.type], st.weightKg == null ? '' : Units.toDisplay(st.weightKg, unit), unit,
            st.weightKg == null ? '' : st.weightKg, st.reps, st.rir == null ? '' : st.rir, st.completedAt || '', ws.id
          ]);
        });
      });
    });
    return '\ufeff' + rows.map((r) => r.map((c) => CsvService.cell(c)).join(',')).join('\r\n') + '\r\n';
  },
  filename() { return `iron-ledger-workouts-${DateKey.today()}.csv`; }
};
const SET_TYPE_NAMES = Object.freeze({ warmup: 'Warm-up', working: 'Working', drop: 'Drop', failure: 'Failure' });

/* =======================================================================
   12b. PHOTO STORAGE (IndexedDB)
   Image files never go into localStorage. They live in an IndexedDB
   database with two object stores keyed by photo id:
     images -> original image Blob
     thumbs -> small JPEG Blob for the gallery
   Photo METADATA lives in the main data (PhotoMeta). A failure here can
   only fail the photo operation; it never touches workout data.
   ======================================================================= */
const IdbPhotoBackend = {
  db: null,
  open() {
    if (IdbPhotoBackend.db) return Promise.resolve(IdbPhotoBackend.db);
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(CONFIG.KEYS.PHOTO_DB, 1); } catch (err) { reject(err); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
        if (!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs');
      };
      req.onsuccess = () => { IdbPhotoBackend.db = req.result; resolve(req.result); };
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
      req.onblocked = () => reject(new Error('IndexedDB is blocked by another tab'));
    });
  },
  async tx(stores, mode, fn) {
    const db = await IdbPhotoBackend.open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(stores, mode);
      let result;
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error || new Error('IndexedDB transaction failed'));
      t.onabort = () => reject(t.error || new Error('IndexedDB transaction aborted'));
      result = fn(t);
    });
  },
  reqValue(req) { return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); },
  async put(id, image, thumb) {
    await IdbPhotoBackend.tx(['images', 'thumbs'], 'readwrite', (t) => {
      t.objectStore('images').put(image, id);
      if (thumb) t.objectStore('thumbs').put(thumb, id); else t.objectStore('thumbs').delete(id);
    });
  },
  async get(store, id) {
    const db = await IdbPhotoBackend.open();
    return IdbPhotoBackend.reqValue(db.transaction(store, 'readonly').objectStore(store).get(id)).then((v) => v || null);
  },
  async delete(id) { await IdbPhotoBackend.tx(['images', 'thumbs'], 'readwrite', (t) => { t.objectStore('images').delete(id); t.objectStore('thumbs').delete(id); }); },
  async keys() {
    const db = await IdbPhotoBackend.open();
    return IdbPhotoBackend.reqValue(db.transaction('images', 'readonly').objectStore('images').getAllKeys());
  },
  async clear() { await IdbPhotoBackend.tx(['images', 'thumbs'], 'readwrite', (t) => { t.objectStore('images').clear(); t.objectStore('thumbs').clear(); }); }
};

/** In-memory backend: used only when explicitly selected (automated tests). */
const MemoryPhotoBackend = {
  images: new Map(), thumbs: new Map(),
  async put(id, image, thumb) { this.images.set(id, image); if (thumb) this.thumbs.set(id, thumb); else this.thumbs.delete(id); },
  async get(store, id) { return (store === 'images' ? this.images : this.thumbs).get(id) || null; },
  async delete(id) { this.images.delete(id); this.thumbs.delete(id); },
  async keys() { return [...this.images.keys()]; },
  async clear() { this.images.clear(); this.thumbs.clear(); }
};

const PhotoStore = {
  backend: null,
  available() {
    if (PhotoStore.backend) return true;
    try { return typeof indexedDB !== 'undefined' && indexedDB !== null; } catch (_) { return false; }
  },
  be() {
    if (!PhotoStore.backend) {
      if (!PhotoStore.available()) throw new AppError('Photo storage is not available in this browser.');
      PhotoStore.backend = IdbPhotoBackend;
    }
    return PhotoStore.backend;
  },
  async put(id, image, thumb) {
    try { await PhotoStore.be().put(id, image, thumb); }
    catch (err) {
      if (err instanceof AppError) throw err;
      console.error(err);
      throw new AppError(/quota/i.test(String(err && (err.name || err.message))) ? 'Not enough storage space on this device for the photo.' : 'The photo could not be saved on this device.');
    }
  },
  image(id) { return PhotoStore.be().get('images', id); },
  thumb(id) { return PhotoStore.be().get('thumbs', id); },
  delete(id) { return PhotoStore.be().delete(id); },
  keys() { return PhotoStore.be().keys(); },
  clear() { return PhotoStore.be().clear(); }
};

/** Decoding / thumbnails (browser canvas). Originals are never modified. */
const ImageTools = {
  load(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { resolve({ img, url }); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new AppError('This image could not be read. Try a JPEG or PNG photo.')); };
      img.src = url;
    });
  },
  async thumbnail(blob, max = CONFIG.PHOTO_THUMB_PX) {
    const { img, url } = await ImageTools.load(blob);
    try {
      const w = img.naturalWidth; const h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const thumb = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
      return { blob: thumb, width: w, height: h };
    } finally { URL.revokeObjectURL(url); }
  }
};

const PhotoService = {
  /** Stores the image FIRST, then the metadata; undoes the image if the metadata fails. */
  async add(blob, { date, pose, clothing, note = '', takenAt = null }) {
    if (!PhotoStore.available()) throw new AppError('Photo storage is not available in this browser.');
    if (!blob || !blob.size) throw new AppError('That file is empty.');
    if (blob.size > CONFIG.MAX_PHOTO_BYTES) throw new AppError('That photo is too large (over 30 MB).');
    if (!/^image\//.test(blob.type || 'image/')) throw new AppError('Choose an image file.');
    if (!Tax.has('poses', pose) || !Tax.has('clothing', clothing)) throw new AppError('Choose a pose and clothing category.');
    if (!DateKey.isKey(date)) throw new AppError('Choose a valid date.');
    const t = await ImageTools.thumbnail(blob);
    const id = PhotoMeta.newId();
    await PhotoStore.put(id, blob, t.blob);
    try {
      PhotoMeta.add({
        id, date, takenAt: takenAt || Util.now(), pose, clothing, note: String(note || '').trim(),
        mime: blob.type || 'image/jpeg', sizeBytes: blob.size, width: t.width, height: t.height,
        createdAt: Util.now(), updatedAt: Util.now()
      });
    } catch (err) {
      await PhotoStore.delete(id).catch(() => {});
      throw err;
    }
    return id;
  },

  /** Metadata first (the source of truth for the gallery); a leftover image file is pruned later. */
  async remove(id) {
    PhotoMeta.remove(id);
    PhotoUrls.forget(id);
    try { await PhotoStore.delete(id); } catch (err) { console.error(err); }
  },

  /** Deletes image files that no longer have metadata (e.g. after a reset or interrupted delete). */
  async prune() {
    if (!PhotoStore.available()) return 0;
    const known = new Set(Store.get().photos.map((p) => p.id));
    const keys = await PhotoStore.keys();
    const orphans = keys.filter((k) => !known.has(k));
    for (const k of orphans) await PhotoStore.delete(k);
    return orphans.length;
  },

  async missing() {
    if (!PhotoStore.available()) return new Set(Store.get().photos.map((p) => p.id));
    const keys = new Set(await PhotoStore.keys());
    return new Set(Store.get().photos.filter((p) => !keys.has(p.id)).map((p) => p.id));
  },

  toBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).slice(String(r.result).indexOf(',') + 1));
      r.onerror = () => reject(r.error || new Error('Could not read the photo'));
      r.readAsDataURL(blob);
    });
  },
  fromBase64(b64, mime) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  },

  /** A separate PHOTO backup: metadata + image data, as one JSON file. */
  async buildBackup() {
    const photos = [];
    for (const meta of PhotoMeta.list()) {
      const blob = await PhotoStore.image(meta.id);
      if (blob) photos.push({ meta, mime: blob.type || meta.mime || 'image/jpeg', data: await PhotoService.toBase64(blob) });
    }
    return { kind: 'iron-ledger-photo-backup', version: 1, app: CONFIG.APP_NAME, exportedAt: Util.now(), photos };
  },

  /** Adds photos that are not already on this device. Never deletes or overwrites existing ones. */
  async importBackup(obj) {
    if (!obj || obj.kind !== 'iron-ledger-photo-backup' || !Array.isArray(obj.photos)) throw new AppError('This file is not an Iron Ledger photo backup.');
    const errors = Validate.photos(obj.photos.map((p) => p && p.meta));
    if (errors.length) throw new AppError('The photo backup is damaged and was not imported.', errors);
    const missing = await PhotoService.missing();
    let added = 0; let skipped = 0;
    for (const p of obj.photos) {
      const existing = PhotoMeta.get(p.meta.id);
      if (existing && !missing.has(p.meta.id)) { skipped++; continue; }
      const blob = PhotoService.fromBase64(p.data, p.mime);
      let thumb = null;
      try { thumb = (await ImageTools.thumbnail(blob)).blob; } catch (_) { /* gallery falls back to the full image */ }
      await PhotoStore.put(p.meta.id, blob, thumb);
      if (!existing) PhotoMeta.add({ ...p.meta });
      added++;
    }
    return { added, skipped };
  }
};

/** Object URLs for images. Thumbnails are cached; full images are released when screens change. */
const PhotoUrls = {
  thumbs: new Map(),
  full: [],
  async thumb(id) {
    if (PhotoUrls.thumbs.has(id)) return PhotoUrls.thumbs.get(id);
    const blob = (await PhotoStore.thumb(id)) || (await PhotoStore.image(id));
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    PhotoUrls.thumbs.set(id, url);
    return url;
  },
  async image(id) {
    const blob = await PhotoStore.image(id);
    if (!blob) return null;
    const url = URL.createObjectURL(blob);
    PhotoUrls.full.push(url);
    return url;
  },
  releaseFull() { PhotoUrls.full.forEach((u) => URL.revokeObjectURL(u)); PhotoUrls.full = []; },
  forget(id) { const u = PhotoUrls.thumbs.get(id); if (u) URL.revokeObjectURL(u); PhotoUrls.thumbs.delete(id); },
  reset() { PhotoUrls.thumbs.forEach((u) => URL.revokeObjectURL(u)); PhotoUrls.thumbs.clear(); PhotoUrls.releaseFull(); }
};

/** Opens a native <dialog>. Falls back to the open attribute where showModal is missing. */
function showDialog(el) {
  if (typeof el.showModal === 'function') { if (!el.open) el.showModal(); }
  else el.setAttribute('open', '');
}
function hideDialog(el) {
  if (typeof el.close === 'function' && el.open) el.close();
  else el.removeAttribute('open');
}

/**
 * Promise-based dialogs on one reusable <dialog id="dialog">:
 *   Dialog.confirm / Dialog.alert / Dialog.prompt / Dialog.sheet
 */
const Dialog = (() => {
  let resolver = null;
  let returnFocus = null;
  let validator = null;
  const el = () => $('#dialog');

  function open(html, { sheet = false, validate = null } = {}) {
    if (resolver) finish(null);
    returnFocus = document.activeElement;
    validator = validate;
    const d = el();
    d.className = sheet ? 'sheet' : '';
    d.innerHTML = html;
    return new Promise((resolve) => {
      resolver = resolve;
      showDialog(d);
      const first = $('input', d) || $('[data-dialog-default]', d) || $('button', d);
      if (first) first.focus();
      if (first && first.select && first.tagName === 'INPUT') first.select();
    });
  }

  function finish(value) {
    const d = el();
    const r = resolver;
    resolver = null;
    validator = null;
    hideDialog(d);
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    if (r) r(value);
  }

  function submitPrompt() {
    const d = el();
    const input = $('input', d);
    const value = input ? input.value : '';
    if (validator) {
      const msg = validator(value);
      const errEl = $('.field-error', d);
      if (msg) {
        errEl.textContent = msg;
        errEl.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
    }
    finish(value);
  }

  function bind() {
    const d = el();
    d.addEventListener('click', (e) => {
      if (e.target === d) { finish(null); return; }        // backdrop tap
      const b = e.target.closest('[data-dialog]');
      if (!b) return;
      const v = b.dataset.dialog;
      if (v === 'cancel') finish(null);
      else if (v === 'submit') submitPrompt();
      else finish(v);
    });
    d.addEventListener('cancel', (e) => { e.preventDefault(); finish(null); }); // Escape key
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submitPrompt(); }
    });
  }

  return {
    bind,
    confirm({ title, message = '', confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
      return open(`<div class="dlg" role="document">
          <h2 id="dlg-title">${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          <div class="dlg__actions">
            <button type="button" class="btn btn-secondary" data-dialog="cancel" data-dialog-default>${esc(cancelLabel)}</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dialog="ok">${esc(confirmLabel)}</button>
          </div></div>`).then((v) => v === 'ok');
    },
    alert({ title, message = '', errors = [] }) {
      return open(`<div class="dlg" role="document">
          <h2>${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          ${errors.length ? `<ul class="errors">${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
          <div class="dlg__actions"><button type="button" class="btn btn-primary" data-dialog="ok">OK</button></div>
        </div>`);
    },
    prompt({ title, label, value = '', message = '', confirmLabel = 'Save', danger = false, maxLength = 60, validate = null, placeholder = '', inputType = 'text', inputMode = '', min = '' }) {
      return open(`<div class="dlg" role="document">
          <h2>${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          <div class="field">
            <label for="dlg-input">${esc(label)}</label>
            <input id="dlg-input" type="${esc(inputType)}" ${inputMode ? `inputmode="${esc(inputMode)}"` : ''} ${min ? `min="${esc(min)}"` : ''} value="${esc(value)}" maxlength="${maxLength}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(placeholder)}">
            <p class="field-error" role="alert" hidden></p>
          </div>
          <div class="dlg__actions">
            <button type="button" class="btn btn-secondary" data-dialog="cancel">Cancel</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dialog="submit">${esc(confirmLabel)}</button>
          </div></div>`, { validate });
    },
    /** Several stacked choices; resolves the chosen id or null. */
    choose({ title, message = '', actions }) {
      const cls = { primary: 'btn-primary', danger: 'btn-danger', secondary: 'btn-secondary', ghost: 'btn-ghost' };
      return open(`<div class="dlg" role="document">
          <h2>${esc(title)}</h2>
          ${message ? `<p class="dlg__msg">${esc(message)}</p>` : ''}
          <div class="dlg__stack ${actions.length > 5 ? 'dlg__stack--scroll' : ''}">
            ${actions.map((a, i) => `<button type="button" class="btn btn-block ${cls[a.kind] || 'btn-secondary'}" data-dialog="${esc(a.id)}" ${i === 0 ? 'data-dialog-default' : ''}>${esc(a.label)}</button>`).join('')}
          </div></div>`);
    },
    sheet({ title, actions }) {
      return open(`<div role="document">
          <h2 class="sheet__title">${esc(title)}</h2>
          <div class="sheet__actions">
            ${actions.map((a) => `<button type="button" class="sheet__btn ${a.danger ? 'sheet__btn--danger' : ''}" data-dialog="${esc(a.id)}" ${a.current ? 'aria-current="true"' : ''}>${icon(a.icon)}<span>${esc(a.label)}</span>${a.current ? '<span class="tag">Current</span>' : ''}</button>`).join('')}
            <button type="button" class="sheet__btn sheet__cancel" data-dialog="cancel">Cancel</button>
          </div></div>`, { sheet: true });
    }
  };
})();

  tabs(label, items, current) {
    return `<nav class="segmented subtabs" aria-label="${esc(label)}">
      ${items.map(([id, text, href]) => `<a href="${href}" ${id === current ? 'aria-current="page"' : ''}>${esc(text)}</a>`).join('')}
    </nav>`;
  },

  /** In-memory screen setting (period, view mode…). Never persisted. */
  uiChoice({ id, label, key, options }) {
    const value = UIState.ui[key];
    return `<div class="segmented seg-sm" role="radiogroup" ${id ? `aria-labelledby="${id}"` : `aria-label="${esc(label)}"`}>
      ${options.map(([v, text]) => `<button type="button" role="radio" aria-checked="${v === value}" data-action="ui-set" data-key="${key}" data-value="${esc(v)}">${esc(text)}</button>`).join('')}
    </div>`;
  },

  tiles(items) {
    return `<dl class="tiles">${items.map(([label, value, sub]) => `<div class="tile">
      <dt>${esc(label)}</dt><dd class="num">${esc(value)}</dd>${sub ? `<span class="tile__sub">${esc(sub)}</span>` : ''}</div>`).join('')}</dl>`;
  },

  /** Row used for settings-style lists. */
  navRow({ href, action, msg, icon: ic, title, sub, tag = '', danger = false }) {
    const inner = `${icon(ic)}<span class="datarow__body"><span class="datarow__title">${esc(title)}</span>${sub ? `<span class="datarow__sub">${esc(sub)}</span>` : ''}</span>${tag}`;
    const cls = `datarow${danger ? ' datarow--danger' : ''}`;
    if (href) return `<a class="${cls}" href="${href}">${inner}${icon('chevron', 'xrow__chev')}</a>`;
    return `<button type="button" class="${cls}" data-action="${action}" ${msg ? `data-msg="${esc(msg)}"` : ''}>${inner}</button>`;
  },

  /** "1  22.5 × 10  RIR 2" lines for completed sets ({set, label}). */
  setLines(items) {
    return `<table class="mini">
      <thead><tr><th scope="col">Set</th><th scope="col">${esc(Units.current())} × reps</th><th scope="col">RIR</th></tr></thead>
      <tbody>${items.map(({ set, label }) => `<tr class="${set.completed ? '' : 'is-skipped'}">
        <td class="num">${esc(label)}</td>
        <td class="num">${set.completed ? `<b>${set.weightKg == null ? 'BW' : esc(Units.fmt(set.weightKg))} × ${set.reps}</b>` : '<span class="muted">Not completed</span>'}</td>
        <td class="num">${set.completed && set.rir != null ? set.rir : '–'}</td></tr>`).join('')}</tbody>
    </table>`;
  },

  /** Completed-workout card. */
  sessionCard(ws) {
    const st = Calc.sessionStats(ws);
    return `<a class="wcard wcard--real" href="#/history/${esc(ws.id)}">
      <span class="wcard__top"><span class="wcard__name">${esc(ws.sourceRoutineName)}</span><span class="wcard__date">${esc(Fmt.dayDate(ws.startedAt))}</span></span>
      <span class="wcard__stats">
        <span class="fig"><b>${Fmt.duration(st.durationSec)}</b><span>duration</span></span>
        <span class="fig"><b>${st.workingSets}</b><span>working sets</span></span>
        <span class="fig"><b>${esc(Units.fmtVolume(st.volumeKg))}</b><span>volume</span></span>
      </span></a>`;
  },

  radioGroup({ id, label, options, value, action, key }) {
    return `<div class="segmented" role="radiogroup" aria-labelledby="${id}">
      ${options.map((o) => `<button type="button" role="radio" aria-checked="${o.id === value}" data-action="${action}" data-key="${key}" data-value="${esc(o.id)}">${esc(o.label)}</button>`).join('')}
    </div>`;
  }
};

const Views = {
  /* ---------------- HOME ---------------- */
  home() {
    const routines = RoutineService.list();
    const today = Clock.date();
    const days = Calc.weekDays(today, SettingsService.get().weekStart);
    const active = WorkoutService.active();
    const sessions = Store.get().sessions;
    const end = new Date(days[6]); end.setDate(end.getDate() + 1);
    const week = Calc.periodStats(sessions, days[0], end);
    const trainedDays = new Set(sessions.map((ws) => new Date(ws.startedAt).toDateString()));
    const todays = ScheduleService.on(DateKey.today()).filter((en) => en.status !== 'moved');
    const missed = ScheduleService.missed();
    const next = ScheduleService.next();
    const goal = GoalService.get().workoutsPerWeek;

    const routineRows = routines.map((r) => `
      <li class="rrow">
        <a class="rrow__main" href="#/routine/${esc(r.id)}">
          <span class="rrow__name">${esc(r.name)}</span>
          <span class="rrow__focus">${esc(Partials.focus(r))}</span>
          <span class="rrow__count num">${Fmt.plural(Calc.routineExerciseCount(r), 'exercise')}, ${Fmt.plural(Calc.routineWorkingSets(r), 'working set')}</span>
        </a>
        <button type="button" class="btn btn-secondary btn-sm" data-action="start-routine" data-id="${esc(r.id)}" aria-label="Start ${esc(r.name)}">${icon('play')}Start</button>
      </li>`).join('');

    const todayCard = (en) => {
      const r = RoutineService.get(en.routineId);
      const name = ScheduleService.routineName(en);
      if (en.status === 'completed') {
        return `<div class="today today--done"><p class="today__title">${esc(name)}</p>
          <p class="today__sub">${icon('check')} Done${en.sessionId ? ` · <a href="#/history/${esc(en.sessionId)}">View workout</a>` : ''}</p></div>`;
      }
      if (en.status === 'skipped') return `<div class="today"><p class="today__title">${esc(name)}</p><p class="today__sub">Skipped</p></div>`;
      return `<div class="today">
        <p class="today__title">${esc(name)}</p>
        ${r ? `<p class="today__sub">${esc(Partials.focus(r))}, ${Fmt.plural(Calc.routineWorkingSets(r), 'working set')}</p>` : '<p class="today__sub">This routine was deleted.</p>'}
        <div class="today__actions">
          ${r ? `<button type="button" class="btn btn-primary" data-action="start-entry" data-entry="${esc(en.id)}">${icon('play')}Start workout</button>` : ''}
          <button type="button" class="icon-btn icon-btn--boxed" data-action="entry-menu" data-entry="${esc(en.id)}" aria-label="Schedule options for ${esc(name)}">${icon('dots')}</button>
        </div></div>`;
    };

    let todaySection;
    if (todays.length) todaySection = todays.map(todayCard).join('');
    else if (ScheduleService.hasPlan()) todaySection = `<div class="today"><p class="today__title">Rest day</p><p class="today__sub">Nothing is scheduled today. You can still start any workout below.</p></div>`;
    else todaySection = `<div class="today"><p class="today__title">No workout scheduled.</p>
      <p class="today__sub">Plan your week to see today's workout here.</p>
      <div class="today__actions"><a class="btn btn-secondary" href="#/workout/schedule">${icon('calendar')}Plan your week</a></div></div>`;

    return `
      <header class="home-head">
        <div class="wordmark"><span class="wordmark__rule" aria-hidden="true"></span><span>IRON LEDGER</span></div>
        <p class="home-date">${esc(Fmt.longDate(today))}</p>
      </header>

      ${active ? `<a class="inprogress" href="#/workout/active">
        <span class="inprogress__label"><span class="pulse" aria-hidden="true"></span>Workout in progress</span>
        <span class="inprogress__name">${esc(active.sourceRoutineName)}</span>
        <span class="inprogress__time num" data-tick="elapsed">${Fmt.clock(Calc.sessionDurationSec(active))}</span>
        <span class="btn btn-primary btn-block">${icon('play')}Resume workout</span>
      </a>` : ''}

      <section class="section" aria-labelledby="today-h">
        <div class="section-head"><h2 class="section-title" id="today-h">Today's workout</h2></div>
        ${todaySection}
      </section>

      ${missed.length ? `<section class="section" aria-labelledby="missed-h">
        <div class="section-head"><h2 class="section-title" id="missed-h">Missed</h2>${missed.length > 2 ? `<a class="link" href="#/workout/schedule">All ${missed.length}${icon('chevron')}</a>` : ''}</div>
        ${missed.slice(0, 2).map((en) => Partials.missedCard(en)).join('')}
      </section>` : ''}

      <section class="section" aria-labelledby="another-h">
        <div class="section-head"><h2 class="section-title" id="another-h">Choose another workout</h2><a class="link" href="#/workout/routines">Routines${icon('chevron')}</a></div>
        ${routines.length ? `<ul class="rlist">${routineRows}</ul>` : `
          <div class="empty-inline">${icon('workout')}<p>No routines yet. <a href="#/routine/new">Create a routine</a>.</p></div>`}
        <button type="button" class="btn btn-secondary btn-block start-empty" data-action="start-empty">${icon('plus')}Start empty workout</button>
      </section>

      <section class="section" aria-labelledby="week-h">
        <div class="section-head">
          <h2 class="section-title" id="week-h">This week</h2>
          <span class="meta num">${esc(Fmt.shortDate(days[0]))} – ${esc(Fmt.shortDate(days[6]))}</span>
        </div>
        <ol class="week" aria-label="Days this week">
          ${days.map((d) => {
            const trained = trainedDays.has(d.toDateString());
            return `<li class="week__day ${trained ? 'has-workout' : ''}" ${Fmt.sameDay(d, today) ? 'aria-current="date"' : ''}><span>${esc(Fmt.weekdayInitial(d))}</span><b class="num">${d.getDate()}</b>${trained ? '<span class="sr-only">workout logged</span>' : ''}</li>`;
          }).join('')}
        </ol>
        ${week.workouts ? Partials.tiles([
          ['Workouts', goal ? `${week.workouts} of ${goal}` : String(week.workouts)],
          ['Working sets', String(week.workingSets)],
          ['Volume', Units.fmtVolume(week.volumeKg)],
          ['Training time', Fmt.duration(week.durationSec)]
        ]) : `<div class="empty-inline">${icon('progress')}<p>${sessions.length ? `No workouts logged this week yet.${goal ? ` Goal: ${goal} per week.` : ''}` : 'Complete your first workout to start building your training history.'}</p></div>`}
      </section>

      ${Views.recentProgress()}

      <section class="section" aria-labelledby="next-h">
        <div class="section-head"><h2 class="section-title" id="next-h">Next workout</h2></div>
        ${next ? `<a class="next" href="#/workout/schedule"><span class="next__name">${esc(ScheduleService.routineName(next))}</span><span class="next__when">${esc(Fmt.relDay(next.date))}</span>${icon('chevron', 'xrow__chev')}</a>`
          : `<div class="empty-inline">${icon('clock')}<p>${ScheduleService.hasPlan() ? 'Nothing else scheduled in the next two weeks.' : 'Nothing scheduled.'}</p></div>`}
      </section>`;
  },

  /** At most two real insights: a recent PR and the bodyweight trend. Hidden when there is nothing real to say. */
  recentProgress() {
    const items = [];
    const sessions = Store.get().sessions;
    const recentFloor = Clock.now() - 14 * 86400000;
    const prs = Calc.prTimeline(sessions).filter((p) => Date.parse(p.date) >= recentFloor);
    if (prs.length) {
      const order = { weight: 0, e1rm: 1, reps: 2, volume: 3 };
      const p = prs.slice().sort((a, b) => Date.parse(b.date) - Date.parse(a.date) || order[a.kind] - order[b.kind])[0];
      items.push(`<a class="insight" href="#/history/${esc(p.sessionId)}">${icon('trophy')}<span><b>New PR: ${esc(p.exerciseName)}</b>
        <span>${esc(Views.prText(p))}, ${esc(Fmt.relDay(DateKey.of(new Date(p.date))))}${prs.length > 1 ? ` · ${Fmt.plural(prs.length, 'PR')} in 2 weeks` : ''}</span></span></a>`);
    }
    const w = Calc.bodySeries(Store.get().body.entries, 'weightKg');
    if (w.length >= 2) {
      const last = w[w.length - 1];
      const base = w.filter((p) => p.t <= last.t - 21 * 86400000).pop() || w[0];
      if (base !== last) {
        items.push(`<a class="insight" href="#/progress/body">${icon('scale')}<span><b>Weight ${esc(Units.metric('weightKg', last.v))}</b>
          <span>${esc(Units.metricDelta('weightKg', last.v - base.v))} since ${esc(Fmt.relDay(DateKey.of(new Date(base.t))))}</span></span></a>`);
      }
    }
    if (!items.length) return '';
    return `<section class="section" aria-labelledby="rp-h"><div class="section-head"><h2 class="section-title" id="rp-h">Recent progress</h2></div>${items.join('')}</section>`;
  },

  prText(p) {
    const u = Units.current();
    const set = `${p.weightKg == null ? 'BW' : `${Units.fmt(p.weightKg)} ${u}`} × ${p.reps}`;
    if (p.kind === 'weight') return `heaviest weight, ${set}`;
    if (p.kind === 'e1rm') return `est. 1RM ${Units.fmt(Math.round(p.value * 10) / 10)} ${u} (${set})`;
    if (p.kind === 'volume') return `best set ${Units.fmtVolume(p.value)} (${set})`;
    return `most reps at this weight, ${set}`;
  },
  prAlso(p) {
    const names = { e1rm: 'est. 1RM', reps: 'reps', volume: 'best set', weight: 'weight' };
    return (p.kinds || []).slice(1).map((k) => names[k]).join(', ');
  },

  /* ---------------- WORKOUT HUB ---------------- */
  workout(tab) {
    const actions = {
      routines: `<a class="btn btn-secondary btn-sm" href="#/routine/new">${icon('plus')}New routine</a>`,
      exercises: `<a class="btn btn-secondary btn-sm" href="#/exercise/new">${icon('plus')}New exercise</a>`
    };
    const body = { routines: Views.routineCards, schedule: Views.schedule, history: Views.history, exercises: Views.library }[tab];
    return `
      ${Partials.mainHead('Workout', actions[tab] || '')}
      ${Partials.tabs('Workout sections', [
        ['routines', 'Routines', '#/workout/routines'],
        ['schedule', 'Schedule', '#/workout/schedule'],
        ['history', 'History', '#/workout/history'],
        ['exercises', 'Exercises', '#/workout/exercises']
      ], tab)}
      ${body()}`;
  },

  routineCards() {
    const routines = RoutineService.list();
    if (!routines.length) {
      return `<div class="empty">
        <div class="empty__mark">${icon('workout')}</div>
        <h2>No routines yet</h2>
        <p>A routine is a reusable plan: exercises, target sets, reps, RIR and rest.</p>
        <a class="btn btn-primary" href="#/routine/new">${icon('plus')}Create routine</a></div>`;
    }
    return `<div class="rcards">${routines.map((r) => `
      <article class="rcard" aria-labelledby="rc-${esc(r.id)}">
        <div class="rcard__top">
          <a class="rcard__link" href="#/routine/${esc(r.id)}">
            <h2 class="rcard__name" id="rc-${esc(r.id)}">${esc(r.name)}</h2>
            <p class="rcard__focus">${esc(Partials.focus(r))}</p>
          </a>
          <span class="rrow__figs">
            <span class="fig"><b>${Calc.routineExerciseCount(r)}</b><span>exercises</span></span>
            <span class="fig"><b>${Calc.routineWorkingSets(r)}</b><span>working sets</span></span>
          </span>
        </div>
        <div class="rcard__actions">
          <button type="button" class="btn btn-primary" data-action="start-routine" data-id="${esc(r.id)}" aria-label="Start ${esc(r.name)}">${icon('play')}Start</button>
          <a class="btn btn-secondary" href="#/routine/${esc(r.id)}/edit" aria-label="Edit ${esc(r.name)}">Edit</a>
          <button type="button" class="icon-btn" data-action="routine-menu" data-id="${esc(r.id)}" aria-label="More actions for ${esc(r.name)}">${icon('dots')}</button>
        </div>
      </article>`).join('')}</div>`;
  },

  library() {
    const f = UIState.library;
    const list = ExerciseService.query({ ...f, sort: 'name' });
    return `
      ${Partials.filters('lib', f)}
      <div class="results-bar"><span id="lib-count" aria-live="polite">${Fmt.plural(list.length, 'exercise')}</span></div>
      <ul class="xlist" id="lib-results">${Partials.libraryRows(list)}</ul>`;
  },

  /* ---------------- ROUTINE DETAIL ---------------- */
  routineDetail(id) {
    const r = RoutineService.get(id);
    if (!r) { Toast.show('That routine no longer exists.'); return Router.redirect('#/workout/routines'); }
    const items = r.exercises.map((it, i) => {
      const ex = ExerciseService.get(it.exerciseId);
      return `<li class="ledger__item">
        <div class="ledger__row">
          <a class="ledger__name" href="#/exercise/${esc(it.exerciseId)}">${esc(ex ? ex.name : 'Unknown exercise')}</a>
          <span class="c num" aria-label="${it.sets} sets">${it.sets}</span>
          <span class="c num" aria-label="${Fmt.range(it.repMin, it.repMax)} reps">${Fmt.range(it.repMin, it.repMax)}</span>
          <span class="c num" aria-label="RIR ${Fmt.rir(it.rirMin, it.rirMax)}">${Fmt.rir(it.rirMin, it.rirMax)}</span>
          <span class="c num" aria-label="Rest ${Fmt.rest(it.restSec)}">${Fmt.rest(it.restSec)}</span>
        </div>
        ${ex ? `<p class="ledger__sub">${i + 1}. ${esc(Fmt.exerciseMeta(ex))}</p>` : ''}

                  <button type="button" class="icon-btn" data-action="routine-menu" data-id="${esc(r.id)}" data-context="detail" aria-label="More actions">${icon('dots')}</button>`
      })}
      ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
      <div class="summary">
        <span class="fig"><b class="num">${Calc.routineExerciseCount(r)}</b><span>exercises</span></span>
        <span class="fig"><b class="num">${Calc.routineWorkingSets(r)}</b><span>working sets</span></span>
      </div>
      <button type="button" class="btn btn-primary btn-block" data-action="start-routine" data-id="${esc(r.id)}">${icon('play')}Start ${esc(r.name)}</button>
      <section class="section" aria-label="Exercises">
        ${r.exercises.length ? `
        <div class="ledger">
          <div class="ledger__colhead" aria-hidden="true"><span>Exercise</span><span>Sets</span><span>Reps</span><span>RIR</span><span>Rest</span></div>
          <ol>${items}</ol>
        </div>` : `<div class="empty"><p>This routine has no exercises yet.</p>
          <a class="btn btn-secondary" href="#/routine/${esc(r.id)}/edit">${icon('plus')}Add exercises</a></div>`}
      </section>`;
  },

  /* ---------------- ROUTINE EDITOR ---------------- */
  routineEditor(id) {
    const key = id ? `routine:${id}` : 'routine:new';
    let form = Forms.get(key);
    if (!form) {
      const draft = id ? RoutineService.draftFrom(id) : RoutineService.newDraft();
      if (!draft) { Toast.show('That routine no longer exists.'); return Router.redirect('#/workout/routines'); }
      form = Forms.open(key, 'routine', draft, id ? `#/routine/${id}` : '#/workout/routines');
    }
    const d = form.draft;
    const err = form.errors || { name: null, items: {} };
    return `
      <header class="edit-head">
        <button type="button" class="btn btn-ghost" data-action="form-cancel">Cancel</button>
        <h1 class="edit-head__title">${id ? 'Edit routine' : 'New routine'}</h1>
        <button type="button" class="btn btn-primary btn-sm" data-action="routine-save">Save</button>
      </header>
      <div class="field">
        <label for="rt-name">Routine name</label>
        <input id="rt-name" type="text" maxlength="60" autocomplete="off" data-bind="name" value="${esc(d.name)}"
          ${err.name ? 'aria-invalid="true" aria-describedby="rt-name-err"' : ''} placeholder="e.g. Upper A">
        ${err.name ? `<p class="field-error" id="rt-name-err">${esc(err.name)}</p>` : ''}
      </div>
      <div class="field">
        <label for="rt-desc">Description <span class="optional">(optional)</span></label>
        <textarea id="rt-desc" rows="2" maxlength="240" data-bind="description">${esc(d.description)}</textarea>
      </div>
      <div class="editor-summary">
        <h2 class="section-title">Exercises</h2>

        <span class="fig"><b id="sum-sets">${Calc.routineWorkingSets(d)}</b><span>working sets</span></span>
      </div>
      <ol class="eitems" id="editor-items">${Views.editorItems(d, err)}</ol>
      <button type="button" class="btn btn-add" data-action="open-picker">${icon('plus')}Add exercises</button>
      ${id ? `<div class="form-footer"><button type="button" class="btn btn-danger-text" data-action="routine-delete" data-id="${esc(id)}">${icon('trash')}Delete routine</button></div>` : ''}`;
  },

  editorItems(d, err) {
    if (!d.exercises.length) return '<li class="empty"><p>No exercises yet. Add the movements this routine should include.</p></li>';
    const last = d.exercises.length - 1;
    const singleRir = SettingsService.get().rirDisplay === 'single';
    return d.exercises.map((it, i) => {
      const ex = ExerciseService.get(it.exerciseId);
      const name = ex ? ex.name : 'Unknown exercise';
      const errs = (err.items && err.items[it.id]) || [];
      const bad = (f) => (errs.some((e) => e.field === f) ? 'aria-invalid="true"' : '');
      const v = (n) => (Number.isInteger(n) ? n : '');
      const iid = esc(it.id);
      return `<li class="eitem ${errs.length ? 'has-error' : ''}" id="item-${iid}" data-item-id="${iid}">
        <div class="eitem__head">
          <span class="eitem__idx num" aria-hidden="true">${i + 1}</span>
          <div class="eitem__title">
            <span class="eitem__name">${esc(name)}</span>
            ${ex ? `<span class="eitem__meta">${esc(Fmt.exerciseMeta(ex))}</span>` : ''}
          </div>
          <div class="eitem__tools">
            <button type="button" class="icon-btn" id="mv-up-${iid}" data-action="item-move" data-item="${iid}" data-dir="-1" aria-label="Move ${esc(name)} up" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button>
            <button type="button" class="icon-btn" id="mv-down-${iid}" data-action="item-move" data-item="${iid}" data-dir="1" aria-label="Move ${esc(name)} down" ${i === last ? 'disabled' : ''}>${icon('down')}</button>
            <button type="button" class="icon-btn icon-btn--danger" id="rm-${iid}" data-action="item-remove" data-item="${iid}" aria-label="Remove ${esc(name)} from routine">${icon('close')}</button>
          </div>
        </div>
        <div class="eitem__grid">
          <div>
            <span class="cell__label" id="lbl-sets-${iid}">Sets</span>
            <div class="stepper" role="group" aria-labelledby="lbl-sets-${iid}">
              <button type="button" data-action="item-step" data-item="${iid}" data-delta="-1" aria-label="Fewer sets">${icon('minus')}</button>
              <output class="num" id="sets-${iid}" aria-live="polite" ${bad('sets')}>${v(it.sets)}</output>
              <button type="button" data-action="item-step" data-item="${iid}" data-delta="1" aria-label="More sets">${icon('plus')}</button>
            </div>
          </div>
          <div>
            <span class="cell__label" aria-hidden="true">Reps</span>
            <div class="range">
              <label class="sr-only" for="rmin-${iid}">Minimum reps for ${esc(name)}</label>
              <input id="rmin-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-item="${iid}" data-field="repMin" value="${v(it.repMin)}" ${bad('reps')}>
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="rmax-${iid}">Maximum reps for ${esc(name)}</label>
              <input id="rmax-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-item="${iid}" data-field="repMax" value="${v(it.repMax)}" ${bad('reps')}>
            </div>
          </div>
          ${singleRir ? `<div>
            <label class="cell__label" for="qone-${iid}">RIR</label>
            <input id="qone-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-item="${iid}" data-field="rirSingle" value="${v(it.rirMax)}" ${bad('rir')}>
          </div>` : `<div>
            <span class="cell__label" aria-hidden="true">RIR</span>
            <div class="range">

              <input id="qmin-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-item="${iid}" data-field="rirMin" value="${v(it.rirMin)}" ${bad('rir')}>
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="qmax-${iid}">Maximum RIR for ${esc(name)}</label>
              <input id="qmax-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-item="${iid}" data-field="rirMax" value="${v(it.rirMax)}" ${bad('rir')}>
            </div>

          <div>

          <div class="eitem__note">
            <label class="cell__label" for="note-${iid}">Note <span class="optional">(optional)</span></label>
            <input class="note-input" id="note-${iid}" type="text" maxlength="200" placeholder="Cue or setup" data-item="${iid}" data-field="notes" value="${esc(it.notes)}">
          </div>
        </div>

  },

  /* ---------------- EXERCISE DETAIL ---------------- */
  exerciseDetail(id, tab = 'overview') {
    const ex = ExerciseService.get(id);
    if (!ex) { Toast.show('That exercise no longer exists.'); return Router.redirect('#/workout/exercises'); }
    const base = `#/exercise/${esc(ex.id)}`;
    const body = tab === 'history' ? Views.exerciseHistory(ex) : tab === 'progress' ? Views.exerciseProgress(ex) : Views.exerciseOverview(ex);
    return `
      ${Partials.subHead({
        title: ex.name, back: '#/workout/exercises',
        actions: `<a class="btn btn-secondary btn-sm" href="${base}/edit">${icon('edit')}Edit</a>`
      })}
      <p class="xd-meta">${esc(Fmt.exerciseMeta(ex))}${Partials.prefTags(ex)}</p>
      ${Partials.tabs('Exercise sections', [
        ['overview', 'Overview', base], ['history', 'History', `${base}/history`], ['progress', 'Progress', `${base}/progress`]
      ], tab)}
      ${body}`;
  },

  exerciseOverview(ex) {
    const used = ExerciseService.routinesUsing(ex.id);
    const alts = ex.alternativeIds.map((aid) => ExerciseService.get(aid)).filter((a) => a && a.active);
    const row = (k, v) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`;
    const none = (t) => `<p class="muted">${esc(t)}</p>`;
    return `
      <div class="pref">
        <span class="field-label" id="pref-label">Preference</span>
        ${Partials.radioGroup({ id: 'pref-label', options: TAXONOMY.preferences, value: ex.preference, action: 'set-pref', key: ex.id })}
      </div>
      <dl class="spec">
        ${row('Primary muscle', esc(Tax.label('muscles', ex.primaryMuscle)))}
        ${row('Secondary', ex.secondaryMuscles.length ? esc(ex.secondaryMuscles.map((m) => Tax.label('muscles', m)).join(', ')) : '<span class="muted">None</span>')}
        ${row('Equipment', esc(Tax.label('equipment', ex.equipment)))}
        ${row('Movement', esc(Tax.label('movements', ex.movementPattern)))}
        ${row('Type', esc(Tax.label('mechanics', ex.mechanic)))}
        ${row('Body region', esc(Tax.label('regions', ex.bodyRegion)))}
        ${row('Default rest', `<span class="num">${Fmt.rest(ex.defaultRestSec)}</span>`)}
        ${row('Weight increment', Calc.incrementFor(ex) ? `<span class="num">${esc(Units.fmt(Calc.incrementFor(ex)))} ${Units.current()}</span>${ex.weightIncrementKg == null ? ' <span class="muted">(default)</span>' : ''}` : '<span class="muted">None</span>')}
      </dl>
      <div class="prose"><h2>Instructions</h2>${ex.instructions ? `<p>${esc(ex.instructions)}</p>` : none('No instructions yet.')}</div>
      <div class="prose"><h2>Personal notes</h2>${ex.notes ? `<p>${esc(ex.notes)}</p>` : none('No notes yet. Tap Edit to add cues or reminders.')}</div>
      <div class="prose"><h2>Machine settings</h2>${ex.machineSettings ? `<p>${esc(ex.machineSettings)}</p>` : none('None recorded.')}</div>
      <div class="prose"><h2>Alternatives</h2>
        ${alts.length ? `<div class="used">${alts.map((a) => `<a href="#/exercise/${esc(a.id)}">${esc(a.name)}${icon('chevron')}</a>`).join('')}</div>` : none('None listed.')}
      </div>
      <div class="prose"><h2>Used in routines</h2>
        ${used.length ? `<div class="used">${used.map((r) => `<a href="#/routine/${esc(r.id)}">${esc(r.name)}${icon('chevron')}</a>`).join('')}</div>` : none('Not in any routine yet.')}
      </div>`;
  },

  exerciseHistory(ex) {
    const entries = SessionService.forExercise(ex.id);
    if (!entries.length) {
      return `<div class="empty">
        <div class="empty__mark">${icon('list')}</div>
        <h2>No sessions logged yet</h2>
        <p>Every completed set of ${esc(ex.name)} will appear here, whichever routine it was part of.</p>
      </div>`;
    }
    return `<ol class="xh">${entries.map(({ session, sets }) => `<li class="xh__item">
      <a class="xh__head" href="#/history/${esc(session.id)}">
        <span class="xh__date">${esc(Fmt.dayDate(session.startedAt))}</span>
        <span class="xh__name">${esc(session.sourceRoutineName)}</span>${icon('chevron', 'xrow__chev')}
      </a>
      ${Partials.setLines(sets)}
    </li>`).join('')}</ol>`;
  },

  exerciseProgress(ex) { return Views.strengthPanel(ex.id); },

  /* ---------------- EXERCISE FORM (create / edit) ---------------- */
  exerciseForm(id) {
    const key = id ? `exercise:${id}` : 'exercise:new';
    let form = Forms.get(key);
    if (!form) {
      let draft;
      if (id) {
        const ex = ExerciseService.get(id);
        if (!ex) { Toast.show('That exercise no longer exists.'); return Router.redirect('#/workout/exercises'); }
        draft = {
          name: ex.name, primaryMuscle: ex.primaryMuscle, secondaryMuscles: [...ex.secondaryMuscles],
          equipment: ex.equipment, movementPattern: ex.movementPattern, mechanic: ex.mechanic,
          defaultRestSec: ex.defaultRestSec, instructions: ex.instructions, notes: ex.notes,

          increment: ex.weightIncrementKg == null ? '' : String(Units.toDisplay(ex.weightIncrementKg))
        };
      } else {
        draft = {
          name: '', primaryMuscle: 'chest', secondaryMuscles: [], equipment: 'machine',
          movementPattern: 'horizontal-push', mechanic: 'compound', defaultRestSec: SettingsService.get().defaultRestSec,
          instructions: '', notes: '', machineSettings: '', increment: ''
        };
      }
      form = Forms.open(key, 'exercise', draft, id ? `#/exercise/${id}` : '#/workout/exercises');

      </header>
      ${id && !ExerciseService.get(id).isCustom ? '<p class="hint">This is a built-in exercise. Your edits are saved on this device.</p>' : ''}
      <div class="field">
        <label for="ex-name">Name</label>
        <input id="ex-name" type="text" maxlength="60" autocomplete="off" data-bind="name" value="${esc(d.name)}"
          ${err.name ? 'aria-invalid="true" aria-describedby="ex-name-err"' : ''} placeholder="e.g. Chest-Supported T-Bar Row">
        ${err.name ? `<p class="field-error" id="ex-name-err">${esc(err.name)}</p>` : ''}
      </div>
      <div class="field">
        <label for="ex-primary">Primary muscle</label>
        <select id="ex-primary" data-bind="primaryMuscle">${select('primaryMuscle', 'muscles', d.primaryMuscle)}</select>
      </div>
      <div class="field">
        <span class="field-label" id="ex-sec-label">Secondary muscles <span class="optional">(optional)</span></span>
        <div class="toggle-group" role="group" aria-labelledby="ex-sec-label" id="ex-secondary">${Views.secondaryChips(d)}</div>
      </div>
      <div class="field">
        <label for="ex-equip">Equipment</label>
        <select id="ex-equip" data-bind="equipment">${select('equipment', 'equipment', d.equipment)}</select>
      </div>
      <div class="field">
        <label for="ex-move">Movement pattern</label>
        <select id="ex-move" data-bind="movementPattern">${select('movementPattern', 'movements', d.movementPattern)}</select>
      </div>
      <div class="field">
        <span class="field-label" id="ex-type-label">Type</span>
        ${Partials.radioGroup({ id: 'ex-type-label', options: TAXONOMY.mechanics, value: d.mechanic, action: 'form-radio', key: 'mechanic' })}
      </div>
      <div class="field">
        <label for="ex-rest">Default rest</label>
        <select id="ex-rest" data-bind="defaultRestSec" data-type="int">${Partials.restOptions(d.defaultRestSec)}</select>
      </div>
      <div class="field">
        <label for="ex-inc">Weight increment (${Units.current()}) <span class="optional">(optional)</span></label>
        <input id="ex-inc" type="text" inputmode="decimal" autocomplete="off" data-bind="increment" value="${esc(d.increment)}"
          placeholder="${CONFIG.DEFAULT_INCREMENT_KG[d.equipment] ? `Default ${Units.fmt(CONFIG.DEFAULT_INCREMENT_KG[d.equipment])}` : 'None'}" ${err.increment ? 'aria-invalid="true"' : ''}>
        ${err.increment ? `<p class="field-error">${esc(err.increment)}</p>` : '<p class="hint">The smallest load jump available, used for progression suggestions.</p>'}
      </div>
      <div class="field">
        <label for="ex-instr">Instructions <span class="optional">(optional)</span></label>
        <textarea id="ex-instr" rows="3" maxlength="1000" data-bind="instructions">${esc(d.instructions)}</textarea>
      </div>
      <div class="field">
        <label for="ex-notes">Notes <span class="optional">(optional)</span></label>
        <textarea id="ex-notes" rows="2" maxlength="1000" data-bind="notes">${esc(d.notes)}</textarea>

      <div class="field">
        <label for="ex-machine">Machine settings <span class="optional">(optional)</span></label>

      </div>`;
