    }).join('');

    const active = WorkoutService.active();
    const sessions = Store.get().sessions;
    const end = new Date(days[6]); end.setDate(end.getDate() + 1);
    const week = Calc.periodStats(sessions, days[0], end);
    const trainedDays = new Set(sessions.map((ws) => new Date(ws.startedAt).toDateString()));
    return `
      <header class="home-head">
        <div class="wordmark"><span class="wordmark__rule" aria-hidden="true"></span><span>IRON LEDGER</span></div>
        <p class="home-date">${esc(Fmt.longDate(today))}</p>
      </header>

      ${active ? `<a class="inprogress" href="#/workout/active">
        <span class="inprogress__label"><span class="pulse" aria-hidden="true"></span>Workout in progress</span>
        <span class="inprogress__name">${esc(active.sourceRoutineName)}</span>
        <span class="inprogress__time num" data-tick="elapsed">${Fmt.clock(Calc.sessionDurationSec(active))}</span>
        <span class="btn btn-primary btn-block">${icon('play')}Resume workout</span>
      </a>` : ''}

      <section class="section" aria-labelledby="today-h">
        <div class="section-head"><h2 class="section-title" id="today-h">Today's workout</h2>${Partials.laterTag('Scheduling later')}</div>
        <div class="today">
          <p class="today__title">No workout scheduled yet.</p>
          <p class="today__sub">Scheduling arrives in a later Alpha. You can start any routine below, on any day.</p>
        </div>
      </section>

      <section class="section" aria-labelledby="choose-h">
        <h1 class="display" id="choose-h">Choose a routine</h1>
        ${routines.length ? `<ul class="rlist">${rows}</ul>` : `
          <div class="empty">
            <div class="empty__mark">${icon('workout')}</div>
            <h2>No routines yet</h2>
            <p>Create a routine to plan the exercises, sets and reps you want to train.</p>
            <a class="btn btn-primary" href="#/routine/new">${icon('plus')}Create routine</a>
          </div>`}
      </section>

      <section class="section" aria-labelledby="missed-h">
        <div class="section-head"><h2 class="section-title" id="missed-h">Missed workout</h2></div>
        <div class="empty-inline">${icon('calendar')}<p>No missed workouts.</p></div>
      </section>

      <section class="section" aria-labelledby="week-h">
        <div class="section-head">
          <h2 class="section-title" id="week-h">This week</h2>
          <span class="meta num">${esc(Fmt.shortDate(days[0]))} – ${esc(Fmt.shortDate(days[6]))}</span>
        </div>
        <ol class="week" aria-label="Days this week">
          ${days.map((d) => {
            const trained = trainedDays.has(d.toDateString());
            return `<li class="week__day ${trained ? 'has-workout' : ''}" ${Fmt.sameDay(d, today) ? 'aria-current="date"' : ''}><span>${esc(Fmt.weekdayInitial(d))}</span><b class="num">${d.getDate()}</b>${trained ? '<span class="sr-only">workout logged</span>' : ''}</li>`;
          }).join('')}
        </ol>
        ${week.workouts ? Partials.tiles([
          ['Workouts', String(week.workouts)],
          ['Working sets', String(week.workingSets)],
          ['Volume', Units.fmtVolume(week.volumeKg)],
          ['Training time', Fmt.duration(week.durationSec)]
        ]) : `<div class="empty-inline">${icon('progress')}<p>${sessions.length ? 'No workouts logged this week yet.' : 'Complete your first workout to start building your training history.'}</p></div>`}
      </section>

      <section class="section" aria-labelledby="next-h">
        <div class="section-head"><h2 class="section-title" id="next-h">Next workout</h2></div>
        <div class="empty-inline">${icon('clock')}<p>Nothing planned yet. Your next scheduled workout will appear here.</p></div>
      </section>`;
  },

  /* ---------------- WORKOUT HUB ---------------- */
  workout(tab) {
    const actions = {
      routines: `<a class="btn btn-secondary btn-sm" href="#/routine/new">${icon('plus')}New routine</a>`,
      exercises: `<a class="btn btn-secondary btn-sm" href="#/exercise/new">${icon('plus')}New exercise</a>`
    };
    const body = { routines: Views.routineCards, schedule: Views.schedule, history: Views.history, exercises: Views.library }[tab];
    return `
      ${Partials.mainHead('Workout', actions[tab] || '')}
      ${Partials.tabs('Workout sections', [
        ['routines', 'Routines', '#/workout/routines'],
        ['schedule', 'Schedule', '#/workout/schedule'],
        ['history', 'History', '#/workout/history'],
        ['exercises', 'Exercises', '#/workout/exercises']
      ], tab)}
      ${body()}`;
  },

  routineCards() {
    const routines = RoutineService.list();
    if (!routines.length) {
      return `<div class="empty">
        <div class="empty__mark">${icon('workout')}</div>
        <h2>No routines yet</h2>
        <p>A routine is a reusable plan: exercises, target sets, reps, RIR and rest.</p>
        <a class="btn btn-primary" href="#/routine/new">${icon('plus')}Create routine</a></div>`;
    }
    return `<div class="rcards">${routines.map((r) => `
      <article class="rcard" aria-labelledby="rc-${esc(r.id)}">
        <div class="rcard__top">
          <a class="rcard__link" href="#/routine/${esc(r.id)}">
            <h2 class="rcard__name" id="rc-${esc(r.id)}">${esc(r.name)}</h2>
            <p class="rcard__focus">${esc(Partials.focus(r))}</p>
          </a>
          <span class="rrow__figs">
            <span class="fig"><b>${Calc.routineExerciseCount(r)}</b><span>exercises</span></span>
            <span class="fig"><b>${Calc.routineWorkingSets(r)}</b><span>working sets</span></span>
          </span>
        </div>
        <div class="rcard__actions">
          <button type="button" class="btn btn-primary" data-action="start-routine" data-id="${esc(r.id)}" aria-label="Start ${esc(r.name)}">${icon('play')}Start</button>
          <a class="btn btn-secondary" href="#/routine/${esc(r.id)}/edit" aria-label="Edit ${esc(r.name)}">Edit</a>
          <button type="button" class="icon-btn" data-action="routine-menu" data-id="${esc(r.id)}" aria-label="More actions for ${esc(r.name)}">${icon('dots')}</button>
        </div>
      </article>`).join('')}</div>`;
  },

  library() {
    const f = UIState.library;
    const list = ExerciseService.query({ ...f, sort: 'name' });
    return `
      ${Partials.filters('lib', f)}
      <div class="results-bar"><span id="lib-count" aria-live="polite">${Fmt.plural(list.length, 'exercise')}</span></div>
      <ul class="xlist" id="lib-results">${Partials.libraryRows(list)}</ul>`;
  },

  /* ---------------- ROUTINE DETAIL ---------------- */
  routineDetail(id) {
    const r = RoutineService.get(id);
    if (!r) { Toast.show('That routine no longer exists.'); return Router.redirect('#/workout/routines'); }
    const items = r.exercises.map((it, i) => {
      const ex = ExerciseService.get(it.exerciseId);
      return `<li class="ledger__item">
        <div class="ledger__row">
          <a class="ledger__name" href="#/exercise/${esc(it.exerciseId)}">${esc(ex ? ex.name : 'Unknown exercise')}</a>
          <span class="c num" aria-label="${it.sets} sets">${it.sets}</span>
          <span class="c num" aria-label="${Fmt.range(it.repMin, it.repMax)} reps">${Fmt.range(it.repMin, it.repMax)}</span>
          <span class="c num" aria-label="RIR ${Fmt.range(it.rirMin, it.rirMax)}">${Fmt.range(it.rirMin, it.rirMax)}</span>
          <span class="c num" aria-label="Rest ${Fmt.rest(it.restSec)}">${Fmt.rest(it.restSec)}</span>
        </div>
        ${ex ? `<p class="ledger__sub">${i + 1}. ${esc(Fmt.exerciseMeta(ex))}</p>` : ''}
        ${it.notes ? `<p class="ledger__note">${esc(it.notes)}</p>` : ''}
      </li>`;
    }).join('');
    return `
      ${Partials.subHead({
        title: r.name, back: '#/workout/routines',
        actions: `<a class="icon-btn" href="#/routine/${esc(r.id)}/edit" aria-label="Edit routine">${icon('edit')}</a>
                  <button type="button" class="icon-btn" data-action="routine-menu" data-id="${esc(r.id)}" data-context="detail" aria-label="More actions">${icon('dots')}</button>`
      })}
      ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
      <div class="summary">
        <span class="fig"><b class="num">${Calc.routineExerciseCount(r)}</b><span>exercises</span></span>
        <span class="fig"><b class="num">${Calc.routineWorkingSets(r)}</b><span>working sets</span></span>
      </div>
      <button type="button" class="btn btn-primary btn-block" data-action="start-routine" data-id="${esc(r.id)}">${icon('play')}Start ${esc(r.name)}</button>
      <section class="section" aria-label="Exercises">
        ${r.exercises.length ? `
        <div class="ledger">
          <div class="ledger__colhead" aria-hidden="true"><span>Exercise</span><span>Sets</span><span>Reps</span><span>RIR</span><span>Rest</span></div>
          <ol>${items}</ol>
        </div>` : `<div class="empty"><p>This routine has no exercises yet.</p>
          <a class="btn btn-secondary" href="#/routine/${esc(r.id)}/edit">${icon('plus')}Add exercises</a></div>`}
      </section>`;
  },

  /* ---------------- ROUTINE EDITOR ---------------- */
  routineEditor(id) {
    const key = id ? `routine:${id}` : 'routine:new';
    let form = Forms.get(key);
    if (!form) {
      const draft = id ? RoutineService.draftFrom(id) : RoutineService.newDraft();
      if (!draft) { Toast.show('That routine no longer exists.'); return Router.redirect('#/workout/routines'); }
      form = Forms.open(key, 'routine', draft, id ? `#/routine/${id}` : '#/workout/routines');
    }
    const d = form.draft;
    const err = form.errors || { name: null, items: {} };
    return `
      <header class="edit-head">
        <button type="button" class="btn btn-ghost" data-action="form-cancel">Cancel</button>
        <h1 class="edit-head__title">${id ? 'Edit routine' : 'New routine'}</h1>
        <button type="button" class="btn btn-primary btn-sm" data-action="routine-save">Save</button>
      </header>
      <div class="field">
        <label for="rt-name">Routine name</label>
        <input id="rt-name" type="text" maxlength="60" autocomplete="off" data-bind="name" value="${esc(d.name)}"
          ${err.name ? 'aria-invalid="true" aria-describedby="rt-name-err"' : ''} placeholder="e.g. Upper A">
        ${err.name ? `<p class="field-error" id="rt-name-err">${esc(err.name)}</p>` : ''}
      </div>
      <div class="field">
        <label for="rt-desc">Description <span class="optional">(optional)</span></label>
        <textarea id="rt-desc" rows="2" maxlength="240" data-bind="description">${esc(d.description)}</textarea>
      </div>
      <div class="editor-summary">
        <h2 class="section-title">Exercises</h2>
        <span class="fig"><b id="sum-ex">${Calc.routineExerciseCount(d)}</b><span>exercises</span></span>
        <span class="fig"><b id="sum-sets">${Calc.routineWorkingSets(d)}</b><span>working sets</span></span>
      </div>
      <ol class="eitems" id="editor-items">${Views.editorItems(d, err)}</ol>
      <button type="button" class="btn btn-add" data-action="open-picker">${icon('plus')}Add exercises</button>
      ${id ? `<div class="form-footer"><button type="button" class="btn btn-danger-text" data-action="routine-delete" data-id="${esc(id)}">${icon('trash')}Delete routine</button></div>` : ''}`;
  },

  editorItems(d, err) {
    if (!d.exercises.length) return '<li class="empty"><p>No exercises yet. Add the movements this routine should include.</p></li>';
    const last = d.exercises.length - 1;
    return d.exercises.map((it, i) => {
      const ex = ExerciseService.get(it.exerciseId);
      const name = ex ? ex.name : 'Unknown exercise';
      const errs = (err.items && err.items[it.id]) || [];
      const bad = (f) => (errs.some((e) => e.field === f) ? 'aria-invalid="true"' : '');
      const v = (n) => (Number.isInteger(n) ? n : '');
      const iid = esc(it.id);
      return `<li class="eitem ${errs.length ? 'has-error' : ''}" id="item-${iid}" data-item-id="${iid}">
        <div class="eitem__head">
          <span class="eitem__idx num" aria-hidden="true">${i + 1}</span>
          <div class="eitem__title">
            <span class="eitem__name">${esc(name)}</span>
            ${ex ? `<span class="eitem__meta">${esc(Fmt.exerciseMeta(ex))}</span>` : ''}
          </div>
          <div class="eitem__tools">
            <button type="button" class="icon-btn" id="mv-up-${iid}" data-action="item-move" data-item="${iid}" data-dir="-1" aria-label="Move ${esc(name)} up" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button>
            <button type="button" class="icon-btn" id="mv-down-${iid}" data-action="item-move" data-item="${iid}" data-dir="1" aria-label="Move ${esc(name)} down" ${i === last ? 'disabled' : ''}>${icon('down')}</button>
            <button type="button" class="icon-btn icon-btn--danger" id="rm-${iid}" data-action="item-remove" data-item="${iid}" aria-label="Remove ${esc(name)} from routine">${icon('close')}</button>
          </div>
        </div>
        <div class="eitem__grid">
          <div>
            <span class="cell__label" id="lbl-sets-${iid}">Sets</span>
            <div class="stepper" role="group" aria-labelledby="lbl-sets-${iid}">
              <button type="button" data-action="item-step" data-item="${iid}" data-delta="-1" aria-label="Fewer sets">${icon('minus')}</button>
              <output class="num" id="sets-${iid}" aria-live="polite" ${bad('sets')}>${v(it.sets)}</output>
              <button type="button" data-action="item-step" data-item="${iid}" data-delta="1" aria-label="More sets">${icon('plus')}</button>
            </div>
          </div>
          <div>
            <span class="cell__label" aria-hidden="true">Reps</span>
            <div class="range">
              <label class="sr-only" for="rmin-${iid}">Minimum reps for ${esc(name)}</label>
              <input id="rmin-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-item="${iid}" data-field="repMin" value="${v(it.repMin)}" ${bad('reps')}>
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="rmax-${iid}">Maximum reps for ${esc(name)}</label>
              <input id="rmax-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" data-item="${iid}" data-field="repMax" value="${v(it.repMax)}" ${bad('reps')}>
            </div>
          </div>
          <div>
            <span class="cell__label" aria-hidden="true">RIR</span>
            <div class="range">
              <label class="sr-only" for="qmin-${iid}">Minimum RIR for ${esc(name)}</label>
              <input id="qmin-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-item="${iid}" data-field="rirMin" value="${v(it.rirMin)}" ${bad('rir')}>
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="qmax-${iid}">Maximum RIR for ${esc(name)}</label>
              <input id="qmax-${iid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" data-item="${iid}" data-field="rirMax" value="${v(it.rirMax)}" ${bad('rir')}>
            </div>
          </div>
          <div>
            <label class="cell__label" for="rest-${iid}">Rest</label>
            <select id="rest-${iid}" data-item="${iid}" data-field="restSec" ${bad('rest')}>${Partials.restOptions(it.restSec)}</select>
          </div>
          <div class="eitem__note">
            <label class="cell__label" for="note-${iid}">Note <span class="optional">(optional)</span></label>
            <input class="note-input" id="note-${iid}" type="text" maxlength="200" placeholder="Cue or setup" data-item="${iid}" data-field="notes" value="${esc(it.notes)}">
          </div>
        </div>
        ${errs.length ? `<ul class="item-errors" role="alert">${errs.map((e) => `<li>${esc(e.message)}</li>`).join('')}</ul>` : ''}
      </li>`;
    }).join('');
  },

  /* ---------------- EXERCISE DETAIL ---------------- */
  exerciseDetail(id, tab = 'overview') {
    const ex = ExerciseService.get(id);
    if (!ex) { Toast.show('That exercise no longer exists.'); return Router.redirect('#/workout/exercises'); }
    const base = `#/exercise/${esc(ex.id)}`;
    const body = tab === 'history' ? Views.exerciseHistory(ex) : tab === 'progress' ? Views.exerciseProgress(ex) : Views.exerciseOverview(ex);
    return `
      ${Partials.subHead({
        title: ex.name, back: '#/workout/exercises',
        actions: `<a class="btn btn-secondary btn-sm" href="${base}/edit">${icon('edit')}Edit</a>`
      })}
      <p class="xd-meta">${esc(Fmt.exerciseMeta(ex))}${Partials.prefTags(ex)}</p>
      ${Partials.tabs('Exercise sections', [
        ['overview', 'Overview', base], ['history', 'History', `${base}/history`], ['progress', 'Progress', `${base}/progress`]
      ], tab)}
      ${body}`;
  },

  exerciseOverview(ex) {
    const used = ExerciseService.routinesUsing(ex.id);
    const alts = ex.alternativeIds.map((aid) => ExerciseService.get(aid)).filter((a) => a && a.active);
    const row = (k, v) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`;
    const none = (t) => `<p class="muted">${esc(t)}</p>`;
    return `
      <div class="pref">
        <span class="field-label" id="pref-label">Preference</span>
        ${Partials.radioGroup({ id: 'pref-label', options: TAXONOMY.preferences, value: ex.preference, action: 'set-pref', key: ex.id })}
      </div>
      <dl class="spec">
        ${row('Primary muscle', esc(Tax.label('muscles', ex.primaryMuscle)))}
        ${row('Secondary', ex.secondaryMuscles.length ? esc(ex.secondaryMuscles.map((m) => Tax.label('muscles', m)).join(', ')) : '<span class="muted">None</span>')}
        ${row('Equipment', esc(Tax.label('equipment', ex.equipment)))}
        ${row('Movement', esc(Tax.label('movements', ex.movementPattern)))}
        ${row('Type', esc(Tax.label('mechanics', ex.mechanic)))}
        ${row('Body region', esc(Tax.label('regions', ex.bodyRegion)))}
        ${row('Default rest', `<span class="num">${Fmt.rest(ex.defaultRestSec)}</span>`)}
      </dl>
      <div class="prose"><h2>Instructions</h2>${ex.instructions ? `<p>${esc(ex.instructions)}</p>` : none('No instructions yet.')}</div>
      <div class="prose"><h2>Personal notes</h2>${ex.notes ? `<p>${esc(ex.notes)}</p>` : none('No notes yet. Tap Edit to add cues or reminders.')}</div>
      <div class="prose"><h2>Machine settings</h2>${ex.machineSettings ? `<p>${esc(ex.machineSettings)}</p>` : none('None recorded.')}</div>
      <div class="prose"><h2>Alternatives</h2>
        ${alts.length ? `<div class="used">${alts.map((a) => `<a href="#/exercise/${esc(a.id)}">${esc(a.name)}${icon('chevron')}</a>`).join('')}</div>` : none('None listed.')}
      </div>
      <div class="prose"><h2>Used in routines</h2>
        ${used.length ? `<div class="used">${used.map((r) => `<a href="#/routine/${esc(r.id)}">${esc(r.name)}${icon('chevron')}</a>`).join('')}</div>` : none('Not in any routine yet.')}
      </div>`;
  },

  exerciseHistory(ex) {
    const entries = SessionService.forExercise(ex.id);
    if (!entries.length) {
      return `<div class="empty">
        <div class="empty__mark">${icon('list')}</div>
        <h2>No sessions logged yet</h2>
        <p>Every completed set of ${esc(ex.name)} will appear here, whichever routine it was part of.</p>
      </div>`;
    }
    return `<ol class="xh">${entries.map(({ session, sets }) => `<li class="xh__item">
      <a class="xh__head" href="#/history/${esc(session.id)}">
        <span class="xh__date">${esc(Fmt.dayDate(session.startedAt))}</span>
        <span class="xh__name">${esc(session.sourceRoutineName)}</span>${icon('chevron', 'xrow__chev')}
      </a>
      ${Partials.setLines(sets)}
    </li>`).join('')}</ol>`;
  },

  exerciseProgress() {
    return `
      ${Partials.tiles([['Current best', '—'], ['Est. 1RM', '—'], ['Best weight', '—'], ['Best set volume', '—']])}
      ${Partials.chartPlaceholder('Complete workouts to start building your strength history.')}`;
  },

  /* ---------------- EXERCISE FORM (create / edit) ---------------- */
  exerciseForm(id) {
    const key = id ? `exercise:${id}` : 'exercise:new';
    let form = Forms.get(key);
    if (!form) {
      let draft;
      if (id) {
        const ex = ExerciseService.get(id);
        if (!ex) { Toast.show('That exercise no longer exists.'); return Router.redirect('#/workout/exercises'); }
        draft = {
          name: ex.name, primaryMuscle: ex.primaryMuscle, secondaryMuscles: [...ex.secondaryMuscles],
          equipment: ex.equipment, movementPattern: ex.movementPattern, mechanic: ex.mechanic,
          defaultRestSec: ex.defaultRestSec, instructions: ex.instructions, notes: ex.notes,
          machineSettings: ex.machineSettings
        };
      } else {
        draft = {
          name: '', primaryMuscle: 'chest', secondaryMuscles: [], equipment: 'machine',
          movementPattern: 'horizontal-push', mechanic: 'compound', defaultRestSec: 90,
          instructions: '', notes: '', machineSettings: ''
        };
      }
      form = Forms.open(key, 'exercise', draft, id ? `#/exercise/${id}` : '#/workout/exercises');
    }
    const d = form.draft;
    const err = form.errors || {};
    const select = (field, list, value) => TAXONOMY[list]
      .map((o) => `<option value="${esc(o.id)}" ${o.id === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
    return `
      <header class="edit-head">
        <button type="button" class="btn btn-ghost" data-action="form-cancel">Cancel</button>
        <h1 class="edit-head__title">${id ? 'Edit exercise' : 'New exercise'}</h1>
        <button type="button" class="btn btn-primary btn-sm" data-action="exercise-save">Save</button>
      </header>
      ${id && !ExerciseService.get(id).isCustom ? '<p class="hint">This is a built-in exercise. Your edits are saved on this device.</p>' : ''}
      <div class="field">
        <label for="ex-name">Name</label>
        <input id="ex-name" type="text" maxlength="60" autocomplete="off" data-bind="name" value="${esc(d.name)}"
          ${err.name ? 'aria-invalid="true" aria-describedby="ex-name-err"' : ''} placeholder="e.g. Chest-Supported T-Bar Row">
        ${err.name ? `<p class="field-error" id="ex-name-err">${esc(err.name)}</p>` : ''}
      </div>
      <div class="field">
        <label for="ex-primary">Primary muscle</label>
        <select id="ex-primary" data-bind="primaryMuscle">${select('primaryMuscle', 'muscles', d.primaryMuscle)}</select>
      </div>
      <div class="field">
        <span class="field-label" id="ex-sec-label">Secondary muscles <span class="optional">(optional)</span></span>
        <div class="toggle-group" role="group" aria-labelledby="ex-sec-label" id="ex-secondary">${Views.secondaryChips(d)}</div>
      </div>
      <div class="field">
        <label for="ex-equip">Equipment</label>
        <select id="ex-equip" data-bind="equipment">${select('equipment', 'equipment', d.equipment)}</select>
      </div>

/* =======================================================================

Object.assign(Views, {
  /* ---------------- WORKOUT › SCHEDULE ---------------- */
  schedule() {
    const today = new Date();

          </div>
          <div class="missed__actions">
            <button type="button" class="btn btn-primary btn-sm" data-action="later" data-msg="${LATER.schedule}">${icon('play')}Start now</button>

      </section>

      <section class="section" aria-labelledby="sw-h">
        <div class="section-head">
          <h2 class="section-title" id="sw-h">This week</h2>
          <span class="meta num">${esc(Fmt.shortDate(days[0]))} – ${esc(Fmt.shortDate(days[6]))}</span>
        </div>
        <ol class="sched">
          ${days.map((d) => {
            const name = PREVIEW.schedule[keys[d.getDay()]];
            const isToday = Fmt.sameDay(d, today);
            return `<li class="sday ${isToday ? 'is-today' : ''}" ${isToday ? 'aria-current="date"' : ''}>
              <span class="sday__date"><span>${esc(Fmt.weekdayInitial(d))}</span><b class="num">${d.getDate()}</b></span>
              <span class="sday__body">
                ${name ? `<span class="sday__name">${esc(name)}</span>` : '<span class="sday__rest">Rest</span>'}
                ${isToday ? '<span class="sday__today">Today</span>' : ''}

            </li>`;
          }).join('')}
        </ol>
      </section>`;
  },

  /* ---------------- WORKOUT › HISTORY (real, completed sessions only) ---------------- */
  history() {
    const mode = UIState.ui.historyMode;
    const all = SessionService.list();
    return `
      <div class="hist-tools">
        <div class="search">${icon('search')}
          <label class="sr-only" for="hist-q">Search workouts</label>
          <input id="hist-q" type="search" placeholder="Search workouts or exercises" data-hist-search value="${esc(UIState.ui.historyQuery || '')}" ${all.length ? '' : 'disabled'}>
        </div>
        <button type="button" class="icon-btn icon-btn--boxed" data-action="later" data-msg="${LATER.history}" aria-label="Filter workouts">${icon('filter')}</button>
      </div>
      <div class="hist-mode">${Partials.uiChoice({ label: 'History view', key: 'historyMode', options: [['list', 'List'], ['calendar', 'Calendar']] })}</div>
      ${mode === 'calendar' ? Views.calendar(all) : ''}
      ${all.length ? `<div id="hist-results">${Views.historyList()}</div>` : `
        <div class="empty">
          <div class="empty__mark">${icon('list')}</div>
          <h2>No workouts logged yet.</h2>
          <p>Completed workouts will appear here, grouped by date.</p>
        </div>`}`;
  },

  historyList() {
    const q = Util.normalize(UIState.ui.historyQuery || '');
    const list = SessionService.list().filter((ws) => !q
      || Util.normalize([ws.sourceRoutineName, ...ws.exercises.map((x) => x.nameSnapshot)].join(' ')).includes(q));
    if (!list.length) return '<p class="hint">No workouts match that search.</p>';
    const groups = [];
    list.forEach((ws) => {
      const m = Fmt.monthYear(ws.startedAt);
      if (!groups.length || groups[groups.length - 1].m !== m) groups.push({ m, items: [] });
      groups[groups.length - 1].items.push(ws);
    });
    return groups.map((g) => `<section class="hgroup"><h2 class="group-head">${esc(g.m)}</h2>
      <div class="wcards">${g.items.map((ws) => Partials.sessionCard(ws)).join('')}</div></section>`).join('');
  },

  calendar(sessions = []) {
    const today = new Date();
    const trained = new Set(sessions.map((ws) => new Date(ws.startedAt).toDateString()));
    const weekStart = SettingsService.get().weekStart;
    const first = new Date(today.getFullYear(), today.getMonth(), 1);
    const lead = (first.getDay() - (weekStart === 'sunday' ? 0 : 1) + 7) % 7;
    const daysIn = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const heads = Calc.weekDays(today, weekStart).map((d) => d.toLocaleDateString(undefined, { weekday: 'narrow' }));
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<span class="cal__cell" aria-hidden="true"></span>');
    for (let d = 1; d <= daysIn; d++) {
      const isToday = d === today.getDate();
      const has = trained.has(new Date(today.getFullYear(), today.getMonth(), d).toDateString());
      cells.push(`<span class="cal__cell ${isToday ? 'is-today' : ''} ${has ? 'has-workout' : ''}" ${isToday ? 'aria-current="date"' : ''}><span class="num">${d}</span>${has ? '<span class="sr-only">workout logged</span>' : ''}</span>`);
    }
    return `<div class="cal">
      <p class="cal__month">${esc(today.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</p>
      <div class="cal__grid" aria-hidden="true">${heads.map((h) => `<span class="cal__head">${esc(h)}</span>`).join('')}</div>
      <div class="cal__grid">${cells.join('')}</div>
      <p class="hint">Marked days have a logged workout.</p>
    </div>`;
  },

/* =======================================================================
   15. CONTROLLERS
   ======================================================================= */

/**
 * Forms holds ONE unsaved editor draft at a time (routine or exercise).
 * Nothing in a draft is persisted until the user taps Save.
 */
const Forms = {
  state: null,
  open(key, kind, draft, backTo) {
    this.state = { key, kind, draft, original: JSON.stringify(draft), errors: null, backTo };
    return this.state;
  },
  get(key) { return this.state && this.state.key === key ? this.state : null; },
  currentKey() { return this.state ? this.state.key : null; },
  isDirty() { return !!this.state && JSON.stringify(this.state.draft) !== this.state.original; },
  clear() { this.state = null; },
  /** Which form (if any) a route belongs to. */
  keyFor(hash) {
    let m;
    if (hash === '#/routine/new') return 'routine:new';
    if ((m = hash.match(/^#\/routine\/([\w-]+)\/edit$/))) return `routine:${m[1]}`;
    if (hash === '#/exercise/new') return 'exercise:new';
    if ((m = hash.match(/^#\/exercise\/([\w-]+)\/edit$/))) return `exercise:${m[1]}`;
    return null;
  },
  /** Generic text/select binding: <input data-bind="field">. */
  bind(el) {
    if (!this.state) return;
    const field = el.dataset.bind;
    const value = el.dataset.type === 'int' ? parseInt(el.value, 10) : el.value;
    this.state.draft[field] = value;
    if (this.state.kind === 'exercise' && field === 'primaryMuscle') {
      // A muscle cannot be both primary and secondary.
      this.state.draft.secondaryMuscles = this.state.draft.secondaryMuscles.filter((m) => m !== value);
      const box = $('#ex-secondary');
      if (box) box.innerHTML = Views.secondaryChips(this.state.draft);
    }
  }
};

const Editor = {
  draft() { return Forms.state && Forms.state.kind === 'routine' ? Forms.state.draft : null; },

  /** Re-renders the item list only, keeping scroll position and restoring focus. */
  renderItems(focusId) {
    const d = this.draft();
    if (!d) return;
    $('#editor-items').innerHTML = Views.editorItems(d, Forms.state.errors || {});
    this.updateSummary();
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el && !el.disabled) el.focus();
    }
  },

  updateSummary() {
    const d = this.draft();
    $('#sum-ex').textContent = Calc.routineExerciseCount(d);
    $('#sum-sets').textContent = Calc.routineWorkingSets(d);
  },

  onItemInput(el) {
    const d = this.draft();
    if (!d) return;
    const it = RoutineDraft.item(d, el.dataset.item);
    if (!it) return;
    const field = el.dataset.field;
    if (field === 'notes') it.notes = el.value;
    else if (field === 'restSec') it.restSec = parseInt(el.value, 10);
    else it[field] = Util.parseIntOrNull(el.value); // blank/invalid stays null -> caught on save
  }
};

/**
 * Exercise picker shared by the routine editor and the active workout.
 * ctx = { title, existingIds(): string[], existingLabel, onAdd(ids) }
 */
const Picker = {
  ctx: null,
  el() { return $('#picker'); },

  open(ctx) {
    this.ctx = ctx;
    UIState.picker = { q: '', muscle: 'all', equipment: 'all', favourites: false, selected: [] };
    const p = this.el();
    p.innerHTML = `
      <header class="picker__head">
        <button type="button" class="btn btn-ghost" style="justify-self:start" data-action="picker-close">Cancel</button>
        <h2 id="picker-title">${esc(ctx.title)}</h2>
        <span class="picker__count num" id="pick-count" aria-live="polite">0 selected</span>
      </header>
      <div class="picker__filters">${Partials.filters('pick', UIState.picker)}</div>
      <div class="picker__list"><ul class="xlist" id="pick-results"></ul></div>
      <footer class="picker__foot">
        <button type="button" class="btn btn-primary btn-block" data-action="picker-add" id="pick-add" disabled>Select exercises to add</button>
      </footer>`;
    this.renderList();
    showDialog(p);
    const search = $('#pick-q');
    if (search && window.matchMedia && window.matchMedia('(hover: hover)').matches) search.focus(); // avoid popping the phone keyboard
  },

  close() { hideDialog(this.el()); },

  renderList() {
    const s = UIState.picker;
    const list = ExerciseService.query({ ...s, sort: 'preference' });
    const existing = new Set(this.ctx ? this.ctx.existingIds() : []);
    $('#pick-results').innerHTML = Partials.pickerRows(list, s.selected, existing, this.ctx ? this.ctx.existingLabel : '');
    this.updateFooter();
  },

  updateFooter() {
    const n = UIState.picker.selected.length;
    $('#pick-count').textContent = `${n} selected`;
    const btn = $('#pick-add');
    btn.disabled = n === 0;
    btn.textContent = n === 0 ? 'Select exercises to add' : `Add ${Fmt.plural(n, 'exercise')}`;
  },

  toggle(id) {
    const sel = UIState.picker.selected;
    const i = sel.indexOf(id);
    if (i >= 0) sel.splice(i, 1); else sel.push(id);
    // Update in place so the list does not jump while scrolling.
    $$('#pick-results [data-action="pick-toggle"]').forEach((b) => {
      const pos = sel.indexOf(b.dataset.id);
      b.setAttribute('aria-pressed', String(pos >= 0));
      $('.pick-badge', b).textContent = pos >= 0 ? pos + 1 : '';
    });
    this.updateFooter();
  },

  add() {
    const sel = UIState.picker.selected.slice();
    if (!sel.length || !this.ctx) return;
    this.close();
    this.ctx.onAdd(sel); // added in the order they were selected
    Toast.show(`Added ${Fmt.plural(sel.length, 'exercise')}`);
  }
};

const Filters = {
  state(scope) { return scope === 'lib' ? UIState.library : UIState.picker; },

  render(scope) {
    if (scope === 'pick') { Picker.renderList(); return; }
    const list = ExerciseService.query({ ...UIState.library, sort: 'name' });
    const box = $('#lib-results');
    if (box) box.innerHTML = Partials.libraryRows(list);
    const count = $('#lib-count');
    if (count) count.textContent = Fmt.plural(list.length, 'exercise');
  },

  onSearch(el) {
    this.state(el.dataset.filter).q = el.value;
    this.render(el.dataset.filter);
  },

  onChip(el) {
    const { scope, key, value } = el.dataset;
    const s = this.state(scope);
    if (key === 'favourites') s.favourites = !s.favourites;
    else s[key] = value;
    // Update pressed state in place (keeps the chip row's scroll position).
    const root = scope === 'pick' ? Picker.el() : $('#view');
    $$(`[data-action="filter"][data-scope="${scope}"]`, root).forEach((c) => {
      const pressed = c.dataset.key === 'favourites' ? s.favourites : s[c.dataset.key] === c.dataset.value;
      c.setAttribute('aria-pressed', String(pressed));
    });
    this.render(scope);
  }
};


/* =======================================================================
   16. ROUTER
   Hash-based so the browser back button works and no server is required.
   Guard: leaving an editor with unsaved changes asks for confirmation.
   ======================================================================= */
const Router = (() => {
  const routes = [
    { re: /^#\/home$/, tab: 'home', view: () => Views.home() },
    { re: /^#\/workout\/(routines|schedule|history|exercises)$/, tab: 'workout', view: (m) => Views.workout(m[1]) },
    { re: /^#\/history\/preview$/, tab: 'workout', preview: true, view: () => Views.previewCompleted() },
    { re: /^#\/history\/([\w-]+)$/, tab: 'workout', view: (m) => Views.historyDetail(m[1]) },
    // Real workout engine (full screen, no bottom nav)
    { re: /^#\/workout\/active$/, tab: 'workout', editing: true, view: () => Views.activeWorkout() },
    { re: /^#\/workout\/summary\/([\w-]+)$/, tab: 'workout', editing: true, view: (m) => Views.workoutSummary(m[1]) },
    { re: /^#\/routine\/new$/, tab: 'workout', editing: true, view: () => Views.routineEditor(null) },
    { re: /^#\/routine\/([\w-]+)\/edit$/, tab: 'workout', editing: true, view: (m) => Views.routineEditor(m[1]) },
    { re: /^#\/routine\/([\w-]+)$/, tab: 'workout', view: (m) => Views.routineDetail(m[1]) },
    { re: /^#\/exercise\/new$/, tab: 'workout', editing: true, view: () => Views.exerciseForm(null) },
    { re: /^#\/exercise\/([\w-]+)\/edit$/, tab: 'workout', editing: true, view: (m) => Views.exerciseForm(m[1]) },
    { re: /^#\/exercise\/([\w-]+)\/(history|progress)$/, tab: 'workout', view: (m) => Views.exerciseDetail(m[1], m[2]) },
    { re: /^#\/exercise\/([\w-]+)$/, tab: 'workout', view: (m) => Views.exerciseDetail(m[1], 'overview') },
    { re: /^#\/progress\/(overview|strength|body|photos)$/, tab: 'progress', view: (m) => Views.progress(m[1]) },
    { re: /^#\/more$/, tab: 'more', view: () => Views.more() },
    // Full-screen UI previews: no bottom nav, read PREVIEW only, write nothing.
    { re: /^#\/preview\/workout$/, tab: 'workout', editing: true, preview: true, view: () => Views.previewWorkout() },
    { re: /^#\/preview\/substitute$/, tab: 'workout', editing: true, preview: true, view: () => Views.previewSubstitute() },
    { re: /^#\/preview\/finish$/, tab: 'workout', editing: true, preview: true, view: () => Views.previewFinish() },
    { re: /^#\/preview\/review$/, tab: 'workout', editing: true, preview: true, view: () => Views.previewReview() }
  ];
  const aliases = { '': '#/home', '#': '#/home', '#/': '#/home', '#/workout': '#/workout/routines', '#/progress': '#/progress/overview' };
  let current = null;
  let bypassGuard = false;

  function normalize(hash) { return aliases[hash] || hash; }
  function isPreviewHash(h) { return !!h && (h.startsWith('#/preview/') || h === '#/history/preview'); }

  /*
   * Hash links are resolved by the app itself, against THIS document's URL.
   * Some hosts (e.g. sandboxed previews using srcdoc) give the page a base URL
   * from another origin; resolving '#/x' against it breaks history calls.
   * Building the URL from location.href avoids that, and a failure to update
   * the address bar must never stop the app from rendering.
   */
  function urlFor(hash) { return location.href.split('#')[0] + hash; }
  function setUrl(hash) {
    try { history.replaceState(null, '', urlFor(hash)); } catch (_) { /* address bar not updatable here */ }
  }

  function render(hash, { keepScroll = false } = {}) {
    hash = normalize(hash);
    const match = routes.map((r) => ({ r, m: hash.match(r.re) })).find((x) => x.m);
    if (!match) return redirect('#/home');
    // Drop a draft that belongs to a route we are no longer on.
    if (Forms.currentKey() && Forms.keyFor(hash) !== Forms.currentKey()) Forms.clear();
    const routeChanged = hash !== current;
    // Remember where a preview was opened from, so "close" returns there.
    if (match.r.preview && !isPreviewHash(current)) UIState.previewReturn = current;
    if (!match.r.preview && isPreviewHash(current)) resetPreviewState();
    current = hash;
    const html = match.r.view(match.m);
    if (html == null) return null; // the view redirected
    const view = $('#view');
    const y = window.scrollY;
    view.innerHTML = html;
    document.body.classList.toggle('is-editing', !!match.r.editing);
    // Compact "workout in progress" strip everywhere except Home (which has its own card) and full-screen views.
    const showStrip = !!WorkoutService.active() && !match.r.editing && match.r.tab !== 'home';
    $('#activebar').innerHTML = showStrip ? Views.activeStrip() : '';
    document.body.classList.toggle('has-activebar', showStrip);
    $$('.tab').forEach((t) => {
      if (t.dataset.tab === match.r.tab) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
    if (keepScroll) window.scrollTo(0, y);
    else if (routeChanged) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
    return null;
  }

  /** Replaces the current history entry (no extra back-button step). */
  function redirect(hash) {
    setUrl(hash);
    render(hash);
    return null;
  }

  async function onHashChange() {
    const target = normalize(location.hash);
    if (!bypassGuard && Forms.isDirty() && Forms.keyFor(target) !== Forms.currentKey()) {
      setUrl(current); // stay put while we ask
      const ok = await Dialog.confirm({
        title: 'Discard changes?', message: 'You have unsaved changes. Leaving now will lose them.',
        confirmLabel: 'Discard', cancelLabel: 'Keep editing', danger: true
      });
      if (!ok) return;
      Forms.clear();
      go(target);
      return;
    }
    bypassGuard = false;
    render(target);
  }

  /** Programmatic navigation. `force` skips the guard (used after save/discard). */
  function go(hash, { force = false } = {}) {
    if (normalize(location.hash) === hash) { render(hash); return; }
    bypassGuard = force;
    try {
      location.hash = hash; // fires hashchange -> render
    } catch (_) {
      bypassGuard = false;
      current = null;
      render(hash);       // host blocks URL changes: navigate in-app only
    }
  }

  function start() {
    window.addEventListener('hashchange', onHashChange);
    const initial = normalize(location.hash);
    if (initial !== location.hash) setUrl(initial);
    render(initial);
  }

  return { start, go, redirect, refresh: () => render(current, { keepScroll: true }), current: () => current };
})();


/* =======================================================================
   17. EVENTS + BOOT
   One delegated listener per event type. Elements declare intent with
   data-action; handlers live in Actions.
   ======================================================================= */
/** Clears in-memory preview selections. Previews never touch stored data. */
function resetPreviewState() {
  UIState.sub = { reason: null, match: null, scope: 'today' };
  UIState.review = null;
}

const Actions = {
  /** Starts a REAL session. Guards against double taps and a second active workout. */
  async 'start-routine'(el) {
    const id = el.dataset.id;
    const a = WorkoutService.active();
    if (a) {
      // A fast second tap on the same routine just opens the workout it created.
      if (a.sourceRoutineId === id && Date.now() - Date.parse(a.startedAt) < 5000) { Router.go('#/workout/active'); return; }
      const choice = await Dialog.choose({
        title: 'Workout already in progress',
        message: `${a.sourceRoutineName}, started ${Fmt.ago(a.startedAt)}.`,
        actions: [
          { id: 'resume', label: `Resume ${a.sourceRoutineName}`, kind: 'primary' },
          { id: 'discard', label: 'Discard & start new', kind: 'secondary' },
          { id: 'cancel', label: 'Cancel', kind: 'ghost' }
        ]
      });
      if (choice === 'resume') { Router.go('#/workout/active'); return; }
      if (choice !== 'discard') return;
      const sure = await Dialog.confirm({
        title: `Discard ${a.sourceRoutineName}?`,
        message: 'Every set logged in this workout will be deleted. This cannot be undone.',
        confirmLabel: 'Discard workout', danger: true
      });
      if (!sure) return;
      WorkoutService.discard();
    }
    if (Actions._starting) return;
    Actions._starting = true;
    try {
      WorkoutService.start(id);
      Router.go('#/workout/active', { force: true });
    } finally {
      setTimeout(() => { Actions._starting = false; }, CONFIG.DOUBLE_TAP_MS);
    }
  },

  /* ----- active workout ----- */
  'aw-toggle'(el) {
    const { se, set } = el.dataset;
    const now = Date.now();
    const last = Actions._lastToggle;
    if (last && last.set === set && now - last.t < CONFIG.DOUBLE_TAP_MS) return; // ignore accidental double tap
    Actions._lastToggle = { set, t: now };
    try {
      WorkoutService.toggleSet(se, set);
    } catch (err) {
      const d = err instanceof AppError && err.details && err.details[0];
      if (d && d.setId) {
        const input = document.getElementById(`${d.field === 'weight' ? 'w' : 'r'}-${d.setId}`);
        if (input) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
      }
      throw err;
    }
    Router.refresh();
  },

  async 'aw-set-menu'(el) {
    const a = WorkoutService.active();
    const { x, st } = WorkoutService.find(a, el.dataset.se, el.dataset.set);
    const label = Calc.setLabels(x.sets)[x.sets.indexOf(st)];
    const icons = { warmup: 'spark', working: 'list', drop: 'down', failure: 'alert' };
    const choice = await Dialog.sheet({
      title: `Set ${label}, ${x.nameSnapshot}`,
      actions: [
        ...CONFIG.SET_TYPES.map((t) => ({ id: `type:${t}`, label: SET_TYPE_LABELS[t], icon: icons[t], current: st.type === t })),
        { id: 'remove', label: 'Remove set', icon: 'trash', danger: true }
      ]
    });
    if (!choice) return;
    if (choice.startsWith('type:')) {
      WorkoutService.setType(x.id, st.id, choice.slice(5));
      Router.refresh();
      return;
    }
    if (WorkoutService.setHasData(st)) {
      const ok = await Dialog.confirm({
        title: `Remove set ${label}?`,
        message: `This set has ${st.completed ? 'been completed' : 'values entered'}. It will be removed from today's workout only.`,
        confirmLabel: 'Remove set', danger: true
      });
      if (!ok) return;
    }
    WorkoutService.removeSet(x.id, st.id);
    Router.refresh();
  },

  'aw-copy-prev'(el) {
    const a = WorkoutService.active();
    const { x, st } = WorkoutService.find(a, el.dataset.se, el.dataset.set);
    const prev = Calc.previousPerformance(Store.get().sessions, x.performedExerciseId, a.id);
    const p = Calc.previousSetFor(prev, x.sets, st);
    if (!p) return;
    WorkoutService.copyPrevious(x.id, st.id, p.weightKg, p.reps);
    Router.refresh();
  },

  'aw-add-set'(el) {
    WorkoutService.addSet(el.dataset.se, 'working');
    Router.refresh();
  },

  async 'aw-ex-menu'(el) {
    const a = WorkoutService.active();
    const { x } = WorkoutService.find(a, el.dataset.se);
    const choice = await Dialog.sheet({
      title: x.nameSnapshot,
      actions: [
        { id: 'set', label: 'Add set', icon: 'plus' },
        { id: 'warmup', label: 'Add warm-up set', icon: 'spark' },
        { id: 'note', label: x.sessionNote ? "Edit today's note" : "Add today's note", icon: 'edit' },
        { id: 'history', label: 'View history', icon: 'list' },
        ...(el.dataset.first === 'true' ? [] : [{ id: 'up', label: 'Move up', icon: 'up' }]),
        ...(el.dataset.last === 'true' ? [] : [{ id: 'down', label: 'Move down', icon: 'down' }]),
        { id: 'replace', label: 'Replace exercise', icon: 'swap' },
        { id: 'remove', label: 'Remove from workout', icon: 'trash', danger: true }
      ]
    });
    if (!choice) return;
    if (choice === 'set' || choice === 'warmup') { WorkoutService.addSet(x.id, choice === 'set' ? 'working' : 'warmup'); Router.refresh(); }
    if (choice === 'replace') Toast.show('Exercise substitution arrives in a later Alpha.');
    if (choice === 'history') {
      if (ExerciseService.get(x.performedExerciseId)) Router.go(`#/exercise/${x.performedExerciseId}/history`);
      else Toast.show('This exercise is no longer in your library.');
    }
    if (choice === 'up' || choice === 'down') {
      WorkoutService.moveExercise(x.id, choice === 'up' ? -1 : 1);
      Router.refresh();
      const card = document.getElementById(`se-${x.id}`);
      if (card) card.scrollIntoView({ block: 'center' });
    }
    if (choice === 'note') {
      const text = await Dialog.prompt({
        title: "Today's note", label: `${x.nameSnapshot} (this workout only)`, value: x.sessionNote,
        message: x.notesSnapshot ? `Routine note: ${x.notesSnapshot}` : '', confirmLabel: 'Save note', maxLength: 200
      });
      if (text == null) return;
      WorkoutService.setExerciseNote(x.id, text);
      Router.refresh();
    }
    if (choice === 'remove') {
      const logged = x.sets.filter((st) => WorkoutService.setHasData(st)).length;
      const ok = await Dialog.confirm({
        title: `Remove ${x.nameSnapshot}?`,
        message: logged
          ? `${Fmt.plural(logged, 'set')} with logged data will be deleted from today's workout. The routine is not changed.`
          : "It will be removed from today's workout only. The routine is not changed.",
        confirmLabel: logged ? 'Delete logged sets' : 'Remove', danger: true
      });
      if (!ok) return;
      WorkoutService.removeExercise(x.id);
      Router.refresh();
    }
  },

  'aw-add-exercise'() {
    Picker.open({
      title: 'Add to workout',
      existingLabel: 'already in workout',
      existingIds: () => (WorkoutService.active() ? WorkoutService.active().exercises.map((x) => x.performedExerciseId) : []),
      onAdd: (ids) => {
        const before = WorkoutService.active().exercises.length;
        WorkoutService.addExercises(ids); // session only; the routine is untouched
        Router.refresh();
        const first = WorkoutService.active().exercises[before];
        const card = first && document.getElementById(`se-${first.id}`);
        if (card) card.scrollIntoView({ block: 'start' });
      }
    });
  },

  async 'aw-menu'() {
    const a = WorkoutService.active();
    const choice = await Dialog.sheet({
      title: a.sourceRoutineName,
      actions: [
        { id: 'notes', label: a.notes ? 'Edit workout note' : 'Add workout note', icon: 'edit' },
        { id: 'discard', label: 'Discard workout', icon: 'trash', danger: true }
      ]
    });
    if (choice === 'notes') {
      const text = await Dialog.prompt({ title: 'Workout note', label: 'Note for this workout', value: a.notes, confirmLabel: 'Save note', maxLength: 500 });
      if (text == null) return;
      WorkoutService.setWorkoutNotes(text);
      Router.refresh();
    }
    if (choice === 'discard') {
      const ok = await Dialog.confirm({
        title: `Discard ${a.sourceRoutineName}?`,
        message: 'Every set logged in this workout will be deleted and nothing goes to History. This cannot be undone.',
        confirmLabel: 'Discard workout', danger: true
      });
      if (!ok) return;
      WorkoutService.discard();
      Toast.show('Workout discarded');
      Router.go('#/home', { force: true });
    }
  },

  async 'aw-finish'() {
    const a = WorkoutService.active();
    const st = Calc.sessionStats(a);
    const open = WorkoutService.incompleteCount();
    let go;
    if (st.workingSets + st.warmupSets === 0) {
      go = (await Dialog.choose({
        title: 'Finish workout?', message: 'No sets are completed yet. Finishing saves a workout with no completed sets.',
        actions: [{ id: 'back', label: 'Return to workout', kind: 'primary' }, { id: 'finish', label: 'Finish anyway', kind: 'secondary' }]
      })) === 'finish';
    } else if (open) {
      go = (await Dialog.choose({
        title: 'Finish workout?', message: `${Fmt.plural(open, 'planned set is', 'planned sets are')} incomplete. They will not be counted.`,
        actions: [{ id: 'back', label: 'Return to workout', kind: 'primary' }, { id: 'finish', label: 'Finish anyway', kind: 'secondary' }]
      })) === 'finish';
    } else {
      go = await Dialog.confirm({ title: 'Finish workout?', message: 'All sets are complete.', confirmLabel: 'Finish workout', cancelLabel: 'Not yet' });
    }
    if (!go) return;
    const id = WorkoutService.finish();
    Router.go(`#/workout/summary/${id}`, { force: true });
  },

  'aw-rest-adjust'(el) {
    WorkoutService.adjustRest(Number(el.dataset.delta));
    $('#restbar-slot').innerHTML = Views.restBar(WorkoutService.active());
  },

  'aw-rest-skip'() {
    WorkoutService.skipRest();
    $('#restbar-slot').innerHTML = '';
  },

  async 'history-menu'(el) {
    const ws = SessionService.get(el.dataset.id);
    if (!ws) return;
    const choice = await Dialog.sheet({ title: ws.sourceRoutineName, actions: [{ id: 'delete', label: 'Delete workout', icon: 'trash', danger: true }] });
    if (choice !== 'delete') return;
    const ok = await Dialog.confirm({
      title: 'Delete this workout?',
      message: `${ws.sourceRoutineName} on ${Fmt.dayDate(ws.startedAt)} will be removed from History and from every statistic. This cannot be undone.`,
      confirmLabel: 'Delete workout', danger: true
    });
    if (!ok) return;
    SessionService.remove(ws.id);
    Toast.show('Workout deleted');
    Router.go('#/workout/history', { force: true });
  },

  /* ----- planned features: explain, never fake ----- */
  later(el) { Toast.show(el.dataset.msg || 'Coming in a later Alpha.'); },

  'ui-set'(el) {
    UIState.ui[el.dataset.key] = el.dataset.value;
    Router.refresh();
  },

  'toggle-progress-preview'() {
    UIState.ui.progressPreview = !UIState.ui.progressPreview;
    Router.refresh();
  },

  async 'schedule-menu'(el) {
    const choice = await Dialog.sheet({
      title: `${el.dataset.name} (preview)`,
      actions: [
        { id: 'start', label: 'Start now', icon: 'play' },
        { id: 'move', label: 'Move', icon: 'calendar' },
        { id: 'replace', label: 'Replace', icon: 'swap' },
        { id: 'skip', label: 'Skip', icon: 'open' },
        { id: 'delete', label: 'Delete from schedule', icon: 'trash', danger: true }
      ]
    });
    if (choice) Toast.show(LATER.schedule);
  },

  'exit-preview'() {
    const back = UIState.previewReturn || '#/home';
    resetPreviewState();
    Router.go(back);
  },

  async 'preview-ex-menu'(el) {
    const ids = ['replace', 'set', 'warmup', 'drop', 'history', 'note', 'remove'];
    const icons = ['swap', 'plus', 'plus', 'plus', 'list', 'edit', 'trash'];
    const choice = await Dialog.sheet({
      title: `${el.dataset.name} (preview)`,
      actions: PREVIEW.activeWorkout.menu.map((label, i) => ({ id: ids[i], label, icon: icons[i], danger: ids[i] === 'remove' }))
    });
    if (choice === 'replace') { UIState.sub = { reason: null, match: null, scope: 'today' }; Router.go('#/preview/substitute'); }
    else if (choice) Toast.show(LATER.logging);
  },

  'sub-set'(el) {
    UIState.sub[el.dataset.key] = el.dataset.value;
    Router.refresh();
  },

  'sub-confirm'() {
    Toast.show(UIState.sub.scope === 'routine'
      ? 'Preview only. Push A was not changed.'
      : 'Preview only. Nothing was replaced.');
    UIState.sub = { reason: null, match: null, scope: 'today' };
    Router.go('#/preview/workout');
  },

  'finish-keep'() {
    Toast.show('Preview only. Push A stays as it is.');
    Actions['exit-preview']();
  },

  'review-toggle'(el) {
    UIState.review[el.dataset.id] = !UIState.review[el.dataset.id];
    Router.refresh();
  },

  'review-apply'() {
    Toast.show('Preview only. Push A was not changed.');
    Actions['exit-preview']();
  },


  async 'routine-menu'(el) {
    const r = RoutineService.get(el.dataset.id);
    if (!r) return;
    const inDetail = el.dataset.context === 'detail';
    const actions = [
      ...(inDetail ? [] : [{ id: 'view', label: 'View routine', icon: 'open' }]),
      { id: 'rename', label: 'Rename', icon: 'rename' },
      { id: 'duplicate', label: 'Duplicate', icon: 'copy' },
      { id: 'delete', label: 'Delete', icon: 'trash', danger: true }
    ];
    const choice = await Dialog.sheet({ title: r.name, actions });
    if (choice === 'view') Router.go(`#/routine/${r.id}`);
    if (choice === 'rename') await Actions.renameRoutine(r);
    if (choice === 'duplicate') {
      const newId = RoutineService.duplicate(r.id);
      Toast.show(`Duplicated as "${RoutineService.get(newId).name}"`);
      if (inDetail) Router.go(`#/routine/${newId}`); else Router.refresh();
    }
    if (choice === 'delete') await Actions.deleteRoutine(r, inDetail);
  },

  async renameRoutine(r) {
    const name = await Dialog.prompt({
      title: 'Rename routine', label: 'Routine name', value: r.name, confirmLabel: 'Rename',
      validate: (v) => {
        if (!v.trim()) return 'Enter a name for the routine.';
        if (RoutineService.nameTaken(v, r.id)) return 'Another routine already uses this name.';
        return null;
      }
    });
    if (name == null) return;
    RoutineService.rename(r.id, name);
    Toast.show('Routine renamed');
    Router.refresh();
  },

  async deleteRoutine(r, leaveDetail) {
    const ok = await Dialog.confirm({
      title: `Delete ${r.name}?`,
      message: 'This removes the routine template. Exercises stay in your library. This cannot be undone.',
      confirmLabel: 'Delete routine', danger: true
    });
    if (!ok) return;
    RoutineService.remove(r.id);
    Forms.clear();
    Toast.show(`Deleted ${r.name}`);
    if (leaveDetail) Router.go('#/workout/routines', { force: true }); else Router.refresh();
  },

  async 'routine-delete'(el) {
    const r = RoutineService.get(el.dataset.id);
    if (r) await Actions.deleteRoutine(r, true);
  },

  /* ----- editor ----- */
  'item-step'(el) {
    const d = Editor.draft();
    const it = d && RoutineDraft.item(d, el.dataset.item);
    if (!it) return;
    const [min, max] = CONFIG.LIMITS.sets;
    const base = Number.isInteger(it.sets) ? it.sets : 3;
    it.sets = Math.min(max, Math.max(min, base + Number(el.dataset.delta)));
    document.getElementById(`sets-${it.id}`).textContent = it.sets;
    Editor.updateSummary();
  },

  'item-move'(el) {
    const d = Editor.draft();
    const dir = Number(el.dataset.dir);
    if (!d || !RoutineDraft.move(d, el.dataset.item, dir)) return;
    const id = el.dataset.item;
    const idx = d.exercises.findIndex((it) => it.id === id);
    // Keep focus on the moved item's button; switch direction at the ends.
    let focusId = `mv-${dir < 0 ? 'up' : 'down'}-${id}`;
    if (dir < 0 && idx === 0) focusId = `mv-down-${id}`;
    if (dir > 0 && idx === d.exercises.length - 1) focusId = `mv-up-${id}`;
    Editor.renderItems(focusId);
  },

  'item-remove'(el) {
    const d = Editor.draft();
    if (!d) return;
    const idx = d.exercises.findIndex((it) => it.id === el.dataset.item);
    const ex = idx >= 0 && ExerciseService.get(d.exercises[idx].exerciseId);
    RoutineDraft.remove(d, el.dataset.item);
    if (Forms.state.errors && Forms.state.errors.items) delete Forms.state.errors.items[el.dataset.item];
    const next = d.exercises[idx] || d.exercises[idx - 1];
    Editor.renderItems(next ? `rm-${next.id}` : null);
    if (!next) $('[data-action="open-picker"]').focus();
    Toast.show(`Removed ${ex ? ex.name : 'exercise'}`);
  },

  'open-picker'() {
    Picker.open({
      title: 'Add exercises',
      existingLabel: 'already in routine',
      existingIds: () => (Editor.draft() ? Editor.draft().exercises.map((it) => it.exerciseId) : []),
      onAdd: (ids) => {
        const d = Editor.draft();
        if (!d) return;
        const before = d.exercises.length;
        RoutineDraft.addExercises(d, ids);
        Editor.renderItems();
        const first = d.exercises[before];
        const node = first && document.getElementById(`item-${first.id}`);
        if (node) node.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    });
  },
  'picker-close'() { Picker.close(); },
  'pick-toggle'(el) { Picker.toggle(el.dataset.id); },
  'picker-add'() { Picker.add(); },
  filter(el) { Filters.onChip(el); },

  'routine-save'() {
    const d = Editor.draft();
    if (!d) return;
    d.name = d.name.trim();
    const errors = RoutineService.validateDraft(d);
    if (errors.count) {
      Forms.state.errors = errors;
      Router.refresh();
      const first = $('[aria-invalid="true"]', $('#view'));
      if (first) { first.scrollIntoView({ block: 'center' }); if (first.focus) first.focus({ preventScroll: true }); }
      Toast.show(errors.count === 1 ? 'Fix 1 issue before saving.' : `Fix ${errors.count} issues before saving.`, 'error');
      return;
    }
    const isNew = !d.id;
    const id = RoutineService.save(d);
    Forms.clear();
    Toast.show(isNew ? 'Routine created' : 'Routine saved');
    Router.go(`#/routine/${id}`, { force: true });
  },

  async 'form-cancel'() {
    if (!Forms.state) return;
    const back = Forms.state.backTo;
    if (Forms.isDirty()) {
      const ok = await Dialog.confirm({
        title: 'Discard changes?', message: 'Your unsaved changes will be lost.',
        confirmLabel: 'Discard', cancelLabel: 'Keep editing', danger: true
      });
      if (!ok) return;
    }
    Forms.clear();
    Router.go(back, { force: true });
  },

  /* ----- exercises ----- */
  'set-pref'(el) {
    ExerciseService.setPreference(el.dataset.key, el.dataset.value);
    Router.refresh();
    Toast.show(`Preference set to ${Tax.label('preferences', el.dataset.value)}`);
  },

  'toggle-secondary'(el) {
    const d = Forms.state && Forms.state.draft;
    if (!d) return;
    const m = el.dataset.value;
    d.secondaryMuscles = d.secondaryMuscles.includes(m) ? d.secondaryMuscles.filter((x) => x !== m) : [...d.secondaryMuscles, m];
    el.setAttribute('aria-pressed', String(d.secondaryMuscles.includes(m)));
  },

  'form-radio'(el) {
    const d = Forms.state && Forms.state.draft;
    if (!d) return;
    d[el.dataset.key] = el.dataset.value;
    $$(`[data-action="form-radio"][data-key="${el.dataset.key}"]`).forEach((b) =>
      b.setAttribute('aria-checked', String(b.dataset.value === el.dataset.value)));
  },

  'exercise-save'() {
    const f = Forms.state;
    if (!f || f.kind !== 'exercise') return;
    const id = f.key === 'exercise:new' ? null : f.key.slice('exercise:'.length);
    f.draft.name = f.draft.name.trim();
    const errors = ExerciseService.validateDraft(f.draft, id);
    if (Object.keys(errors).length) {
      f.errors = errors;
      Router.refresh();
      const first = $('[aria-invalid="true"]', $('#view'));
      if (first) { first.scrollIntoView({ block: 'center' }); first.focus({ preventScroll: true }); }
      Toast.show(Object.values(errors)[0], 'error');
      return;
    }
    const savedId = id ? ExerciseService.update(id, f.draft) : ExerciseService.create(f.draft);
    Forms.clear();
    Toast.show(id ? 'Exercise saved' : 'Exercise created');
    Router.go(`#/exercise/${savedId}`, { force: true });
  },

  /* ----- settings + data ----- */
  'set-setting'(el) {
    SettingsService.set(el.dataset.key, el.dataset.value);
    if (el.dataset.key === 'theme') Theme.apply(el.dataset.value);
    Router.refresh();
  },

  async 'export-backup'() {
    const json = JSON.stringify(BackupService.build(), null, 2);
    // When hosted as a claude.ai artifact, plain download links are inert,
    // so the file is handed over through the viewer's downloads capability.
    if (window.claude && typeof window.claude.use === 'function') {
      const downloads = await window.claude.use('downloads');
      if (downloads) {
        try {
          await downloads.save({ filename: BackupService.filename(), data: json });
          Toast.show('Backup exported');
        } catch (err) {
          if (err && err.code === 'declined') Toast.show('Export cancelled');
          else if (err && err.code === 'rate_limited') Toast.show('An export prompt is already open.', 'error');
          else Toast.show('Export is not available in this view.', 'error');
        }
        return;
      }
    }
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = BackupService.filename();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    Toast.show('Backup exported');
  },

  'import-backup'() {
    const input = $('#import-file');
    input.value = '';
    input.click();
  },

  async 'reset-data'() {
    const typed = await Dialog.prompt({
      title: 'Reset Alpha data?',
      message: 'This permanently erases your routines, workout history, any workout in progress, custom exercises and settings, then reloads the sample data. Export a backup first if you want to keep anything.',
      label: 'Type RESET to confirm', confirmLabel: 'Reset data', danger: true, maxLength: 10,
      validate: (v) => (v.trim() === 'RESET' ? null : 'Type RESET in capital letters to confirm.')
    });
    if (typed == null) return;
    BackupService.reset();
    Forms.clear();
    UIState.library = { q: '', muscle: 'all', equipment: 'all', favourites: false };
    Theme.apply(SettingsService.get().theme);
    Toast.show('Data reset to sample routines');
    Router.go('#/home', { force: true });
  },

  'dismiss-banner'() { $('#banner').innerHTML = ''; }
};

async function handleImportFile(file) {
  if (!file) return;
  if (file.size > CONFIG.MAX_IMPORT_BYTES) {
    await Dialog.alert({ title: 'Import failed', message: 'That file is too large to be an Iron Ledger backup.' });
    return;
  }
  const text = await file.text();
  const res = BackupService.parse(text);
  if (!res.ok) {
    await Dialog.alert({
      title: 'Import failed',
      message: 'Nothing was changed. The file was rejected for these reasons:',
      errors: res.errors.slice(0, 4).concat(res.errors.length > 4 ? [`…and ${res.errors.length - 4} more.`] : [])
    });
    return;
  }
  const when = res.summary.exportedAt ? new Date(res.summary.exportedAt) : null;
  const ok = await Dialog.confirm({
    title: 'Replace all data?',
    message: `This backup${when && !isNaN(when) ? ` from ${when.toLocaleString()}` : ''} contains ${Fmt.plural(res.summary.routines, 'routine')}, ${Fmt.plural(res.summary.exercises, 'exercise')} and ${Fmt.plural(res.summary.sessions, 'completed workout')}${res.summary.hasActive ? ', plus a workout in progress' : ''}. All current data, including any workout in progress, will be replaced.`,
    confirmLabel: 'Replace data', danger: true
  });
  if (!ok) return;
  BackupService.apply(res.data, res.active);
  Forms.clear();
  Theme.apply(SettingsService.get().theme);
  Toast.show('Backup imported');
  Router.go('#/home', { force: true });
}

function bindEvents() {
  document.addEventListener('click', async (e) => {
    // In-app links are routed here so they never resolve against a foreign base URL.
    const link = e.target.closest('a[href^="#/"]');
    if (link && !e.defaultPrevented && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      e.preventDefault();
      Router.go(link.getAttribute('href'));
      return;
    }
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = Actions[el.dataset.action];
    if (!fn) return;
    e.preventDefault();
    try { await fn(el, e); } catch (err) { handleError(err); }
  });

  const onEdit = (e) => {
    const el = e.target;
    try {
      if (el.dataset.aw) {
        // Saved on every keystroke: nothing is lost if the page closes mid-entry.
        const r = WorkoutService.updateSetField(el.dataset.se, el.dataset.set, el.dataset.aw, el.value);
        el.setAttribute('aria-invalid', String(r.invalid));
      } else if (el.dataset.histSearch !== undefined) {
        UIState.ui.historyQuery = el.value;
        const box = $('#hist-results');
        if (box) box.innerHTML = Views.historyList();
      } else if (el.dataset.ui) { UIState.ui[el.dataset.ui] = el.value; Router.refresh(); }
      else if (el.dataset.filter) Filters.onSearch(el);
      else if (el.dataset.bind) Forms.bind(el);
      else if (el.dataset.item && el.dataset.field) Editor.onItemInput(el);
    } catch (err) { handleError(err); }
  };
  document.addEventListener('input', (e) => { if (!e.target.dataset.ui) onEdit(e); });
  document.addEventListener('change', (e) => { if (e.target.tagName === 'SELECT') onEdit(e); });

  // Enter moves weight -> reps -> RIR within a set row, then closes the keyboard.
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (e.key !== 'Enter' || !el.dataset || !el.dataset.aw) return;
    e.preventDefault();
    const next = { weight: 'r', reps: 'q' }[el.dataset.aw];
    const target = next && document.getElementById(`${next}-${el.dataset.set}`);
    if (target) target.focus(); else el.blur();
  });

  $('#import-file').addEventListener('change', (e) => {
    handleImportFile(e.target.files && e.target.files[0]).catch(handleError);
  });

  const picker = Picker.el();
  picker.addEventListener('cancel', (e) => { e.preventDefault(); Picker.close(); });

  Dialog.bind();

  window.addEventListener('beforeunload', (e) => {
    if (Forms.isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => { if (SettingsService.get().theme === 'system') Theme.apply('system'); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
  }
}

/**
 * Updates elapsed time and rest countdown once a second. Every value is
 * recomputed from stored timestamps, so screen lock, backgrounding or a
 * throttled interval cannot make the clocks drift.
 */
const Ticker = {
  restDoneKey: null,
  start() {
    const a = WorkoutService.active();
    if (a && a.restTimer && Calc.restRemainingSec(a.restTimer) <= 0) Ticker.restDoneKey = a.restTimer.endsAt;
    setInterval(() => Ticker.tick(), 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Ticker.tick(); });
    window.addEventListener('pageshow', () => Ticker.tick());
  },
  tick() {
    const a = WorkoutService.active();
    if (!a) return;
    const elapsed = Fmt.clock(Calc.sessionDurationSec(a));
    $$('[data-tick="elapsed"]').forEach((n) => { if (n.textContent !== elapsed) n.textContent = elapsed; });
    const t = a.restTimer;
    if (!t) return;
    const rem = Calc.restRemainingSec(t);
    const txt = Fmt.clock(rem);
    $$('[data-tick="rest"]').forEach((n) => { if (n.textContent !== txt) n.textContent = txt; });
    if (rem > 0) return;
    const bar = $('.restbar');
    if (bar && !bar.classList.contains('is-done')) {
      bar.classList.add('is-done');
      const label = $('[data-rest-label]', bar); if (label) label.textContent = 'Rest complete';
      const skip = $('[data-rest-skip]', bar); if (skip) skip.textContent = 'Dismiss';
    }
    if (Ticker.restDoneKey !== t.endsAt) { Ticker.restDoneKey = t.endsAt; Toast.show('Rest complete'); }
  }
};

function showBanner(messages) {
  if (!messages.length) return;
  $('#banner').innerHTML = `<div class="banner__box" role="alert">${icon('alert')}<p>${messages.map(esc).join(' ')}</p>
    <button type="button" class="icon-btn" data-action="dismiss-banner" aria-label="Dismiss message">${icon('close')}</button></div>`;
}

function boot() {
  try {
    Store.init();
  } catch (err) {
    console.error(err);
    $('#view').innerHTML = `<div class="fatal"><h1>Iron Ledger could not start</h1>
      <p>Your stored data was not modified. Error: ${esc(err.message)}</p></div>`;
    return;
  }
  Theme.apply(SettingsService.get().theme);
  bindEvents();
  showBanner(Store.takeNotices());
  Router.start();
  Ticker.start();
}

boot();
</script>
