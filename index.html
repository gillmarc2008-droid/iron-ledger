<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E141C">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Ledger</title>
<style>
/* =====================================================================
   DESIGN TOKENS
   Concept: a training ledger. Ink-blue base, ledger-paper light mode,
   hairline "ruled" rows, and prescriptions set as right-aligned
   tabular number columns. One accent: ledger green.
   ===================================================================== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --tap: 44px;
  --pad: 20px;
  --maxw: 560px;
  --nav-h: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);

  /* Light: ledger paper */
  color-scheme: light;
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --surface-2: #E7ECE6;
  --line: #D8DFD6;
  --line-strong: #B9C4B7;
  --text: #0F1A24;
  --text-2: #3D4A57;
  --text-3: #5D6A76;
  --accent: #17704C;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(23, 112, 76, .10);
  --danger: #B3261E;
  --danger-soft: rgba(179, 38, 30, .09);
  --focus: #17704C;
  --scrim: rgba(15, 26, 36, .45);
  --preview: #5B3FC4;
  --preview-soft: rgba(91, 63, 196, .08);
}

/* Dark: ink. Applied for explicit dark, or system when the device prefers dark. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E141C;
    --surface: #161E28;
    --surface-2: #1E2834;
    --line: #243040;
    --line-strong: #34445A;
    --text: #E9EEF3;
    --text-2: #B3BECA;
    --text-3: #8C99A8;
    --accent: #7FD3AE;
    --accent-ink: #072018;
    --accent-soft: rgba(127, 211, 174, .12);
    --danger: #FF8A80;
    --danger-soft: rgba(255, 138, 128, .10);
    --focus: #7FD3AE;
    --scrim: rgba(3, 6, 10, .66);
    --preview: #B9A6FF;
    --preview-soft: rgba(185, 166, 255, .09);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E141C;
  --surface: #161E28;
  --surface-2: #1E2834;
  --line: #243040;
  --line-strong: #34445A;
  --text: #E9EEF3;
  --text-2: #B3BECA;
  --text-3: #8C99A8;
  --accent: #7FD3AE;
  --accent-ink: #072018;
  --accent-soft: rgba(127, 211, 174, .12);
  --danger: #FF8A80;
  --danger-soft: rgba(255, 138, 128, .10);
  --focus: #7FD3AE;
  --scrim: rgba(3, 6, 10, .66);
  --preview: #B9A6FF;
  --preview-soft: rgba(185, 166, 255, .09);
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 50;
  background: var(--accent); color: var(--accent-ink);
  padding: 10px 14px; border-radius: var(--r-sm); text-decoration: none; font-weight: 600;
}
.skip-link:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* =====================================================================
   SHELL
   ===================================================================== */
#view {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad)
           calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 40px);
  outline: none;
}
body.is-editing #view { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px); }
body.is-editing .tabbar { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar__inner {
  max-width: var(--maxw); margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--nav-h);
  text-decoration: none; color: var(--text-3);
  font-size: 12px; font-weight: 500; letter-spacing: .01em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--text); font-weight: 650; }
/* Active state is shown by weight, colour AND a marker — never colour alone */
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 30%; right: 30%;
  height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
}

.banner {
  max-width: var(--maxw); margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 0;
}
.banner__box {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--danger-soft); color: var(--text);
  border-left: 3px solid var(--danger);
  border-radius: var(--r-sm); padding: 12px 8px 12px 14px; font-size: 15px;
}
.banner__box p { flex: 1; padding-top: 2px; }

/* =====================================================================
   TYPE + HEADERS
   ===================================================================== */
.page-head {
  display: flex; align-items: center; gap: 4px;
  min-height: 56px; margin: 0 -10px 8px;
}
.page-head__titles { flex: 1; min-width: 0; padding: 0 10px; }
.page-head--sub .page-head__titles { padding-left: 2px; }
.page-title {
  font-family: var(--font-display);
  font-size: 30px; line-height: 1.12; font-weight: 720; letter-spacing: -.022em;
  overflow-wrap: anywhere;
}
.page-head--sub .page-title { font-size: 22px; letter-spacing: -.015em; }
.page-head__actions { display: flex; align-items: center; gap: 2px; }

.section { margin-top: 32px; }
.section:first-of-type { margin-top: 8px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 10px;
}
.section-title { font-size: 15px; font-weight: 650; color: var(--text-2); letter-spacing: .005em; }
.meta { font-size: 14px; color: var(--text-3); }
.link {
  display: inline-flex; align-items: center; gap: 2px;
  min-height: var(--tap); padding: 0 2px;
  color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: none;
}
.link svg { width: 18px; height: 18px; }
.lede { color: var(--text-2); font-size: 16px; }
.muted { color: var(--text-3); }

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px;
  border: 0; border-radius: var(--r-md);
  font-size: 16px; font-weight: 620; line-height: 1.1; text-decoration: none;
  transition: transform .12s var(--ease), background-color .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text); padding: 0 12px; }
.btn-danger { background: var(--danger); color: #fff; }
:root[data-theme="dark"] .btn-danger { color: #2A0602; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger { color: #2A0602; } }
.btn-danger-text { background: transparent; color: var(--danger); padding: 0 4px; }
.btn-block { width: 100%; min-height: 52px; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: var(--tap); height: var(--tap); padding: 0;
  border: 0; border-radius: 50%; background: transparent; color: var(--text-2);
  text-decoration: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.icon-btn--danger { color: var(--danger); }

/* =====================================================================
   HOME
   ===================================================================== */
.home-head { padding: 14px 0 6px; }
.wordmark {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-size: 15px; font-weight: 800; letter-spacing: .24em;
}
/* The brand mark: a ledger margin rule */
.wordmark__rule { width: 3px; height: 18px; background: var(--accent); border-radius: 2px; }
.home-date { margin-top: 4px; color: var(--text-3); font-size: 15px; }
.display {
  font-family: var(--font-display);
  font-size: 40px; line-height: 1.02; font-weight: 760; letter-spacing: -.035em;
  margin-top: 6px;
}
.home-lede { margin-top: 8px; color: var(--text-2); }

/* Ruled routine rows (ledger lines rather than boxed cards) */
.rlist { margin-top: 18px; border-top: 1px solid var(--line); }
.rrow {
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.rrow__main {
  flex: 1; min-width: 0; display: block;
  padding: 16px 0; text-decoration: none;
}
.rrow__name { display: block; font-size: 19px; font-weight: 680; letter-spacing: -.01em; }
.rrow__focus { display: block; color: var(--text-3); font-size: 15px; margin-top: 2px; }
.rrow__figs { display: flex; gap: 14px; flex: none; text-align: right; }
.fig { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.fig b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fig span { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.empty-inline {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  color: var(--text-2);
}
.empty-inline svg { width: 24px; height: 24px; color: var(--text-3); margin-top: 1px; }

/* Week strip: real dates, no invented numbers */
.week {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px;
}
.week__day {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 0; border-radius: var(--r-sm);
  font-size: 12px; color: var(--text-3);
}
.week__day b { font-size: 17px; font-weight: 650; color: var(--text-2); }
.week__day[aria-current="date"] { background: var(--surface-2); color: var(--text); }
.week__day[aria-current="date"] b { color: var(--text); }
.week__day[aria-current="date"]::after {
  content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--accent);
}

/* =====================================================================
   SEGMENTED CONTROL
   ===================================================================== */
.segmented {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface-2); border-radius: var(--r-md); padding: 3px;
}
.segmented > a, .segmented > button {
  min-height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: transparent;
  color: var(--text-2); font-size: 15px; font-weight: 600; text-decoration: none;
  padding: 0 8px;
}
.segmented > [aria-current="page"],
.segmented > [aria-checked="true"],
.segmented > [aria-pressed="true"] {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px var(--line-strong);
}
.workout-tabs { margin-bottom: 18px; }

/* =====================================================================
   ROUTINE CARDS (Workout > Routines)
   ===================================================================== */
.rcards { display: grid; gap: 12px; }
.rcard {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 16px 16px 12px;
}
.rcard__top { display: flex; gap: 12px; align-items: flex-start; }
.rcard__link { flex: 1; min-width: 0; text-decoration: none; padding-top: 2px; }
.rcard__name { font-size: 20px; font-weight: 700; letter-spacing: -.012em; }
.rcard__focus { color: var(--text-3); font-size: 15px; margin-top: 2px; }
.rcard__actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
.rcard__actions .btn { flex: 1; }
.rcard__actions .icon-btn { flex: none; }

/* =====================================================================
   LEDGER TABLE (routine detail)
   ===================================================================== */
.summary {
  display: flex; gap: 28px; padding: 6px 0 18px;
}
.summary .fig { align-items: flex-start; }
.summary .fig b { font-size: 30px; letter-spacing: -.02em; }
.summary .fig span { font-size: 13px; }

.ledger { border-top: 1px solid var(--line-strong); }
.ledger__colhead, .ledger__row {
  display: grid;
  grid-template-columns: 1fr 40px 58px 46px 46px;
  column-gap: 6px; align-items: baseline;
}
.ledger__colhead {
  padding: 8px 0; font-size: 12px; color: var(--text-3); font-weight: 600;
  border-bottom: 1px solid var(--line);
}
.ledger__colhead span:not(:first-child), .ledger__row .c { text-align: right; }
.ledger__item { border-bottom: 1px solid var(--line); padding: 14px 0; }
.ledger__name { font-size: 17px; font-weight: 640; text-decoration: none; line-height: 1.3; }
.ledger__row .c { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ledger__sub { font-size: 14px; color: var(--text-3); margin-top: 2px; }
.ledger__note {
  margin-top: 8px; font-size: 15px; color: var(--text-2);
  padding-left: 10px; border-left: 2px solid var(--line-strong);
}
.desc { color: var(--text-2); margin: -2px 0 14px; }

/* =====================================================================
   SEARCH, CHIPS, EXERCISE LIST
   ===================================================================== */
.search {
  position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 14px; width: 20px; height: 20px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; min-height: 48px; padding: 0 14px 0 44px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-md);
  font-size: 16px;
}
.search input:focus { outline: none; border-color: var(--focus); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 12px calc(var(--pad) * -1) 0; padding: 0 var(--pad);
  scroll-padding: 0 var(--pad);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 40px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  background: transparent; color: var(--text-2); font-size: 15px; font-weight: 550;
}
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] {
  background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 650;
}
.chip[aria-pressed="true"] .chip__check { display: inline; }
.chip__check { display: none; }

.results-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: 14px 0 2px; font-size: 14px; color: var(--text-3);
}

.xlist { border-top: 1px solid var(--line); margin-top: 6px; }
.xlist > li { border-bottom: 1px solid var(--line); }
.xrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 64px; padding: 10px 0;
  background: transparent; border: 0; text-align: left; text-decoration: none;
}
.xrow__body { flex: 1; min-width: 0; }
.xrow__name { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
.xrow__meta { display: block; font-size: 14px; color: var(--text-3); margin-top: 1px; }
.xrow__chev { color: var(--text-3); width: 20px; height: 20px; }
.tags { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 6px;
  background: var(--surface-2); color: var(--text-2);
}
.tag svg { width: 14px; height: 14px; }
.tag--fav { background: var(--accent-soft); color: var(--accent); }
.tag--avoid { background: var(--danger-soft); color: var(--danger); }
.tag--dnu { background: var(--danger); color: var(--bg); }

/* Picker selection badge shows ORDER, not just colour */
.pick-badge {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--line-strong); font-size: 14px; font-weight: 750;
}
.xrow[aria-pressed="true"] .pick-badge {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}

/* =====================================================================
   EMPTY STATES
   ===================================================================== */
.empty {
  padding: 48px 8px; text-align: center; color: var(--text-2);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty__mark {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-2); color: var(--text-3);
}
.empty__mark svg { width: 30px; height: 30px; }
.empty h2 { font-size: 20px; font-weight: 700; color: var(--text); }
.empty p { max-width: 30ch; }
.later { margin-top: 28px; font-size: 14px; color: var(--text-3); text-align: center; }

/* =====================================================================
   FORMS + EDITORS
   ===================================================================== */
.edit-head {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  margin: 0 calc(var(--pad) * -1) 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(var(--pad) - 8px) 8px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
body.is-editing #view { padding-top: 0; }
.edit-head__title { font-size: 17px; font-weight: 700; text-align: center; }

.field { margin-top: 18px; }
.field > label, .field-label {
  display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 6px;
}
.optional { font-weight: 400; color: var(--text-3); }
.input, .field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 11px 14px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  font-size: 16px;
}
.field textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.field select, .eitem select {
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px;
}
.field input:focus, .field select:focus, .field textarea:focus,
.eitem input:focus, .eitem select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
[aria-invalid="true"] { border-color: var(--danger) !important; }
.field-error { color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 6px; }
.field-error::before { content: "! "; }
.hint { color: var(--text-3); font-size: 14px; margin-top: 6px; }

.toggle-group { display: flex; flex-wrap: wrap; gap: 8px; }

.editor-summary { display: flex; gap: 22px; margin: 28px 0 6px; align-items: flex-end; }
.editor-summary .fig { align-items: flex-start; }
.editor-summary .section-title { flex: 1; }

.eitems { counter-reset: none; }
.eitem {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 12px 12px 14px 14px; margin-top: 10px;
}
.eitem.has-error { box-shadow: inset 3px 0 0 var(--danger); }
.eitem__head { display: flex; align-items: flex-start; gap: 10px; }
.eitem__idx { font-size: 15px; font-weight: 700; color: var(--text-3); width: 22px; padding-top: 3px; }
.eitem__title { flex: 1; min-width: 0; padding-top: 1px; }
.eitem__name { display: block; font-size: 17px; font-weight: 650; line-height: 1.3; }
.eitem__meta { display: block; font-size: 14px; color: var(--text-3); }
.eitem__tools { display: flex; margin: -6px -6px 0 0; }
.eitem__tools .icon-btn { width: 40px; height: 44px; }

.eitem__grid {
  display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12px 10px; margin-top: 12px;
}
.cell__label { display: block; font-size: 13px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; }
.stepper {
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
  background: var(--surface-2); border-radius: var(--r-md); min-height: 44px;
}
.stepper button {
  height: 44px; border: 0; background: transparent; color: var(--text);
  display: grid; place-items: center; border-radius: var(--r-md);
}
.stepper button svg { width: 18px; height: 18px; }
.stepper output { text-align: center; font-size: 20px; font-weight: 700; }
.range { display: grid; grid-template-columns: 1fr 12px 1fr; align-items: center; }
.range span { text-align: center; color: var(--text-3); }
.eitem input[type="text"], .eitem input[inputmode], .eitem select {
  width: 100%; min-height: 44px; padding: 0 6px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-md);
  font-size: 18px; font-weight: 650; text-align: center; font-variant-numeric: tabular-nums;
}
.eitem select { text-align: left; padding: 0 30px 0 12px; font-size: 17px; background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; }
.eitem__note { grid-column: 2 / -1; min-width: 0; }
.eitem input.note-input {
  width: 100%; min-height: 44px; padding: 0 12px;
  background: transparent; border: 1px dashed var(--line-strong); border-radius: var(--r-md);
  font-size: 15px; text-align: left; font-weight: 400;
}
.item-errors { margin-top: 8px; }
.item-errors li { color: var(--danger); font-size: 14px; font-weight: 600; }
.item-errors li::before { content: "! "; }

.btn-add {
  width: 100%; min-height: 56px; margin-top: 12px;
  border: 1.5px dashed var(--line-strong); background: transparent; color: var(--text);
  border-radius: var(--r-lg); font-weight: 650;
}
.form-footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }

/* =====================================================================
   EXERCISE DETAIL
   ===================================================================== */
.xd-meta { color: var(--text-2); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pref { margin-bottom: 22px; }
.pref .segmented { grid-auto-columns: auto; grid-template-columns: repeat(4, 1fr); }
.pref .segmented button { font-size: 14px; padding: 0 4px; min-height: 44px; }
.spec { border-top: 1px solid var(--line); }
.spec > div {
  display: grid; grid-template-columns: 9.5em 1fr; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.spec dt { color: var(--text-3); font-size: 15px; }
.spec dd { font-weight: 560; }
.prose { margin-top: 24px; }
.prose h2 { font-size: 15px; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
.prose p { color: var(--text); max-width: 62ch; white-space: pre-line; }
.used { margin-top: 6px; }
.used a { display: flex; justify-content: space-between; align-items: center; min-height: var(--tap); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); }
.used a svg { width: 18px; height: 18px; color: var(--text-3); }

/* =====================================================================
   MORE / SETTINGS
   ===================================================================== */
.setting { padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting:first-of-type { border-top: 1px solid var(--line); }
.setting__label { display: block; font-weight: 600; margin-bottom: 8px; }
.setting__hint { font-size: 14px; color: var(--text-3); margin-top: 8px; }
.datarow {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 12px 0;
  border: 0; border-bottom: 1px solid var(--line); background: transparent;
  text-align: left;
}
.datarow:first-of-type { border-top: 1px solid var(--line); }
.datarow svg { width: 22px; height: 22px; color: var(--text-2); }
.datarow__body { flex: 1; }
.datarow__title { display: block; font-weight: 620; }
.datarow__sub { display: block; font-size: 14px; color: var(--text-3); }
.datarow--danger .datarow__title, .datarow--danger svg { color: var(--danger); }
.about { margin-top: 32px; color: var(--text-3); font-size: 14px; line-height: 1.6; }

/* =====================================================================
   DIALOGS, SHEETS, PICKER, TOAST
   ===================================================================== */
dialog {
  padding: 0; border: 0; color: var(--text); background: var(--surface);
  max-width: min(420px, calc(100vw - 32px)); width: 100%;
  border-radius: var(--r-lg);
}
dialog::backdrop { background: var(--scrim); }
dialog[open] { animation: pop .18s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.dlg { padding: 22px 20px 16px; }
.dlg h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.dlg p { color: var(--text-2); margin-top: 8px; }
.dlg ul.errors { margin-top: 10px; color: var(--danger); font-size: 15px; }
.dlg ul.errors li { margin-top: 4px; }
.dlg .field { margin-top: 14px; }
.dlg__actions { display: flex; gap: 10px; margin-top: 22px; }
.dlg__actions .btn { flex: 1; }

dialog.sheet {
  margin: auto auto 0; max-width: var(--maxw); width: 100%;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
dialog.sheet[open] { animation: rise .22s var(--ease); }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet__title { padding: 18px 20px 6px; font-size: 14px; font-weight: 600; color: var(--text-3); }
.sheet__actions { padding: 0 8px 8px; }
.sheet__btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 52px; padding: 0 12px; border: 0; background: transparent;
  border-radius: var(--r-md); font-size: 17px; font-weight: 550; text-align: left;
}
.sheet__btn:active { background: var(--surface-2); }
.sheet__btn svg { width: 22px; height: 22px; color: var(--text-2); }
.sheet__btn--danger, .sheet__btn--danger svg { color: var(--danger); }
.sheet__cancel { border-top: 1px solid var(--line); margin-top: 4px; justify-content: center; font-weight: 650; }

dialog.picker {
  max-width: var(--maxw); width: 100%; height: 100%; max-height: 100%;
  margin: 0 auto; border-radius: 0; background: var(--bg);
}
dialog.picker[open] { display: flex; flex-direction: column; animation: rise .22s var(--ease); }
.picker__head {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 8px 6px;
}
.picker__head h2 { font-size: 17px; font-weight: 700; }
.picker__count { justify-self: end; padding-right: 12px; font-size: 14px; color: var(--text-3); }
.picker__filters { padding: 4px var(--pad) 10px; border-bottom: 1px solid var(--line); }
.picker__list { flex: 1; overflow-y: auto; padding: 0 var(--pad); -webkit-overflow-scrolling: touch; }
.picker__list .xlist { border-top: 0; margin-top: 0; }
.picker__foot {
  padding: 12px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid var(--line); background: var(--bg);
}

.toast {
  position: fixed; left: 50%; z-index: 100;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  max-width: min(440px, calc(100vw - 32px)); width: max-content;
  background: var(--text); color: var(--bg);
  padding: 13px 18px; border-radius: var(--r-md);
  font-size: 15px; font-weight: 600; line-height: 1.35;
  transition: opacity .2s, transform .2s var(--ease);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
.toast[data-tone="error"] { background: var(--danger); color: #fff; }
body.is-editing .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }

.fatal { padding: 40px var(--pad); max-width: var(--maxw); margin: 0 auto; }
.fatal h1 { font-size: 24px; margin-bottom: 10px; }


/* =====================================================================
   ALPHA 1.5 — PLANNED-FEATURE SCREENS
   Visual rule: violet + dashed outline = UI preview (demo content).
   Grey outlined "Later" tag = control that is not functional yet.
   ===================================================================== */
.tag--preview { background: var(--preview-soft); color: var(--preview); box-shadow: inset 0 0 0 1px var(--preview); }
.tag--later { background: transparent; color: var(--text-3); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pv-banner {
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
  padding: 12px 14px; margin: 4px 0 14px;
  border: 1.5px dashed var(--preview); border-radius: var(--r-md); background: var(--preview-soft);
  font-size: 15px; color: var(--text-2);
}
.pv-banner b { color: var(--text); }
.pv-link {
  display: flex; align-items: center; gap: 12px; margin-top: 14px;
  padding: 14px; border: 1.5px dashed var(--preview); border-radius: var(--r-md);
  text-decoration: none; background: var(--preview-soft);
}
.pv-link > svg { width: 22px; height: 22px; color: var(--preview); }
.pv-link__body { flex: 1; min-width: 0; }
.pv-link__title { display: block; font-weight: 650; }
.pv-link__sub { display: block; font-size: 14px; color: var(--text-3); }

.subtabs { margin-bottom: 18px; }
.subtabs > a { font-size: 14px; padding: 0 4px; }
.seg-sm > button { min-height: 36px; font-size: 14px; }

.rrow__count { display: block; font-size: 14px; color: var(--text-3); margin-top: 2px; }
.today { padding: 16px; background: var(--surface); border-radius: var(--r-lg); }
.today__title { font-size: 18px; font-weight: 650; }
.today__sub { color: var(--text-3); font-size: 15px; margin-top: 2px; }
.home-head + .section { margin-top: 18px; }
#choose-h { font-size: 32px; margin-bottom: 4px; }

/* tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 14px; }
.tile { background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; min-height: 80px; }
.tile dt { font-size: 13px; font-weight: 600; color: var(--text-3); }
.tile dd { font-size: 24px; font-weight: 720; letter-spacing: -.01em; margin-top: 4px; }
.tile__sub { display: block; font-size: 13px; color: var(--text-3); }

/* chart placeholder */
.chart-ph { margin: 6px 0 0; padding: 14px 14px 12px; background: var(--surface); border-radius: var(--r-md); }
.chart-ph svg { width: 100%; height: 130px; display: block; }
.chart-ph__grid path { stroke: var(--line); stroke-width: 1; fill: none; }
.chart-ph__axis { stroke: var(--line-strong); stroke-width: 1; fill: none; }
.chart-ph__line { stroke: var(--line-strong); stroke-width: 2; stroke-dasharray: 5 6; fill: none; }
.chart-ph figcaption { font-size: 14px; color: var(--text-3); margin-top: 8px; }

/* overview */
.ov-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.switch {
  display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
  min-height: var(--tap); border: 0; background: transparent; padding: 0;
  font-size: 15px; font-weight: 600; color: var(--text-2);
}
.switch__track { width: 42px; height: 26px; border-radius: 13px; background: var(--line-strong); position: relative; transition: background .15s; }
.switch__thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s var(--ease); }
.switch[aria-checked="true"] .switch__track { background: var(--preview); }
.switch[aria-checked="true"] .switch__thumb { transform: translateX(16px); }
.mbars { border-top: 1px solid var(--line); }
.mbar { display: grid; grid-template-columns: 6.5em 1fr 4.2em; gap: 10px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--line); }
.mbar__label { font-size: 15px; }
.mbar__track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.mbar__fill { display: block; height: 100%; background: var(--preview); border-radius: 3px; }
.mbar__value { text-align: right; font-size: 15px; font-weight: 600; color: var(--text-2); }
.prs { border-top: 1px solid var(--line); }
.prs li { display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--line); }
.prs svg { width: 20px; height: 20px; color: var(--accent); }
.prs__name { flex: 1; font-weight: 600; }
.prs__val { font-weight: 700; }
.prs__when { font-size: 13px; color: var(--text-3); width: 3.4em; text-align: right; }
.coach { padding: 16px; border-radius: var(--r-lg); background: var(--surface); }
.coach__head { display: flex; align-items: center; gap: 10px; }
.coach__head svg { width: 22px; height: 22px; color: var(--accent); }
.coach__head h2 { flex: 1; font-size: 18px; font-weight: 700; }
.coach__list { margin-top: 10px; color: var(--text-2); font-size: 15px; }
.coach__list li { padding: 4px 0 4px 16px; position: relative; }
.coach__list li::before { content: ""; position: absolute; left: 2px; top: 13px; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }

.str-name { font-size: 22px; font-weight: 700; margin-top: 18px; letter-spacing: -.01em; }
.str-name + .meta { margin-bottom: 12px; }
.str-metric { margin: 16px 0 10px; }

/* schedule */
.missed { padding: 16px; border-radius: var(--r-lg); background: var(--surface); box-shadow: inset 3px 0 0 var(--danger); }
.missed__name { font-size: 19px; font-weight: 700; }
.missed__when { color: var(--text-3); font-size: 15px; }
.missed__actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.missed__actions .btn-primary { flex: 1 1 100%; }
.missed__actions .btn-secondary, .missed__actions .btn-ghost { flex: 1; }
.sched { border-top: 1px solid var(--line); }
.sday { display: flex; align-items: center; gap: 14px; min-height: 64px; border-bottom: 1px solid var(--line); }
.sday__date { width: 40px; display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--text-3); line-height: 1.15; }
.sday__date b { font-size: 18px; color: var(--text-2); }
.sday__body { flex: 1; display: flex; flex-direction: column; }
.sday__name { font-size: 17px; font-weight: 650; }
.sday__rest { font-size: 16px; color: var(--text-3); }
.sday__today { font-size: 13px; font-weight: 650; color: var(--accent); }
.sday.is-today .sday__date b { color: var(--text); }
.sday.is-today { box-shadow: inset 3px 0 0 var(--accent); padding-left: 0; }

/* history */
.hist-tools { display: flex; gap: 8px; align-items: center; }
.hist-tools .search { flex: 1; }
.search input:disabled { opacity: .6; }
.icon-btn--boxed { border-radius: var(--r-md); background: var(--surface-2); width: 48px; height: 48px; }
.hist-mode { margin: 12px 0 4px; }
.group-head { font-size: 15px; font-weight: 650; color: var(--text-2); margin: 4px 0 8px; }
.wcard {
  display: block; padding: 14px 16px; border-radius: var(--r-lg); text-decoration: none;
  background: var(--surface); border: 1.5px dashed var(--preview);
}
.wcard__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wcard__name { font-size: 19px; font-weight: 700; }
.wcard__date { display: block; color: var(--text-3); font-size: 15px; }
.wcard__stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; margin-top: 12px; }
.wcard__stats .fig { align-items: flex-start; }
.wcard__stats .fig b { font-size: 17px; }
.cal { margin: 14px 0 0; padding: 14px; background: var(--surface); border-radius: var(--r-lg); }
.cal__month { font-weight: 650; margin-bottom: 8px; }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal__head { font-size: 12px; color: var(--text-3); font-weight: 600; padding: 4px 0; }
.cal__cell { min-height: 38px; display: grid; place-items: center; font-size: 15px; color: var(--text-2); border-radius: 8px; }
.cal__cell.is-today { background: var(--surface-2); color: var(--text); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
.summary--4 { gap: 18px; flex-wrap: wrap; }
.summary .fig b { font-size: 26px; }
.cw { border-top: 1px solid var(--line-strong); }
.cw__ex { padding: 14px 0; border-bottom: 1px solid var(--line); }
.cw__head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cw__name { font-size: 17px; font-weight: 650; }
.cw__sub { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--text-2); margin-top: 4px; }
.cw__sub svg { width: 16px; height: 16px; color: var(--accent); }
.mini { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
.mini th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 600; padding: 2px 0 4px; }
.mini td { padding: 3px 0; color: var(--text-2); }
.mini td b { color: var(--text); font-weight: 650; }
.mini th:first-child, .mini td:first-child { width: 3em; }
.mini th:last-child, .mini td:last-child { width: 3em; text-align: right; }

/* photos */
.compare { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare--slider { grid-template-columns: 1fr; }
.compare__slider { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--r-md); overflow: hidden; }
.compare__slider .slot { border-radius: 0; }
.compare__handle { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--text); }
.compare__handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--text); }
.slot {
  aspect-ratio: 3 / 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px dashed var(--line-strong); border-radius: var(--r-md); background: var(--surface); color: var(--text-3);
  font-size: 14px; font-weight: 600; padding: 8px; text-align: center;
}
.slot svg { width: 26px; height: 26px; }

/* active workout preview */
body.is-editing .aw-head { margin-top: 0; }
.aw-head {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  margin: 0 calc(var(--pad) * -1) 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) var(--pad) 8px calc(var(--pad) - 10px);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.aw-head__mid { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.aw-head__name { font-weight: 700; font-size: 17px; }
.aw-head__time { display: inline-flex; gap: 4px; align-items: center; font-size: 15px; color: var(--text-2); font-weight: 600; }
.aw-head__time svg { width: 15px; height: 15px; }
.aw-ex { background: var(--surface); border-radius: var(--r-lg); padding: 14px 12px 8px 14px; margin-top: 12px; }
.aw-ex__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.aw-ex__name { font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
.aw-ex__muscle { font-size: 14px; color: var(--text-3); }
.aw-ex__head .icon-btn { margin: -8px -4px 0 0; }
.aw-target { display: flex; gap: 16px; font-size: 15px; color: var(--text-3); margin: 8px 0 6px; }
.aw-target b { color: var(--text); font-weight: 700; margin-left: 4px; }
.settable { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
.settable th { font-size: 12px; font-weight: 650; color: var(--text-3); text-align: center; padding: 2px 0; }
.settable th svg { width: 14px; height: 14px; vertical-align: -2px; }
.settable th:nth-child(2), .settable td.prev { text-align: left; }
.settable td { text-align: center; padding: 0 2px; font-size: 16px; }
.settable td.set-n { font-weight: 700; color: var(--text-2); width: 30px; }
.settable td.prev { color: var(--text-3); font-size: 14px; white-space: nowrap; }
.cellval {
  display: grid; place-items: center; min-height: 44px; min-width: 44px;
  border-radius: 10px; background: var(--surface-2); font-size: 18px; font-weight: 700;
}
.cellval.is-empty { color: var(--text-3); font-weight: 500; }
.settable tr.is-done .cellval { background: var(--accent-soft); }
.settable tr.is-done td.set-n { color: var(--accent); }
.setcheck {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  border: 2px solid var(--line-strong); background: transparent; color: var(--accent-ink);
}
.setcheck[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.setcheck svg { width: 22px; height: 22px; stroke-width: 2.6; }
.aw-addset { margin-top: 2px; padding: 0 6px; color: var(--accent); }
body.is-editing #view:has(.restbar) { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }
.restbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 8px;
  max-width: var(--maxw); margin: 0 auto;
  padding: 10px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: var(--text); color: var(--bg);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.restbar__label { font-size: 14px; font-weight: 650; opacity: .75; }
.restbar__time { font-size: 30px; font-weight: 760; letter-spacing: -.02em; }
.restbar__btn {
  min-width: 52px; min-height: 44px; border-radius: 12px; border: 0;
  background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); font-weight: 700; font-size: 15px;
}
.restbar__btn--skip { background: var(--bg); color: var(--text); }

/* substitution / review */
.sub-lede { font-size: 18px; color: var(--text-2); margin-top: 4px; }
.sub-lede b { color: var(--text); }
.choices { display: grid; gap: 8px; margin-top: 10px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  min-height: 52px; padding: 13px 14px; border-radius: var(--r-md);
  background: var(--surface); border: 1.5px solid transparent;
}
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice__dot { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line-strong); }
.choice[aria-checked="true"] .choice__dot { border: 7px solid var(--accent); }
.choice__body { flex: 1; }
.choice__title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 650; font-size: 16px; }
.choice__sub { display: block; font-size: 14px; color: var(--text-3); margin-top: 2px; }
.note { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--line-strong); color: var(--text-2); font-size: 15px; background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.sticky-foot {
  position: sticky; bottom: 0; margin: 24px calc(var(--pad) * -1) 0;
  padding: 12px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 12px);
  background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.checks { display: grid; gap: 8px; }
.check {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  min-height: 56px; padding: 12px 14px; border: 0; border-radius: var(--r-md); background: var(--surface);
  font-size: 16px; font-weight: 550;
}
.check__box { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line-strong); display: grid; place-items: center; color: var(--accent-ink); }
.check[aria-checked="true"] .check__box { background: var(--accent); border-color: var(--accent); }
.check__box svg { width: 18px; height: 18px; stroke-width: 2.8; }

/* finish */
.done-hero { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 4px; }
.done-hero__mark { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.done-hero__mark svg { width: 28px; height: 28px; stroke-width: 2.6; }
.changes { border-top: 1px solid var(--line); }
.changes li { display: flex; gap: 10px; align-items: center; min-height: 52px; border-bottom: 1px solid var(--line); font-weight: 600; }
.changes svg { width: 20px; height: 20px; color: var(--text-3); }
.finish-actions { display: grid; gap: 10px; margin-top: 28px; }

/* rows used as links */
a.datarow { text-decoration: none; }
.datarow .tag { flex: none; }

/* =====================================================================
   ALPHA 2 — WORKOUT ENGINE
   ===================================================================== */
/* dialogs */
.dlg__msg { white-space: pre-line; }
.dlg__stack { display: grid; gap: 8px; margin-top: 20px; }
.sheet__btn .tag { margin-left: auto; }
.sheet__btn[aria-current="true"] { background: var(--surface-2); }

/* in-progress card (Home) + compact strip (other screens) */
.inprogress {
  display: grid; gap: 4px; margin: 14px 0 6px; padding: 16px;
  border-radius: var(--r-lg); background: var(--surface); text-decoration: none;
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
.inprogress__label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; color: var(--accent); }
.inprogress__name { font-size: 24px; font-weight: 740; letter-spacing: -.02em; }
.inprogress__time { font-size: 17px; font-weight: 650; color: var(--text-2); margin-bottom: 8px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.activebar-slot:empty { display: none; }
.activebar {
  position: fixed; left: 0; right: 0; z-index: 19;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  max-width: var(--maxw); margin: 0 auto;
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px;
  background: var(--surface-2); border-top: 1px solid var(--line); text-decoration: none;
}
.activebar__body { flex: 1; min-width: 0; line-height: 1.25; }
.activebar__title { display: block; font-size: 13px; font-weight: 650; color: var(--accent); }
.activebar__sub { display: block; font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activebar__cta { font-weight: 700; padding: 10px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
body.has-activebar #view { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 96px); }
body.has-activebar .toast { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 66px); }

/* week strip marks */
.week__day.has-workout b { color: var(--accent); }
.week__day.has-workout::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); order: 3; }
.cal__cell { position: relative; }
.cal__cell.has-workout::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }

/* active workout */
.aw-head__end { display: flex; align-items: center; gap: 2px; }
.aw-ex { padding: 14px 10px 6px 12px; }
.aw-ex__muscle .tag { margin-left: 6px; vertical-align: 1px; }
.aw-target { gap: 14px; flex-wrap: wrap; color: var(--text-3); }
.aw-target b { margin-left: 0; }
.aw-target span b { margin-left: 3px; }
.aw-note {
  margin: 6px 0 2px; padding: 8px 10px; border-radius: var(--r-sm);
  background: var(--surface-2); font-size: 15px; color: var(--text);
}
.aw-note--today { box-shadow: inset 3px 0 0 var(--accent); }
.note-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-3); margin-bottom: 1px; }
.sets { margin-top: 8px; }
.srow {
  display: grid; align-items: center; gap: 4px;
  grid-template-columns: 30px minmax(46px, 64px) minmax(56px, 1fr) 52px 44px 46px;
  padding: 3px 0;
}
.srow--head { font-size: 12px; font-weight: 650; color: var(--text-3); text-align: center; padding-bottom: 0; }
.srow--head span:nth-child(2) { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow--head svg { width: 14px; height: 14px; vertical-align: -2px; }
.srow__label {
  height: 44px; border: 0; border-radius: 10px; background: transparent;
  font-weight: 760; font-size: 16px; color: var(--text-2); padding: 0;
}
.srow--warmup .srow__label, .srow--drop .srow__label, .srow--failure .srow__label { color: var(--text); background: var(--surface-2); }
.srow__prev {
  height: 44px; border: 0; background: transparent; padding: 0 2px; text-align: left;
  font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
button.srow__prev { text-decoration: underline dotted; text-underline-offset: 3px; }
.srow__prev.is-empty { display: flex; align-items: center; }
.srow__in {
  width: 100%; min-width: 0; height: 48px; padding: 0 4px;
  border: 1.5px solid transparent; border-radius: 10px; background: var(--surface-2);
  font-size: 19px; font-weight: 700; text-align: center;
}
.srow__in::placeholder { color: var(--text-3); font-weight: 500; font-size: 15px; opacity: .8; }
.srow__in:focus { outline: none; border-color: var(--focus); background: var(--bg); }
.srow__in[aria-invalid="true"] { border-color: var(--danger); }
.srow.is-done .srow__in { background: var(--accent-soft); }
.srow.is-done .srow__label { color: var(--accent); }
.srow .setcheck { width: 46px; height: 48px; }
.aw-addset { margin-top: 2px; }
.restbar.is-done { background: var(--accent); color: var(--accent-ink); }
.restbar.is-done .restbar__btn { color: var(--accent-ink); background: color-mix(in srgb, var(--accent-ink) 14%, transparent); }
.restbar.is-done .restbar__btn--skip { background: var(--accent-ink); color: var(--accent); }

/* history */
.wcards { display: grid; gap: 10px; }
.wcard--real { border: 0; }
.wcard--real .wcard__date { font-size: 14px; }
.wcard--real .wcard__stats { grid-template-columns: repeat(3, auto); }
.hgroup + .hgroup { margin-top: 22px; }
.hgroup .group-head { margin-top: 18px; }
.mini tr.is-skipped td { color: var(--text-3); }
.cw__sub .note-label { display: inline; margin-right: 6px; }
.xh__item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.xh { border-top: 1px solid var(--line); }
.xh__head { display: flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; }
.xh__date { font-weight: 700; }
.xh__name { flex: 1; color: var(--text-3); }

button.srow__prev {
  display: flex; flex-direction: column; justify-content: center; line-height: 1.15;
  text-decoration: none; font-size: 13px; color: var(--text-2);
  border-radius: 8px; background: transparent; box-shadow: inset 0 -1.5px 0 var(--line-strong);
}
button.srow__prev span:last-child { color: var(--text-3); }
.hint + .section, .summary + .section { margin-top: 28px; }
</style>

<script>
'use strict';

/* =======================================================================
   IRON LEDGER 2.0 — ALPHA 1
   Single-file build. The script is divided into layered sections:

     1. CONFIG            constants, storage keys, limits
     2. TAXONOMY          muscles, equipment, movements, preferences
     3. SEED DATA         default exercises + sample routines (first run only)
     3b. PREVIEW DATA     frozen demo content for UI previews (never stored)
     4. UTILITIES         ids, cloning, escaping, text normalisation
     5. MODELS            factories that produce normalised records
     6. VALIDATION        one place that defines what valid data is
     7. MIGRATIONS        schema upgrade runner (empty at v1)
     8. STORAGE SERVICE   the ONLY code that touches localStorage
     9. STORE             in-memory state + atomic, validated transactions
    10. CALCULATIONS      the single implementation of every derived metric
    11. FORMATTING        display helpers (no business logic)
    12. SERVICES          exercise, routine, settings, backup
    13. UI PRIMITIVES     icons, toast, dialogs
    14. VIEWS             pure render functions -> HTML strings
    15. CONTROLLERS       editors, picker, filters
    16. ROUTER            hash routing + unsaved-changes guard
    17. EVENTS + BOOT     delegated event handling and start-up

   Dependency direction: UI -> services -> store -> storage.
   Nothing below the UI layer reads or writes the DOM.
   ======================================================================= */


/* =======================================================================
   1. CONFIG
   ======================================================================= */
const CONFIG = Object.freeze({
  APP_NAME: 'Iron Ledger',
  APP_VERSION: '2.0.0-alpha.2',
  APP_STAGE: 'Alpha 2',
  SCHEMA_VERSION: 2,   // v2 (Alpha 2): adds completed workout sessions
  BACKUP_KIND: 'iron-ledger-backup',
  MAX_IMPORT_BYTES: 5 * 1024 * 1024,
  KEYS: Object.freeze({
    DATA: 'ironLedger.v2.data',                  // all persistent app data
    ACTIVE_WORKOUT: 'ironLedger.v2.activeWorkout', // the ONE in-progress session (saved on every edit)
    RECOVERY_PREFIX: 'ironLedger.v2.recovery.',  // copies of unreadable data
    PREMIGRATION_PREFIX: 'ironLedger.v2.premigration.schema' // untouched copy kept before each schema upgrade
  }),
  LIMITS: Object.freeze({
    sets: [1, 10],
    reps: [1, 100],
    rir: [0, 5],
    restSec: [0, 600],
    // Logged performance (active and completed sessions)
    weightKg: [0, 1000],
    loggedReps: [0, 999],
    loggedRir: [0, 10]
  }),
  /* Weight is stored in KILOGRAMS everywhere (canonical). Pounds exist only
     at the display/input boundary, via the Units helper. */
  KG_PER_LB: 0.45359237,
  SET_TYPES: Object.freeze(['warmup', 'working', 'drop', 'failure']),
  REST_STEP_SEC: 15,
  DOUBLE_TAP_MS: 600
});


/* =======================================================================
   2. TAXONOMY
   Stable ids are stored; labels are display-only and may change freely.
   ======================================================================= */
const TAXONOMY = Object.freeze({
  muscles: [
    { id: 'chest', label: 'Chest', region: 'upper', filter: true },
    { id: 'back', label: 'Back', region: 'upper', filter: true },
    { id: 'shoulders', label: 'Shoulders', region: 'upper', filter: true },
    { id: 'biceps', label: 'Biceps', region: 'upper', filter: true },
    { id: 'triceps', label: 'Triceps', region: 'upper', filter: true },
    { id: 'forearms', label: 'Forearms', region: 'upper', filter: false },
    { id: 'quads', label: 'Quads', region: 'lower', filter: true },
    { id: 'hamstrings', label: 'Hamstrings', region: 'lower', filter: true },
    { id: 'glutes', label: 'Glutes', region: 'lower', filter: false },
    { id: 'calves', label: 'Calves', region: 'lower', filter: true },
    { id: 'core', label: 'Core', region: 'core', filter: true }
  ],
  regions: [
    { id: 'upper', label: 'Upper body' },
    { id: 'lower', label: 'Lower body' },
    { id: 'core', label: 'Core' }
  ],
  equipment: [
    { id: 'dumbbell', label: 'Dumbbells' },
    { id: 'barbell', label: 'Barbell' },
    { id: 'smith', label: 'Smith machine' },
    { id: 'cable', label: 'Cable' },
    { id: 'machine', label: 'Machine' },
    { id: 'bodyweight', label: 'Bodyweight' }
  ],
  movements: [
    { id: 'horizontal-push', label: 'Horizontal push' },
    { id: 'incline-push', label: 'Incline push' },
    { id: 'vertical-push', label: 'Vertical push' },
    { id: 'fly', label: 'Chest fly' },
    { id: 'lateral-raise', label: 'Lateral raise' },
    { id: 'rear-fly', label: 'Rear-delt fly' },
    { id: 'vertical-pull', label: 'Vertical pull' },
    { id: 'horizontal-pull', label: 'Horizontal pull' },
    { id: 'elbow-flexion', label: 'Elbow flexion (curl)' },
    { id: 'elbow-extension', label: 'Elbow extension' },
    { id: 'squat', label: 'Squat / leg press' },
    { id: 'hinge', label: 'Hip hinge' },
    { id: 'knee-extension', label: 'Knee extension' },
    { id: 'knee-flexion', label: 'Knee flexion (leg curl)' },
    { id: 'calf-raise', label: 'Calf raise' },
    { id: 'spinal-flexion', label: 'Spinal flexion' },
    { id: 'hip-flexion', label: 'Hip flexion' }
  ],
  mechanics: [
    { id: 'compound', label: 'Compound' },
    { id: 'isolation', label: 'Isolation' }
  ],
  preferences: [
    { id: 'favourite', label: 'Favourite' },
    { id: 'neutral', label: 'Neutral' },
    { id: 'avoid', label: 'Avoid' },
    { id: 'do-not-use', label: 'Do not use' }
  ],
  units: [{ id: 'kg', label: 'kg' }, { id: 'lb', label: 'lb' }],
  themes: [{ id: 'system', label: 'System' }, { id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }],
  weekStarts: [{ id: 'monday', label: 'Monday' }, { id: 'sunday', label: 'Sunday' }]
});

const Tax = {
  ids(list) { return TAXONOMY[list].map((x) => x.id); },
  has(list, id) { return TAXONOMY[list].some((x) => x.id === id); },
  label(list, id) {
    const item = TAXONOMY[list].find((x) => x.id === id);
    return item ? item.label : 'Unknown';
  },
  filterMuscles() { return TAXONOMY.muscles.filter((m) => m.filter); },
  regionFor(muscleId) {
    const m = TAXONOMY.muscles.find((x) => x.id === muscleId);
    return m ? m.region : 'upper';
  }
};


/* =======================================================================
   3. SEED DATA
   Used ONLY on first run or after an explicit reset.
   Seed exercise ids are stable ('ex_' + key) so that a future backup merge
   can recognise the same built-in exercise across devices.
   Tuple: [key, name, primary, secondary[], equipment, movement, mechanic,
           defaultRestSec, instructions, alternativeKeys[]]
   ======================================================================= */
const SEED_EXERCISES = [

    ['incline_db_press', 'machine_chest_press']],

    ['db_fly', 'cable_fly']],
  ['db_fly', 'Dumbbell Fly', 'chest', ['shoulders'], 'dumbbell', 'fly', 'isolation', 90,
    'Lie flat holding the dumbbells over the chest. With a fixed slight elbow bend, open the arms in a wide arc to a comfortable stretch, then bring them back together.',
    ['pec_deck', 'cable_fly']],
  ['cable_fly', 'Cable Fly', 'chest', ['shoulders'], 'cable', 'fly', 'isolation', 90,
    'Set both pulleys near shoulder height. Step forward, keep a slight elbow bend and bring the handles together in front of the chest.',
    ['pec_deck', 'db_fly']],
  // Shoulders
  ['seated_db_shoulder_press', 'Seated Dumbbell Shoulder Press', 'shoulders', ['triceps'], 'dumbbell', 'vertical-push', 'compound', 120,
    'Sit upright against a supported bench. Press the dumbbells overhead from ear height, then lower until the elbows reach about shoulder level.',
    ['machine_shoulder_press']],
  ['machine_shoulder_press', 'Machine Shoulder Press', 'shoulders', ['triceps'], 'machine', 'vertical-push', 'compound', 120,
    'Set the seat so the handles start around shoulder height. Press overhead and lower under control.',
    ['seated_db_shoulder_press']],
  ['lateral_raise', 'Lateral Raise', 'shoulders', [], 'dumbbell', 'lateral-raise', 'isolation', 60,
    'Stand tall with a slight forward lean. Raise the dumbbells out to the sides until the arms are about parallel to the floor, leading with the elbows.',
    ['cable_lateral_raise']],

    []],
  // Back
  ['wide_lat_pulldown', 'Wide-Grip Lat Pulldown', 'back', ['biceps'], 'cable', 'vertical-pull', 'compound', 120,
