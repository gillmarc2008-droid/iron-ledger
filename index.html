      const taken = new Set();
      return Models.routine({
        id: r.id, name: r.name, description: r.description, createdAt: t, updatedAt: t,
        exercises: r.items.map(([key, sets, repMin, repMax, rirMin, rirMax, restSec, notes]) => {
          const id = Id.unique('ri', taken);
          taken.add(id);
          return { id, exerciseId: 'ex_' + key, sets, repMin, repMax, rirMin, rirMax, restSec, notes };
        })
      });
    });
    const data = Models.dataset();
    data.exercises = exercises;
    data.routines = routines;
    data.meta.seededAt = t;
    return data;
  }
};


/* =======================================================================
   6. VALIDATION
   The single definition of valid data. Used by the store (every write),
   by import, and by the routine editor (item rules).
   ======================================================================= */
const Validate = {
  /** Rules for a routine item's prescription. Returns [{field, message}]. */
  itemErrors(it) {
    const L = CONFIG.LIMITS;
    const e = [];
    if (!Util.isIntIn(it.sets, L.sets)) e.push({ field: 'sets', message: `Sets must be ${L.sets[0]}–${L.sets[1]}.` });
    const repOk = Util.isIntIn(it.repMin, L.reps) && Util.isIntIn(it.repMax, L.reps);
    if (!repOk) e.push({ field: 'reps', message: `Reps must be whole numbers from ${L.reps[0]} to ${L.reps[1]}.` });
    else if (it.repMin > it.repMax) e.push({ field: 'reps', message: 'Minimum reps cannot be higher than maximum reps.' });
    const rirOk = Util.isIntIn(it.rirMin, L.rir) && Util.isIntIn(it.rirMax, L.rir);
    if (!rirOk) e.push({ field: 'rir', message: `RIR must be whole numbers from ${L.rir[0]} to ${L.rir[1]}.` });
    else if (it.rirMin > it.rirMax) e.push({ field: 'rir', message: 'Minimum RIR cannot be higher than maximum RIR.' });
    if (!Util.isIntIn(it.restSec, L.restSec)) e.push({ field: 'rest', message: 'Rest time is out of range.' });
    return e;
  },

  /** Whole-dataset integrity check. Returns an array of messages (empty = valid). */
  dataset(d) {
    const e = [];
    if (!d || typeof d !== 'object' || Array.isArray(d)) return ['Data is not an object.'];
    if (!Number.isInteger(d.schemaVersion) || d.schemaVersion < 1) e.push('Missing or invalid schemaVersion.');
    if (!d.meta || typeof d.meta !== 'object') e.push('Missing meta section.');
    if (!d.settings || typeof d.settings !== 'object') e.push('Missing settings.');
    else {
      if (!Tax.has('units', d.settings.units)) e.push('Invalid units setting.');
      if (!Tax.has('themes', d.settings.theme)) e.push('Invalid theme setting.');
      if (!Tax.has('weekStarts', d.settings.weekStart)) e.push('Invalid week-start setting.');
      if (d.schemaVersion >= 3) {
        if (!Tax.has('rirDisplays', d.settings.rirDisplay)) e.push('Invalid RIR display setting.');
        if (!Tax.has('restModes', d.settings.restMode)) e.push('Invalid rest behaviour setting.');
        if (!Util.isIntIn(d.settings.defaultRestSec, [15, 600])) e.push('Invalid default rest setting.');
        if (typeof d.settings.restAlerts !== 'boolean') e.push('Invalid rest alert setting.');
      }
    }
    if (d.schemaVersion >= 4) {
      Validate.body(d.body).forEach((m) => e.push(m));
      Validate.photos(d.photos).forEach((m) => e.push(m));
    }
    if (d.schemaVersion >= 3) {
      Validate.goals(d.goals).forEach((m) => e.push(m));
      Validate.schedule(d.schedule).forEach((m) => e.push(m));
      if (!Array.isArray(d.routineReviews)) e.push('Missing routine review list.');
    }
    if (!Array.isArray(d.exercises)) e.push('Missing exercise list.');
    if (!Array.isArray(d.routines)) e.push('Missing routine list.');
    if (!Array.isArray(d.sessions)) e.push('Missing workout history list.');
    if (e.length) return e;

    const sessionIds = new Set();
    d.sessions.forEach((ws) => {
      if (ws && typeof ws.id === 'string') {
        if (sessionIds.has(ws.id)) e.push(`Duplicate workout id: ${ws.id}.`);
        sessionIds.add(ws.id);
      }
      Validate.session(ws, 'completed').forEach((m) => e.push(m));
    });

    const exIds = new Set();
    d.exercises.forEach((x, i) => {
      const label = `Exercise ${i + 1}`;
      if (!x || typeof x !== 'object') { e.push(`${label} is not an object.`); return; }
      if (typeof x.id !== 'string' || !x.id) e.push(`${label} has no id.`);
      else if (exIds.has(x.id)) e.push(`Duplicate exercise id: ${x.id}.`);
      else exIds.add(x.id);
      if (typeof x.name !== 'string' || !x.name.trim()) e.push(`${label} has no name.`);
      if (!Tax.has('muscles', x.primaryMuscle)) e.push(`${label} has an unknown primary muscle.`);
      if (!Tax.has('equipment', x.equipment)) e.push(`${label} has unknown equipment.`);
      if (!Tax.has('preferences', x.preference)) e.push(`${label} has an invalid preference.`);
      if (!Array.isArray(x.secondaryMuscles)) e.push(`${label} has invalid secondary muscles.`);
    });

    const rtIds = new Set();
    d.routines.forEach((r, i) => {
      const label = r && r.name ? `Routine "${r.name}"` : `Routine ${i + 1}`;
      if (!r || typeof r !== 'object') { e.push(`${label} is not an object.`); return; }
      if (typeof r.id !== 'string' || !r.id) e.push(`${label} has no id.`);
      else if (rtIds.has(r.id)) e.push(`Duplicate routine id: ${r.id}.`);
      else rtIds.add(r.id);
      if (typeof r.name !== 'string' || !r.name.trim()) e.push(`${label} has no name.`);
      if (!Array.isArray(r.exercises)) { e.push(`${label} has no exercise list.`); return; }
      const itemIds = new Set();
      r.exercises.forEach((it, j) => {
        if (!it || typeof it !== 'object') { e.push(`${label}, item ${j + 1} is invalid.`); return; }
        if (typeof it.id !== 'string' || !it.id || itemIds.has(it.id)) e.push(`${label}, item ${j + 1} has a missing or duplicate id.`);
        else itemIds.add(it.id);
        if (!exIds.has(it.exerciseId)) e.push(`${label}, item ${j + 1} references an exercise that does not exist.`);
        Validate.itemErrors(it).forEach((err) => e.push(`${label}, item ${j + 1}: ${err.message}`));
      });
    });
    return e;
  },

  /**
   * One workout session (active or completed). Lenient about references
   * (an exercise or routine may have been deleted since) because sessions
   * carry their own snapshots; strict about structure and logged values.
   */
  session(s, expectStatus) {
    const e = [];
    if (!s || typeof s !== 'object' || Array.isArray(s)) return ['Workout record is not an object.'];
    const label = `Workout "${s.sourceRoutineName || s.id || '?'}"`;
    const isTime = (v) => typeof v === 'string' && !isNaN(Date.parse(v));
    if (typeof s.id !== 'string' || !s.id) e.push(`${label} has no id.`);
    if (s.status !== expectStatus) e.push(`${label} has status "${s.status}", expected "${expectStatus}".`);
    if (!isTime(s.startedAt)) e.push(`${label} has no valid start time.`);
    if (expectStatus === 'completed' && !isTime(s.completedAt)) e.push(`${label} has no valid finish time.`);
    if (!Array.isArray(s.exercises)) { e.push(`${label} has no exercise list.`); return e; }
    const L = CONFIG.LIMITS;
    const ids = new Set();
    s.exercises.forEach((x, i) => {
      const xl = `${label}, exercise ${i + 1}`;
      if (!x || typeof x !== 'object') { e.push(`${xl} is invalid.`); return; }
      if (typeof x.id !== 'string' || !x.id || ids.has(x.id)) e.push(`${xl} has a missing or duplicate id.`);
      else ids.add(x.id);
      if (typeof x.nameSnapshot !== 'string') e.push(`${xl} has no name snapshot.`);
      if (!Array.isArray(x.sets)) { e.push(`${xl} has no set list.`); return; }
      x.sets.forEach((st, j) => {
        const sl = `${xl}, set ${j + 1}`;
        if (!st || typeof st !== 'object') { e.push(`${sl} is invalid.`); return; }
        if (typeof st.id !== 'string' || !st.id || ids.has(st.id)) e.push(`${sl} has a missing or duplicate id.`);
        else ids.add(st.id);
        if (!CONFIG.SET_TYPES.includes(st.type)) e.push(`${sl} has an unknown type.`);
        if (st.weightKg !== null && !(typeof st.weightKg === 'number' && isFinite(st.weightKg) && st.weightKg >= L.weightKg[0] && st.weightKg <= L.weightKg[1])) e.push(`${sl} has an invalid weight.`);
        if (st.reps !== null && !Util.isIntIn(st.reps, L.loggedReps)) e.push(`${sl} has invalid reps.`);
        if (st.rir !== null && !Util.isIntIn(st.rir, L.loggedRir)) e.push(`${sl} has an invalid RIR.`);
        if (typeof st.completed !== 'boolean') e.push(`${sl} has no completion state.`);
      });
    });
    return e;
  },

  body(b) {
    const e = [];
    if (!b || !Array.isArray(b.entries)) return ['Missing body measurements.'];
    const ids = new Set();
    const keys = Tax.ids('bodyMetrics');
    b.entries.forEach((en, i) => {
      if (!en || typeof en.id !== 'string' || ids.has(en.id)) { e.push(`Body entry ${i + 1} has a missing or duplicate id.`); return; }
      ids.add(en.id);
      if (!DateKey.isKey(en.date)) e.push(`Body entry ${i + 1} has an invalid date.`);
      if (!en.values || typeof en.values !== 'object') { e.push(`Body entry ${i + 1} has no values.`); return; }
      const vals = Object.entries(en.values);
      if (!vals.length) e.push(`Body entry ${i + 1} is empty.`);
      vals.forEach(([k, v]) => {
        if (!keys.includes(k)) e.push(`Body entry ${i + 1} has an unknown measurement.`);
        else if (!(typeof v === 'number' && isFinite(v) && v > 0 && v <= 500)) e.push(`Body entry ${i + 1} has an invalid ${k}.`);
      });
    });
    return e;
  },

  photos(list) {
    const e = [];
    if (!Array.isArray(list)) return ['Missing photo list.'];
    const ids = new Set();
    list.forEach((ph, i) => {
      if (!ph || typeof ph.id !== 'string' || ids.has(ph.id)) { e.push(`Photo ${i + 1} has a missing or duplicate id.`); return; }
      ids.add(ph.id);
      if (!DateKey.isKey(ph.date)) e.push(`Photo ${i + 1} has an invalid date.`);
      if (!Tax.has('poses', ph.pose)) e.push(`Photo ${i + 1} has an invalid pose.`);
      if (!Tax.has('clothing', ph.clothing)) e.push(`Photo ${i + 1} has an invalid clothing category.`);
    });
    return e;
  },

  goals(g) {
    const e = [];
    if (!g || typeof g !== 'object') return ['Missing goals.'];
    const num = (v) => v === null || (typeof v === 'number' && isFinite(v) && v >= 0);
    if (!num(g.bodyweightKg) || (g.bodyweightKg != null && g.bodyweightKg > 500)) e.push('Invalid bodyweight goal.');
    if (!num(g.bodyFatPct) || (g.bodyFatPct != null && g.bodyFatPct > 75)) e.push('Invalid body-fat goal.');
    if (g.workoutsPerWeek !== null && !Util.isIntIn(g.workoutsPerWeek, [1, 7])) e.push('Invalid training-frequency goal.');
    if (!Array.isArray(g.strength)) return e.concat('Invalid strength goal list.');
    const ids = new Set();
    g.strength.forEach((sg, i) => {
      if (!sg || typeof sg.id !== 'string' || ids.has(sg.id)) e.push(`Strength goal ${i + 1} has a missing or duplicate id.`);
      else ids.add(sg.id);
      if (!sg || typeof sg.exerciseId !== 'string') e.push(`Strength goal ${i + 1} has no exercise.`);
      if (!sg || !(typeof sg.targetWeightKg === 'number' && sg.targetWeightKg > 0 && sg.targetWeightKg <= CONFIG.LIMITS.weightKg[1])) e.push(`Strength goal ${i + 1} has an invalid weight.`);
      if (sg && sg.targetReps !== null && !Util.isIntIn(sg.targetReps, [1, 100])) e.push(`Strength goal ${i + 1} has invalid reps.`);
      if (sg && sg.targetDate !== null && !DateKey.isKey(sg.targetDate)) e.push(`Strength goal ${i + 1} has an invalid date.`);
    });
    return e;
  },

  schedule(sc) {
    const e = [];
    if (!sc || typeof sc !== 'object' || !sc.plan || typeof sc.plan !== 'object') return ['Missing schedule.'];
    Tax.ids('weekdays').forEach((k) => { if (!Array.isArray(sc.plan[k]) || sc.plan[k].some((x) => typeof x !== 'string')) e.push(`Invalid weekly plan for ${k}.`); });
    if (!Array.isArray(sc.entries)) return e.concat('Missing schedule entries.');
    const ids = new Set();
    const statuses = ['planned', 'completed', 'skipped', 'moved', 'removed'];
    sc.entries.forEach((en, i) => {
      if (!en || typeof en.id !== 'string' || ids.has(en.id)) { e.push(`Schedule entry ${i + 1} has a missing or duplicate id.`); return; }
      ids.add(en.id);
      if (!DateKey.isKey(en.date)) e.push(`Schedule entry ${i + 1} has an invalid date.`);
      if (!statuses.includes(en.status)) e.push(`Schedule entry ${i + 1} has an invalid status.`);
      if (typeof en.routineId !== 'string') e.push(`Schedule entry ${i + 1} has no routine.`);
    });
    return e;
  },

  /** Checks the outer backup envelope before looking at the data inside. */
  backupEnvelope(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return ['The file does not contain a JSON object.'];
    if (obj.kind !== CONFIG.BACKUP_KIND) return ['This file is not an Iron Ledger backup.'];
    if (!obj.data || typeof obj.data !== 'object') return ['The backup contains no data.'];
    if (!Number.isInteger(obj.data.schemaVersion)) return ['The backup has no schema version.'];
    if (obj.data.schemaVersion > CONFIG.SCHEMA_VERSION) {
      return [`The backup uses schema v${obj.data.schemaVersion}, which is newer than this app (v${CONFIG.SCHEMA_VERSION}). Update the app before importing.`];
    }
    return [];
  }
};


/* =======================================================================
   7. MIGRATIONS
   Each entry upgrades data FROM that version to version + 1.
   Never change stored shapes without adding a migration here.

   v1 -> v2 (Alpha 2): adds `sessions: []` for completed workouts.
   v2 -> v3 (Alpha 3): adds `goals`, `schedule`, `routineReviews` and four
   settings with defaults. Sessions, routines and exercises are untouched.
   v3 -> v4 (2.0): adds `body.entries`, `photos` (metadata only), the
   `photoGuide` setting and `weightIncrementKg: null` on every exercise.
   Before any upgrade write, the untouched JSON is kept under
   ironLedger.v2.premigration.schema<N>.
   ======================================================================= */
const Migrations = {
  steps: {
    1: (d) => {
      d.sessions = Array.isArray(d.sessions) ? d.sessions : [];
      d.schemaVersion = 2;
      if (d.meta && typeof d.meta === 'object') d.meta.migratedToV2At = Util.now();
      return d;
    },
    2: (d) => {
      d.settings = Models.settings(d.settings || {});
      d.goals = Models.goals(d.goals || {});
      d.schedule = Models.schedule(d.schedule || {});
      d.routineReviews = Array.isArray(d.routineReviews) ? d.routineReviews : [];
      d.schemaVersion = 3;
      if (d.meta && typeof d.meta === 'object') d.meta.migratedToV3At = Util.now();
      return d;
    },
    3: (d) => {
      d.exercises = d.exercises.map((x) => ({ ...x, weightIncrementKg: typeof x.weightIncrementKg === 'number' ? x.weightIncrementKg : null }));
      d.settings = Models.settings(d.settings || {});
      d.body = d.body && Array.isArray(d.body.entries) ? d.body : { entries: [] };
      d.photos = Array.isArray(d.photos) ? d.photos : [];
      d.schemaVersion = 4;
      if (d.meta && typeof d.meta === 'object') d.meta.migratedToV4At = Util.now();
      return d;
    }
  },
  run(data) {
    let d = data;
    while (d.schemaVersion < CONFIG.SCHEMA_VERSION) {
      const step = this.steps[d.schemaVersion];
      if (!step) throw new AppError(`No migration exists from schema v${d.schemaVersion}.`);
      d = step(Util.clone(d));
    }
    return d;
  }
};


/* =======================================================================
   8. STORAGE SERVICE
   The ONLY module allowed to touch localStorage. Swapping to IndexedDB or a
   cloud backend later means replacing this object, nothing else.
   ======================================================================= */
const StorageService = {
  available() {
    try {
      const k = 'ironLedger.v2.__probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (_) { return false; }
  },
  /** @returns {{status:'empty'|'ok'|'corrupt', value?:any, raw?:string}} */
  loadData() {
    const raw = localStorage.getItem(CONFIG.KEYS.DATA);
    if (raw == null) return { status: 'empty' };
    try { return { status: 'ok', value: JSON.parse(raw), raw }; }
    catch (_) { return { status: 'corrupt', raw }; }
  },
  saveData(data) {
    try {
      const json = JSON.stringify(data);
      localStorage.setItem(CONFIG.KEYS.DATA, json);
      return { ok: true, bytes: json.length };
    } catch (error) { return { ok: false, error }; }
  },
  clearData() { localStorage.removeItem(CONFIG.KEYS.DATA); },

  /* The in-progress workout lives under its own key so the frequent
     (every edit) saves stay small and never rewrite completed history. */
  loadActive() {
    const raw = localStorage.getItem(CONFIG.KEYS.ACTIVE_WORKOUT);
    if (raw == null) return { status: 'empty' };
    try { return { status: 'ok', value: JSON.parse(raw), raw }; }
    catch (_) { return { status: 'corrupt', raw }; }
  },
  saveActive(session) {
    try {
      localStorage.setItem(CONFIG.KEYS.ACTIVE_WORKOUT, JSON.stringify(session));
      return { ok: true };
    } catch (error) { return { ok: false, error }; }
  },
  clearActive() { try { localStorage.removeItem(CONFIG.KEYS.ACTIVE_WORKOUT); } catch (_) { /* ignore */ } },
  /** Writes a copy once (never overwrites an existing copy). */
  keepCopyOnce(key, raw) {
    try { if (localStorage.getItem(key) == null) localStorage.setItem(key, raw); return true; } catch (_) { return false; }
  },
  /** Preserves unreadable data instead of silently discarding it. */
  keepRecoveryCopy(raw) {
    const key = CONFIG.KEYS.RECOVERY_PREFIX + Clock.date().toISOString().replace(/[:.]/g, '-');
    try { localStorage.setItem(key, raw); return key; } catch (_) { return null; }
  },
  dataSize() {
    const raw = localStorage.getItem(CONFIG.KEYS.DATA);
    return raw ? raw.length : 0;
  }
};


/* =======================================================================
   9. STORE
   Holds the in-memory dataset. Every change goes through transact():
     clone -> mutate the clone -> validate -> persist -> swap in.
   If validation or saving fails, the previous state is untouched, so the
   in-memory and stored data can never diverge.
   ======================================================================= */
const Store = (() => {
  let data = null;
  let active = null;      // the in-progress workout session, or null
  let persistent = true;
  const notices = [];

  function persistActive(a) {
    if (!persistent) return;
    const r = StorageService.saveActive(a);
    if (!r.ok) throw new AppError('Could not save your workout. Device storage may be full. Your last saved state is unchanged.');
  }

  /** Loads the in-progress workout, if any, AFTER the main data is ready. */
  function initActive() {
    const res = StorageService.loadActive();
    if (res.status === 'empty') return;
    if (res.status === 'corrupt') {
      const key = StorageService.keepRecoveryCopy(res.raw);
      StorageService.clearActive();
      notices.push(`An in-progress workout could not be read.${key ? ` A copy was preserved under "${key}".` : ''}`);
      return;
    }
    const a = res.value;
    // Finishing writes history FIRST, then clears the active key. If the page
    // closed between those two steps, the workout is already safe in history.
    if (a && data.sessions.some((ws) => ws.id === a.id)) { StorageService.clearActive(); return; }
    const errors = Validate.session(a, 'active');
    if (errors.length) {
      const key = StorageService.keepRecoveryCopy(res.raw);
      StorageService.clearActive();
      notices.push(`An in-progress workout was damaged and could not be resumed (${errors[0]})${key ? ` A copy was preserved under "${key}".` : ''}`);
      return;
    }
    active = a;
  }

  function persist(d) {
    if (!persistent) return;
    const r = StorageService.saveData(d);
    if (!r.ok) throw new AppError('Could not save. Device storage may be full or blocked. Your previous data is unchanged.');
  }

  function recover(raw, reason) {
    const key = StorageService.keepRecoveryCopy(raw);
    data = Seed.build();
    persist(data);
    notices.push(`${reason} ${key ? `The unreadable data was preserved under the key "${key}". ` : ''}Sample data has been loaded.`);
  }

  function init() {
    if (!StorageService.available()) {
      persistent = false;
      data = Seed.build();
      notices.push('This browser is blocking local storage. Changes will be lost when you close the page.');
      return;
    }
    const res = StorageService.loadData();
    if (res.status === 'empty') {               // first run: seed exactly once
      data = Seed.build();
      persist(data);
      return;
    }
    if (res.status === 'corrupt') { recover(res.raw, 'Saved data could not be read.'); return; }

    const stored = res.value;
    if (stored && Number.isInteger(stored.schemaVersion) && stored.schemaVersion > CONFIG.SCHEMA_VERSION) {
      // Data from a newer build: never overwrite it. Run read-only on sample data.
      persistent = false;
      data = Seed.build();
      notices.push('Saved data comes from a newer version of Iron Ledger and was left untouched. Changes here will not be saved.');
      return;
    }
    try {
      if (stored && Number.isInteger(stored.schemaVersion) && stored.schemaVersion < CONFIG.SCHEMA_VERSION) {
        StorageService.keepCopyOnce(CONFIG.KEYS.PREMIGRATION_PREFIX + stored.schemaVersion, res.raw);
      }
      const migrated = Migrations.run(stored);
      const errors = Validate.dataset(migrated);
      if (errors.length) { recover(res.raw, `Saved data failed an integrity check (${errors[0]})`); return; }
      data = migrated;
      if (migrated !== stored) persist(data); // only write when a migration changed something
    } catch (err) {
      recover(res.raw, `Saved data could not be upgraded (${err.message}).`);
    }
    if (persistent) initActive();
  }

  function transact(mutator) {
    const draft = Util.clone(data);
    const result = mutator(draft);
    draft.meta.updatedAt = Util.now();
    const errors = Validate.dataset(draft);
    if (errors.length) {
      console.error('Integrity check failed', errors);
      throw new AppError('That change was blocked because it would make your data inconsistent.', errors);
    }
    persist(draft);
    data = draft;
    return result;
  }

  /** Replaces the entire dataset AND the active workout (import / reset). */
  function replace(next, nextActive = null) {
    const errors = Validate.dataset(next);
    if (nextActive) errors.push(...Validate.session(nextActive, 'active'));
    if (errors.length) throw new AppError('The data is not valid and was not loaded.', errors);
    persist(next);
    if (nextActive) persistActive(nextActive);
    else if (persistent) StorageService.clearActive();
    data = next;
    active = nextActive;
  }

  /* ---------- active workout ---------- */
  function beginActive(session) {
    if (active) throw new AppError('A workout is already in progress.');
    const errors = Validate.session(session, 'active');
    if (errors.length) throw new AppError('The workout could not be started.', errors);
    persistActive(session);
    active = session;
  }

  /** Same clone -> mutate -> validate -> persist -> swap pattern as transact(). */
  function activeTransact(mutator) {
    if (!active) throw new AppError('No workout is in progress.');
    const draft = Util.clone(active);
    const result = mutator(draft);
    const errors = Validate.session(draft, 'active');
    if (errors.length) {
      console.error('Workout integrity check failed', errors);
      throw new AppError('That change was blocked because it would damage the workout record.', errors);
    }
    persistActive(draft);
    active = draft;
    return result;
  }

  /**
   * Transaction-like completion:
   *   1. write the completed session into history (durable),
   *   2. only then remove the active workout.
   * A crash between 1 and 2 is repaired by initActive().
   */
  function commitActive(completed, alsoInSameTransaction) {
    transact((d) => {
      if (!d.sessions.some((ws) => ws.id === completed.id)) d.sessions.push(completed);
      if (alsoInSameTransaction) alsoInSameTransaction(d); // e.g. mark the schedule entry completed
    });
    if (persistent) StorageService.clearActive();
    active = null;
  }

  function discardActive() {
    if (persistent) StorageService.clearActive();
    active = null;
  }

  return {
    init,
    transact,
    replace,
    beginActive,
    activeTransact,
    commitActive,
    discardActive,
    getActive: () => active,
    get: () => data,
    isPersistent: () => persistent,
    takeNotices: () => notices.splice(0)
  };
})();


/* =======================================================================
   10. CALCULATIONS
   Rule 4: one implementation per metric. UI code must call these and never
   re-derive counts itself. Completed-session metrics will live here too.
   ======================================================================= */
const Calc = {
  routineExerciseCount(routine) {
    return routine.exercises.length;
  },
  /** Alpha 1 routines prescribe working sets only (warm-ups come with sessions). */
  routineWorkingSets(routine) {
    return routine.exercises.reduce((sum, it) => sum + (Number.isInteger(it.sets) ? it.sets : 0), 0);
  },
  /**
   * Primary muscles ranked by prescribed working sets.
   * Ties keep the order in which muscles first appear in the routine.
   */
  routineMuscleFocus(routine, getExercise, limit = 3) {
    const tally = new Map();
    routine.exercises.forEach((it) => {
      const ex = getExercise(it.exerciseId);
      if (!ex) return;
      tally.set(ex.primaryMuscle, (tally.get(ex.primaryMuscle) || 0) + (Number.isInteger(it.sets) ? it.sets : 0));
    });
    return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit).map(([m]) => m);
  },
  /* ---------- workout sessions (single source for every session metric) ----------
     Definitions used everywhere:
       working set  = any set whose type is NOT warm-up (working, drop, failure)
       volume       = weightKg × reps over COMPLETED working sets only
       duration     = completedAt (or now) − startedAt, from timestamps        */
  isWorkingSet(set) { return set.type !== 'warmup'; },

  setVolumeKg(set) {
    if (!set.completed || !Calc.isWorkingSet(set)) return 0;
    if (typeof set.weightKg !== 'number' || !Number.isInteger(set.reps)) return 0;
    return set.weightKg * set.reps;
  },

  sessionDurationSec(session, now = Clock.now()) {
    const start = Date.parse(session.startedAt);
    const end = session.completedAt ? Date.parse(session.completedAt) : now;
    return Math.max(0, Math.floor((end - start) / 1000));
  },

  sessionStats(session) {
    let workingSets = 0;
    let warmupSets = 0;
    let incompleteSets = 0;
    let volumeKg = 0;
    session.exercises.forEach((x) => x.sets.forEach((st) => {
      if (!st.completed) { incompleteSets++; return; }
      if (Calc.isWorkingSet(st)) workingSets++; else warmupSets++;
      volumeKg += Calc.setVolumeKg(st);
    }));
    return { workingSets, warmupSets, incompleteSets, volumeKg, durationSec: Calc.sessionDurationSec(session) };
  },

  /** Display labels: warm-ups "W", drops "D", failure "F", working sets numbered 1..n. */
  setLabels(sets) {
    let n = 0;
    return sets.map((st) => {
      if (st.type === 'warmup') return 'W';
      if (st.type === 'drop') return 'D';
      if (st.type === 'failure') return 'F';
      n += 1;
      return String(n);
    });
  },

  /**
   * Most recent COMPLETED session (excluding `excludeId`) in which this exercise
   * id was actually performed, with its completed sets. Follows the exercise,
   * not the routine. Active sessions are never in this list.
   */
  previousPerformance(sessions, exerciseId, excludeId = null) {
    let best = null;
    sessions.forEach((ws) => {
      if (ws.status !== 'completed' || ws.id === excludeId) return;
      const sets = [];
      ws.exercises.forEach((x) => {
        if (x.performedExerciseId === exerciseId) x.sets.forEach((st) => { if (st.completed) sets.push(st); });
      });
      if (!sets.length) return;
      if (!best || Date.parse(ws.completedAt) > Date.parse(best.session.completedAt)) best = { session: ws, sets };
    });
    return best;
  },

  /** Matches a set to the previous session's set of the same type and position. */
  previousSetFor(prev, sets, set) {
    if (!prev) return null;
    const ordinal = sets.filter((st) => st.type === set.type).indexOf(set);
    const same = prev.sets.filter((st) => st.type === set.type);
    return same[ordinal] || null;
  },

  restRemainingSec(timer, now = Clock.now()) {
    if (!timer || !timer.endsAt) return 0;
    return Math.max(0, Math.ceil((Date.parse(timer.endsAt) - now) / 1000));
  },

  /** Totals for completed sessions whose start falls in [from, to). */
  periodStats(sessions, from, to) {
    const out = { workouts: 0, workingSets: 0, volumeKg: 0, durationSec: 0, muscles: {}, prs: 0, avgDurationSec: 0 };
    sessions.forEach((ws) => {
      if (ws.status !== 'completed') return;
      const t = Date.parse(ws.startedAt);
      if ((from && t < from.getTime()) || (to && t >= to.getTime())) return;
      const st = Calc.sessionStats(ws);
      out.workouts++;
      out.workingSets += st.workingSets;
      out.volumeKg += st.volumeKg;
      out.durationSec += st.durationSec;
      ws.exercises.forEach((x) => {
        const n = x.sets.filter((s) => s.completed && Calc.isWorkingSet(s)).length;
        if (n && x.primaryMuscleSnapshot) out.muscles[x.primaryMuscleSnapshot] = (out.muscles[x.primaryMuscleSnapshot] || 0) + n;
      });
    });
    const ids = new Set(sessions.filter((ws) => {
      const t = Date.parse(ws.startedAt);
      return ws.status === 'completed' && !((from && t < from.getTime()) || (to && t >= to.getTime()));
    }).map((ws) => ws.id));
    out.prs = Calc.prTimeline(sessions).filter((p) => ids.has(p.sessionId)).length;
    out.avgDurationSec = out.workouts ? Math.round(out.durationSec / out.workouts) : 0;
    return out;
  },

  /* ---------- strength: ONE estimated-1RM formula (Epley) ----------
     e1RM = weight × (1 + reps / 30), only for weighted sets of 1–12 reps. */
  e1rm(weightKg, reps) {
    if (typeof weightKg !== 'number' || weightKg <= 0 || !Number.isInteger(reps) || reps < 1 || reps > CONFIG.E1RM_MAX_REPS) return null;
    return reps === 1 ? weightKg : weightKg * (1 + reps / 30);
  },

  /** Completed working sets of one exercise in one session (substitutions count for the PERFORMED exercise). */
  workingSetsOf(ws, exerciseId) {
    const out = [];
    ws.exercises.forEach((x) => {
      if (x.performedExerciseId === exerciseId) x.sets.forEach((st) => { if (st.completed && Calc.isWorkingSet(st) && Number.isInteger(st.reps)) out.push(st); });
    });
    return out;
  },

  /**
   * THE PR engine. Walks completed sessions in order and records when a set
   * beats the exercise's previous best. Categories:
   *   weight -> heaviest weight lifted
   *   reps   -> more reps than ever at that weight or heavier
   *   e1rm   -> best estimated 1RM (Epley)
   *   volume -> best single-set weight × reps
   * Warm-ups and incomplete sets never count. A first-ever performance sets
   * the baseline and is not a PR. Each exercise yields at most ONE PR per
   * session (lead category: weight > e1RM > reps > volume; others in `kinds`).
   */
  prTimeline(sessions) {
    if (Calc._prCache && Calc._prCache.src === sessions) return Calc._prCache.out;
    const out = [];
    const best = new Map(); // exerciseId -> { weight, e1rm, volume, sets: [{w, r}] }
    sessions.filter((ws) => ws.status === 'completed').slice().sort((a, b) => Date.parse(a.startedAt) - Date.parse(b.startedAt)).forEach((ws) => {
      const perEx = new Map();
      ws.exercises.forEach((x) => {
        const list = perEx.get(x.performedExerciseId) || { name: x.nameSnapshot, sets: [] };
        x.sets.forEach((st) => { if (st.completed && Calc.isWorkingSet(st) && Number.isInteger(st.reps) && st.reps > 0) list.sets.push(st); });
        perEx.set(x.performedExerciseId, list);
      });
      perEx.forEach(({ name, sets }, exId) => {
        if (!sets.length) return;
        const prev = best.get(exId);
        const w = (st) => (typeof st.weightKg === 'number' ? st.weightKg : 0);
        if (prev) {
          const found = {};
          const consider = (kind, value, st, previous) => { if (!found[kind] || value > found[kind].value) found[kind] = { value, st, previous }; };
          sets.forEach((st) => {
            if (w(st) > 0 && w(st) > prev.weight + 1e-9) consider('weight', w(st), st, prev.weight);
            const e = Calc.e1rm(st.weightKg, st.reps);
            if (e && e > prev.e1rm + 1e-9) consider('e1rm', e, st, prev.e1rm);
            const v = w(st) * st.reps;
            if (v > 0 && v > prev.volume + 1e-9) consider('volume', v, st, prev.volume);
            const repsBefore = Math.max(0, ...prev.sets.filter((p) => p.w >= w(st) - 1e-9).map((p) => p.r));
            if (repsBefore > 0 && st.reps > repsBefore) consider('reps', st.reps, st, repsBefore);
          });
          // One PR per exercise per session: the most meaningful category leads, the rest are listed.
          const kinds = ['weight', 'e1rm', 'reps', 'volume'].filter((k) => found[k]);
          if (kinds.length) {
            const f = found[kinds[0]];
            out.push({
              sessionId: ws.id, date: ws.startedAt, exerciseId: exId, exerciseName: name, kind: kinds[0], kinds,
              value: f.value, previous: f.previous, weightKg: f.st.weightKg, reps: f.st.reps
            });
          }
        }
        const rec = prev || { weight: 0, e1rm: 0, volume: 0, sets: [] };
        sets.forEach((st) => {
          rec.weight = Math.max(rec.weight, w(st));
          rec.e1rm = Math.max(rec.e1rm, Calc.e1rm(st.weightKg, st.reps) || 0);
          rec.volume = Math.max(rec.volume, w(st) * st.reps);
          rec.sets.push({ w: w(st), r: st.reps });
        });
        best.set(exId, rec);
      });
    });
    Calc._prCache = { src: sessions, out };
    return out;
  },

  sessionPRs(sessions, sessionId) { return Calc.prTimeline(sessions).filter((p) => p.sessionId === sessionId); },

  /** Per-session points for one exercise: top weight, best e1RM, volume. */
  exerciseSeries(sessions, exerciseId) {
    return sessions.filter((ws) => ws.status === 'completed').slice().sort((a, b) => Date.parse(a.startedAt) - Date.parse(b.startedAt)).map((ws) => {
      const sets = Calc.workingSetsOf(ws, exerciseId);
      if (!sets.length) return null;
      const weights = sets.map((st) => st.weightKg).filter((x) => typeof x === 'number');
      const e = sets.map((st) => Calc.e1rm(st.weightKg, st.reps)).filter(Boolean);
      const top = sets.slice().sort((p, q) => ((q.weightKg || 0) - (p.weightKg || 0)) || q.reps - p.reps)[0];
      return {
        t: Date.parse(ws.startedAt), sessionId: ws.id, topSet: { weightKg: top.weightKg, reps: top.reps },
        weight: weights.length ? Math.max(...weights) : null,
        e1rm: e.length ? Math.max(...e) : null,
        volume: sets.reduce((v, st) => v + Calc.setVolumeKg(st), 0) || null,
        reps: Math.max(...sets.map((st) => st.reps))
      };
    }).filter(Boolean);
  },

  /** All-time records for one exercise (null fields when not applicable). */
  exerciseRecords(sessions, exerciseId) {
    let heaviest = null; let mostReps = null; let bestVolume = null; let bestE1rm = null;
    sessions.forEach((ws) => {
      if (ws.status !== 'completed') return;
      Calc.workingSetsOf(ws, exerciseId).forEach((st) => {
        const w = typeof st.weightKg === 'number' ? st.weightKg : null;
        if (w != null && (!heaviest || w > heaviest.weightKg || (w === heaviest.weightKg && st.reps > heaviest.reps))) heaviest = { weightKg: w, reps: st.reps, date: ws.startedAt };
        if (!mostReps || st.reps > mostReps.reps || (st.reps === mostReps.reps && (w || 0) > (mostReps.weightKg || 0))) mostReps = { weightKg: w, reps: st.reps, date: ws.startedAt };
        const v = Calc.setVolumeKg(st);
        if (v > 0 && (!bestVolume || v > bestVolume.volumeKg)) bestVolume = { volumeKg: v, weightKg: w, reps: st.reps, date: ws.startedAt };
        const e = Calc.e1rm(w, st.reps);
        if (e && (!bestE1rm || e > bestE1rm.value)) bestE1rm = { value: e, weightKg: w, reps: st.reps, date: ws.startedAt };
      });
    });
    return { heaviest, mostReps, bestVolume, bestE1rm };
  },

  /* ---------- progression: deterministic double progression ----------
     Looks at the most recent completed session of the PERFORMED exercise.
       INCREASE  every target working set reached the top of the rep range at
                 the top weight, without going below the target RIR.
       REDUCE    most sets fell below the rep range in the last TWO sessions
                 at the same or a heavier weight (one bad day never reduces).
       STAY      everything else; the reason names what to improve.
     The suggestion never changes logged values. */
  incrementFor(exercise) {
    if (!exercise) return null;
    if (typeof exercise.weightIncrementKg === 'number' && exercise.weightIncrementKg > 0) return exercise.weightIncrementKg;
    return CONFIG.DEFAULT_INCREMENT_KG[exercise.equipment] || null;
  },

  recommendation(sessions, sx, increment, excludeId = null) {
    const done = sessions.filter((ws) => ws.status === 'completed' && ws.id !== excludeId)
      .filter((ws) => Calc.workingSetsOf(ws, sx.performedExerciseId).length)
      .sort((a, b) => Date.parse(b.startedAt) - Date.parse(a.startedAt));
    if (!done.length) return null;
    const lo = sx.targetRepMin; const hi = sx.targetRepMax;
    const rirLo = sx.targetRirMin;
    const sets = Calc.workingSetsOf(done[0], sx.performedExerciseId).filter((st) => st.type !== 'drop');
    const weighted = sets.every((st) => typeof st.weightKg === 'number' && st.weightKg > 0);
    const top = weighted ? Math.max(...sets.map((st) => st.weightKg)) : null;
    const atTop = weighted ? sets.filter((st) => Math.abs(st.weightKg - top) < 1e-9) : sets;
    const reps = atTop.map((st) => st.reps);
    const repText = reps.join(', ');
    const fmtW = (kg) => `${Units.fmt(kg)} ${Units.current()}`;
    const tooHard = atTop.filter((st) => st.rir != null && st.rir < rirLo).length;
    const below = atTop.filter((st) => st.reps < lo).length;
    const enoughSets = atTop.length >= Math.max(1, sx.targetSets);
    const allTop = atTop.every((st) => st.reps >= hi);
    if (!weighted) {
      if (enoughSets && allTop) return { action: 'reps', weightKg: null, reason: `You reached ${hi}+ reps on every set (${repText}). Add reps or add load.` };
      return { action: 'stay', weightKg: null, reason: `Last time: ${repText} reps. Aim for ${hi} on every set.` };
    }
    if (enoughSets && allTop && tooHard === 0) {
      if (!increment) return { action: 'stay', weightKg: top, reason: `You reached ${hi} reps on all ${atTop.length} sets (${repText}). Set a weight increment for this exercise to get a load suggestion.` };
      return { action: 'increase', weightKg: top + increment, reason: `You reached ${hi} reps on all ${atTop.length} sets at ${fmtW(top)} (${repText}) within your target RIR.` };
    }
    if (below * 2 > atTop.length) {
      const before = done[1] ? Calc.workingSetsOf(done[1], sx.performedExerciseId).filter((st) => typeof st.weightKg === 'number' && st.weightKg >= top - 1e-9) : [];
      const belowBefore = before.length && before.filter((st) => st.reps < lo).length * 2 > before.length;
      if (belowBefore && increment && top - increment > 0) {
        return { action: 'reduce', weightKg: top - increment, reason: `Most sets fell below ${lo} reps in your last two sessions (last time: ${repText}). A lighter load should bring you back into ${lo}–${hi}.` };
      }
      return { action: 'stay', weightKg: top, reason: `Last time most sets were below ${lo} reps (${repText}). Stay at ${fmtW(top)} and aim for ${lo}–${hi}.` };
    }
    if (enoughSets && allTop && tooHard) {
      return { action: 'stay', weightKg: top, reason: `You reached ${hi} reps (${repText}), but ${Fmt.plural(tooHard, 'set was', 'sets were')} harder than your target RIR. Repeat ${fmtW(top)} before increasing.` };
    }
    if (!enoughSets && allTop) {
      return { action: 'stay', weightKg: top, reason: `You reached ${hi} reps on ${Fmt.plural(atTop.length, 'set')} of ${sx.targetSets}. Complete all ${sx.targetSets} sets at the top of the range before increasing.` };
    }
    return { action: 'stay', weightKg: top, reason: `You reached ${repText} reps last time. Reach ${hi} on all ${sx.targetSets} sets before increasing.` };
  },

  /* ---------- body ---------- */
  bodySeries(entries, metric) {
    return entries.filter((en) => typeof en.values[metric] === 'number')
      .map((en) => ({ t: Calc.bodyTime(en), v: en.values[metric], id: en.id }))
      .sort((a, b) => a.t - b.t);
  },
  bodyTime(en) { return DateKey.toDate(en.date).getTime() + (en.time ? (parseInt(en.time.slice(0, 2), 10) * 60 + parseInt(en.time.slice(3, 5), 10)) * 60000 : 0); },
  latestBody(entries, metric) {
    const s = Calc.bodySeries(entries, metric);
    return s.length ? s[s.length - 1] : null;
  },
  /** First value on/after `from` and last value on/before `to` (keys). Never interpolates. */
  bodyChange(entries, metric, fromKey, toKey) {
    const s = Calc.bodySeries(entries, metric).filter((p) => { const k = DateKey.of(new Date(p.t)); return k >= fromKey && k <= toKey; });
    if (s.length < 2) return null;
    return { from: s[0], to: s[s.length - 1], delta: s[s.length - 1].v - s[0].v };
  },

  periodStart(period, now = Clock.date()) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const back = { '7d': 6, '30d': 29 }[period];
    if (back != null) { d.setDate(d.getDate() - back); return d; }
    if (period === '3m') { d.setMonth(d.getMonth() - 3); return d; }
    if (period === '1y') { d.setFullYear(d.getFullYear() - 1); return d; }
    return null; // all time
  },

  /**
   * Structural differences between a session and its source routine snapshot,
   * identified by ids (routineItemId / session exercise id), never by names.
   * Each change has: key, kind, label (as an action), desc (as a fact), checked (default).
   * Only substitutions the user explicitly marked "Update routine" start checked.
   */
  routineChanges(session) {
    const out = [];
    if (!session || !session.sourceRoutineId) return out;
    session.exercises.forEach((x) => {
      if (x.addedDuringSession) {
        out.push({ key: `add:${x.id}`, kind: 'add', seId: x.id, exerciseId: x.performedExerciseId,
          label: `Add ${x.nameSnapshot}`, desc: `${x.nameSnapshot} added`, checked: false });
        return;
      }
      if (x.substitution && x.performedExerciseId !== x.originalExerciseId) {
        out.push({ key: `replace:${x.id}`, kind: 'replace', seId: x.id, routineItemId: x.routineItemId,
          fromExerciseId: x.originalExerciseId, toExerciseId: x.performedExerciseId,
          label: `Replace ${x.originalNameSnapshot} with ${x.nameSnapshot}`,
          desc: `${x.originalNameSnapshot} → ${x.nameSnapshot}`, checked: !!x.proposeRoutineUpdate });
      }
      const working = x.sets.filter((st) => Calc.isWorkingSet(st)).length;
      if (working > 0 && working !== x.targetSets) {
        out.push({ key: `sets:${x.id}`, kind: 'sets', seId: x.id, routineItemId: x.routineItemId, to: working,
          label: `Change ${x.nameSnapshot} from ${x.targetSets} to ${working} sets`,
          desc: `${x.nameSnapshot}: ${x.targetSets} → ${working} working sets`, checked: false });
      }
    });
    (session.removedExercises || []).forEach((r) => {
      if (!r.routineItemId) return;
      out.push({ key: `remove:${r.routineItemId}`, kind: 'remove', routineItemId: r.routineItemId,
        label: `Remove ${r.nameSnapshot}`, desc: `${r.nameSnapshot} removed`, checked: false });
    });
    const original = session.routineOrderSnapshot || [];
    const nowOrder = session.exercises.map((x) => x.routineItemId).filter((id) => id && original.includes(id));
    const expected = original.filter((id) => nowOrder.includes(id));
    if (nowOrder.join() !== expected.join()) {
      out.push({ key: 'order', kind: 'order', order: nowOrder, label: "Use today's exercise order", desc: 'Exercise order changed', checked: false });
    }
    return out;
  },

  /** Exercises the user replaced because of pain (never suggested again as alternatives). */
  painFlaggedExercises(sessions, active) {
    const out = new Set();
    [...sessions, ...(active ? [active] : [])].forEach((ws) => ws.exercises.forEach((x) => {
      if (x.substitution && x.substitutionReason === 'pain') out.add(x.originalExerciseId);
    }));
    return out;
  },

  /**
   * Deterministic substitution ranking. Candidates must share the primary
   * muscle; then movement pattern, mechanic, secondary muscles, listed
   * alternatives, equipment (relative to the reason) and preference add score.
   * This ranks similarity only. It never judges whether an exercise is safe.
   */
  substitutionCandidates(original, reason, exercises, painFlagged = new Set(), limit = 5) {
    if (!original) return [];
    const wantsOtherEquipment = reason === 'equipmentUnavailable' || reason === 'location';
    return exercises.map((ex) => {
      if (ex.id === original.id || !ex.active || ex.preference === 'do-not-use' || painFlagged.has(ex.id)) return null;
      if (ex.primaryMuscle !== original.primaryMuscle) return null;
      let score = 40;
      const why = [];
      if (ex.movementPattern === original.movementPattern) { score += 30; why.push('same movement'); }
      if (ex.mechanic === original.mechanic) score += 10;
      score += Math.min(15, 5 * ex.secondaryMuscles.filter((m) => original.secondaryMuscles.includes(m)).length);
      if (original.alternativeIds.includes(ex.id)) { score += 25; why.push('listed alternative'); }
      if (wantsOtherEquipment) {
        if (ex.equipment !== original.equipment) { score += 12; why.push(`uses ${Tax.label('equipment', ex.equipment).toLowerCase()}`); }
        else score -= 30;
      }
      if (ex.preference === 'favourite') { score += 8; why.push('favourite'); }
      if (ex.preference === 'avoid') score -= 15;
      return { exercise: ex, score, why };
    }).filter(Boolean).sort((a, b) => b.score - a.score || a.exercise.name.localeCompare(b.exercise.name))
      // "Avoid" exercises are only offered when there are fewer than three other options.
      .filter((c, _i, all) => c.exercise.preference !== 'avoid' || all.filter((o) => o.exercise.preference !== 'avoid').length < 3)
      .slice(0, limit);
  },

  /**
   * Heaviest completed working set for an exercise, optionally requiring at
   * least `minReps` reps. Ties go to more reps, then the earlier date.
   */
  bestSet(sessions, exerciseId, minReps = null) {
    let best = null;
    sessions.forEach((ws) => ws.exercises.forEach((x) => {
      if (x.performedExerciseId !== exerciseId) return;
      x.sets.forEach((st) => {
        if (!st.completed || !Calc.isWorkingSet(st) || typeof st.weightKg !== 'number' || !Number.isInteger(st.reps)) return;
        if (minReps != null && st.reps < minReps) return;
        if (!best || st.weightKg > best.weightKg || (st.weightKg === best.weightKg && st.reps > best.reps)) {
          best = { weightKg: st.weightKg, reps: st.reps, date: ws.startedAt, sessionId: ws.id };
        }
      });
    }));
    return best;
  },

  /** Real per-exercise summary from completed sessions. */
  exerciseSummary(sessions, exerciseId) {
    let count = 0;
    let last = null;
    let bestVolume = null;
    sessions.forEach((ws) => {
      let did = false;
      ws.exercises.forEach((x) => {
        if (x.performedExerciseId !== exerciseId) return;
        x.sets.forEach((st) => {
          if (!st.completed) return;
          did = true;
          const v = Calc.setVolumeKg(st);
          if (v > 0 && (!bestVolume || v > bestVolume.volumeKg)) bestVolume = { volumeKg: v, weightKg: st.weightKg, reps: st.reps };
        });
      });
      if (did) { count++; if (!last || Date.parse(ws.startedAt) > Date.parse(last)) last = ws.startedAt; }
    });
    return { sessions: count, lastPerformed: last, heaviest: Calc.bestSet(sessions, exerciseId), bestVolume };
  },

  /** Calendar week containing `date`, honouring the week-start setting. */
  weekDays(date, weekStart) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const startIdx = weekStart === 'sunday' ? 0 : 1;
    const offset = (d.getDay() - startIdx + 7) % 7;
    const start = new Date(d);
    start.setDate(d.getDate() - offset);
    return Array.from({ length: 7 }, (_, i) => {
      const day = new Date(start);
      day.setDate(start.getDate() + i);
      return day;
    });
  }
};


/* =======================================================================
   11. FORMATTING (display only)
   ======================================================================= */
const Fmt = {
  rest(sec) {
    if (!Number.isInteger(sec)) return '–';
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  },
  range(a, b) {
    if (!Number.isInteger(a) || !Number.isInteger(b)) return '–';
    return a === b ? String(a) : `${a}–${b}`;
  },
  longDate(d) { return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); },
  shortDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); },
  weekdayInitial(d) { return d.toLocaleDateString(undefined, { weekday: 'short' }); },
  plural(n, one, many) { return `${n} ${n === 1 ? one : (many || one + 's')}`; },
  /** RIR target text honouring the "Default RIR display" preference. Display only. */
  rir(min, max) {
    if (!Number.isInteger(min) || !Number.isInteger(max)) return '–';
    return SettingsService.get().rirDisplay === 'single' ? String(max) : Fmt.range(min, max);
  },
  /** Today / Tomorrow / Yesterday / "Thu, Oct 8" for a date key. */
  relDay(key) {
    const diff = DateKey.diffDays(key, DateKey.today());
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return DateKey.toDate(key).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  },
  dayLabel(key) { return DateKey.toDate(key).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' }); },
  /** Elapsed clock: 38:24 or 1:04:12 */
  clock(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
  },
  /** Duration words: 1h 04m, 42m */
  duration(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
  },
  time(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); },
  dayDate(iso) { return new Date(iso).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); },
  monthYear(iso) { return new Date(iso).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); },
  ago(iso) {
    const min = Math.max(0, Math.round((Clock.now() - Date.parse(iso)) / 60000));
    if (min < 1) return 'just now';
    if (min < 60) return `${min} minute${min === 1 ? '' : 's'} ago`;
    const h = Math.floor(min / 60);
    return `${h} hour${h === 1 ? '' : 's'} ${min % 60} min ago`;
  },
  bytes(n) { return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`; },
  sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); },
  /** "Chest, shoulders and triceps" */
  muscleList(ids) {
    const labels = ids.map((id, i) => (i === 0 ? Tax.label('muscles', id) : Tax.label('muscles', id).toLowerCase()));
    if (labels.length <= 1) return labels[0] || 'No exercises yet';
    return `${labels.slice(0, -1).join(', ')} and ${labels[labels.length - 1]}`;
  },
  exerciseMeta(ex) {
    return `${Tax.label('muscles', ex.primaryMuscle)}, ${Tax.label('equipment', ex.equipment).toLowerCase()}`;
  }
};


/* =======================================================================
   11b. UNITS — the ONLY place kg <-> lb conversion happens.
   Stored values are always kilograms. Switching the unit setting changes
   display and input interpretation only; stored history never changes.
   ======================================================================= */
const Units = {
  current() { return SettingsService.get().units; },
  toDisplay(kg, unit = Units.current()) {
    if (typeof kg !== 'number') return null;
    const v = unit === 'lb' ? kg / CONFIG.KG_PER_LB : kg;
    return Math.round(v * 100) / 100;
  },
  fromDisplay(value, unit = Units.current()) {
    const kg = unit === 'lb' ? value * CONFIG.KG_PER_LB : value;
    return Math.round(kg * 1e6) / 1e6;
  },
  /** Accepts "22.5", "22,5" or "22." Returns {empty} | {invalid} | {value}. */
  parse(raw) {
    const s = String(raw == null ? '' : raw).trim().replace(',', '.');
    if (!s) return { empty: true };
    if (!/^\d+(\.\d*)?$/.test(s)) return { invalid: true };
    return { value: parseFloat(s) };
  },
  fmt(kg, unit = Units.current()) {
    const v = Units.toDisplay(kg, unit);
    return v == null ? '' : String(v);
  },
  /* Lengths are stored in cm; the kg/lb preference shows cm or inches. */
  lenUnit(unit = Units.current()) { return unit === 'lb' ? 'in' : 'cm'; },
  lenToDisplay(cm, unit = Units.current()) { return typeof cm === 'number' ? Math.round((unit === 'lb' ? cm / 2.54 : cm) * 10) / 10 : null; },
  lenFromDisplay(v, unit = Units.current()) { return Math.round((unit === 'lb' ? v * 2.54 : v) * 1e4) / 1e4; },
  /** Display any body metric in the user's units. */
  metric(metric, value, unit = Units.current()) {
    if (typeof value !== 'number') return '—';
    const kind = TAXONOMY.bodyMetrics.find((m) => m.id === metric).kind;
    if (kind === 'weight') return `${Math.round(Units.toDisplay(value, unit) * 10) / 10} ${unit}`;
    if (kind === 'pct') return `${Math.round(value * 10) / 10}%`;
    return `${Units.lenToDisplay(value, unit)} ${Units.lenUnit(unit)}`;
  },
  metricDelta(metric, delta, unit = Units.current()) {
    const kind = TAXONOMY.bodyMetrics.find((m) => m.id === metric).kind;
    const sign = delta > 0 ? '+' : delta < 0 ? '−' : '±';
    const a = Math.abs(delta);
    if (kind === 'weight') return `${sign}${Math.round(Units.toDisplay(a, unit) * 10) / 10} ${unit}`;
    if (kind === 'pct') return `${sign}${Math.round(a * 10) / 10} pts`;
    return `${sign}${Units.lenToDisplay(a, unit)} ${Units.lenUnit(unit)}`;
  },
  fmtVolume(kg, unit = Units.current()) {
    const v = unit === 'lb' ? kg / CONFIG.KG_PER_LB : kg;
    return `${Math.round(v).toLocaleString()} ${unit}`;
  }
};


/* =======================================================================
   12. SERVICES
   Business logic. Services read via Store.get() and write via
   Store.transact(); they never touch the DOM or localStorage.
   ======================================================================= */
const ExerciseService = {
  list() { return Store.get().exercises; },
  get(id) { return Store.get().exercises.find((x) => x.id === id) || null; },

  searchText(ex) {
    return Util.normalize([
      ex.name,
      Tax.label('muscles', ex.primaryMuscle),
      ...ex.secondaryMuscles.map((m) => Tax.label('muscles', m)),
      Tax.label('equipment', ex.equipment),
      Tax.label('movements', ex.movementPattern),
      ex.mechanic
    ].join(' '));
  },

  /**
   * Single query implementation shared by the library and the picker.
   * sort 'name'       -> alphabetical (library)
   * sort 'preference' -> favourites first, do-not-use last (picker)
   */
  query({ q = '', muscle = 'all', equipment = 'all', favourites = false, sort = 'name' } = {}) {
    const tokens = Util.normalize(q).split(' ').filter(Boolean);
    const rank = { favourite: 0, neutral: 1, avoid: 2, 'do-not-use': 3 };
    return this.list()
      .filter((x) => x.active)
      .filter((x) => muscle === 'all' || x.primaryMuscle === muscle)
      .filter((x) => equipment === 'all' || x.equipment === equipment)
      .filter((x) => !favourites || x.preference === 'favourite')
      .filter((x) => { if (!tokens.length) return true; const h = this.searchText(x); return tokens.every((t) => h.includes(t)); })
      .sort((a, b) => (sort === 'preference' ? rank[a.preference] - rank[b.preference] : 0) || a.name.localeCompare(b.name));
  },

  nameTaken(name, exceptId) {
    const n = Util.normalize(name);
    return this.list().some((x) => x.id !== exceptId && Util.normalize(x.name) === n);
  },

  validateDraft(draft, exceptId) {
    const errors = {};
    if (!String(draft.name || '').trim()) errors.name = 'Enter a name for the exercise.';
    else if (this.nameTaken(draft.name, exceptId)) errors.name = 'An exercise with this name already exists.';
    return errors;
  },

  create(draft) {
    const errors = this.validateDraft(draft, null);
    if (Object.keys(errors).length) throw new AppError(Object.values(errors)[0]);
    return Store.transact((d) => {
      const taken = new Set(d.exercises.map((x) => x.id));
      const ex = Models.exercise({ ...draft, id: Id.unique('ex', taken), isCustom: true, preference: 'neutral' });
      d.exercises.push(ex);
      return ex.id;
    });
  },

  /** Editable descriptive fields only; id, custom flag, preference and history links are preserved. */
  update(id, draft) {
    const errors = this.validateDraft(draft, id);
    if (Object.keys(errors).length) throw new AppError(Object.values(errors)[0]);
    return Store.transact((d) => {
      const i = d.exercises.findIndex((x) => x.id === id);
      if (i < 0) throw new AppError('This exercise no longer exists.');
      const prev = d.exercises[i];
      d.exercises[i] = Models.exercise({
        ...prev,
        name: draft.name, primaryMuscle: draft.primaryMuscle, secondaryMuscles: draft.secondaryMuscles,
        equipment: draft.equipment, movementPattern: draft.movementPattern, mechanic: draft.mechanic,
        defaultRestSec: draft.defaultRestSec, instructions: draft.instructions, notes: draft.notes,
        machineSettings: draft.machineSettings,
        weightIncrementKg: draft.weightIncrementKg,
        updatedAt: Util.now()
      });
      return id;
    });
  },

  /** Quick edit during a workout (machine settings / personal note). */
  setField(id, field, value) {
    if (!['machineSettings', 'notes'].includes(field)) throw new AppError('Unknown field.');
    Store.transact((d) => {
      const ex = d.exercises.find((x) => x.id === id);
      if (!ex) throw new AppError('This exercise no longer exists.');
      ex[field] = String(value || '').trim();
      ex.updatedAt = Util.now();
    });
  },

  setPreference(id, preference) {
    if (!Tax.has('preferences', preference)) throw new AppError('Unknown preference.');
    Store.transact((d) => {
      const ex = d.exercises.find((x) => x.id === id);
      if (!ex) throw new AppError('This exercise no longer exists.');
      ex.preference = preference;
      ex.updatedAt = Util.now();
    });
  },

  routinesUsing(id) {
    return Store.get().routines.filter((r) => r.exercises.some((it) => it.exerciseId === id));
  }
};

const RoutineService = {
  list() { return Store.get().routines; },
  get(id) { return Store.get().routines.find((r) => r.id === id) || null; },

  nameTaken(name, exceptId) {
    const n = Util.normalize(name);
    return this.list().some((r) => r.id !== exceptId && Util.normalize(r.name) === n);
  },

  newDraft() { return Models.routine({ id: null, name: '', description: '', exercises: [] }); },
  draftFrom(id) { const r = this.get(id); return r ? Util.clone(r) : null; },

  /** @returns {{name:string|null, items:Object<string,Array>, count:number}} */
  validateDraft(draft) {
    const errors = { name: null, items: {}, count: 0 };
    if (!draft.name.trim()) errors.name = 'Enter a name for the routine.';
    else if (this.nameTaken(draft.name, draft.id)) errors.name = 'Another routine already uses this name.';
    draft.exercises.forEach((it) => {
      const e = Validate.itemErrors(it);
      if (e.length) errors.items[it.id] = e;
    });
    errors.count = (errors.name ? 1 : 0) + Object.values(errors.items).reduce((n, list) => n + list.length, 0);
    return errors;
  },

  /** Creates or replaces a routine from an editor draft. Returns the routine id. */
  save(draft) {
    const errors = this.validateDraft(draft);
    if (errors.count) throw new AppError('Fix the highlighted fields before saving.');
    return Store.transact((d) => {
      const t = Util.now();
      const clean = Models.routine({ ...draft, updatedAt: t });
      if (!clean.id) {
        clean.id = Id.unique('rt', new Set(d.routines.map((r) => r.id)));
        clean.createdAt = t;
        d.routines.push(clean);
      } else {
        const i = d.routines.findIndex((r) => r.id === clean.id);
        if (i < 0) throw new AppError('This routine no longer exists.');
        d.routines[i] = clean; // replaced in place so list order is kept
      }
      return clean.id;
    });
  },

  rename(id, name) {
    const trimmed = String(name || '').trim();
    if (!trimmed) throw new AppError('Enter a name for the routine.');
    if (this.nameTaken(trimmed, id)) throw new AppError('Another routine already uses this name.');
    Store.transact((d) => {
      const r = d.routines.find((x) => x.id === id);
      if (!r) throw new AppError('This routine no longer exists.');
      r.name = trimmed;
      r.updatedAt = Util.now();
    });
  },

  copyName(base) {
    let name = `${base} (copy)`;
    let n = 2;
    while (this.nameTaken(name, null)) name = `${base} (copy ${n++})`;
    return name;
  },

  /** Full independent copy: new routine id AND new item ids. Inserted after the original. */
  duplicate(id) {
    const src = this.get(id);
    if (!src) throw new AppError('This routine no longer exists.');
    const name = this.copyName(src.name);
    return Store.transact((d) => {
      const t = Util.now();
      const itemIds = new Set();
      const copy = Models.routine({
        ...Util.clone(src),
        id: Id.unique('rt', new Set(d.routines.map((r) => r.id))),
        name, createdAt: t, updatedAt: t,
        exercises: src.exercises.map((it) => {
          const itemId = Id.unique('ri', itemIds);
          itemIds.add(itemId);
          return { ...it, id: itemId };
        })
      });
      const at = d.routines.findIndex((r) => r.id === id);
      d.routines.splice(at + 1, 0, copy);
      return copy.id;
    });
  },

  /** Deletes the template only. Exercises in the library are never touched. */
  remove(id) {
    Store.transact((d) => {
      const before = d.routines.length;
      d.routines = d.routines.filter((r) => r.id !== id);
      if (d.routines.length === before) throw new AppError('This routine no longer exists.');
      // The plan stops scheduling it; future planned dates are removed. Past entries stay as history.
      Tax.ids('weekdays').forEach((k) => { d.schedule.plan[k] = d.schedule.plan[k].filter((rid) => rid !== id); });
      const today = DateKey.today();
      d.schedule.entries.forEach((en) => {
        if (en.routineId === id && en.status === 'planned' && en.date >= today) { en.status = 'removed'; en.updatedAt = Util.now(); }
      });
    });
  },

  /**
   * Applies the SELECTED review changes to the CURRENT routine template.
   * The completed session is only read, never modified.
   */
  applySessionChanges(sessionId, keys) {
    const ws = Store.get().sessions.find((x) => x.id === sessionId);
    if (!ws) throw new AppError('That workout could not be found.');
    const chosen = Calc.routineChanges(ws).filter((c) => keys.includes(c.key));
    return Store.transact((d) => {
      const r = d.routines.find((rt) => rt.id === ws.sourceRoutineId);
      if (!r) throw new AppError(`${ws.sourceRoutineName} no longer exists, so no changes can be applied.`);
      const applied = [];
      const skipped = [];
      const item = (id) => r.exercises.find((it) => it.id === id);
      const exists = (exId) => d.exercises.some((e) => e.id === exId);
      const byKind = (k) => chosen.filter((c) => c.kind === k);
      byKind('replace').forEach((c) => {
        const it = item(c.routineItemId);
        if (!it || !exists(c.toExerciseId)) { skipped.push(c.key); return; }
        it.exerciseId = c.toExerciseId; applied.push(c.key);
      });
      byKind('sets').forEach((c) => {
        const it = item(c.routineItemId);
        if (!it) { skipped.push(c.key); return; }
        it.sets = Math.max(CONFIG.LIMITS.sets[0], Math.min(CONFIG.LIMITS.sets[1], c.to)); applied.push(c.key);
      });
      byKind('remove').forEach((c) => {
        if (!item(c.routineItemId)) { skipped.push(c.key); return; }
        r.exercises = r.exercises.filter((it) => it.id !== c.routineItemId); applied.push(c.key);
      });
      byKind('order').forEach((c) => {
        const wanted = c.order.filter((id) => item(id));
        const rest = r.exercises.filter((it) => !wanted.includes(it.id));
        r.exercises = [...wanted.map((id) => item(id)), ...rest]; applied.push(c.key);
      });
      byKind('add').forEach((c) => {
        const idx = ws.exercises.findIndex((x) => x.id === c.seId);
        const x = ws.exercises[idx];
        if (!x || !exists(x.performedExerciseId)) { skipped.push(c.key); return; }
        const taken = new Set(r.exercises.map((it) => it.id));
        const working = x.sets.filter((st) => Calc.isWorkingSet(st)).length || x.targetSets;
        const newItem = Models.routineItem({
          id: Id.unique('ri', taken), exerciseId: x.performedExerciseId,
          sets: Math.max(1, Math.min(CONFIG.LIMITS.sets[1], working)),
          repMin: x.targetRepMin, repMax: x.targetRepMax, rirMin: x.targetRirMin, rirMax: x.targetRirMax,
          restSec: x.restSeconds, notes: ''
        });
        // Insert after the nearest earlier session exercise that exists in the routine.
        let at = r.exercises.length;
        for (let i = idx - 1; i >= 0; i--) {
          const pos = r.exercises.findIndex((it) => it.id === ws.exercises[i].routineItemId);
          if (pos >= 0) { at = pos + 1; break; }
        }
        r.exercises.splice(at, 0, newItem); applied.push(c.key);
      });
      r.updatedAt = Util.now();
      d.routineReviews.push({ id: Id.unique('rv', new Set(d.routineReviews.map((v) => v.id))), sessionId, routineId: r.id, outcome: 'applied', appliedKeys: applied, skippedKeys: skipped, at: Util.now() });
      return { applied, skipped };
    });
  },

  keepOriginal(sessionId) {
    const ws = Store.get().sessions.find((x) => x.id === sessionId);
    if (!ws) throw new AppError('That workout could not be found.');
    Store.transact((d) => {
      d.routineReviews.push({ id: Id.unique('rv', new Set(d.routineReviews.map((v) => v.id))), sessionId, routineId: ws.sourceRoutineId, outcome: 'kept', appliedKeys: [], skippedKeys: [], at: Util.now() });
    });
  },

  reviewFor(sessionId) { return Store.get().routineReviews.find((v) => v.sessionId === sessionId) || null; }
};

/** Pure operations on an UNSAVED routine draft held by the editor. */
const RoutineDraft = {
  addExercises(draft, exerciseIds) {
    const taken = new Set(draft.exercises.map((it) => it.id));
    exerciseIds.forEach((exId) => {
      const ex = ExerciseService.get(exId);
      if (!ex) return;
      const id = Id.unique('ri', taken);
      taken.add(id);
      const iso = ex.mechanic === 'isolation';
      draft.exercises.push(Models.routineItem({
        id, exerciseId: ex.id, sets: 3,
        repMin: iso ? 10 : 8, repMax: iso ? 15 : 12,
        rirMin: 1, rirMax: 2, restSec: ex.defaultRestSec
      }));
    });
  },
  remove(draft, itemId) { draft.exercises = draft.exercises.filter((it) => it.id !== itemId); },
  move(draft, itemId, dir) {
    const i = draft.exercises.findIndex((it) => it.id === itemId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= draft.exercises.length) return false;
    const list = draft.exercises;
    [list[i], list[j]] = [list[j], list[i]];
    return true;
  },
  item(draft, itemId) { return draft.exercises.find((it) => it.id === itemId) || null; }
};

const SettingsService = {
  get() { return Store.get().settings; },
  set(key, value) {
    const lists = { units: 'units', theme: 'themes', weekStart: 'weekStarts', rirDisplay: 'rirDisplays', restMode: 'restModes' };
    if (key === 'defaultRestSec') {
      if (!Util.isIntIn(value, [15, 600])) throw new AppError('Default rest must be between 15 and 600 seconds.');
    } else if (key === 'restAlerts' || key === 'photoGuide') {
      if (typeof value !== 'boolean') throw new AppError('Unknown setting.');
    } else if (!lists[key] || !Tax.has(lists[key], value)) throw new AppError('Unknown setting.');
    Store.transact((d) => { d.settings[key] = value; });
  }
};

const BackupService = {
  build() {
    return {
      kind: CONFIG.BACKUP_KIND,
      app: CONFIG.APP_NAME,
      appVersion: CONFIG.APP_VERSION,
      exportedAt: Util.now(),
      data: Util.clone(Store.get()),                 // routines, exercises, settings, completed history
      activeWorkout: Store.getActive() ? Util.clone(Store.getActive()) : null // in-progress workout, if any
    };
  },
  filename(date = Clock.date()) {
    const p = (n) => String(n).padStart(2, '0');
    return `iron-ledger-backup-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}-${p(date.getHours())}${p(date.getMinutes())}.json`;
  },
  /** Parses and fully validates backup text WITHOUT touching current data. */
  parse(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (_) { return { ok: false, errors: ['The file is not valid JSON.'] }; }
    const envelope = Validate.backupEnvelope(obj);
    if (envelope.length) return { ok: false, errors: envelope };
    let data;
    try { data = Migrations.run(Util.clone(obj.data)); }
    catch (err) { return { ok: false, errors: [err.message] }; }
    const errors = Validate.dataset(data);
    let active = obj.activeWorkout || null;
    if (active) {
      if (data.sessions.some((ws) => ws.id === active.id)) active = null; // already completed: history wins
      else errors.push(...Validate.session(active, 'active'));
    }
    if (errors.length) return { ok: false, errors };
    return {
      ok: true, data, active,
      summary: { exportedAt: obj.exportedAt, routines: data.routines.length, exercises: data.exercises.length, sessions: data.sessions.length, hasActive: !!active }
    };
  },
  apply(data, active = null) { Store.replace(data, active); },
  /** Restores seed data AND default settings; clears any workout in progress. */
  reset() { Store.replace(Seed.build(), null); }
};


/** Completed workout history (read + delete). Never edits logged values. */
const SessionService = {
  list() {
    return Store.get().sessions.slice().sort((a, b) => Date.parse(b.startedAt) - Date.parse(a.startedAt));
  },
  get(id) { return Store.get().sessions.find((ws) => ws.id === id) || null; },
  forExercise(exerciseId) {
    return SessionService.list().map((ws) => {
      const sets = [];
      ws.exercises.forEach((x) => { if (x.performedExerciseId === exerciseId) x.sets.forEach((st, i) => { if (st.completed) sets.push({ set: st, label: Calc.setLabels(x.sets)[i] }); }); });
      return sets.length ? { session: ws, sets } : null;
    }).filter(Boolean);
  },
  remove(id) {
    Store.transact((d) => {
      const before = d.sessions.length;
      d.sessions = d.sessions.filter((ws) => ws.id !== id);
      if (d.sessions.length === before) throw new AppError('That workout no longer exists.');
    });
  }
};

/**
 * The active workout engine. All changes go through Store.activeTransact,
 * which saves after EVERY change. Routines are only ever READ here.
 */
const WorkoutService = {
  active() { return Store.getActive(); },

  idsIn(session) {
    const t = new Set([session.id]);
    session.exercises.forEach((x) => { t.add(x.id); x.sets.forEach((st) => t.add(st.id)); });
    return t;
  },

  newSet(type, weightKg, ids) {
    const id = Id.unique('st', ids);
    ids.add(id);
    return { id, type, weightKg: weightKg == null ? null : weightKg, reps: null, rir: null, completed: false, completedAt: null };
  },

  /** Builds a session exercise from a library exercise + prescription (snapshots included). */
  buildExercise(ex, t, ids) {
    const id = Id.unique('se', ids);
    ids.add(id);
    const sets = [];
    for (let i = 0; i < t.sets; i++) sets.push(WorkoutService.newSet('working', null, ids));
    return {
      id,
      originalExerciseId: t.exerciseId,
      performedExerciseId: t.exerciseId,
      routineItemId: t.routineItemId || null,
      nameSnapshot: ex ? ex.name : 'Unknown exercise',
      primaryMuscleSnapshot: ex ? ex.primaryMuscle : null,
      equipmentSnapshot: ex ? ex.equipment : null,
      targetSets: t.sets,
      targetRepMin: t.repMin, targetRepMax: t.repMax,
      targetRirMin: t.rirMin, targetRirMax: t.rirMax,
      restSeconds: t.restSec,
      notesSnapshot: t.notes || '',
      sessionNote: '',
      substitution: false,
      substitutionReason: null,
      addedDuringSession: !!t.added,
      sets
    };
  },

  /** Starts a session from a DEEP SNAPSHOT of the routine (optionally for a schedule entry). */
  start(routineId, { scheduleEntryId = null } = {}) {
    if (Store.getActive()) throw new AppError('A workout is already in progress.');
    const routine = RoutineService.get(routineId);
    if (!routine) throw new AppError('That routine no longer exists.');
    const snap = Util.clone(routine);
    const ids = new Set(Store.get().sessions.map((ws) => ws.id));
    const id = Id.unique('ws', ids);
    ids.add(id);
    const session = {
      id,
      status: 'active',
      kind: 'routine',
      sourceRoutineId: snap.id,
      sourceRoutineName: snap.name,
      scheduleEntryId,
      startedAt: Util.now(),
      completedAt: null,
      durationSec: null,
      notes: '',
      restTimer: null,
      routineOrderSnapshot: snap.exercises.map((it) => it.id),
      removedExercises: [],
      appVersion: CONFIG.APP_VERSION,
      exercises: snap.exercises.map((it) => WorkoutService.buildExercise(ExerciseService.get(it.exerciseId), {
        exerciseId: it.exerciseId, routineItemId: it.id, sets: it.sets, repMin: it.repMin, repMax: it.repMax,
        rirMin: it.rirMin, rirMax: it.rirMax, restSec: it.restSec, notes: it.notes, added: false
      }, ids))
    };
    Store.beginActive(session);
    return id;
  },

  /** A session with no source routine; exercises are added during the workout. */
  startEmpty() {
    if (Store.getActive()) throw new AppError('A workout is already in progress.');
    const ids = new Set(Store.get().sessions.map((ws) => ws.id));
    const id = Id.unique('ws', ids);
    Store.beginActive({
      id, status: 'active', kind: 'empty', sourceRoutineId: null, sourceRoutineName: 'Custom workout',
      scheduleEntryId: null, startedAt: Util.now(), completedAt: null, durationSec: null, notes: '',
      restTimer: null, routineOrderSnapshot: [], removedExercises: [], appVersion: CONFIG.APP_VERSION, exercises: []
    });
    return id;
  },

  find(d, seId, setId) {
    const x = d.exercises.find((e) => e.id === seId);
    if (!x) throw new AppError('That exercise is no longer in this workout.');
    if (setId == null) return { x };
    const st = x.sets.find((e) => e.id === setId);
    if (!st) throw new AppError('That set no longer exists.');
    return { x, st };
  },

  /**
   * Saves one typed value. Blank stores null; an invalid value stores null
   * and reports invalid so the field can be flagged (never silently guessed).
   */
  updateSetField(seId, setId, field, raw) {
    const L = CONFIG.LIMITS;
    let value = null;
    let invalid = false;
    if (field === 'weight') {
      const p = Units.parse(raw);
      if (p.invalid) invalid = true;
      else if (!p.empty) {
        const kg = Units.fromDisplay(p.value);
        if (kg > L.weightKg[1]) invalid = true; else value = kg;
      }
    } else {
      const s = String(raw).trim();
      const n = Util.parseIntOrNull(s);
      const range = field === 'reps' ? L.loggedReps : L.loggedRir;
      if (s && (n == null || !Util.isIntIn(n, range))) invalid = true;
      else value = n;
    }
    const key = { weight: 'weightKg', reps: 'reps', rir: 'rir' }[field];
    Store.activeTransact((d) => { WorkoutService.find(d, seId, setId).st[key] = value; });
    return { invalid };
  },

  /** Completes or un-completes a set. Completion validates, saves and starts rest. */
  toggleSet(seId, setId) {
    return Store.activeTransact((d) => {
      const { x, st } = WorkoutService.find(d, seId, setId);
      const label = Calc.setLabels(x.sets)[x.sets.indexOf(st)];
      if (st.completed) {
        st.completed = false;
        st.completedAt = null;
        return { completed: false };
      }
      const weightRequired = x.equipmentSnapshot !== 'bodyweight';
      if (weightRequired && st.weightKg == null) throw new AppError(`Enter the weight for set ${label}.`, [{ setId: st.id, field: 'weight' }]);
      if (st.reps == null) throw new AppError(`Enter the reps for set ${label}.`, [{ setId: st.id, field: 'reps' }]);
      // RIR is encouraged but optional (Alpha 2 decision).
      st.completed = true;
      st.completedAt = Util.now();
      // Quick entry: carry WEIGHT (never reps/RIR) to the next open set of the same type.
      const i = x.sets.indexOf(st);
      const next = x.sets.slice(i + 1).find((n) => !n.completed && n.type === st.type);
      if (next && next.weightKg == null && st.weightKg != null) next.weightKg = st.weightKg;
      // Rest follows working and failure sets (not warm-ups, not mid-drop-set).
      if ((st.type === 'working' || st.type === 'failure') && x.restSeconds > 0) {
        d.lastRestExerciseId = x.id;
        if (SettingsService.get().restMode === 'auto') WorkoutService.armRest(d, x);
        else d.restTimer = null;
      }
      return { completed: true };
    });
  },

  copyPrevious(seId, setId, weightKg, reps) {
    Store.activeTransact((d) => {
      const { st } = WorkoutService.find(d, seId, setId);
      if (st.completed) throw new AppError('Undo the completed set before changing it.');
      if (weightKg != null) st.weightKg = weightKg;
      if (reps != null) st.reps = reps;
    });
  },

  addSet(seId, type = 'working') {
    Store.activeTransact((d) => {
      const { x } = WorkoutService.find(d, seId);
      const ids = WorkoutService.idsIn(d);
      const last = x.sets.filter((st) => st.type === type && st.weightKg != null).pop();
      const set = WorkoutService.newSet(type, last ? last.weightKg : null, ids);
      if (type === 'warmup') {
        const at = x.sets.filter((st) => st.type === 'warmup').length;
        x.sets.splice(at, 0, set);
      } else x.sets.push(set);
    });
  },

  removeSet(seId, setId) {
    Store.activeTransact((d) => {
      const { x } = WorkoutService.find(d, seId, setId);
      x.sets = x.sets.filter((st) => st.id !== setId);
    });
  },

  setHasData(st) { return st.completed || st.weightKg != null || st.reps != null || st.rir != null; },

  setType(seId, setId, type) {
