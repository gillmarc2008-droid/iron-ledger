<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E141C">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Ledger</title>
<style>
/* =====================================================================
   DESIGN TOKENS
   Concept: a training ledger. Ink-blue base, ledger-paper light mode,
   hairline "ruled" rows, and prescriptions set as right-aligned
   tabular number columns. One accent: ledger green.
   ===================================================================== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --tap: 44px;
  --pad: 20px;
  --maxw: 560px;
  --nav-h: 64px;
  --ease: cubic-bezier(.2, .7, .2, 1);

  /* Light: ledger paper */
  color-scheme: light;
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --surface-2: #E7ECE6;
  --line: #D8DFD6;
  --line-strong: #B9C4B7;
  --text: #0F1A24;
  --text-2: #3D4A57;
  --text-3: #5D6A76;
  --accent: #17704C;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(23, 112, 76, .10);
  --danger: #B3261E;
  --danger-soft: rgba(179, 38, 30, .09);
  --focus: #17704C;
  --scrim: rgba(15, 26, 36, .45);
}

/* Dark: ink. Applied for explicit dark, or system when the device prefers dark. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E141C;
    --surface: #161E28;
    --surface-2: #1E2834;
    --line: #243040;
    --line-strong: #34445A;
    --text: #E9EEF3;
    --text-2: #B3BECA;
    --text-3: #8C99A8;
    --accent: #7FD3AE;
    --accent-ink: #072018;
    --accent-soft: rgba(127, 211, 174, .12);
    --danger: #FF8A80;
    --danger-soft: rgba(255, 138, 128, .10);
    --focus: #7FD3AE;
    --scrim: rgba(3, 6, 10, .66);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E141C;
  --surface: #161E28;
  --surface-2: #1E2834;
  --line: #243040;
  --line-strong: #34445A;
  --text: #E9EEF3;
  --text-2: #B3BECA;
  --text-3: #8C99A8;
  --accent: #7FD3AE;
  --accent-ink: #072018;
  --accent-soft: rgba(127, 211, 174, .12);
  --danger: #FF8A80;
  --danger-soft: rgba(255, 138, 128, .10);
  --focus: #7FD3AE;
  --scrim: rgba(3, 6, 10, .66);
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 50;
  background: var(--accent); color: var(--accent-ink);
  padding: 10px 14px; border-radius: var(--r-sm); text-decoration: none; font-weight: 600;
}
.skip-link:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* =====================================================================
   SHELL
   ===================================================================== */
#view {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--pad)
           calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 40px);
  outline: none;
}
body.is-editing #view { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px); }
body.is-editing .tabbar { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(140%) blur(14px);
  backdrop-filter: saturate(140%) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar__inner {
  max-width: var(--maxw); margin: 0 auto;
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--nav-h);
  text-decoration: none; color: var(--text-3);
  font-size: 12px; font-weight: 500; letter-spacing: .01em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--text); font-weight: 650; }
/* Active state is shown by weight, colour AND a marker — never colour alone */
.tab[aria-current="page"]::before {
  content: ""; position: absolute; top: -1px; left: 30%; right: 30%;
  height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
}

.banner {
  max-width: var(--maxw); margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) var(--pad) 0;
}
.banner__box {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--danger-soft); color: var(--text);
  border-left: 3px solid var(--danger);
  border-radius: var(--r-sm); padding: 12px 8px 12px 14px; font-size: 15px;
}
.banner__box p { flex: 1; padding-top: 2px; }

/* =====================================================================
   TYPE + HEADERS
   ===================================================================== */
.page-head {
  display: flex; align-items: center; gap: 4px;
  min-height: 56px; margin: 0 -10px 8px;
}
.page-head__titles { flex: 1; min-width: 0; padding: 0 10px; }
.page-head--sub .page-head__titles { padding-left: 2px; }
.page-title {
  font-family: var(--font-display);
  font-size: 30px; line-height: 1.12; font-weight: 720; letter-spacing: -.022em;
  overflow-wrap: anywhere;
}
.page-head--sub .page-title { font-size: 22px; letter-spacing: -.015em; }
.page-head__actions { display: flex; align-items: center; gap: 2px; }

.section { margin-top: 32px; }
.section:first-of-type { margin-top: 8px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin-bottom: 10px;
}
.section-title { font-size: 15px; font-weight: 650; color: var(--text-2); letter-spacing: .005em; }
.meta { font-size: 14px; color: var(--text-3); }
.link {
  display: inline-flex; align-items: center; gap: 2px;
  min-height: var(--tap); padding: 0 2px;
  color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: none;
}
.link svg { width: 18px; height: 18px; }
.lede { color: var(--text-2); font-size: 16px; }
.muted { color: var(--text-3); }

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px;
  border: 0; border-radius: var(--r-md);
  font-size: 16px; font-weight: 620; line-height: 1.1; text-decoration: none;
  transition: transform .12s var(--ease), background-color .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--text); padding: 0 12px; }
.btn-danger { background: var(--danger); color: #fff; }
:root[data-theme="dark"] .btn-danger { color: #2A0602; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-danger { color: #2A0602; } }
.btn-danger-text { background: transparent; color: var(--danger); padding: 0 4px; }
.btn-block { width: 100%; min-height: 52px; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: var(--tap); height: var(--tap); padding: 0;
  border: 0; border-radius: 50%; background: transparent; color: var(--text-2);
  text-decoration: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.icon-btn--danger { color: var(--danger); }

/* =====================================================================
   HOME
   ===================================================================== */
.home-head { padding: 14px 0 6px; }
.wordmark {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-size: 15px; font-weight: 800; letter-spacing: .24em;
}
/* The brand mark: a ledger margin rule */
.wordmark__rule { width: 3px; height: 18px; background: var(--accent); border-radius: 2px; }
.home-date { margin-top: 4px; color: var(--text-3); font-size: 15px; }
.display {
  font-family: var(--font-display);
  font-size: 40px; line-height: 1.02; font-weight: 760; letter-spacing: -.035em;
  margin-top: 6px;
}
.home-lede { margin-top: 8px; color: var(--text-2); }

/* Ruled routine rows (ledger lines rather than boxed cards) */
.rlist { margin-top: 18px; border-top: 1px solid var(--line); }
.rrow {
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.rrow__main {
  flex: 1; min-width: 0; display: block;
  padding: 16px 0; text-decoration: none;
}
.rrow__name { display: block; font-size: 19px; font-weight: 680; letter-spacing: -.01em; }
.rrow__focus { display: block; color: var(--text-3); font-size: 15px; margin-top: 2px; }
.rrow__figs { display: flex; gap: 14px; flex: none; text-align: right; }
.fig { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.fig b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fig span { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.empty-inline {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  color: var(--text-2);
}
.empty-inline svg { width: 24px; height: 24px; color: var(--text-3); margin-top: 1px; }

/* Week strip: real dates, no invented numbers */
.week {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px;
}
.week__day {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 0; border-radius: var(--r-sm);
  font-size: 12px; color: var(--text-3);
}
.week__day b { font-size: 17px; font-weight: 650; color: var(--text-2); }
.week__day[aria-current="date"] { background: var(--surface-2); color: var(--text); }
.week__day[aria-current="date"] b { color: var(--text); }
.week__day[aria-current="date"]::after {
  content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--accent);
}

/* =====================================================================
   SEGMENTED CONTROL
   ===================================================================== */
.segmented {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--surface-2); border-radius: var(--r-md); padding: 3px;
}
.segmented > a, .segmented > button {
  min-height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: transparent;
  color: var(--text-2); font-size: 15px; font-weight: 600; text-decoration: none;
  padding: 0 8px;
}
.segmented > [aria-current="page"],
.segmented > [aria-checked="true"],
.segmented > [aria-pressed="true"] {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), inset 0 0 0 1px var(--line-strong);
}
.workout-tabs { margin-bottom: 18px; }

/* =====================================================================
   ROUTINE CARDS (Workout > Routines)
   ===================================================================== */
.rcards { display: grid; gap: 12px; }
.rcard {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 16px 16px 12px;
}
.rcard__top { display: flex; gap: 12px; align-items: flex-start; }
.rcard__link { flex: 1; min-width: 0; text-decoration: none; padding-top: 2px; }
.rcard__name { font-size: 20px; font-weight: 700; letter-spacing: -.012em; }
.rcard__focus { color: var(--text-3); font-size: 15px; margin-top: 2px; }
.rcard__actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
.rcard__actions .btn { flex: 1; }
.rcard__actions .icon-btn { flex: none; }

/* =====================================================================
   LEDGER TABLE (routine detail)
   ===================================================================== */
.summary {
  display: flex; gap: 28px; padding: 6px 0 18px;
}
.summary .fig { align-items: flex-start; }
.summary .fig b { font-size: 30px; letter-spacing: -.02em; }
.summary .fig span { font-size: 13px; }

.ledger { border-top: 1px solid var(--line-strong); }
.ledger__colhead, .ledger__row {
  display: grid;
  grid-template-columns: 1fr 40px 58px 46px 46px;
  column-gap: 6px; align-items: baseline;
}
.ledger__colhead {
  padding: 8px 0; font-size: 12px; color: var(--text-3); font-weight: 600;
  border-bottom: 1px solid var(--line);
}
.ledger__colhead span:not(:first-child), .ledger__row .c { text-align: right; }
.ledger__item { border-bottom: 1px solid var(--line); padding: 14px 0; }
.ledger__name { font-size: 17px; font-weight: 640; text-decoration: none; line-height: 1.3; }
.ledger__row .c { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ledger__sub { font-size: 14px; color: var(--text-3); margin-top: 2px; }
.ledger__note {
  margin-top: 8px; font-size: 15px; color: var(--text-2);
  padding-left: 10px; border-left: 2px solid var(--line-strong);
}
.desc { color: var(--text-2); margin: -2px 0 14px; }

/* =====================================================================
   SEARCH, CHIPS, EXERCISE LIST
   ===================================================================== */
.search {
  position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 14px; width: 20px; height: 20px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 100%; min-height: 48px; padding: 0 14px 0 44px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-md);
  font-size: 16px;
}
.search input:focus { outline: none; border-color: var(--focus); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 12px calc(var(--pad) * -1) 0; padding: 0 var(--pad);
  scroll-padding: 0 var(--pad);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 40px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  background: transparent; color: var(--text-2); font-size: 15px; font-weight: 550;
}
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] {
  background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 650;
}
.chip[aria-pressed="true"] .chip__check { display: inline; }
.chip__check { display: none; }

.results-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin: 14px 0 2px; font-size: 14px; color: var(--text-3);
}

.xlist { border-top: 1px solid var(--line); margin-top: 6px; }
.xlist > li { border-bottom: 1px solid var(--line); }
.xrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 64px; padding: 10px 0;
  background: transparent; border: 0; text-align: left; text-decoration: none;
}
.xrow__body { flex: 1; min-width: 0; }
.xrow__name { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
.xrow__meta { display: block; font-size: 14px; color: var(--text-3); margin-top: 1px; }
.xrow__chev { color: var(--text-3); width: 20px; height: 20px; }
.tags { display: inline-flex; gap: 6px; align-items: center; flex: none; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 650; padding: 3px 8px; border-radius: 6px;
  background: var(--surface-2); color: var(--text-2);
}
.tag svg { width: 14px; height: 14px; }
.tag--fav { background: var(--accent-soft); color: var(--accent); }
.tag--avoid { background: var(--danger-soft); color: var(--danger); }
.tag--dnu { background: var(--danger); color: var(--bg); }

/* Picker selection badge shows ORDER, not just colour */
.pick-badge {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--line-strong); font-size: 14px; font-weight: 750;
}
.xrow[aria-pressed="true"] .pick-badge {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}

/* =====================================================================
   EMPTY STATES
   ===================================================================== */
.empty {
  padding: 48px 8px; text-align: center; color: var(--text-2);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty__mark {
  width: 64px; height: 64px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface-2); color: var(--text-3);
}
.empty__mark svg { width: 30px; height: 30px; }
.empty h2 { font-size: 20px; font-weight: 700; color: var(--text); }
.empty p { max-width: 30ch; }
.later { margin-top: 28px; font-size: 14px; color: var(--text-3); text-align: center; }

/* =====================================================================
   FORMS + EDITORS
   ===================================================================== */
.edit-head {
  position: sticky; top: 0; z-index: 10;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  margin: 0 calc(var(--pad) * -1) 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) calc(var(--pad) - 8px) 8px;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
body.is-editing #view { padding-top: 0; }
.edit-head__title { font-size: 17px; font-weight: 700; text-align: center; }

.field { margin-top: 18px; }
.field > label, .field-label {
  display: block; font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 6px;
}
.optional { font-weight: 400; color: var(--text-3); }
.input, .field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 11px 14px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md);
  font-size: 16px;
}
.field textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.field select, .eitem select {
  -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px;
}
.field input:focus, .field select:focus, .field textarea:focus,
.eitem input:focus, .eitem select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
[aria-invalid="true"] { border-color: var(--danger) !important; }
.field-error { color: var(--danger); font-size: 14px; font-weight: 600; margin-top: 6px; }
.field-error::before { content: "! "; }
.hint { color: var(--text-3); font-size: 14px; margin-top: 6px; }

.toggle-group { display: flex; flex-wrap: wrap; gap: 8px; }

.editor-summary { display: flex; gap: 22px; margin: 28px 0 6px; align-items: flex-end; }
.editor-summary .fig { align-items: flex-start; }
.editor-summary .section-title { flex: 1; }

.eitems { counter-reset: none; }
.eitem {
  background: var(--surface); border-radius: var(--r-lg);
  padding: 12px 12px 14px 14px; margin-top: 10px;
}
.eitem.has-error { box-shadow: inset 3px 0 0 var(--danger); }
.eitem__head { display: flex; align-items: flex-start; gap: 10px; }
.eitem__idx { font-size: 15px; font-weight: 700; color: var(--text-3); width: 22px; padding-top: 3px; }
.eitem__title { flex: 1; min-width: 0; padding-top: 1px; }
.eitem__name { display: block; font-size: 17px; font-weight: 650; line-height: 1.3; }
.eitem__meta { display: block; font-size: 14px; color: var(--text-3); }
.eitem__tools { display: flex; margin: -6px -6px 0 0; }
.eitem__tools .icon-btn { width: 40px; height: 44px; }

.eitem__grid {
  display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 12px 10px; margin-top: 12px;
}
.cell__label { display: block; font-size: 13px; font-weight: 600; color: var(--text-3); margin-bottom: 4px; }
.stepper {
  display: grid; grid-template-columns: 40px 1fr 40px; align-items: center;
  background: var(--surface-2); border-radius: var(--r-md); min-height: 44px;
}
.stepper button {
  height: 44px; border: 0; background: transparent; color: var(--text);
  display: grid; place-items: center; border-radius: var(--r-md);
}
.stepper button svg { width: 18px; height: 18px; }
.stepper output { text-align: center; font-size: 20px; font-weight: 700; }
.range { display: grid; grid-template-columns: 1fr 12px 1fr; align-items: center; }
.range span { text-align: center; color: var(--text-3); }
.eitem input[type="text"], .eitem input[inputmode], .eitem select {
  width: 100%; min-height: 44px; padding: 0 6px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--r-md);
  font-size: 18px; font-weight: 650; text-align: center; font-variant-numeric: tabular-nums;
}
.eitem select { text-align: left; padding: 0 30px 0 12px; font-size: 17px; background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; }
.eitem__note { grid-column: 2 / -1; min-width: 0; }
.eitem input.note-input {
  width: 100%; min-height: 44px; padding: 0 12px;
  background: transparent; border: 1px dashed var(--line-strong); border-radius: var(--r-md);
  font-size: 15px; text-align: left; font-weight: 400;
}
.item-errors { margin-top: 8px; }
.item-errors li { color: var(--danger); font-size: 14px; font-weight: 600; }
.item-errors li::before { content: "! "; }

.btn-add {
  width: 100%; min-height: 56px; margin-top: 12px;
  border: 1.5px dashed var(--line-strong); background: transparent; color: var(--text);
  border-radius: var(--r-lg); font-weight: 650;
}
.form-footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }

/* =====================================================================
   EXERCISE DETAIL
   ===================================================================== */
.xd-meta { color: var(--text-2); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pref { margin-bottom: 22px; }
.pref .segmented { grid-auto-columns: auto; grid-template-columns: repeat(4, 1fr); }
.pref .segmented button { font-size: 14px; padding: 0 4px; min-height: 44px; }
.spec { border-top: 1px solid var(--line); }
.spec > div {
  display: grid; grid-template-columns: 9.5em 1fr; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.spec dt { color: var(--text-3); font-size: 15px; }
.spec dd { font-weight: 560; }
.prose { margin-top: 24px; }
.prose h2 { font-size: 15px; font-weight: 650; color: var(--text-2); margin-bottom: 6px; }
.prose p { color: var(--text); max-width: 62ch; white-space: pre-line; }
.used { margin-top: 6px; }
.used a { display: flex; justify-content: space-between; align-items: center; min-height: var(--tap); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); }
.used a svg { width: 18px; height: 18px; color: var(--text-3); }

/* =====================================================================
   MORE / SETTINGS
   ===================================================================== */
.setting { padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting:first-of-type { border-top: 1px solid var(--line); }
.setting__label { display: block; font-weight: 600; margin-bottom: 8px; }
.setting__hint { font-size: 14px; color: var(--text-3); margin-top: 8px; }
.datarow {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 12px 0;
  border: 0; border-bottom: 1px solid var(--line); background: transparent;
  text-align: left;
}
.datarow:first-of-type { border-top: 1px solid var(--line); }
.datarow svg { width: 22px; height: 22px; color: var(--text-2); }
.datarow__body { flex: 1; }
.datarow__title { display: block; font-weight: 620; }
.datarow__sub { display: block; font-size: 14px; color: var(--text-3); }
.datarow--danger .datarow__title, .datarow--danger svg { color: var(--danger); }
.about { margin-top: 32px; color: var(--text-3); font-size: 14px; line-height: 1.6; }

/* =====================================================================
   DIALOGS, SHEETS, PICKER, TOAST
   ===================================================================== */
dialog {
  padding: 0; border: 0; color: var(--text); background: var(--surface);
  max-width: min(420px, calc(100vw - 32px)); width: 100%;
  border-radius: var(--r-lg);
}
dialog::backdrop { background: var(--scrim); }
dialog[open] { animation: pop .18s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.dlg { padding: 22px 20px 16px; }
.dlg h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.dlg p { color: var(--text-2); margin-top: 8px; }
.dlg ul.errors { margin-top: 10px; color: var(--danger); font-size: 15px; }
.dlg ul.errors li { margin-top: 4px; }
.dlg .field { margin-top: 14px; }
.dlg__actions { display: flex; gap: 10px; margin-top: 22px; }
.dlg__actions .btn { flex: 1; }

dialog.sheet {
  margin: auto auto 0; max-width: var(--maxw); width: 100%;
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
dialog.sheet[open] { animation: rise .22s var(--ease); }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet__title { padding: 18px 20px 6px; font-size: 14px; font-weight: 600; color: var(--text-3); }
.sheet__actions { padding: 0 8px 8px; }
.sheet__btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 52px; padding: 0 12px; border: 0; background: transparent;
  border-radius: var(--r-md); font-size: 17px; font-weight: 550; text-align: left;
}
.sheet__btn:active { background: var(--surface-2); }
.sheet__btn svg { width: 22px; height: 22px; color: var(--text-2); }
.sheet__btn--danger, .sheet__btn--danger svg { color: var(--danger); }
.sheet__cancel { border-top: 1px solid var(--line); margin-top: 4px; justify-content: center; font-weight: 650; }

dialog.picker {
  max-width: var(--maxw); width: 100%; height: 100%; max-height: 100%;
  margin: 0 auto; border-radius: 0; background: var(--bg);
}
dialog.picker[open] { display: flex; flex-direction: column; animation: rise .22s var(--ease); }
.picker__head {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 6px) 8px 6px;
}
.picker__head h2 { font-size: 17px; font-weight: 700; }
.picker__count { justify-self: end; padding-right: 12px; font-size: 14px; color: var(--text-3); }
.picker__filters { padding: 4px var(--pad) 10px; border-bottom: 1px solid var(--line); }
.picker__list { flex: 1; overflow-y: auto; padding: 0 var(--pad); -webkit-overflow-scrolling: touch; }
.picker__list .xlist { border-top: 0; margin-top: 0; }
.picker__foot {
  padding: 12px var(--pad) calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid var(--line); background: var(--bg);
}

.toast {
  position: fixed; left: 50%; z-index: 100;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  max-width: min(440px, calc(100vw - 32px)); width: max-content;
  background: var(--text); color: var(--bg);
  padding: 13px 18px; border-radius: var(--r-md);
  font-size: 15px; font-weight: 600; line-height: 1.35;
  transition: opacity .2s, transform .2s var(--ease);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
.toast[data-tone="error"] { background: var(--danger); color: #fff; }
body.is-editing .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }

.fatal { padding: 40px var(--pad); max-width: var(--maxw); margin: 0 auto; }
.fatal h1 { font-size: 24px; margin-bottom: 10px; }

<script>
'use strict';

/* =======================================================================
   IRON LEDGER 2.0 — ALPHA 1
   Single-file build. The script is divided into layered sections:

     1. CONFIG            constants, storage keys, limits
     2. TAXONOMY          muscles, equipment, movements, preferences
     3. SEED DATA         default exercises + sample routines (first run only)
     4. UTILITIES         ids, cloning, escaping, text normalisation
     5. MODELS            factories that produce normalised records
     6. VALIDATION        one place that defines what valid data is
     7. MIGRATIONS        schema upgrade runner (empty at v1)
     8. STORAGE SERVICE   the ONLY code that touches localStorage
     9. STORE             in-memory state + atomic, validated transactions
    10. CALCULATIONS      the single implementation of every derived metric
    11. FORMATTING        display helpers (no business logic)
    12. SERVICES          exercise, routine, settings, backup
    13. UI PRIMITIVES     icons, toast, dialogs
    14. VIEWS             pure render functions -> HTML strings
    15. CONTROLLERS       editors, picker, filters
    16. ROUTER            hash routing + unsaved-changes guard
    17. EVENTS + BOOT     delegated event handling and start-up

   Dependency direction: UI -> services -> store -> storage.
   Nothing below the UI layer reads or writes the DOM.
   ======================================================================= */


/* =======================================================================
   1. CONFIG
   ======================================================================= */
const CONFIG = Object.freeze({
  APP_NAME: 'Iron Ledger',
  APP_VERSION: '2.0.0-alpha.1',
  SCHEMA_VERSION: 1,
  BACKUP_KIND: 'iron-ledger-backup',
  MAX_IMPORT_BYTES: 5 * 1024 * 1024,
  KEYS: Object.freeze({
    DATA: 'ironLedger.v2.data',                  // all persistent app data
    ACTIVE_WORKOUT: 'ironLedger.v2.activeWorkout', // reserved for Alpha 2 (unused)
    RECOVERY_PREFIX: 'ironLedger.v2.recovery.'   // copies of unreadable data
  }),
  LIMITS: Object.freeze({
    sets: [1, 10],
    reps: [1, 100],
    rir: [0, 5],
    restSec: [0, 600]
  }),
  REST_STEP_SEC: 15,
  ALPHA2_MESSAGE: 'Active workouts will be enabled in Alpha 2.'
});


/* =======================================================================
   2. TAXONOMY
   Stable ids are stored; labels are display-only and may change freely.
   ======================================================================= */
const TAXONOMY = Object.freeze({
  muscles: [
    { id: 'chest', label: 'Chest', region: 'upper', filter: true },
    { id: 'back', label: 'Back', region: 'upper', filter: true },
    { id: 'shoulders', label: 'Shoulders', region: 'upper', filter: true },
    { id: 'biceps', label: 'Biceps', region: 'upper', filter: true },
    { id: 'triceps', label: 'Triceps', region: 'upper', filter: true },
    { id: 'forearms', label: 'Forearms', region: 'upper', filter: false },
    { id: 'quads', label: 'Quads', region: 'lower', filter: true },
    { id: 'hamstrings', label: 'Hamstrings', region: 'lower', filter: true },
    { id: 'glutes', label: 'Glutes', region: 'lower', filter: false },
    { id: 'calves', label: 'Calves', region: 'lower', filter: true },
    { id: 'core', label: 'Core', region: 'core', filter: true }
  ],
  regions: [
    { id: 'upper', label: 'Upper body' },
    { id: 'lower', label: 'Lower body' },
    { id: 'core', label: 'Core' }
  ],
  equipment: [
    { id: 'dumbbell', label: 'Dumbbells' },
    { id: 'barbell', label: 'Barbell' },
    { id: 'smith', label: 'Smith machine' },
    { id: 'cable', label: 'Cable' },
    { id: 'machine', label: 'Machine' },

  ],
  movements: [
    { id: 'horizontal-push', label: 'Horizontal push' },

    { id: 'vertical-push', label: 'Vertical push' },
    { id: 'fly', label: 'Chest fly' },
    { id: 'lateral-raise', label: 'Lateral raise' },
    { id: 'rear-fly', label: 'Rear-delt fly' },
    { id: 'vertical-pull', label: 'Vertical pull' },
    { id: 'horizontal-pull', label: 'Horizontal pull' },
    { id: 'elbow-flexion', label: 'Elbow flexion (curl)' },
    { id: 'elbow-extension', label: 'Elbow extension' },
    { id: 'squat', label: 'Squat / leg press' },
    { id: 'hinge', label: 'Hip hinge' },
    { id: 'knee-extension', label: 'Knee extension' },
    { id: 'knee-flexion', label: 'Knee flexion (leg curl)' },
    { id: 'calf-raise', label: 'Calf raise' },
    { id: 'spinal-flexion', label: 'Spinal flexion' },
    { id: 'hip-flexion', label: 'Hip flexion' }
  ],
  mechanics: [
    { id: 'compound', label: 'Compound' },
    { id: 'isolation', label: 'Isolation' }
  ],
  preferences: [
    { id: 'favourite', label: 'Favourite' },
    { id: 'neutral', label: 'Neutral' },
    { id: 'avoid', label: 'Avoid' },
    { id: 'do-not-use', label: 'Do not use' }
  ],
  units: [{ id: 'kg', label: 'kg' }, { id: 'lb', label: 'lb' }],
  themes: [{ id: 'system', label: 'System' }, { id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }],
  weekStarts: [{ id: 'monday', label: 'Monday' }, { id: 'sunday', label: 'Sunday' }]
});

const Tax = {
  ids(list) { return TAXONOMY[list].map((x) => x.id); },
  has(list, id) { return TAXONOMY[list].some((x) => x.id === id); },
  label(list, id) {
    const item = TAXONOMY[list].find((x) => x.id === id);
    return item ? item.label : 'Unknown';
  },
  filterMuscles() { return TAXONOMY.muscles.filter((m) => m.filter); },
  regionFor(muscleId) {
    const m = TAXONOMY.muscles.find((x) => x.id === muscleId);
    return m ? m.region : 'upper';
  }
};

/* =======================================================================
   4. UTILITIES
   ======================================================================= */
class AppError extends Error {
  /** An expected, user-facing error. Its message is safe to show. */
  constructor(message, details) { super(message); this.name = 'AppError'; this.details = details || []; }
}

const Util = {
  now() { return new Date().toISOString(); },
  clone(v) { return typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)); },
  esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Lowercase, strip accents and punctuation: used for search + name comparison. */
  normalize(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  },
  isIntIn(v, [min, max]) { return Number.isInteger(v) && v >= min && v <= max; },
  /** Parses user-typed integers; returns null for blank/invalid input. */
  parseIntOrNull(raw) {
    const s = String(raw).trim();
    return /^\d+$/.test(s) ? parseInt(s, 10) : null;
  }
};

const Id = {
  /** Random, non-semantic id. Display names are never used as identifiers. */
  create(prefix) {
    let core;
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      core = crypto.randomUUID().replace(/-/g, '').slice(0, 16);
    } else {
      core = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }
    return `${prefix}_${core}`;
  },
  /** Guarantees uniqueness against a set of ids already in use. */
  unique(prefix, taken) {
    let id;
    do { id = Id.create(prefix); } while (taken.has(id));
    return id;
  }
};


/* =======================================================================
   5. MODELS
   Factories return complete, normalised records with every field present.
   They never assign ids — services do, so uniqueness is checked in one place.
   ======================================================================= */
const Models = {
  exercise(src = {}) {
    const t = Util.now();
    const primary = Tax.has('muscles', src.primaryMuscle) ? src.primaryMuscle : 'chest';
    const secondary = Array.isArray(src.secondaryMuscles)
      ? [...new Set(src.secondaryMuscles.filter((m) => Tax.has('muscles', m) && m !== primary))]
      : [];
    return {
      id: src.id || null,
      name: String(src.name || '').trim(),
      primaryMuscle: primary,
      secondaryMuscles: secondary,
      bodyRegion: Tax.regionFor(primary), // derived so it can never disagree with primary
      equipment: Tax.has('equipment', src.equipment) ? src.equipment : 'machine',
      movementPattern: Tax.has('movements', src.movementPattern) ? src.movementPattern : 'horizontal-push',
      mechanic: src.mechanic === 'isolation' ? 'isolation' : 'compound',
      instructions: String(src.instructions || '').trim(),
      defaultRestSec: Util.isIntIn(src.defaultRestSec, CONFIG.LIMITS.restSec) ? src.defaultRestSec : 90,
      notes: String(src.notes || '').trim(),
      preference: Tax.has('preferences', src.preference) ? src.preference : 'neutral',
      alternativeIds: Array.isArray(src.alternativeIds) ? [...new Set(src.alternativeIds.filter((x) => typeof x === 'string'))] : [],
      machineSettings: String(src.machineSettings || '').trim(),
      active: src.active !== false,
      isCustom: !!src.isCustom,
      createdAt: src.createdAt || t,
      updatedAt: src.updatedAt || t
    };
  },

  /** One prescribed exercise inside a routine template. Planning data only. */
  routineItem(src = {}) {
    return {
      id: src.id || null,
      exerciseId: src.exerciseId || null,
      sets: src.sets ?? 3,
      repMin: src.repMin ?? 8,
      repMax: src.repMax ?? 12,
      rirMin: src.rirMin ?? 1,
      rirMax: src.rirMax ?? 2,
      restSec: src.restSec ?? 90,
      notes: String(src.notes || '').trim()
    };
  },

  /** A routine is a TEMPLATE. It never holds completed performance. */
  routine(src = {}) {
    const t = Util.now();
    return {
      id: src.id || null,
      name: String(src.name || '').trim(),
      description: String(src.description || '').trim(),
      exercises: Array.isArray(src.exercises) ? src.exercises.map((it) => Models.routineItem(it)) : [],
      createdAt: src.createdAt || t,
      updatedAt: src.updatedAt || t
    };
  },

  settings(src = {}) {
    return {
      units: Tax.has('units', src.units) ? src.units : 'kg',
      theme: Tax.has('themes', src.theme) ? src.theme : 'system',
      weekStart: Tax.has('weekStarts', src.weekStart) ? src.weekStart : 'monday'
    };
  },

  /** Top-level persisted document. New collections arrive via migrations. */
  dataset() {
    const t = Util.now();
    return {
      schemaVersion: CONFIG.SCHEMA_VERSION,
      meta: { createdAt: t, updatedAt: t, seededAt: null, appVersion: CONFIG.APP_VERSION },
      settings: Models.settings(),
      exercises: [],
      routines: []
    };
  }
};

const Seed = {
  /** Builds a fresh dataset from seed definitions. Never merges into existing data. */
  build() {
    const t = Util.now();
    const exercises = SEED_EXERCISES.map(([key, name, primary, secondary, equipment, movement, mechanic, rest, instructions, alts]) =>
      Models.exercise({
        id: 'ex_' + key, name, primaryMuscle: primary, secondaryMuscles: secondary, equipment,
        movementPattern: movement, mechanic, defaultRestSec: rest, instructions,
        alternativeIds: (alts || []).map((a) => 'ex_' + a), createdAt: t, updatedAt: t
      }));
    const routines = SEED_ROUTINES.map((r) => {
      const taken = new Set();
      return Models.routine({
        id: r.id, name: r.name, description: r.description, createdAt: t, updatedAt: t,
        exercises: r.items.map(([key, sets, repMin, repMax, rirMin, rirMax, restSec, notes]) => {
          const id = Id.unique('ri', taken);
          taken.add(id);
          return { id, exerciseId: 'ex_' + key, sets, repMin, repMax, rirMin, rirMax, restSec, notes };
        })
      });
    });
    const data = Models.dataset();
    data.exercises = exercises;
    data.routines = routines;
    data.meta.seededAt = t;
    return data;
  }
};


/* =======================================================================
   6. VALIDATION
   The single definition of valid data. Used by the store (every write),
   by import, and by the routine editor (item rules).
   ======================================================================= */
const Validate = {
  /** Rules for a routine item's prescription. Returns [{field, message}]. */
  itemErrors(it) {
    const L = CONFIG.LIMITS;
    const e = [];
    if (!Util.isIntIn(it.sets, L.sets)) e.push({ field: 'sets', message: `Sets must be ${L.sets[0]}–${L.sets[1]}.` });
    const repOk = Util.isIntIn(it.repMin, L.reps) && Util.isIntIn(it.repMax, L.reps);
    if (!repOk) e.push({ field: 'reps', message: `Reps must be whole numbers from ${L.reps[0]} to ${L.reps[1]}.` });
    else if (it.repMin > it.repMax) e.push({ field: 'reps', message: 'Minimum reps cannot be higher than maximum reps.' });
    const rirOk = Util.isIntIn(it.rirMin, L.rir) && Util.isIntIn(it.rirMax, L.rir);
    if (!rirOk) e.push({ field: 'rir', message: `RIR must be whole numbers from ${L.rir[0]} to ${L.rir[1]}.` });
    else if (it.rirMin > it.rirMax) e.push({ field: 'rir', message: 'Minimum RIR cannot be higher than maximum RIR.' });
    if (!Util.isIntIn(it.restSec, L.restSec)) e.push({ field: 'rest', message: 'Rest time is out of range.' });
    return e;
  },

  /** Whole-dataset integrity check. Returns an array of messages (empty = valid). */
  dataset(d) {
    const e = [];
    if (!d || typeof d !== 'object' || Array.isArray(d)) return ['Data is not an object.'];
    if (!Number.isInteger(d.schemaVersion) || d.schemaVersion < 1) e.push('Missing or invalid schemaVersion.');
    if (!d.meta || typeof d.meta !== 'object') e.push('Missing meta section.');
    if (!d.settings || typeof d.settings !== 'object') e.push('Missing settings.');
    else {
      if (!Tax.has('units', d.settings.units)) e.push('Invalid units setting.');
      if (!Tax.has('themes', d.settings.theme)) e.push('Invalid theme setting.');
      if (!Tax.has('weekStarts', d.settings.weekStart)) e.push('Invalid week-start setting.');
    }
    if (!Array.isArray(d.exercises)) e.push('Missing exercise list.');
    if (!Array.isArray(d.routines)) e.push('Missing routine list.');
    if (e.length) return e;

    const exIds = new Set();
    d.exercises.forEach((x, i) => {
      const label = `Exercise ${i + 1}`;
      if (!x || typeof x !== 'object') { e.push(`${label} is not an object.`); return; }
      if (typeof x.id !== 'string' || !x.id) e.push(`${label} has no id.`);
      else if (exIds.has(x.id)) e.push(`Duplicate exercise id: ${x.id}.`);
      else exIds.add(x.id);
      if (typeof x.name !== 'string' || !x.name.trim()) e.push(`${label} has no name.`);
      if (!Tax.has('muscles', x.primaryMuscle)) e.push(`${label} has an unknown primary muscle.`);
      if (!Tax.has('equipment', x.equipment)) e.push(`${label} has unknown equipment.`);
      if (!Tax.has('preferences', x.preference)) e.push(`${label} has an invalid preference.`);
      if (!Array.isArray(x.secondaryMuscles)) e.push(`${label} has invalid secondary muscles.`);
    });

    const rtIds = new Set();
    d.routines.forEach((r, i) => {
      const label = r && r.name ? `Routine "${r.name}"` : `Routine ${i + 1}`;
      if (!r || typeof r !== 'object') { e.push(`${label} is not an object.`); return; }
      if (typeof r.id !== 'string' || !r.id) e.push(`${label} has no id.`);
      else if (rtIds.has(r.id)) e.push(`Duplicate routine id: ${r.id}.`);
      else rtIds.add(r.id);
      if (typeof r.name !== 'string' || !r.name.trim()) e.push(`${label} has no name.`);
      if (!Array.isArray(r.exercises)) { e.push(`${label} has no exercise list.`); return; }
      const itemIds = new Set();
      r.exercises.forEach((it, j) => {
        if (!it || typeof it !== 'object') { e.push(`${label}, item ${j + 1} is invalid.`); return; }
        if (typeof it.id !== 'string' || !it.id || itemIds.has(it.id)) e.push(`${label}, item ${j + 1} has a missing or duplicate id.`);
        else itemIds.add(it.id);
        if (!exIds.has(it.exerciseId)) e.push(`${label}, item ${j + 1} references an exercise that does not exist.`);
        Validate.itemErrors(it).forEach((err) => e.push(`${label}, item ${j + 1}: ${err.message}`));
      });
    });
    return e;
  },

  /** Checks the outer backup envelope before looking at the data inside. */
  backupEnvelope(obj) {
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return ['The file does not contain a JSON object.'];
    if (obj.kind !== CONFIG.BACKUP_KIND) return ['This file is not an Iron Ledger backup.'];
    if (!obj.data || typeof obj.data !== 'object') return ['The backup contains no data.'];
    if (!Number.isInteger(obj.data.schemaVersion)) return ['The backup has no schema version.'];
    if (obj.data.schemaVersion > CONFIG.SCHEMA_VERSION) {
      return [`The backup uses schema v${obj.data.schemaVersion}, which is newer than this app (v${CONFIG.SCHEMA_VERSION}). Update the app before importing.`];
    }
    return [];
  }
};


/* =======================================================================
   7. MIGRATIONS
   Each entry upgrades data FROM that version to version + 1.
   Example for the future:  1: (d) => { d.sessions = []; d.schemaVersion = 2; return d; }
   Never change stored shapes without adding a migration here.
   ======================================================================= */
const Migrations = {
  steps: {},
  run(data) {
    let d = data;
    while (d.schemaVersion < CONFIG.SCHEMA_VERSION) {
      const step = this.steps[d.schemaVersion];
      if (!step) throw new AppError(`No migration exists from schema v${d.schemaVersion}.`);
      d = step(Util.clone(d));
    }
    return d;
  }
};


/* =======================================================================
   8. STORAGE SERVICE
   The ONLY module allowed to touch localStorage. Swapping to IndexedDB or a
   cloud backend later means replacing this object, nothing else.
   ======================================================================= */
const StorageService = {
  available() {
    try {
      const k = 'ironLedger.v2.__probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (_) { return false; }
  },
  /** @returns {{status:'empty'|'ok'|'corrupt', value?:any, raw?:string}} */
  loadData() {
    const raw = localStorage.getItem(CONFIG.KEYS.DATA);
    if (raw == null) return { status: 'empty' };
    try { return { status: 'ok', value: JSON.parse(raw), raw }; }
    catch (_) { return { status: 'corrupt', raw }; }
  },
  saveData(data) {
    try {
      const json = JSON.stringify(data);
      localStorage.setItem(CONFIG.KEYS.DATA, json);
      return { ok: true, bytes: json.length };
    } catch (error) { return { ok: false, error }; }
  },
  clearData() { localStorage.removeItem(CONFIG.KEYS.DATA); },
  /** Preserves unreadable data instead of silently discarding it. */
  keepRecoveryCopy(raw) {
    const key = CONFIG.KEYS.RECOVERY_PREFIX + new Date().toISOString().replace(/[:.]/g, '-');
    try { localStorage.setItem(key, raw); return key; } catch (_) { return null; }
  },
  dataSize() {
    const raw = localStorage.getItem(CONFIG.KEYS.DATA);
    return raw ? raw.length : 0;
  }
};


/* =======================================================================
   9. STORE
   Holds the in-memory dataset. Every change goes through transact():
     clone -> mutate the clone -> validate -> persist -> swap in.
   If validation or saving fails, the previous state is untouched, so the
   in-memory and stored data can never diverge.
   ======================================================================= */
const Store = (() => {
  let data = null;
  let persistent = true;
  const notices = [];

  function persist(d) {
    if (!persistent) return;
    const r = StorageService.saveData(d);
    if (!r.ok) throw new AppError('Could not save. Device storage may be full or blocked. Your previous data is unchanged.');
  }

  function recover(raw, reason) {
    const key = StorageService.keepRecoveryCopy(raw);
    data = Seed.build();
    persist(data);
    notices.push(`${reason} ${key ? `The unreadable data was preserved under the key "${key}". ` : ''}Sample data has been loaded.`);
  }

  function init() {
    if (!StorageService.available()) {
      persistent = false;
      data = Seed.build();
      notices.push('This browser is blocking local storage. Changes will be lost when you close the page.');
      return;
    }
    const res = StorageService.loadData();
    if (res.status === 'empty') {               // first run: seed exactly once
      data = Seed.build();
      persist(data);
      return;
    }
    if (res.status === 'corrupt') { recover(res.raw, 'Saved data could not be read.'); return; }

    const stored = res.value;
    if (stored && Number.isInteger(stored.schemaVersion) && stored.schemaVersion > CONFIG.SCHEMA_VERSION) {
      // Data from a newer build: never overwrite it. Run read-only on sample data.
      persistent = false;
      data = Seed.build();
      notices.push('Saved data comes from a newer version of Iron Ledger and was left untouched. Changes here will not be saved.');
      return;
    }
    try {
      const migrated = Migrations.run(stored);
      const errors = Validate.dataset(migrated);
      if (errors.length) { recover(res.raw, `Saved data failed an integrity check (${errors[0]})`); return; }
      data = migrated;
      if (migrated !== stored) persist(data); // only write when a migration changed something
    } catch (err) {
      recover(res.raw, `Saved data could not be upgraded (${err.message}).`);
    }
  }

  function transact(mutator) {
    const draft = Util.clone(data);
    const result = mutator(draft);
    draft.meta.updatedAt = Util.now();
    const errors = Validate.dataset(draft);
    if (errors.length) {
      console.error('Integrity check failed', errors);
      throw new AppError('That change was blocked because it would make your data inconsistent.', errors);
    }
    persist(draft);
    data = draft;
    return result;
  }

  /** Replaces the entire dataset (import / reset). Validates first. */
  function replace(next) {
    const errors = Validate.dataset(next);
    if (errors.length) throw new AppError('The data is not valid and was not loaded.', errors);
    persist(next);
    data = next;
  }

  return {
    init,
    transact,
    replace,
    get: () => data,
    isPersistent: () => persistent,
    takeNotices: () => notices.splice(0)
  };
})();


/* =======================================================================
   10. CALCULATIONS
   Rule 4: one implementation per metric. UI code must call these and never
   re-derive counts itself. Completed-session metrics will live here too.
   ======================================================================= */
const Calc = {
  routineExerciseCount(routine) {
    return routine.exercises.length;
  },
  /** Alpha 1 routines prescribe working sets only (warm-ups come with sessions). */
  routineWorkingSets(routine) {
    return routine.exercises.reduce((sum, it) => sum + (Number.isInteger(it.sets) ? it.sets : 0), 0);
  },
  /**
   * Primary muscles ranked by prescribed working sets.
   * Ties keep the order in which muscles first appear in the routine.
   */
  routineMuscleFocus(routine, getExercise, limit = 3) {
    const tally = new Map();
    routine.exercises.forEach((it) => {
      const ex = getExercise(it.exerciseId);
      if (!ex) return;
      tally.set(ex.primaryMuscle, (tally.get(ex.primaryMuscle) || 0) + (Number.isInteger(it.sets) ? it.sets : 0));
    });
    return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, limit).map(([m]) => m);
  },
  /** Calendar week containing `date`, honouring the week-start setting. */
  weekDays(date, weekStart) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const startIdx = weekStart === 'sunday' ? 0 : 1;
    const offset = (d.getDay() - startIdx + 7) % 7;
    const start = new Date(d);
    start.setDate(d.getDate() - offset);
    return Array.from({ length: 7 }, (_, i) => {
      const day = new Date(start);
      day.setDate(start.getDate() + i);
      return day;
    });
  }
};


/* =======================================================================
   11. FORMATTING (display only)
   ======================================================================= */
const Fmt = {
  rest(sec) {
    if (!Number.isInteger(sec)) return '–';
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  },
  range(a, b) {
    if (!Number.isInteger(a) || !Number.isInteger(b)) return '–';
    return a === b ? String(a) : `${a}–${b}`;
  },
  longDate(d) { return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); },
  shortDate(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); },
  weekdayInitial(d) { return d.toLocaleDateString(undefined, { weekday: 'short' }); },
  plural(n, one, many) { return `${n} ${n === 1 ? one : (many || one + 's')}`; },
  bytes(n) { return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`; },
  sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); },
  /** "Chest, shoulders and triceps" */
  muscleList(ids) {
    const labels = ids.map((id, i) => (i === 0 ? Tax.label('muscles', id) : Tax.label('muscles', id).toLowerCase()));
    if (labels.length <= 1) return labels[0] || 'No exercises yet';
    return `${labels.slice(0, -1).join(', ')} and ${labels[labels.length - 1]}`;
  },
  exerciseMeta(ex) {
    return `${Tax.label('muscles', ex.primaryMuscle)}, ${Tax.label('equipment', ex.equipment).toLowerCase()}`;
  }
};


/* =======================================================================
   12. SERVICES
   Business logic. Services read via Store.get() and write via
   Store.transact(); they never touch the DOM or localStorage.
   ======================================================================= */
const ExerciseService = {
  list() { return Store.get().exercises; },
  get(id) { return Store.get().exercises.find((x) => x.id === id) || null; },

  searchText(ex) {
    return Util.normalize([
      ex.name,
      Tax.label('muscles', ex.primaryMuscle),
      ...ex.secondaryMuscles.map((m) => Tax.label('muscles', m)),
      Tax.label('equipment', ex.equipment),
      Tax.label('movements', ex.movementPattern),
      ex.mechanic
    ].join(' '));
  },

  /**
   * Single query implementation shared by the library and the picker.
   * sort 'name'       -> alphabetical (library)
   * sort 'preference' -> favourites first, do-not-use last (picker)
   */
  query({ q = '', muscle = 'all', equipment = 'all', favourites = false, sort = 'name' } = {}) {
    const tokens = Util.normalize(q).split(' ').filter(Boolean);
    const rank = { favourite: 0, neutral: 1, avoid: 2, 'do-not-use': 3 };
    return this.list()
      .filter((x) => x.active)
      .filter((x) => muscle === 'all' || x.primaryMuscle === muscle)
      .filter((x) => equipment === 'all' || x.equipment === equipment)
      .filter((x) => !favourites || x.preference === 'favourite')
      .filter((x) => { if (!tokens.length) return true; const h = this.searchText(x); return tokens.every((t) => h.includes(t)); })
      .sort((a, b) => (sort === 'preference' ? rank[a.preference] - rank[b.preference] : 0) || a.name.localeCompare(b.name));
  },

  nameTaken(name, exceptId) {
    const n = Util.normalize(name);
    return this.list().some((x) => x.id !== exceptId && Util.normalize(x.name) === n);
  },

  validateDraft(draft, exceptId) {
    const errors = {};
    if (!String(draft.name || '').trim()) errors.name = 'Enter a name for the exercise.';
    else if (this.nameTaken(draft.name, exceptId)) errors.name = 'An exercise with this name already exists.';
    return errors;
  },

  create(draft) {
    const errors = this.validateDraft(draft, null);
    if (Object.keys(errors).length) throw new AppError(Object.values(errors)[0]);
    return Store.transact((d) => {
      const taken = new Set(d.exercises.map((x) => x.id));
      const ex = Models.exercise({ ...draft, id: Id.unique('ex', taken), isCustom: true, preference: 'neutral' });
      d.exercises.push(ex);
      return ex.id;
    });
  },

  /** Editable descriptive fields only; id, custom flag, preference and history links are preserved. */
  update(id, draft) {
    const errors = this.validateDraft(draft, id);
    if (Object.keys(errors).length) throw new AppError(Object.values(errors)[0]);
    return Store.transact((d) => {
      const i = d.exercises.findIndex((x) => x.id === id);
      if (i < 0) throw new AppError('This exercise no longer exists.');
      const prev = d.exercises[i];
      d.exercises[i] = Models.exercise({
        ...prev,
        name: draft.name, primaryMuscle: draft.primaryMuscle, secondaryMuscles: draft.secondaryMuscles,
        equipment: draft.equipment, movementPattern: draft.movementPattern, mechanic: draft.mechanic,
        defaultRestSec: draft.defaultRestSec, instructions: draft.instructions, notes: draft.notes,
        machineSettings: draft.machineSettings,
        updatedAt: Util.now()
      });
      return id;
    });
  },

  setPreference(id, preference) {
    if (!Tax.has('preferences', preference)) throw new AppError('Unknown preference.');
    Store.transact((d) => {
      const ex = d.exercises.find((x) => x.id === id);
      if (!ex) throw new AppError('This exercise no longer exists.');
      ex.preference = preference;
      ex.updatedAt = Util.now();
    });
  },

  routinesUsing(id) {
    return Store.get().routines.filter((r) => r.exercises.some((it) => it.exerciseId === id));
  }
};

const RoutineService = {
  list() { return Store.get().routines; },
  get(id) { return Store.get().routines.find((r) => r.id === id) || null; },

  nameTaken(name, exceptId) {
    const n = Util.normalize(name);
    return this.list().some((r) => r.id !== exceptId && Util.normalize(r.name) === n);
  },

  newDraft() { return Models.routine({ id: null, name: '', description: '', exercises: [] }); },
  draftFrom(id) { const r = this.get(id); return r ? Util.clone(r) : null; },

  /** @returns {{name:string|null, items:Object<string,Array>, count:number}} */
  validateDraft(draft) {
    const errors = { name: null, items: {}, count: 0 };
    if (!draft.name.trim()) errors.name = 'Enter a name for the routine.';
    else if (this.nameTaken(draft.name, draft.id)) errors.name = 'Another routine already uses this name.';
    draft.exercises.forEach((it) => {
      const e = Validate.itemErrors(it);
      if (e.length) errors.items[it.id] = e;
    });
    errors.count = (errors.name ? 1 : 0) + Object.values(errors.items).reduce((n, list) => n + list.length, 0);
    return errors;
  },

  /** Creates or replaces a routine from an editor draft. Returns the routine id. */
  save(draft) {
    const errors = this.validateDraft(draft);
    if (errors.count) throw new AppError('Fix the highlighted fields before saving.');
    return Store.transact((d) => {
      const t = Util.now();
      const clean = Models.routine({ ...draft, updatedAt: t });
      if (!clean.id) {
        clean.id = Id.unique('rt', new Set(d.routines.map((r) => r.id)));
        clean.createdAt = t;
        d.routines.push(clean);
      } else {
        const i = d.routines.findIndex((r) => r.id === clean.id);
        if (i < 0) throw new AppError('This routine no longer exists.');
        d.routines[i] = clean; // replaced in place so list order is kept
      }
      return clean.id;
    });
  },

  rename(id, name) {
    const trimmed = String(name || '').trim();
    if (!trimmed) throw new AppError('Enter a name for the routine.');
    if (this.nameTaken(trimmed, id)) throw new AppError('Another routine already uses this name.');
    Store.transact((d) => {
      const r = d.routines.find((x) => x.id === id);
      if (!r) throw new AppError('This routine no longer exists.');
      r.name = trimmed;
      r.updatedAt = Util.now();
    });
  },

  copyName(base) {
    let name = `${base} (copy)`;
    let n = 2;
    while (this.nameTaken(name, null)) name = `${base} (copy ${n++})`;
    return name;
  },

  /** Full independent copy: new routine id AND new item ids. Inserted after the original. */
  duplicate(id) {
    const src = this.get(id);
    if (!src) throw new AppError('This routine no longer exists.');
    const name = this.copyName(src.name);
    return Store.transact((d) => {
      const t = Util.now();
      const itemIds = new Set();
      const copy = Models.routine({
        ...Util.clone(src),
        id: Id.unique('rt', new Set(d.routines.map((r) => r.id))),
        name, createdAt: t, updatedAt: t,
        exercises: src.exercises.map((it) => {
          const itemId = Id.unique('ri', itemIds);
          itemIds.add(itemId);
          return { ...it, id: itemId };
        })
      });
      const at = d.routines.findIndex((r) => r.id === id);
      d.routines.splice(at + 1, 0, copy);
      return copy.id;
    });
  },

  /** Deletes the template only. Exercises in the library are never touched. */
  remove(id) {
    Store.transact((d) => {
      const before = d.routines.length;
      d.routines = d.routines.filter((r) => r.id !== id);
      if (d.routines.length === before) throw new AppError('This routine no longer exists.');
    });
  }
};

/** Pure operations on an UNSAVED routine draft held by the editor. */
const RoutineDraft = {
  addExercises(draft, exerciseIds) {
    const taken = new Set(draft.exercises.map((it) => it.id));
    exerciseIds.forEach((exId) => {
      const ex = ExerciseService.get(exId);
      if (!ex) return;
      const id = Id.unique('ri', taken);
      taken.add(id);
      const iso = ex.mechanic === 'isolation';
      draft.exercises.push(Models.routineItem({
        id, exerciseId: ex.id, sets: 3,
        repMin: iso ? 10 : 8, repMax: iso ? 15 : 12,
        rirMin: 1, rirMax: 2, restSec: ex.defaultRestSec
      }));
    });
  },
  remove(draft, itemId) { draft.exercises = draft.exercises.filter((it) => it.id !== itemId); },
  move(draft, itemId, dir) {
    const i = draft.exercises.findIndex((it) => it.id === itemId);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= draft.exercises.length) return false;
    const list = draft.exercises;
    [list[i], list[j]] = [list[j], list[i]];
    return true;
  },
  item(draft, itemId) { return draft.exercises.find((it) => it.id === itemId) || null; }
};

const BackupService = {
  build() {
    return {
      kind: CONFIG.BACKUP_KIND,
      app: CONFIG.APP_NAME,
      appVersion: CONFIG.APP_VERSION,
      exportedAt: Util.now(),
      data: Util.clone(Store.get()) // the complete persistent dataset
    };
  },
  filename(date = new Date()) {
    const p = (n) => String(n).padStart(2, '0');
    return `iron-ledger-backup-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}-${p(date.getHours())}${p(date.getMinutes())}.json`;
  },
  /** Parses and fully validates backup text WITHOUT touching current data. */
  parse(text) {
    let obj;
    try { obj = JSON.parse(text); } catch (_) { return { ok: false, errors: ['The file is not valid JSON.'] }; }
    const envelope = Validate.backupEnvelope(obj);
    if (envelope.length) return { ok: false, errors: envelope };
    let data;
    try { data = Migrations.run(Util.clone(obj.data)); }
    catch (err) { return { ok: false, errors: [err.message] }; }
    const errors = Validate.dataset(data);
    if (errors.length) return { ok: false, errors };
    return {
      ok: true, data,
      summary: { exportedAt: obj.exportedAt, routines: data.routines.length, exercises: data.exercises.length }
    };
  },
  apply(data) { Store.replace(data); },
  /** Restores seed data AND default settings. */
  reset() { Store.replace(Seed.build()); }
};

/** Opens a native <dialog>. Falls back to the open attribute where showModal is missing. */
function showDialog(el) {
  if (typeof el.showModal === 'function') { if (!el.open) el.showModal(); }
  else el.setAttribute('open', '');
}
function hideDialog(el) {
  if (typeof el.close === 'function' && el.open) el.close();
  else el.removeAttribute('open');
}

/**
 * Promise-based dialogs on one reusable <dialog id="dialog">:
 *   Dialog.confirm / Dialog.alert / Dialog.prompt / Dialog.sheet
 */
const Dialog = (() => {
  let resolver = null;
  let returnFocus = null;
  let validator = null;
  const el = () => $('#dialog');

  function open(html, { sheet = false, validate = null } = {}) {
    if (resolver) finish(null);
    returnFocus = document.activeElement;
    validator = validate;
    const d = el();
    d.className = sheet ? 'sheet' : '';
    d.innerHTML = html;
    return new Promise((resolve) => {
      resolver = resolve;
      showDialog(d);
      const first = $('input', d) || $('[data-dialog-default]', d) || $('button', d);
      if (first) first.focus();
      if (first && first.select && first.tagName === 'INPUT') first.select();
    });
  }

  function finish(value) {
    const d = el();
    const r = resolver;
    resolver = null;
    validator = null;
    hideDialog(d);
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    if (r) r(value);
  }

  function submitPrompt() {
    const d = el();
    const input = $('input', d);
    const value = input ? input.value : '';
    if (validator) {
      const msg = validator(value);
      const errEl = $('.field-error', d);
      if (msg) {
        errEl.textContent = msg;
        errEl.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
    }
    finish(value);
  }

  function bind() {
    const d = el();
    d.addEventListener('click', (e) => {
      if (e.target === d) { finish(null); return; }        // backdrop tap
      const b = e.target.closest('[data-dialog]');
      if (!b) return;
      const v = b.dataset.dialog;
      if (v === 'cancel') finish(null);
      else if (v === 'submit') submitPrompt();
      else finish(v);
    });
    d.addEventListener('cancel', (e) => { e.preventDefault(); finish(null); }); // Escape key
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submitPrompt(); }
    });
  }

  return {
    bind,
    confirm({ title, message = '', confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
      return open(`<div class="dlg" role="document">
          <h2 id="dlg-title">${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          <div class="dlg__actions">
            <button type="button" class="btn btn-secondary" data-dialog="cancel" data-dialog-default>${esc(cancelLabel)}</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dialog="ok">${esc(confirmLabel)}</button>
          </div></div>`).then((v) => v === 'ok');
    },
    alert({ title, message = '', errors = [] }) {
      return open(`<div class="dlg" role="document">
          <h2>${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          ${errors.length ? `<ul class="errors">${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
          <div class="dlg__actions"><button type="button" class="btn btn-primary" data-dialog="ok">OK</button></div>
        </div>`);
    },
    prompt({ title, label, value = '', message = '', confirmLabel = 'Save', danger = false, maxLength = 60, validate = null, placeholder = '' }) {
      return open(`<div class="dlg" role="document">
          <h2>${esc(title)}</h2>
          ${message ? `<p>${esc(message)}</p>` : ''}
          <div class="field">
            <label for="dlg-input">${esc(label)}</label>
            <input id="dlg-input" type="text" value="${esc(value)}" maxlength="${maxLength}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(placeholder)}">
            <p class="field-error" role="alert" hidden></p>
          </div>
          <div class="dlg__actions">
            <button type="button" class="btn btn-secondary" data-dialog="cancel">Cancel</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-dialog="submit">${esc(confirmLabel)}</button>
          </div></div>`, { validate });
    },
    sheet({ title, actions }) {
      return open(`<div role="document">
          <h2 class="sheet__title">${esc(title)}</h2>
          <div class="sheet__actions">
            ${actions.map((a) => `<button type="button" class="sheet__btn ${a.danger ? 'sheet__btn--danger' : ''}" data-dialog="${esc(a.id)}">${icon(a.icon)}<span>${esc(a.label)}</span></button>`).join('')}
            <button type="button" class="sheet__btn sheet__cancel" data-dialog="cancel">Cancel</button>
          </div></div>`, { sheet: true });
    }
  };
})();

  libraryRows(list) {
    if (!list.length) return '<li class="empty"><p>No exercises match. Try a different search or clear the filters.</p></li>';
    return list.map((ex) => `<li><a class="xrow" href="#/exercise/${esc(ex.id)}">
        <span class="xrow__body"><span class="xrow__name">${esc(ex.name)}</span><span class="xrow__meta">${esc(Fmt.exerciseMeta(ex))}</span></span>
        ${Partials.prefTags(ex)}${icon('chevron', 'xrow__chev')}</a></li>`).join('');
  },

  pickerRows(list, selected, inRoutine) {
    if (!list.length) return '<li class="empty"><p>No exercises match. Try a different search or clear the filters.</p></li>';
    return list.map((ex) => {
      const pos = selected.indexOf(ex.id);
      const on = pos >= 0;
      return `<li><button type="button" class="xrow" data-action="pick-toggle" data-id="${esc(ex.id)}" aria-pressed="${on}">
          <span class="pick-badge num" aria-hidden="true">${on ? pos + 1 : ''}</span>
          <span class="xrow__body"><span class="xrow__name">${esc(ex.name)}</span>
          <span class="xrow__meta">${esc(Fmt.exerciseMeta(ex))}${inRoutine.has(ex.id) ? ', already in routine' : ''}</span></span>
          ${Partials.prefTags(ex)}</button></li>`;
    }).join('');
  },

  /** Filter controls shared by library ('lib') and picker ('pick'). */
  filters(scope, f) {
    const chip = (key, value, label, pressed) =>
      `<button type="button" class="chip" data-action="filter" data-scope="${scope}" data-key="${key}" data-value="${esc(value)}" aria-pressed="${pressed}">${label}</button>`;
    return `
      <div class="search">${icon('search')}
        <label class="sr-only" for="${scope}-q">Search exercises</label>
        <input id="${scope}-q" type="search" placeholder="Search exercises" autocomplete="off" enterkeyhint="search"
          data-filter="${scope}" value="${esc(f.q)}">
      </div>
      <div class="chips" role="group" aria-label="Filter by muscle">
        ${chip('muscle', 'all', 'All muscles', f.muscle === 'all')}
        ${Tax.filterMuscles().map((m) => chip('muscle', m.id, esc(m.label), f.muscle === m.id)).join('')}
      </div>
      <div class="chips" role="group" aria-label="Filter by equipment">
        ${chip('favourites', 'toggle', `${icon('star')}Favourites`, f.favourites)}
        ${chip('equipment', 'all', 'All equipment', f.equipment === 'all')}
        ${TAXONOMY.equipment.map((e) => chip('equipment', e.id, esc(e.label), f.equipment === e.id)).join('')}
      </div>`;
  },

  restOptions(selected) {
    const opts = [];
    for (let s = 0; s <= 300; s += CONFIG.REST_STEP_SEC) opts.push(s);
    [360, 420, 480, 600].forEach((s) => opts.push(s));
    if (Number.isInteger(selected) && !opts.includes(selected)) { opts.push(selected); opts.sort((a, b) => a - b); }
    return opts.map((s) => `<option value="${s}" ${s === selected ? 'selected' : ''}>${Fmt.rest(s)}</option>`).join('');
  },

  radioGroup({ id, label, options, value, action, key }) {
    return `<div class="segmented" role="radiogroup" aria-labelledby="${id}">
      ${options.map((o) => `<button type="button" role="radio" aria-checked="${o.id === value}" data-action="${action}" data-key="${key}" data-value="${esc(o.id)}">${esc(o.label)}</button>`).join('')}
    </div>`;
  }
};

          name: ex.name, primaryMuscle: ex.primaryMuscle, secondaryMuscles: [...ex.secondaryMuscles],

        };

        draft = {

        };
