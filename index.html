  secondaryChips(d) {
    return TAXONOMY.muscles.filter((m) => m.id !== d.primaryMuscle).map((m) => {
      const on = d.secondaryMuscles.includes(m.id);
      return `<button type="button" class="chip" data-action="toggle-secondary" data-value="${esc(m.id)}" aria-pressed="${on}"><span class="chip__check">${icon('check')}</span>${esc(m.label)}</button>`;
    }).join('');
  }
};


/* =======================================================================
   14b. PLANNING, PROGRESS AND SETTINGS VIEWS
   Every value is real: schedule entries, completed sessions, goals and
   settings. Nothing here renders demo data.
   ======================================================================= */
Object.assign(Views, {
  /* ---------------- WORKOUT › SCHEDULE ---------------- */
  schedule() {
    const today = DateKey.today();
    const missed = ScheduleService.missed(CONFIG.SCHEDULE_WINDOW_DAYS);
    const weekStart = SettingsService.get().weekStart;
    const thisWeek = Calc.weekDays(Clock.date(), weekStart).map((d) => DateKey.of(d));
    const nextWeek = thisWeek.map((k) => DateKey.add(k, 7));
    const plan = ScheduleService.sc().plan;
    const order = weekStart === 'sunday' ? ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'] : ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const hasPlan = ScheduleService.hasPlan();
    return `
      ${missed.length ? `<section class="section" aria-labelledby="sm-h">
        <div class="section-head"><h2 class="section-title" id="sm-h">Missed</h2></div>
        <div class="stack">${missed.map((en) => Partials.missedCard(en)).join('')}</div>
      </section>` : ''}

      <section class="section" aria-labelledby="sw-h">
        <div class="section-head"><h2 class="section-title" id="sw-h">This week</h2>
          <span class="meta num">${esc(Fmt.shortDate(DateKey.toDate(thisWeek[0])))} – ${esc(Fmt.shortDate(DateKey.toDate(thisWeek[6])))}</span></div>
        <ol class="sched">${thisWeek.map((k) => Views.scheduleDay(k, today)).join('')}</ol>
      </section>

      <section class="section" aria-labelledby="sn-h">
        <div class="section-head"><h2 class="section-title" id="sn-h">Next week</h2></div>
        <ol class="sched">${nextWeek.map((k) => Views.scheduleDay(k, today)).join('')}</ol>
      </section>

      <section class="section" aria-labelledby="sp-h">
        <div class="section-head"><h2 class="section-title" id="sp-h">Weekly plan</h2></div>
        ${hasPlan ? '' : '<p class="desc">Assign routines to weekdays. Iron Ledger fills in your schedule from this plan.</p>'}
        <ul class="plan">${order.map((k) => {
          const names = plan[k].map((id) => (RoutineService.get(id) || {}).name).filter(Boolean);
          return `<li><button type="button" class="plan__row" data-action="plan-day" data-day="${k}">
            <span class="plan__day">${esc(Tax.label('weekdays', k))}</span>
            <span class="plan__val ${names.length ? '' : 'is-rest'}">${names.length ? esc(names.join(' + ')) : 'Rest'}</span>
            ${icon('chevron', 'xrow__chev')}</button></li>`;
        }).join('')}</ul>
        <p class="hint">Plan changes apply from today onward. Past days keep what happened.</p>
      </section>`;
  },

  scheduleDay(key, today) {
    const entries = ScheduleService.on(key);
    const isToday = key === today;
    const d = DateKey.toDate(key);
    const status = (en) => {
      if (en.status === 'completed') return `<span class="tag tag--fav">${icon('check')}Done</span>`;
      if (en.status === 'skipped') return '<span class="tag">Skipped</span>';
      if (en.status === 'moved') return `<span class="tag">Moved to ${esc(Fmt.relDay(en.movedTo))}</span>`;
      if (ScheduleService.isMissed(en)) return '<span class="tag tag--avoid">Missed</span>';
      return '';
    };
    return `<li class="sday ${isToday ? 'is-today' : ''}" ${isToday ? 'aria-current="date"' : ''}>
      <span class="sday__date"><span>${esc(Fmt.weekdayInitial(d))}</span><b class="num">${d.getDate()}</b></span>
      <span class="sday__body">
        ${entries.length ? entries.map((en) => `<span class="sday__entry ${en.status === 'moved' ? 'is-moved' : ''}">
            <span class="sday__name">${esc(ScheduleService.routineName(en))}</span>${status(en)}
            ${en.status === 'moved' ? '' : `<button type="button" class="icon-btn" data-action="entry-menu" data-entry="${esc(en.id)}" aria-label="Options for ${esc(ScheduleService.routineName(en))} on ${esc(Fmt.dayLabel(key))}">${icon('dots')}</button>`}
          </span>`).join('') : '<span class="sday__rest">Rest</span>'}
        ${isToday ? '<span class="sday__today">Today</span>' : ''}
      </span>
      ${key >= today ? `<button type="button" class="icon-btn" data-action="schedule-add" data-date="${key}" aria-label="Add a workout on ${esc(Fmt.dayLabel(key))}">${icon('plus')}</button>` : '<span class="sday__spacer"></span>'}
    </li>`;
  },

  /* ---------------- WORKOUT › HISTORY (real, completed sessions only) ---------------- */
  history() {
    const mode = UIState.ui.historyMode;
    const all = SessionService.list();
    return `
      <div class="hist-tools">
        <div class="search">${icon('search')}
          <label class="sr-only" for="hist-q">Search workouts</label>
          <input id="hist-q" type="search" placeholder="Search workouts or exercises" data-hist-search value="${esc(UIState.ui.historyQuery || '')}" ${all.length ? '' : 'disabled'}>
        </div>
      </div>
      <div class="hist-mode">${Partials.uiChoice({ label: 'History view', key: 'historyMode', options: [['list', 'List'], ['calendar', 'Calendar']] })}</div>
      ${mode === 'calendar' ? Views.calendar(all) : ''}
      ${all.length ? (mode === 'calendar' ? '' : `<div id="hist-results">${Views.historyList()}</div>`) : `
        <div class="empty">
          <div class="empty__mark">${icon('list')}</div>
          <h2>No workout history yet.</h2>
          <p>Completed workouts appear here, grouped by date.</p>
          <a class="btn btn-primary" href="#/home">${icon('play')}Start a workout</a>
        </div>`}`;
  },

  historyList() {
    const q = Util.normalize(UIState.ui.historyQuery || '');
    const list = SessionService.list().filter((ws) => !q
      || Util.normalize([ws.sourceRoutineName, ...ws.exercises.map((x) => x.nameSnapshot)].join(' ')).includes(q));
    if (!list.length) return '<p class="hint">No workouts match that search.</p>';
    const groups = [];
    list.forEach((ws) => {
      const m = Fmt.monthYear(ws.startedAt);
      if (!groups.length || groups[groups.length - 1].m !== m) groups.push({ m, items: [] });
      groups[groups.length - 1].items.push(ws);
    });
    return groups.map((g) => `<section class="hgroup"><h2 class="group-head">${esc(g.m)}</h2>
      <div class="wcards">${g.items.map((ws) => Partials.sessionCard(ws)).join('')}</div></section>`).join('');
  },

  /**
   * Month calendar. Each day shows its state as a symbol AND text (not colour alone):
   *   ✓ completed workout · ○ scheduled · ✕ missed · – skipped · blank = rest day
   */
  calendar(sessions = []) {
    const weekStart = SettingsService.get().weekStart;
    const today = DateKey.today();
    const month = UIState.ui.calMonth || today.slice(0, 7);
    const first = DateKey.toDate(`${month}-01`);
    const lead = (first.getDay() - (weekStart === 'sunday' ? 0 : 1) + 7) % 7;
    const daysIn = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const heads = Calc.weekDays(first, weekStart).map((d) => d.toLocaleDateString(undefined, { weekday: 'narrow' }));
    const byDay = new Map();
    sessions.forEach((ws) => { const k = DateKey.of(new Date(ws.startedAt)); byDay.set(k, (byDay.get(k) || []).concat(ws)); });
    const entries = ScheduleService.visible();
    const state = (k) => {
      if (byDay.has(k)) return ['done', '✓', 'workout completed'];
      const ens = entries.filter((en) => en.date === k && en.status !== 'moved' && en.status !== 'completed');
      if (ens.some((en) => ScheduleService.isMissed(en))) return ['missed', '✕', 'missed'];
      if (ens.some((en) => en.status === 'planned')) return ['planned', '○', 'scheduled'];
      if (ens.some((en) => en.status === 'skipped')) return ['skipped', '–', 'skipped'];
      return ['rest', '', 'rest day'];
    };
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<span class="cal__cell" aria-hidden="true"></span>');
    for (let n = 1; n <= daysIn; n++) {
      const k = `${month}-${String(n).padStart(2, '0')}`;
      const [cls, mark, word] = state(k);
      cells.push(`<button type="button" class="cal__cell cal__cell--${cls} ${k === today ? 'is-today' : ''} ${k === UIState.ui.calDay ? 'is-selected' : ''}" data-action="cal-day" data-date="${k}"
        ${k === today ? 'aria-current="date"' : ''} aria-label="${esc(Fmt.dayLabel(k))}, ${word}"><span class="num">${n}</span><span class="cal__mark" aria-hidden="true">${mark}</span></button>`);
    }
    const sel = UIState.ui.calDay && UIState.ui.calDay.startsWith(month) ? UIState.ui.calDay : null;
    let details = '';
    if (sel) {
      const ws = byDay.get(sel) || [];
      const ens = entries.filter((en) => en.date === sel);
      details = `<div class="cal__day"><p class="cal__dayhead">${esc(Fmt.dayLabel(sel))}</p>
        ${ws.map((x) => Partials.sessionCard(x)).join('')}
        ${ens.filter((en) => en.status !== 'completed').map((en) => `<p class="cal__entry">${esc(ScheduleService.routineName(en))}: ${en.status === 'moved' ? `moved to ${esc(Fmt.relDay(en.movedTo))}` : en.status === 'skipped' ? 'skipped' : ScheduleService.isMissed(en) ? 'missed' : 'scheduled'}</p>`).join('')}
        ${!ws.length && !ens.length ? '<p class="cal__entry">Rest day. Nothing logged or scheduled.</p>' : ''}</div>`;
    }
    const prev = DateKey.of(new Date(first.getFullYear(), first.getMonth() - 1, 1)).slice(0, 7);
    const next = DateKey.of(new Date(first.getFullYear(), first.getMonth() + 1, 1)).slice(0, 7);
    return `<div class="cal">
      <div class="cal__nav">
        <button type="button" class="icon-btn" data-action="cal-month" data-month="${prev}" aria-label="Previous month">${icon('back')}</button>
        <p class="cal__month">${esc(first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</p>
        <button type="button" class="icon-btn" data-action="cal-month" data-month="${next}" aria-label="Next month">${icon('chevron')}</button>
      </div>
      <div class="cal__grid" aria-hidden="true">${heads.map((h) => `<span class="cal__head">${esc(h)}</span>`).join('')}</div>
      <div class="cal__grid">${cells.join('')}</div>
      <p class="cal__legend"><span><b>✓</b> Completed</span><span><b>○</b> Scheduled</span><span><b>✕</b> Missed</span><span><b>–</b> Skipped</span><span>Blank: rest</span></p>
      ${details}
    </div>`;
  },

  /* ---------------- PROGRESS ---------------- */
  progress(tab) {
    return `
      ${Partials.mainHead('Progress')}
      ${Partials.tabs('Progress sections', [
        ['overview', 'Overview', '#/progress/overview'],
        ['strength', 'Strength', '#/progress/strength'],
        ['body', 'Body', '#/progress/body'],
        ['photos', 'Photos', '#/progress/photos']
      ], tab)}
      ${{ strength: Views.progressStrength, body: Views.progressBody, photos: Views.progressPhotos }[tab] ? { strength: Views.progressStrength, body: Views.progressBody, photos: Views.progressPhotos }[tab]() : Views.progressOverview()}`;
  },

  progressOverview() {
    const from = Calc.periodStart(UIState.ui.progressPeriod);
    const P = Calc.periodStats(Store.get().sessions, from, null);
    const has = P.workouts > 0;
    const max = Math.max(1, ...Object.values(P.muscles));
    const muscles = Tax.filterMuscles().map((m) => {
      const n = P.muscles[m.id] || 0;
      return `<li class="mbar">
        <span class="mbar__label">${esc(m.label)}</span>
        <span class="mbar__track" aria-hidden="true"><span class="mbar__fill" style="width:${has ? Math.round((n / max) * 100) : 0}%"></span></span>
        <span class="mbar__value num">${has ? `${n} sets` : '—'}</span>
      </li>`;
    }).join('');
    return `
      <div class="ov-controls">
        ${Partials.uiChoice({ label: 'Period', key: 'progressPeriod', options: [['7d', '7D'], ['30d', '30D'], ['3m', '3M'], ['1y', '1Y'], ['all', 'All']] })}
      </div>

      <section class="section" aria-labelledby="ov-t">
        <div class="section-head"><h2 class="section-title" id="ov-t">Training</h2></div>
        ${Partials.tiles([
          ['Workouts', has ? String(P.workouts) : '—'],
          ['Working sets', has ? String(P.workingSets) : '—'],
          ['Training volume', has ? Units.fmtVolume(P.volumeKg) : '—'],
          ['Training time', has ? Fmt.duration(P.durationSec) : '—'],
          ['Average workout', has ? Fmt.duration(P.avgDurationSec) : '—'],
          ['Personal records', has ? String(P.prs) : '—']
        ])}
        ${has ? '<p class="hint">Working sets exclude warm-ups. Volume counts completed working sets only.</p>' : `<div class="empty-inline">${icon('workout')}<p>No workouts in this period. <a href="#/home">Start a workout</a> to see your numbers.</p></div>`}
      </section>

      ${Views.goalsProgress()}

      ${(() => {
        const prs = Calc.prTimeline(Store.get().sessions).filter((p) => !from || Date.parse(p.date) >= from.getTime()).slice(-5).reverse();
        return `<section class="section" aria-labelledby="ov-p"><div class="section-head"><h2 class="section-title" id="ov-p">Recent PRs</h2></div>
          ${prs.length ? `<ul class="prs">${prs.map((p) => `<li><a href="#/history/${esc(p.sessionId)}">${icon('trophy')}<span class="prs__name">${esc(p.exerciseName)}<span class="prs__kind">${esc(Views.prText(p))}</span></span><span class="prs__when">${esc(Fmt.relDay(DateKey.of(new Date(p.date))))}</span></a></li>`).join('')}</ul>`
            : `<div class="empty-inline">${icon('trophy')}<p>No PRs in this period. PRs appear when you beat a previous best on an exercise.</p></div>`}</section>`;
      })()}

      ${(() => {
        const r = Views.transformationRange();
        const t = Views.transformationData(r.from, r.to);
        if (!t.metrics.length && !t.strength.length && !t.photos.length) return '';
        return `<section class="section" aria-labelledby="ov-tr"><div class="section-head"><h2 class="section-title" id="ov-tr">Transformation</h2>
          <a class="link" href="#/progress/transformation">Details${icon('chevron')}</a></div>
          <p class="meta">${esc(Fmt.dayLabel(r.from))} → ${esc(Fmt.dayLabel(r.to))}</p>
          <dl class="spec tr">${Views.transformationRows({ ...t, strength: t.strength.slice(0, 2) })}</dl></section>`;
      })()}

      <section class="section" aria-labelledby="ov-m">
        <div class="section-head"><h2 class="section-title" id="ov-m">Muscle groups</h2><span class="meta">Working sets, by primary muscle</span></div>
        <ul class="mbars">${muscles}</ul>
      </section>`;
  },

  /** Goals with REAL current values only (bodyweight/body-fat are not tracked yet, so they show only the goal). */
  goalsProgress() {
    const g = GoalService.get();
    const any = g.bodyweightKg != null || g.bodyFatPct != null || g.workoutsPerWeek != null || g.strength.length;
    if (!any) {
      return `<section class="section" aria-labelledby="ov-g">
        <div class="section-head"><h2 class="section-title" id="ov-g">Goals</h2></div>
        <a class="next" href="#/more/goals"><span class="next__name">Set your goals</span><span class="next__when">Bodyweight, frequency, strength</span>${icon('chevron', 'xrow__chev')}</a>
      </section>`;
    }
    const days = Calc.weekDays(Clock.date(), SettingsService.get().weekStart);
    const end = new Date(days[6]); end.setDate(end.getDate() + 1);
    const thisWeek = Calc.periodStats(Store.get().sessions, days[0], end).workouts;
    const row = (k, cur, goal, tag = '') => `<div><dt>${esc(k)}</dt><dd><span class="goal-cur">Current: ${cur}</span><span class="goal-target">Goal: ${goal}</span>${tag}</dd></div>`;
    const unit = Units.current();
    const lw = Calc.latestBody(Store.get().body.entries, 'weightKg');
    const lf = Calc.latestBody(Store.get().body.entries, 'bodyFatPct');
    return `<section class="section" aria-labelledby="ov-g">
      <div class="section-head"><h2 class="section-title" id="ov-g">Goals</h2><a class="link" href="#/more/goals">Edit${icon('chevron')}</a></div>
      <dl class="spec goals">
        ${g.bodyweightKg != null ? row('Bodyweight', lw ? esc(Units.metric('weightKg', lw.v)) : '—', `${esc(Units.fmt(g.bodyweightKg))} ${unit}`) : ''}
        ${g.bodyFatPct != null ? row('Body fat', lf ? esc(Units.metric('bodyFatPct', lf.v)) : '—', `${g.bodyFatPct}%`) : ''}
        ${g.workoutsPerWeek != null ? row('Workouts this week', String(thisWeek), `${g.workoutsPerWeek} per week`, thisWeek >= g.workoutsPerWeek ? '<span class="tag tag--fav">Reached</span>' : '') : ''}
        ${g.strength.map((sg) => {
          const p = GoalService.strengthProgress(sg);
          const name = (ExerciseService.get(sg.exerciseId) || {}).name || sg.exerciseNameSnapshot;
          const target = `${esc(Units.fmt(sg.targetWeightKg))} ${unit}${sg.targetReps ? ` × ${sg.targetReps}` : ''}${sg.targetDate ? ` by ${esc(Fmt.relDay(sg.targetDate))}` : ''}`;
          const cur = p.best ? `${esc(Units.fmt(p.best.weightKg))} ${unit} × ${p.best.reps}` : '—';
          return row(name, cur, target, p.reached ? '<span class="tag tag--fav">Reached</span>' : '');
        }).join('')}
      </dl>
      ${(g.bodyweightKg != null && !lw) || (g.bodyFatPct != null && !lf) ? '<p class="hint"><a href="#/progress/body/new">Record a measurement</a> to see your current values.</p>' : ''}
    </section>`;
  },

  progressStrength() {
    const sessions = Store.get().sessions;
    const performed = new Set();
    SessionService.list().forEach((ws) => ws.exercises.forEach((x) => { if (x.sets.some((st) => st.completed)) performed.add(x.performedExerciseId); }));
    const list = ExerciseService.query({ sort: 'name' });
    let id = UIState.ui.strengthExercise;
    if (!id || !ExerciseService.get(id)) id = [...performed][0] || (list[0] && list[0].id) || null;
    const ex = id ? ExerciseService.get(id) : null;
    const opts = (arr) => arr.map((x) => `<option value="${esc(x.id)}" ${x.id === id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
    const logged = list.filter((x) => performed.has(x.id));
    const others = list.filter((x) => !performed.has(x.id));
    return `
      <div class="field">
        <label for="str-ex">Exercise</label>
        <select id="str-ex" data-ui="strengthExercise">
          ${logged.length ? `<optgroup label="Logged">${opts(logged)}</optgroup><optgroup label="Not logged yet">${opts(others)}</optgroup>` : opts(list)}
        </select>
      </div>
      ${ex ? `<h2 class="str-name">${esc(ex.name)}</h2><p class="meta">${esc(Fmt.exerciseMeta(ex))}</p>
        ${Views.strengthPanel(ex.id)}
        <section class="section" aria-labelledby="str-h">
          <div class="section-head"><h2 class="section-title" id="str-h">History</h2></div>
          ${Views.exerciseHistory(ex)}
        </section>` : ''}`;
  },

        ${Partials.navRow({ href: '#/more/goals', icon: 'target', title: 'Target body fat', sub: g.bodyFatPct != null ? `${g.bodyFatPct}%` : 'Not set' })}

      </section>

      <section class="section" aria-labelledby="pref-h">
        <div class="section-head"><h2 class="section-title" id="pref-h">Preferences</h2></div>
        <div class="setting">
          <span class="setting__label" id="set-units">Units</span>

          <p class="setting__hint">Weights are stored in kg and shown in your chosen unit.</p>
        </div>
        <div class="setting">
          <span class="setting__label" id="set-theme">Theme</span>
          ${Partials.radioGroup({ id: 'set-theme', options: TAXONOMY.themes, value: s.theme, action: 'set-setting', key: 'theme' })}
        </div>
        <div class="setting">
          <span class="setting__label" id="set-week">Week starts on</span>

        </div>
        <div class="setting">
          <span class="setting__label" id="set-rir">RIR display</span>
          ${Partials.radioGroup({ id: 'set-rir', options: TAXONOMY.rirDisplays, value: s.rirDisplay, action: 'set-setting', key: 'rirDisplay' })}
          <p class="setting__hint">${s.rirDisplay === 'single' ? 'Targets show one value, for example RIR 2. Editing a routine sets a single target.' : 'Targets show a range, for example RIR 1–2.'} Logged workouts are not affected.</p>
        </div>
        <div class="setting">
          <span class="setting__label" id="set-rest">Rest timer</span>
          ${Partials.radioGroup({ id: 'set-rest', options: TAXONOMY.restModes, value: s.restMode, action: 'set-setting', key: 'restMode' })}

        <div class="setting">
          <label class="setting__label" for="set-defrest">Default rest</label>
          <select id="set-defrest" class="input" data-setting="defaultRestSec">
            ${restOpts.map((v) => `<option value="${v}" ${v === s.defaultRestSec ? 'selected' : ''}>${Fmt.rest(v)}</option>`).join('')}
            <option value="custom">Custom…</option>
          </select>
          <p class="setting__hint">Used for new exercises you create. Each exercise's own rest time takes priority.</p>
        </div>
        <div class="setting">
          <button type="button" class="switch" role="switch" aria-checked="${s.restAlerts && alertsOk}" data-action="toggle-rest-alerts" ${alertsOk ? '' : 'disabled'}>
            <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>Rest timer alert
          </button>
          <p class="setting__hint">${alertsOk
            ? 'Vibrates and beeps when rest ends while Iron Ledger is open on screen. Phones do not let web apps alert reliably while locked.'
            : 'This browser does not support vibration or sound alerts, so rest alerts are unavailable.'}</p>
        </div>
      </section>

      <section class="section" aria-labelledby="data-h">
        <div class="section-head">
          <h2 class="section-title" id="data-h">Data</h2>
          <span class="meta num">${Fmt.plural(data.routines.length, 'routine')}, ${Fmt.plural(data.sessions.length, 'workout')}, ${size}</span>
        </div>
        ${Partials.navRow({ action: 'export-backup', icon: 'download', title: 'Export data backup', sub: 'Everything except photo images: routines, workouts, schedule, body, goals and settings.' })}
        ${Partials.navRow({ action: 'import-backup', icon: 'upload', title: 'Import data backup', sub: 'Replace all current data with a backup file.' })}
        ${data.sessions.length ? Partials.navRow({ action: 'export-csv', icon: 'csv', title: 'Export workout CSV', sub: `Every completed set from ${Fmt.plural(data.sessions.length, 'workout')}, for spreadsheets.` }) : ''}
        ${data.photos.length ? Partials.navRow({ action: 'export-photos', icon: 'camera', title: 'Export photo backup', sub: `Your ${Fmt.plural(data.photos.length, 'progress photo')} in one file. Not included in the data backup.` }) : ''}
        ${PhotoStore.available() ? Partials.navRow({ action: 'import-photos', icon: 'upload', title: 'Import photo backup', sub: 'Adds photos from a photo backup. Existing photos are kept.' }) : ''}
        ${Partials.navRow({ action: 'reset-data', icon: 'reset', title: 'Reset all data', sub: `Erase everything${data.photos.length ? ', including progress photos,' : ''} and reload the sample routines.`, danger: true })}
      </section>

      <section class="section" aria-labelledby="about-h">
        <div class="section-head"><h2 class="section-title" id="about-h">About</h2></div>
        <dl class="spec">
          <div><dt>App</dt><dd>Iron Ledger</dd></div>
          <div><dt>Version</dt><dd class="num">${esc(CONFIG.APP_DISPLAY_VERSION)}</dd></div>
          <div><dt>Data schema</dt><dd class="num">v${CONFIG.SCHEMA_VERSION}</dd></div>
        </dl>
        <p class="about">Your data is stored only in this browser on this device. Export a data backup and a photo backup regularly.</p>
      </section>`;

  /* ---------------- GOALS ---------------- */
  goals() {
    const g = GoalService.get();
    const unit = Units.current();
    return `
      ${Partials.subHead({ title: 'Goals', back: '#/more' })}
      <section class="section" aria-labelledby="gb-h">
        <div class="section-head"><h2 class="section-title" id="gb-h">Body</h2></div>
        <div class="field">
          <label for="goal-bw">Target bodyweight (${unit})</label>
          <input id="goal-bw" type="text" inputmode="decimal" autocomplete="off" data-goal="bodyweightKg" value="${esc(Units.fmt(g.bodyweightKg))}" placeholder="Not set">
          <p class="field-error" id="goal-bw-err" hidden></p>
        </div>
        <div class="field">
          <label for="goal-bf">Target body fat (%)</label>
          <input id="goal-bf" type="text" inputmode="decimal" autocomplete="off" data-goal="bodyFatPct" value="${g.bodyFatPct == null ? '' : g.bodyFatPct}" placeholder="Not set">
          <p class="field-error" id="goal-bf-err" hidden></p>
        </div>

      </section>

            <span class="xrow__body"><span class="xrow__name">${esc(name)}</span>
            <span class="xrow__meta num">Target: ${esc(Units.fmt(sg.targetWeightKg))} ${unit}${sg.targetReps ? ` × ${sg.targetReps}` : ''}${sg.targetDate ? `, by ${esc(Fmt.relDay(sg.targetDate))}` : ''}</span></span>
            ${icon('chevron', 'xrow__chev')}</a></li>`;
        }).join('')}</ul>` : '<p class="desc">No strength goals yet.</p>'}
        <a class="btn btn-add" href="#/more/goals/strength/new">${icon('plus')}Add strength goal</a>
      </section>`;
  },

  strengthGoalForm(id) {
    const key = id ? `goal:${id}` : 'goal:new';
    let form = Forms.get(key);
    if (!form) {
      let draft;
      if (id) {
        const sg = GoalService.strength(id);
        if (!sg) { Toast.show('That goal no longer exists.'); return Router.redirect('#/more/goals'); }
        draft = { id: sg.id, exerciseId: sg.exerciseId, weight: Units.fmt(sg.targetWeightKg), reps: sg.targetReps == null ? '' : String(sg.targetReps), targetDate: sg.targetDate || '', createdAt: sg.createdAt };
      } else {
        const first = ExerciseService.query({ sort: 'preference' })[0];
        draft = { id: null, exerciseId: first ? first.id : '', weight: '', reps: '', targetDate: '' };
      }
      form = Forms.open(key, 'goal', draft, '#/more/goals');
    }
    const d = form.draft;
    const err = form.errors || {};
    const list = ExerciseService.query({ sort: 'name' });
    return `
      <header class="edit-head">
        <button type="button" class="btn btn-ghost" data-action="form-cancel">Cancel</button>
        <h1 class="edit-head__title">${id ? 'Edit goal' : 'New strength goal'}</h1>

      </header>
      <div class="field">
        <label for="sg-ex">Exercise</label>
        <select id="sg-ex" data-bind="exerciseId">${list.map((x) => `<option value="${esc(x.id)}" ${x.id === d.exerciseId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label for="sg-w">Target weight (${Units.current()})</label>
        <input id="sg-w" type="text" inputmode="decimal" autocomplete="off" data-bind="weight" value="${esc(d.weight)}" ${err.weight ? 'aria-invalid="true" aria-describedby="sg-w-err"' : ''}>
        ${err.weight ? `<p class="field-error" id="sg-w-err">${esc(err.weight)}</p>` : ''}
      </div>
      <div class="field">
        <label for="sg-r">Target reps <span class="optional">(optional)</span></label>
        <input id="sg-r" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" data-bind="reps" value="${esc(d.reps)}" ${err.reps ? 'aria-invalid="true" aria-describedby="sg-r-err"' : ''}>
        ${err.reps ? `<p class="field-error" id="sg-r-err">${esc(err.reps)}</p>` : ''}
      </div>
      <div class="field">
        <label for="sg-d">Target date <span class="optional">(optional)</span></label>
        <input id="sg-d" type="date" data-bind="targetDate" value="${esc(d.targetDate)}">

  }
});


/* =======================================================================
   14c. WORKOUT ENGINE VIEWS
   Render the active session, the summary and completed history.
   Everything shown comes from session records (snapshots), never from the
   current routine, so later edits cannot rewrite what happened.
   ======================================================================= */
const SET_TYPE_LABELS = Object.freeze({ warmup: 'Warm-up', working: 'Working', drop: 'Drop', failure: 'Failure' });

Object.assign(Views, {
  /* ---------------- ACTIVE WORKOUT ---------------- */
  activeWorkout() {
    const a = WorkoutService.active();
    if (!a) { Toast.show('No workout in progress.'); return Router.redirect('#/home'); }
    const unit = Units.current();
    const history = Store.get().sessions;
    return `
      <header class="aw-head">
        <a class="icon-btn" href="#/home" aria-label="Minimise. The workout keeps running.">${icon('down')}</a>
        <div class="aw-head__mid">
          <span class="aw-head__name">${esc(a.sourceRoutineName)}</span>
          <span class="aw-head__time num">${icon('clock')}<span data-tick="elapsed">${Fmt.clock(Calc.sessionDurationSec(a))}</span></span>
        </div>
        <span class="aw-head__end">
          <button type="button" class="icon-btn" data-action="aw-menu" aria-label="Workout options">${icon('dots')}</button>
          <button type="button" class="btn btn-primary btn-sm" data-action="aw-finish">Finish</button>
        </span>
      </header>
      ${a.notes ? `<p class="aw-note aw-note--today"><span class="note-label">Workout note</span>${esc(a.notes)}</p>` : ''}
      ${a.exercises.length ? a.exercises.map((x, i) => Views.awCard(a, x, i, unit, history)).join('') : `
        <div class="empty"><div class="empty__mark">${icon('workout')}</div><h2>${a.kind === 'empty' ? 'Add your first exercise' : 'No exercises'}</h2><p>Add exercises to start logging sets.</p></div>`}
      <button type="button" class="btn btn-add" data-action="aw-add-exercise">${icon('plus')}Add exercise</button>
      <div id="restbar-slot">${Views.restBar(a)}</div>`;
  },

  awCard(a, x, i, unit, history) {
    const prev = Calc.previousPerformance(history, x.performedExerciseId, a.id);
    const labels = Calc.setLabels(x.sets);
    const reps = Fmt.range(x.targetRepMin, x.targetRepMax);
    const rir = Fmt.rir(x.targetRirMin, x.targetRirMax);
    const muscle = x.primaryMuscleSnapshot ? Tax.label('muscles', x.primaryMuscleSnapshot) : '';
    const last = a.exercises.length - 1;
    return `<section class="aw-ex" id="se-${esc(x.id)}" aria-labelledby="sen-${esc(x.id)}">
      <div class="aw-ex__head">
        <div>
          <h2 class="aw-ex__name" id="sen-${esc(x.id)}">${esc(x.nameSnapshot)}</h2>
          <p class="aw-ex__muscle">${esc(muscle)}${x.addedDuringSession ? ' <span class="tag">Added today</span>' : ''}</p>
          ${x.substitution ? `<p class="aw-sub">${icon('swap')}Replacing ${esc(x.originalNameSnapshot)}${x.proposeRoutineUpdate ? ' · routine update suggested' : ' · today only'}</p>` : ''}
        </div>
        <button type="button" class="icon-btn" data-action="aw-ex-menu" data-se="${esc(x.id)}" data-first="${i === 0}" data-last="${i === last}" aria-label="Options for ${esc(x.nameSnapshot)}">${icon('dots')}</button>
      </div>
      <p class="aw-target num"><b>${x.targetSets} × ${reps}</b><span>RIR <b>${rir}</b></span><span>Rest <b>${Fmt.rest(x.restSeconds)}</b></span></p>
      ${Views.awReco(a, x, history)}
      ${(() => {
        const ex = ExerciseService.get(x.performedExerciseId);
        const bits = [];
        if (ex && ex.machineSettings) bits.push(`<span class="note-label">Machine settings</span>${esc(ex.machineSettings)}`);
        if (ex && ex.notes) bits.push(`<span class="note-label">Personal note</span>${esc(ex.notes)}`);
        return bits.length ? `<p class="aw-note aw-note--ex">${bits.join('<br>')}</p>` : '';
      })()}
      ${x.notesSnapshot ? `<p class="aw-note"><span class="note-label">Routine note</span>${esc(x.notesSnapshot)}</p>` : ''}
      ${x.sessionNote ? `<p class="aw-note aw-note--today"><span class="note-label">Today's note</span>${esc(x.sessionNote)}</p>` : ''}
      <div class="sets" role="table" aria-label="Sets for ${esc(x.nameSnapshot)}">
        <div class="srow srow--head" role="row">
          <span role="columnheader">Set</span>
          <span role="columnheader" ${prev ? `title="Previous: ${esc(Fmt.shortDate(new Date(prev.session.startedAt)))}"` : ''}>${prev ? esc(Fmt.shortDate(new Date(prev.session.startedAt))) : 'Prev'}</span>
          <span role="columnheader">${esc(unit)}</span>
          <span role="columnheader">Reps</span>
          <span role="columnheader">RIR</span>
          <span role="columnheader"><span class="sr-only">Done</span>${icon('check')}</span>
        </div>
        ${x.sets.map((st, j) => Views.awSetRow(x, st, labels[j], Calc.previousSetFor(prev, x.sets, st), reps, rir, unit)).join('')}
      </div>
      <button type="button" class="btn btn-ghost btn-sm aw-addset" data-action="aw-add-set" data-se="${esc(x.id)}">${icon('plus')}Add set</button>
    </section>`;
  },

  /** Unobtrusive, explained suggestion. It never changes any logged value. */
  awReco(a, x, history) {
    const ex = ExerciseService.get(x.performedExerciseId);
    const r = Calc.recommendation(history, x, Calc.incrementFor(ex), a.id);
    if (!r) return '';
    const u = Units.current();
    const head = { increase: `Try ${Units.fmt(r.weightKg)} ${u}`, reduce: `Try ${Units.fmt(r.weightKg)} ${u}`, stay: r.weightKg != null ? `Stay at ${Units.fmt(r.weightKg)} ${u}` : 'Same as last time', reps: 'Add reps or load' }[r.action];
    return `<details class="reco reco--${r.action}">
      <summary><span class="reco__label">Suggested today</span><b>${esc(head)}</b><span class="reco__target num">× ${esc(Fmt.range(x.targetRepMin, x.targetRepMax))}</span></summary>
      <p class="reco__why">${esc(r.reason)}</p>
    </details>`;
  },

  awSetRow(x, st, label, p, reps, rir, unit) {
    const sid = esc(st.id);
    const se = esc(x.id);
    const typeName = SET_TYPE_LABELS[st.type];
    const prevText = p ? `${p.weightKg == null ? 'BW' : Units.fmt(p.weightKg, unit)}×${p.reps}` : '';
    return `<div class="srow ${st.completed ? 'is-done' : ''} srow--${st.type}" role="row" id="row-${sid}">
      <button type="button" class="srow__label" data-action="aw-set-menu" data-se="${se}" data-set="${sid}" aria-label="Set ${esc(label)}, ${typeName}. Change type or remove">${esc(label)}</button>
      ${p ? `<button type="button" class="srow__prev num" data-action="aw-copy-prev" data-se="${se}" data-set="${sid}" aria-label="Previous ${esc(prevText)}. Tap to copy"><span>${esc(p.weightKg == null ? 'BW' : Units.fmt(p.weightKg, unit))}</span><span>×${p.reps}</span></button>`
          : '<span class="srow__prev is-empty" aria-label="No previous">—</span>'}
      <input class="srow__in num" id="w-${sid}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next"
        data-aw="weight" data-se="${se}" data-set="${sid}" value="${esc(Units.fmt(st.weightKg, unit))}"
        placeholder="${p && p.weightKg != null ? esc(Units.fmt(p.weightKg, unit)) : (x.equipmentSnapshot === 'bodyweight' ? 'BW' : '')}" aria-label="Weight in ${esc(unit)}, set ${esc(label)}">
      <input class="srow__in num" id="r-${sid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" enterkeyhint="next"
        data-aw="reps" data-se="${se}" data-set="${sid}" value="${st.reps == null ? '' : st.reps}" placeholder="${esc(reps)}" aria-label="Reps, set ${esc(label)}">
      <input class="srow__in num" id="q-${sid}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" enterkeyhint="done"
        data-aw="rir" data-se="${se}" data-set="${sid}" value="${st.rir == null ? '' : st.rir}" placeholder="${esc(rir)}" aria-label="RIR (optional), set ${esc(label)}">
      <button type="button" class="setcheck" data-action="aw-toggle" data-se="${se}" data-set="${sid}" aria-pressed="${st.completed}"
        aria-label="${st.completed ? `Set ${esc(label)} completed. Tap to undo` : `Complete set ${esc(label)}`}">${st.completed ? icon('check') : ''}</button>
    </div>`;
  },

  restBar(a) {
    const t = a && a.restTimer;
    if (!t) {
      const x = a && a.lastRestExerciseId && a.exercises.find((e) => e.id === a.lastRestExerciseId);
      if (!x || SettingsService.get().restMode !== 'manual') return '';
      return `<div class="restbar restbar--idle" role="group" aria-label="Rest timer">
        <span class="restbar__label">Rest</span>
        <span class="restbar__time num">${Fmt.clock(x.restSeconds)}</span>
        <button type="button" class="restbar__btn restbar__btn--skip restbar__btn--wide" data-action="aw-rest-start">${icon('play')}Start rest</button>
        <button type="button" class="restbar__btn" data-action="aw-rest-skip" aria-label="Dismiss">${icon('close')}</button>
      </div>`;
    }
    const rem = Calc.restRemainingSec(t);
    const done = rem <= 0;
    return `<div class="restbar ${done ? 'is-done' : ''}" role="group" aria-label="Rest timer">
      <span class="restbar__label" data-rest-label>${done ? 'Rest complete' : 'Rest'}</span>
      <span class="restbar__time num" data-tick="rest">${Fmt.clock(rem)}</span>
      <button type="button" class="restbar__btn" data-action="aw-rest-adjust" data-delta="-15" aria-label="Subtract 15 seconds">−15</button>
      <button type="button" class="restbar__btn restbar__btn--skip" data-action="aw-rest-skip" data-rest-skip>${done ? 'Dismiss' : 'Skip'}</button>
      <button type="button" class="restbar__btn" data-action="aw-rest-adjust" data-delta="15" aria-label="Add 15 seconds">+15</button>
    </div>`;
  },

  /* ---------------- SUMMARY (after Finish) ---------------- */
  workoutSummary(id) {
    const ws = SessionService.get(id);
    if (!ws) { Toast.show('That workout could not be found.'); return Router.redirect('#/workout/history'); }
    const st = Calc.sessionStats(ws);
    const changes = Calc.routineChanges(ws);
    const review = RoutineService.reviewFor(ws.id);
    const routine = ws.sourceRoutineId ? RoutineService.get(ws.sourceRoutineId) : null;
    const icons = { add: 'plus', remove: 'trash', sets: 'list', order: 'swap', replace: 'swap' };
    let reviewLine = '';
    if (ws.sourceRoutineId && changes.length) {
      if (review) reviewLine = review.outcome === 'applied'
        ? `${Fmt.plural(review.appliedKeys.length, 'change')} applied to ${esc(ws.sourceRoutineName)}.${review.skippedKeys.length ? ` ${review.skippedKeys.length} could not be applied because the routine had changed.` : ''}`
        : `${esc(ws.sourceRoutineName)} was kept as it was.`;
      else if (!routine) reviewLine = `${esc(ws.sourceRoutineName)} no longer exists, so these changes cannot be applied to it.`;
    }
    return `
      <header class="aw-head">
        <a class="icon-btn" href="#/home" aria-label="Close summary">${icon('close')}</a>

      <div class="summary">
        <span class="fig"><b>${Fmt.duration(st.durationSec)}</b><span>duration</span></span>
        <span class="fig"><b>${st.workingSets}</b><span>working sets</span></span>
        <span class="fig"><b>${esc(Units.fmtVolume(st.volumeKg))}</b><span>volume</span></span>

        ${reviewLine ? `<p class="hint">${reviewLine}</p>` : ''}
        ${changes.length && !review && routine ? `<a class="btn btn-secondary btn-block" href="#/workout/review/${esc(ws.id)}">Review routine changes</a>` : ''}
      </section>` : ''}
      <div class="finish-actions">
        <a class="btn btn-primary btn-block" href="#/home">Done</a>
        <a class="btn btn-secondary btn-block" href="#/history/${esc(ws.id)}">View workout</a>

  prList(sessionId) {
    const prs = Calc.sessionPRs(Store.get().sessions, sessionId);
    if (!prs.length) return '';
    return `<section class="section" aria-labelledby="pr-h"><div class="section-head"><h2 class="section-title" id="pr-h">Personal records</h2></div>
      <ul class="prs">${prs.map((p) => `<li>${icon('trophy')}<span class="prs__name">${esc(p.exerciseName)}<span class="prs__kind">${esc(Views.prText(p))}${Views.prAlso(p) ? ` · also ${esc(Views.prAlso(p))}` : ''}</span></span></li>`).join('')}</ul></section>`;
  },

  /* ---------------- REVIEW ROUTINE CHANGES ---------------- */
  routineReview(id) {
    const ws = SessionService.get(id);
    if (!ws) { Toast.show('That workout could not be found.'); return Router.redirect('#/workout/history'); }
    if (RoutineService.reviewFor(ws.id)) return Router.redirect(`#/workout/summary/${ws.id}`);
    const routine = RoutineService.get(ws.sourceRoutineId);
    const changes = Calc.routineChanges(ws);
    if (!UIState.review || UIState.review.sessionId !== ws.id) {
      UIState.review = { sessionId: ws.id, checked: Object.fromEntries(changes.map((c) => [c.key, c.checked])) };
    }
    const n = changes.filter((c) => UIState.review.checked[c.key]).length;
    return `
      <header class="aw-head">
        <a class="icon-btn" href="#/workout/summary/${esc(ws.id)}" aria-label="Skip review">${icon('close')}</a>
        <div class="aw-head__mid"><span class="aw-head__name">Review routine changes</span></div>
        <span style="width:44px"></span>
      </header>
      ${routine ? `<p class="desc">Today's workout differed from <b>${esc(routine.name)}</b>. Tick the changes to keep in the routine. Unticked changes stay in today's workout only.</p>
        <div class="checks">${changes.map((c) => `<button type="button" class="check" role="checkbox" aria-checked="${!!UIState.review.checked[c.key]}" data-action="review-toggle" data-key="${esc(c.key)}">
          <span class="check__box" aria-hidden="true">${UIState.review.checked[c.key] ? icon('check') : ''}</span><span>${esc(c.label)}</span></button>`).join('')}</div>

        </div>`
      : `<p class="desc">${esc(ws.sourceRoutineName)} no longer exists, so nothing can be applied. Your workout is saved.</p>
        <a class="btn btn-primary btn-block" href="#/workout/summary/${esc(ws.id)}">Continue</a>`}`;
  },

  /* ---------------- REPLACE EXERCISE (real substitution) ---------------- */
  replaceExercise(seId) {
    const a = WorkoutService.active();
    if (!a) { Toast.show('No workout in progress.'); return Router.redirect('#/home'); }
    const x = a.exercises.find((e) => e.id === seId);
    if (!x) { Toast.show('That exercise is no longer in this workout.'); return Router.redirect('#/workout/active'); }
    if (!UIState.replace || UIState.replace.seId !== seId) UIState.replace = { seId, reason: null, area: null, note: '', matchId: null, browsedId: null, scope: 'today' };
    const st = UIState.replace;
    const header = `<header class="aw-head">
        <a class="icon-btn" href="#/workout/active" aria-label="Back to workout">${icon('back')}</a>
        <div class="aw-head__mid"><span class="aw-head__name">Replace exercise</span></div>
        <span style="width:44px"></span>
      </header>`;
    if (x.sets.some((set) => set.completed)) {
      return `${header}<p class="sub-lede">Replace <b>${esc(x.nameSnapshot)}</b></p>
        <p class="desc">Sets are already completed for this exercise, so it can't be replaced without mixing two exercises in one record. Undo those sets, or add the new exercise separately.</p>
        <button type="button" class="btn btn-primary btn-block" data-action="aw-add-exercise">${icon('plus')}Add exercise instead</button>`;
    }
    const original = ExerciseService.get(x.performedExerciseId);
    const painFlagged = Calc.painFlaggedExercises(Store.get().sessions, a);
    const ranked = st.reason ? Calc.substitutionCandidates(original, st.reason, ExerciseService.list(), painFlagged) : [];
    const browsed = st.browsedId && !ranked.some((c) => c.exercise.id === st.browsedId) ? ExerciseService.get(st.browsedId) : null;
    const match = ExerciseService.get(st.matchId);
    const choice = (key, value, title, sub = '', extra = '') =>
      `<button type="button" class="choice" role="radio" aria-checked="${st[key] === value}" data-action="replace-set" data-key="${key}" data-value="${esc(value)}">
        <span class="choice__dot" aria-hidden="true"></span>
        <span class="choice__body"><span class="choice__title">${esc(title)}${extra}</span>${sub ? `<span class="choice__sub">${esc(sub)}</span>` : ''}</span>
      </button>`;
    return `${header}
      <p class="sub-lede">Replace <b>${esc(x.nameSnapshot)}</b></p>
      <section class="section" aria-labelledby="why-h">
        <h2 class="section-title" id="why-h">Why are you replacing it?</h2>
        <div class="choices" role="radiogroup" aria-labelledby="why-h">${TAXONOMY.substitutionReasons.map((r) => choice('reason', r.id, r.label)).join('')}</div>
      </section>
      ${st.reason === 'pain' ? `<section class="section" aria-labelledby="where-h">
        <h2 class="section-title" id="where-h">Where?</h2>
        <div class="chips chips--wrap" role="radiogroup" aria-labelledby="where-h">${TAXONOMY.painAreas.map((p) => `<button type="button" class="chip" role="radio" aria-checked="${st.area === p.id}" aria-pressed="${st.area === p.id}" data-action="replace-set" data-key="area" data-value="${p.id}">${esc(p.label)}</button>`).join('')}</div>
        <div class="field"><label for="rep-note">Note <span class="optional">(optional)</span></label>
          <input id="rep-note" type="text" maxlength="200" data-replace-note value="${esc(st.note)}" placeholder="What did you notice?"></div>
        <p class="note">This is saved with today's workout, and Iron Ledger will stop suggesting ${esc(x.nameSnapshot)} as an alternative. It can't tell whether another exercise is right for you.</p>
      </section>` : ''}
      ${st.reason ? `<section class="section" aria-labelledby="bm-h">
        <h2 class="section-title" id="bm-h">${ranked.length ? 'Best matches' : 'Choose an exercise'}</h2>
        ${ranked.length || browsed ? `<div class="choices" role="radiogroup" aria-labelledby="bm-h">
          ${ranked.map((c) => choice('matchId', c.exercise.id, c.exercise.name, `${Fmt.exerciseMeta(c.exercise)}${c.why.length ? `. ${c.why.join(', ')}` : ''}.`)).join('')}
          ${browsed ? choice('matchId', browsed.id, browsed.name, `${Fmt.exerciseMeta(browsed)}. Chosen from the library.`) : ''}
        </div>` : '<p class="desc">No close matches in your library. Browse all exercises to choose one.</p>'}
        <button type="button" class="btn btn-ghost btn-sm browse-all" data-action="replace-browse">${icon('search')}Browse all exercises</button>
      </section>` : ''}
      ${match ? `<section class="section" aria-labelledby="ap-h">
        <h2 class="section-title" id="ap-h">Replace ${esc(x.nameSnapshot)} with ${esc(match.name)}</h2>
        <div class="choices" role="radiogroup" aria-labelledby="ap-h">
          ${choice('scope', 'today', 'Today only', `${a.sourceRoutineName} stays as it is.`, ' <span class="tag tag--fav">Recommended</span>')}
          ${x.routineItemId ? choice('scope', 'routine', `Update ${a.sourceRoutineName}`, 'Nothing changes now. You will be asked to confirm after the workout.') : ''}
        </div>
      </section>` : ''}
      <div class="sticky-foot">
        <button type="button" class="btn btn-primary btn-block" data-action="replace-confirm" data-se="${esc(x.id)}" ${match && (st.reason !== 'pain' || st.area) ? '' : 'disabled'}>${match ? `Replace with ${esc(match.name)}` : 'Choose a replacement'}</button>
      </div>`;
  },

  /** Compact "workout in progress" strip shown on other screens. */
  activeStrip() {

      <span class="activebar__sub num">${esc(a.sourceRoutineName)} · <span data-tick="elapsed">${Fmt.clock(Calc.sessionDurationSec(a))}</span>${a.restTimer ? ` · Rest <span data-tick="rest">${Fmt.clock(rem)}</span>` : ''}</span></span>

});


/* =======================================================================
   14d. BODY, PHOTOS, COMPARISON, TRANSFORMATION, STRENGTH CHARTS
   All numbers come from stored entries/sessions. Missing data is shown as
   missing; nothing is interpolated or invented.
   ======================================================================= */
const PERIODS = [['30d', '30D'], ['3m', '3M'], ['6m', '6M'], ['1y', '1Y'], ['all', 'All']];
function periodFrom(p) {
  if (p === '6m') { const d = DateKey.toDate(DateKey.today()); d.setMonth(d.getMonth() - 6); return d; }
  return Calc.periodStart(p);
}

Object.assign(Partials, {
  /**
   * Dependency-free SVG line chart. series: [{ name, points:[{t, v}], dashed }].
   * Shows only real points; fewer than two points explains what is needed.
   */
  lineChart(series, { fmt = (v) => String(Math.round(v * 10) / 10), label = 'Trend' } = {}) {
    const pts = series.flatMap((s) => s.points);
    const longest = Math.max(0, ...series.map((s) => s.points.length));
    if (longest < 2) {
      return `<div class="chart-empty">${icon('progress')}<p>${longest === 1 ? 'One entry in this period. Add another to see a trend.' : 'No entries in this period.'}</p></div>`;
    }
    const W = 320; const H = 160; const L = 6; const R = 6; const T = 16; const B = 24;
    const t0 = Math.min(...pts.map((p) => p.t)); let t1 = Math.max(...pts.map((p) => p.t)); if (t1 === t0) t1 = t0 + 1;
    let lo = Math.min(...pts.map((p) => p.v)); let hi = Math.max(...pts.map((p) => p.v));
    const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.05 || 1; lo -= pad; hi += pad;
    const x = (t) => L + ((t - t0) / (t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const day = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const lines = series.map((s, i) => {
      if (!s.points.length) return '';
      const d = s.points.map((p, j) => `${j ? 'L' : 'M'}${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
      return `<path class="ch__line ${i ? 'ch__line--2' : ''}" d="${d}"${s.dashed || i ? ' stroke-dasharray="5 5"' : ''}/>
        ${s.points.map((p) => `<circle class="ch__dot ${i ? 'ch__dot--2' : ''}" cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.2"/>`).join('')}`;
    }).join('');
    const summary = series.filter((s) => s.points.length).map((s) => {
      const a = s.points[0]; const b = s.points[s.points.length - 1];
      return `${s.name}: ${fmt(a.v)} on ${day(a.t)}, ${fmt(b.v)} on ${day(b.t)}`;
    }).join('. ');
    return `<figure class="ch">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}. ${esc(summary)}">
        <g class="ch__grid"><path d="M${L} ${T}H${W - R}M${L} ${(T + H - B) / 2}H${W - R}M${L} ${H - B}H${W - R}"/></g>
        <text class="ch__lab" x="${L}" y="${T - 4}">${esc(fmt(hi - pad))}</text>
        <text class="ch__lab" x="${L}" y="${H - B - 4}">${esc(fmt(lo + pad))}</text>
        ${lines}
        <text class="ch__lab" x="${L}" y="${H - 6}">${esc(day(t0))}</text>
        <text class="ch__lab" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(day(t1))}</text>
      </svg>
      ${series.length > 1 ? `<figcaption class="ch__legend">${series.map((s, i) => `<span><i class="ch__key ${i ? 'ch__key--2' : ''}"></i>${esc(s.name)}</span>`).join('')}</figcaption>` : ''}
    </figure>`;
  },

  chips(key, options, label) {
    return `<div class="chips" role="group" aria-label="${esc(label)}">${options.map(([v, t]) =>
      `<button type="button" class="chip" data-action="ui-set" data-key="${key}" data-value="${esc(v)}" aria-pressed="${UIState.ui[key] === v}">${esc(t)}</button>`).join('')}</div>`;
  },

  photoTile(p, missing, action = '') {
    const label = `${Tax.label('poses', p.pose)}, ${Tax.label('clothing', p.clothing).toLowerCase()}`;
    const inner = `<span class="ph__img ${missing ? 'is-missing' : ''}">${missing ? `${icon('alert')}<span>Image not on this device</span>` : `<img data-thumb="${esc(p.id)}" alt="${esc(label)}, ${esc(Fmt.relDay(p.date))}">`}</span>
      <span class="ph__cap"><b>${esc(DateKey.toDate(p.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }))}</b><span>${esc(label)}</span></span>`;
    return action ? `<button type="button" class="ph" ${action}>${inner}</button>` : `<a class="ph" href="#/progress/photos/${esc(p.id)}">${inner}</a>`;
  }
});

/** Framing guide (SVG overlay on the live camera only; never saved into the photo). */
function framingGuide(pose) {
  const side = pose === 'side';
  const body = side
    ? '<ellipse cx="50" cy="15" rx="7" ry="8.5"/><path d="M47 24 C42 34 42 48 45 58 C46 66 45 78 46 96 M53 24 C59 34 60 46 56 58 C55 66 56 78 55 96"/>'
    : '<ellipse cx="50" cy="15" rx="7.5" ry="9"/><path d="M42 25 C30 27 27 31 26 40 L24 60 M58 25 C70 27 73 31 74 40 L76 60 M38 30 C37 45 39 52 41 58 L42 96 M62 30 C63 45 61 52 59 58 L58 96 M50 58 L50 96"/>';
  return `<svg class="cam__guide" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path class="cam__axis" d="M50 2V98M10 5H90M10 97H90"/><g class="cam__body">${body}</g></svg>`;
}

Object.assign(Views, {

      <dd class="num">${latest ? esc(Units.metric(metric, latest.v)) : '—'}</dd>
      <span class="tile__sub">${goal != null ? `Goal: ${esc(Units.metric(metric, goal))}` : latest ? esc(Fmt.relDay(DateKey.of(new Date(latest.t)))) : 'No entries'}</span></div>`;
    if (!entries.length) {
      return `<div class="empty"><div class="empty__mark">${icon('scale')}</div><h2>No body measurements yet.</h2>

          <span class="xrow__meta">${Object.entries(en.values).map(([k, v]) => `${esc(Tax.label('bodyMetrics', k))} ${esc(Units.metric(k, v))}`).join(' · ')}${en.note ? ` · “${esc(en.note)}”` : ''}</span></span>

  },

  /* ---------------- COMPARE ---------------- */
  compare() {
    const all = PhotoMeta.list();
    const c = UIState.compare;
    if (all.length >= 2 && !c.a && !c.b && !c.choosing) {
      // Sensible default: the newest photo that has an earlier partner with the same pose and clothing.
      const latest = all.find((p) => all.some((o) => o.id !== p.id && o.pose === p.pose && o.clothing === p.clothing)) || all[0];
      const match = all.filter((p) => p.id !== latest.id && p.pose === latest.pose && p.clothing === latest.clothing).pop();
      c.b = latest.id; c.a = match ? match.id : null; c.choosing = match ? null : 'a';
    }
    if (all.length < 2) return `${Partials.subHead({ title: 'Compare photos', back: '#/progress/photos' })}<div class="empty"><p>Add at least two photos to compare them.</p></div>`;
    const A = PhotoMeta.get(c.a); const B = PhotoMeta.get(c.b);
    const [early, late] = A && B && A.date > B.date ? [B, A] : [A, B];
    const slot = (p, which, label) => `<button type="button" class="cmp-pick ${c.choosing === which ? 'is-active' : ''}" data-action="compare-choose" data-which="${which}">
      ${p ? `<img data-thumb="${esc(p.id)}" alt=""><span><b>${esc(label)}</b>${esc(Fmt.relDay(p.date))}, ${esc(Tax.label('poses', p.pose).toLowerCase())}</span>` : `${icon('plus')}<span><b>${esc(label)}</b>Select photo</span>`}</button>`;
    let chooser = '';
    if (c.choosing) {
      const other = PhotoMeta.get(c.choosing === 'a' ? c.b : c.a);
      const filtered = other && !c.showAll ? all.filter((p) => p.pose === other.pose && p.clothing === other.clothing && p.id !== other.id) : all.filter((p) => !other || p.id !== other.id);
      chooser = `<section class="section cmp-chooser" aria-label="Choose a photo">
        <div class="section-head"><h2 class="section-title">${c.choosing === 'a' ? 'Select earlier photo' : 'Select later photo'}</h2>
          ${other ? `<button type="button" class="link" data-action="compare-showall">${c.showAll ? 'Matching only' : 'Show all'}</button>` : ''}</div>
        ${other && !c.showAll ? `<p class="hint">Showing ${esc(Tax.label('poses', other.pose).toLowerCase())}, ${esc(Tax.label('clothing', other.clothing).toLowerCase())} photos to match.</p>` : ''}
        <div class="ph-grid">${filtered.map((p) => Partials.photoTile(p, UIState.missingPhotos.has(p.id), `data-action="compare-set" data-id="${esc(p.id)}"`)).join('') || '<p class="desc">No matching photos. Tap Show all.</p>'}</div>
      </section>`;
    }
    const days = early && late ? DateKey.diffDays(late.date, early.date) : null;
    const frame = (p, side) => {
      const z = c.zoom[side]; const o = c.offset[side];
      return `<div class="cmp-frame" data-pan="${side}"><img data-full="${esc(p.id)}" alt="${side === 'a' ? 'Earlier' : 'Later'} photo, ${esc(Fmt.dayLabel(p.date))}" style="transform:translate(${o.x}%,${o.y}%) scale(${z})" draggable="false"></div>`;
    };
    let viewer = '';
    if (early && late && !c.choosing) {
      viewer = UIState.ui.compareMode === 'slider'
        ? `<div class="cmp-slider" style="--cut:${c.cut}%">
            <div class="cmp-frame cmp-frame--base" data-pan="a"><img data-full="${esc(early.id)}" alt="Earlier photo" style="transform:translate(${c.offset.a.x}%,${c.offset.a.y}%) scale(${c.zoom.a})" draggable="false"></div>
            <div class="cmp-frame cmp-frame--top" data-pan="b"><img data-full="${esc(late.id)}" alt="Later photo" style="transform:translate(${c.offset.b.x}%,${c.offset.b.y}%) scale(${c.zoom.b})" draggable="false"></div>
            <span class="cmp-slider__line" aria-hidden="true"></span>
          </div>
          <label class="sr-only" for="cmp-cut">Reveal later photo</label>
          <input id="cmp-cut" class="cmp-range" type="range" min="0" max="100" value="${c.cut}" data-compare="cut">`
        : `<div class="cmp-side">${frame(early, 'a')}${frame(late, 'b')}</div>`;
      viewer += `<div class="cmp-meta"><span>${esc(Fmt.dayLabel(early.date))}</span><span class="num">${days != null ? `${days} days` : ''}</span><span>${esc(Fmt.dayLabel(late.date))}</span></div>
        <div class="cmp-adjust">
          <label>Earlier zoom <input type="range" min="1" max="2.5" step="0.05" value="${c.zoom.a}" data-compare="zoom-a"></label>
          <label>Later zoom <input type="range" min="1" max="2.5" step="0.05" value="${c.zoom.b}" data-compare="zoom-b"></label>
          <button type="button" class="btn btn-ghost btn-sm" data-action="compare-reset">Reset position</button>
        </div>
        <p class="hint">Drag a photo to line it up. Adjustments are for viewing only; your photos are not changed.</p>`;
    }
    return `
      ${Partials.subHead({ title: 'Compare photos', back: '#/progress/photos' })}
      <div class="cmp-picks">${slot(early || A, 'a', 'Earlier')}${slot(late || B, 'b', 'Later')}</div>
      ${chooser}
      ${early && late && !c.choosing ? `<div class="cmp-mode">${Partials.uiChoice({ label: 'Comparison mode', key: 'compareMode', options: [['side', 'Side by side'], ['slider', 'Slider']] })}</div>` : ''}
      ${viewer}`;
  },

  /* ---------------- TRANSFORMATION ---------------- */
  transformationData(fromKey, toKey) {
    const d = Store.get();
    const body = d.body.entries;
    const metrics = TAXONOMY.bodyMetrics.map((m) => ({ m, ch: Calc.bodyChange(body, m.id, fromKey, toKey) })).filter((x) => x.ch);
    const inRange = d.sessions.filter((ws) => { const k = DateKey.of(new Date(ws.startedAt)); return k >= fromKey && k <= toKey; })
      .sort((a, b) => Date.parse(a.startedAt) - Date.parse(b.startedAt));
    const counts = new Map();
    inRange.forEach((ws) => new Set(ws.exercises.filter((x) => x.sets.some((st) => st.completed && Calc.isWorkingSet(st))).map((x) => x.performedExerciseId)).forEach((id) => counts.set(id, (counts.get(id) || 0) + 1)));
    const strength = [...counts.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id]) => {
      const pts = Calc.exerciseSeries(inRange, id);
      if (pts.length < 2) return null;
      const name = (ExerciseService.get(id) || {}).name || inRange.flatMap((ws) => ws.exercises).find((x) => x.performedExerciseId === id).nameSnapshot;
      return { id, name, from: pts[0].topSet, to: pts[pts.length - 1].topSet };
    }).filter(Boolean);
    const photosBy = (pose) => {
      const list = d.photos.filter((p) => p.pose === pose && p.date >= fromKey && p.date <= toKey).sort((a, b) => a.date.localeCompare(b.date));
      return list.length >= 2 ? { first: list[0], last: list[list.length - 1] } : null;
    };
    return { metrics, workouts: inRange.length, strength, photos: TAXONOMY.poses.map((p) => ({ pose: p, pair: photosBy(p.id) })).filter((x) => x.pair) };
  },

  transformationRange() {
    const d = Store.get();
    const dates = [...d.sessions.map((ws) => DateKey.of(new Date(ws.startedAt))), ...d.body.entries.map((e) => e.date), ...d.photos.map((p) => p.date)].sort();
    return { from: UIState.ui.trFrom || dates[0] || DateKey.today(), to: UIState.ui.trTo || DateKey.today() };
  },

  transformationRows(t) {
    const rows = [];
    t.metrics.forEach(({ m, ch }) => rows.push(`<div><dt>${esc(m.label)}</dt><dd class="num">${esc(Units.metric(m.id, ch.from.v))} → <b>${esc(Units.metric(m.id, ch.to.v))}</b> <span class="delta">${esc(Units.metricDelta(m.id, ch.delta))}</span></dd></div>`));
    const ts = (x) => `${x.weightKg == null ? 'BW' : `${Units.fmt(x.weightKg)} ${Units.current()}`} × ${x.reps}`;
    t.strength.forEach((s) => rows.push(`<div><dt>${esc(s.name)}</dt><dd class="num">${esc(ts(s.from))} → <b>${esc(ts(s.to))}</b> <span class="delta">top set</span></dd></div>`));
    rows.push(`<div><dt>Workouts</dt><dd class="num"><b>${t.workouts}</b> completed</dd></div>`);
    return rows.join('');
  },

  transformation() {
    const r = Views.transformationRange();
    const t = Views.transformationData(r.from, r.to);
    return `
      ${Partials.subHead({ title: 'Transformation', back: '#/progress/overview' })}
      <div class="bgrid bgrid--2">
        <div class="bfield"><label for="tr-from">From</label><input id="tr-from" type="date" data-ui-date="trFrom" value="${r.from}" max="${r.to}"></div>
        <div class="bfield"><label for="tr-to">To</label><input id="tr-to" type="date" data-ui-date="trTo" value="${r.to}" min="${r.from}" max="${DateKey.today()}"></div>
      </div>
      <dl class="spec tr">${Views.transformationRows(t)}</dl>
      ${!t.metrics.length ? '<p class="hint">Body changes appear when a measurement was recorded at least twice in this range.</p>' : ''}
      ${!t.strength.length ? '<p class="hint">Strength changes appear for exercises performed at least twice in this range.</p>' : ''}
      ${t.photos.length ? `<section class="section" aria-labelledby="trp-h"><div class="section-head"><h2 class="section-title" id="trp-h">Photos</h2></div>
        ${t.photos.map(({ pose, pair }) => `<div class="tr-photos"><span class="tr-photos__label">${esc(pose.label)}</span>
          <img data-thumb="${esc(pair.first.id)}" alt="${esc(pose.label)}, ${esc(Fmt.dayLabel(pair.first.date))}">
          <img data-thumb="${esc(pair.last.id)}" alt="${esc(pose.label)}, ${esc(Fmt.dayLabel(pair.last.date))}">
          <button type="button" class="btn btn-secondary btn-sm" data-action="compare-pair" data-a="${esc(pair.first.id)}" data-b="${esc(pair.last.id)}">Compare</button></div>`).join('')}</section>`
        : '<p class="hint">Photo comparisons appear when a pose has at least two photos in this range.</p>'}`;
  },

  /* ---------------- STRENGTH (shared by Progress and exercise detail) ---------------- */
  strengthPanel(exerciseId) {
    const sessions = Store.get().sessions;
    const rec = Calc.exerciseRecords(sessions, exerciseId);
    const series = Calc.exerciseSeries(sessions, exerciseId);
    if (!series.length) {
      return `<div class="empty-inline">${icon('progress')}<p>No completed sets yet. Start a workout with this exercise to build its history.</p></div>`;
    }
    const u = Units.current();
    const set = (r) => (r ? `${r.weightKg == null ? 'BW' : `${Units.fmt(r.weightKg)} ${u}`} × ${r.reps}` : '—');
    const last = series[series.length - 1];
    const metric = UIState.ui.strengthMetric;
    const from = periodFrom(UIState.ui.strengthPeriod);
    const pts = series.filter((p) => (!from || p.t >= from.getTime()) && p[metric] != null)
      .map((p) => ({ t: p.t, v: metric === 'reps' ? p.reps : Units.toDisplay(p[metric]) }));
    const labelOf = { weight: 'Top set weight', e1rm: 'Estimated 1RM', volume: 'Session volume', reps: 'Most reps' };
    return `
      <dl class="tiles">
        <div class="tile"><dt>Latest top set</dt><dd class="num">${last.weight != null ? `${esc(Units.fmt(last.weight))} ${u}` : `${last.reps} reps`}</dd><span class="tile__sub">${esc(Fmt.dayDate(new Date(last.t).toISOString()))}</span></div>
        <div class="tile"><dt>Best weight</dt><dd class="num">${rec.heaviest ? esc(set(rec.heaviest)) : '—'}</dd></div>
        <div class="tile"><dt>Best reps</dt><dd class="num">${esc(set(rec.mostReps))}</dd></div>
        <div class="tile"><dt>Best set</dt><dd class="num">${rec.bestVolume ? esc(Units.fmtVolume(rec.bestVolume.volumeKg)) : '—'}</dd><span class="tile__sub">${rec.bestVolume ? esc(set(rec.bestVolume)) : ''}</span></div>
        <div class="tile"><dt>Est. 1RM</dt><dd class="num">${rec.bestE1rm ? `${esc(Units.fmt(Math.round(rec.bestE1rm.value * 10) / 10))} ${u}` : '—'}</dd><span class="tile__sub">${rec.bestE1rm ? `from ${esc(set(rec.bestE1rm))}` : 'Needs a weighted set of 1–12 reps'}</span></div>
      </dl>
      <div class="str-metric">${Partials.chips('strengthMetric', [['weight', 'Weight'], ['e1rm', 'Est. 1RM'], ['volume', 'Volume'], ['reps', 'Reps']], 'Chart')}</div>
      <div class="str-metric">${Partials.uiChoice({ label: 'Period', key: 'strengthPeriod', options: PERIODS })}</div>
      ${Partials.lineChart([{ name: labelOf[metric], points: pts }], { fmt: (v) => (metric === 'reps' ? `${Math.round(v)}` : `${Math.round(v * 10) / 10} ${u}`), label: labelOf[metric] })}
      <p class="hint">Est. 1RM uses the Epley formula, weight × (1 + reps ÷ 30), for sets of 1–12 reps.</p>`;
  }
});
